<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Asistente Contable</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Mulish:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<!-- SRI: si el CDN llegara a servir un archivo distinto al verificado, el navegador lo rechaza en lugar de
     ejecutarlo sobre los archivos contables. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"
        integrity="sha384-vtjasyidUo0kW94K5MXDXntzOJpQgBKXmE7e2Ga4LG0skTTLeBi97eFAXsqewJjw"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<style>
  :root{
    --ink:#4A3B41;
    --heading:#573B46;
    --paper:#FBF3F2;
    --brand:#B56B86;
    --brand-dark:#935068;
    --brand-light:#F7E4EC;
    --brand-lighter:#FBE6EC;
    --slate:#93797F;
    --line:#F6E6EA;
    --ok:#4F9878;
    --ok-bg:#EAF3EE;
    --alert:#B5524A;
    --alert-bg:#FBE9E7;
    --card:#FFFFFF;
    --dz-empty-bg:#FDF6F8;
    --dz-empty-line:#ECD3DC;
    --dz-filled-bg:#F6FBF8;
    --dz-filled-line:#CFE3D6;
    --note-bg:#FFF8F3;
    --note-line:#ECCDBF;
    --note-text:#9C7D6D;
    --accent-purple-bg:#ECE7F6;
    --accent-purple:#8467B0;
    --accent-green-bg:#E4F0EC;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Mulish",system-ui,"Segoe UI",Arial,sans-serif;
    background:radial-gradient(120% 90% at 85% -10%, #FBE3EA 0%, var(--paper) 46%, var(--paper) 100%);
    background-attachment:fixed;
    color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;
  }
  .app{max-width:1240px;margin:0 auto;padding:26px 56px 64px}

  /* Encabezado */
  .masthead{display:flex;align-items:center;justify-content:space-between;padding-bottom:22px;margin-bottom:24px}
  .brand{display:flex;align-items:center;gap:13px}
  .logo-box{width:42px;height:42px;border-radius:13px;background:linear-gradient(150deg,#E79BB2,#C07A95);
    display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(192,122,149,.32);flex-shrink:0}
  .logo-mark{width:15px;height:15px;border:2.5px solid #fff;border-radius:5px 5px 5px 0}
  .masthead h1{font-family:"DM Serif Display",Georgia,serif;font-weight:400;font-size:20px;letter-spacing:.2px;color:var(--heading)}
  .user-chip{display:flex;align-items:center;gap:10px;padding:7px 8px 7px 16px;background:#fff;
    border-radius:999px;box-shadow:0 4px 14px rgba(160,110,130,.10)}
  .user-chip .user-name{font-size:13.5px;font-weight:600;color:#7A6068}
  .user-chip .avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(150deg,#F3C4D1,#D693AA);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff;flex-shrink:0}
  .crumb{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--slate);margin-bottom:18px}
  .crumb button{background:none;border:none;color:var(--brand);font-weight:800;cursor:pointer;font-size:14px;padding:0}
  .crumb button:hover{color:var(--brand-dark);text-decoration:underline}
  .crumb .print-btn{margin-left:auto;background:#fff;border:1.5px solid var(--line);color:var(--brand);font-weight:800;
    font-size:13px;padding:7px 16px;border-radius:999px;box-shadow:0 4px 12px rgba(158,104,126,.08)}
  .crumb .print-btn:hover{background:var(--brand);color:#fff;border-color:var(--brand);text-decoration:none}
  @page{ size: A4 portrait; margin: 8mm; }
  @media print{
    header, .crumb, .dropzones, .run-bar, .desc, .btn-run, .btn-export, .cg-print, input[type=file], .dz{display:none !important}
    .app{padding:0 !important;max-width:100% !important;width:100% !important;zoom:.75}
    body, .app{background:#fff !important}
    .step-block{box-shadow:none !important}
    .step-block, .cierre-caja, .cierre-panel, .saldo-ctx, .ret-saldoini, .finding, .ret-tabla tr{break-inside:avoid}
    .step-body{display:block !important}
    /* Que todas las columnas quepan en el ancho de la hoja */
    .ret-tabla{width:100% !important;table-layout:fixed}
    .ret-tabla th, .ret-tabla td{white-space:normal !important;word-break:break-word;overflow-wrap:anywhere}
    .cg-cols{grid-template-columns:1fr 1fr !important}
    /* Los botones de acción no se imprimen; el aviso de cifras incompletas SÍ debe quedar en el papel */
    .bloq-btn, .bloq-relink, .sd-copy{display:none !important}
    .sd-panel, .bloq-panel, .bloq-aviso, .sd-item, .per-panel{break-inside:avoid}
    /* Impresion exclusiva del reporte de Caja General: se apaga todo lo demas sin desmontarlo, para no
       perder el estado de la pantalla. visibility (no display) mantiene el alto de la pagina estable. */
    body.solo-cg *{visibility:hidden !important}
    body.solo-cg #cgReporte, body.solo-cg #cgReporte *{visibility:visible !important}
    body.solo-cg #cgReporte{position:absolute;left:0;top:0;width:100%;border:none !important;padding:0 !important}
    body.solo-cg #cgReporte > .cg-h-btn{display:none}   /* en el papel manda el encabezado de la hoja */
    body.solo-cg #cgReporte .cg-solo-head{display:block;margin-bottom:12px;border-bottom:2px solid var(--brand);padding-bottom:8px}
    body.solo-cg #cgReporte .cg-solo-head b{display:block;font-size:15px;color:var(--heading)}
    body.solo-cg #cgReporte .cg-solo-head span{font-size:11px;color:var(--slate)}
    body.solo-cg #cgReporte .cg-pie-as{display:block}
    #cgReporte .dif-tabla, #cgReporte .dif-sub, #cgReporte .cg-row{break-inside:avoid}
    #cgReporte .dif-tabla thead{display:table-header-group}   /* la cabecera se repite en cada hoja */
  }

  /* Menu de modulos */
  .hero{margin-bottom:36px;animation:floatIn .5s ease both}
  .greet{font-size:14px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--brand);margin-bottom:10px}
  .hero-title{font-family:"DM Serif Display",serif;font-weight:400;font-size:42px;line-height:1.1;color:var(--heading);max-width:620px}
  .hero-sub{font-size:16.5px;color:var(--slate);margin-top:12px;max-width:560px;line-height:1.55}
  @keyframes floatIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

  .modules-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
  .module-card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px 26px 24px;
    box-shadow:0 10px 30px rgba(158,104,126,.09);cursor:pointer;transition:transform .18s ease,box-shadow .18s ease}
  .module-card:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(158,104,126,.18)}
  .module-card.disabled{opacity:.6;cursor:default}
  .module-card.disabled:hover{transform:none;box-shadow:0 10px 30px rgba(158,104,126,.09)}
  .module-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
  .icon-box{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;
    font-size:24px;flex-shrink:0}
  .tag-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;
    font-size:12px;font-weight:800;letter-spacing:.2px;white-space:nowrap}
  .tag-pill .dot{width:6px;height:6px;border-radius:50%}
  .module-card h2{font-family:"DM Serif Display",serif;font-weight:400;font-size:23px;color:var(--heading);margin-top:18px}
  .module-card p{font-size:14.5px;color:var(--slate);margin-top:7px;line-height:1.5}
  .module-action{display:flex;align-items:center;gap:7px;margin-top:20px;font-size:13.5px;font-weight:800;color:var(--brand)}
  .module-action.muted{color:var(--slate);font-weight:700}
  .module-action .arrow{font-size:16px;transform:translateY(.5px)}

  .note-banner{margin-top:30px;display:flex;align-items:center;gap:12px;padding:18px 24px;
    background:var(--note-bg);border:1px dashed var(--note-line);border-radius:18px;color:var(--note-text)}
  .note-banner .ico{font-size:20px}
  .note-banner .txt{font-size:13.5px;line-height:1.5}

  /* Modulo */
  .stage{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px;margin-bottom:18px;
    box-shadow:0 10px 30px rgba(158,104,126,.08)}
  .stage h3{font-family:"DM Serif Display",serif;font-weight:400;font-size:19px;color:var(--heading);
    display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .stage h3 .tag{font-family:"Mulish",sans-serif;font-size:11px;font-weight:800;letter-spacing:.4px;
    background:var(--brand-light);color:var(--brand-dark);padding:4px 10px;border-radius:999px}
  .stage p.desc{font-size:13.5px;color:var(--slate);margin-bottom:16px}
  .dz-ayuda{margin-top:5px}
  .dz-ayuda>summary{cursor:pointer;font-size:11.5px;color:var(--brand);font-weight:700;list-style:none;user-select:none}
  .dz-ayuda>summary::-webkit-details-marker{display:none}
  .dz-ayuda>summary::before{content:"? ";font-weight:800}
  .dz-ayuda>div{font-size:11.5px;color:var(--slate);line-height:1.5;margin-top:5px;background:#FBF7F9;
    border-radius:8px;padding:7px 9px}
  .dropzones{display:grid;gap:14px}
  .dz-grid2{grid-template-columns:1fr 1fr}
  .dropzones.grid2{display:grid;grid-template-columns:1fr 1fr}
  .dz{border:2px dashed var(--dz-empty-line);border-radius:16px;padding:16px;display:flex;align-items:center;gap:12px;
    background:var(--dz-empty-bg);transition:all .15s ease}
  .dz.filled{border-style:solid;border-color:var(--dz-filled-line);background:var(--dz-filled-bg)}
  .dz.dragover{border-color:var(--brand);background:var(--brand-lighter)}
  .dz .ico{font-size:22px}
  .dz .info{flex:1;min-width:0}
  .dz .info .lbl{font-size:13px;font-weight:700;color:var(--heading)}
  .dz .info .expected{font-size:12px;color:var(--brand);margin-top:3px;font-weight:600}
  .dz .info .sub{font-size:12px;color:var(--slate);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
  .dz input[type=file]{display:none}
  .dz .btn-sel{font-size:12.5px;font-weight:800;background:#fff;color:var(--brand);border:1.5px solid var(--line);
    padding:8px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;box-shadow:0 4px 12px rgba(158,104,126,.08)}
  .dz .btn-sel:hover{background:var(--brand);color:#fff;border-color:var(--brand)}

  .stage-run{display:flex;align-items:center;gap:12px;margin-top:18px;padding-top:16px;border-top:1px dashed var(--line);flex-wrap:wrap}
  .btn-step-run{background:#fff;border:1.5px solid var(--brand);color:var(--brand);font-family:"Mulish";font-size:13px;font-weight:800;
    padding:9px 18px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:all .15s ease}
  .btn-step-run:hover:not(:disabled){background:var(--brand);color:#fff}
  .btn-step-run:disabled{border-color:var(--line);color:var(--slate);cursor:not-allowed}
  .stage-run-note{font-size:12.5px;color:var(--slate);font-weight:600}

  .run-bar{display:flex;align-items:center;gap:14px;margin:22px 0;flex-wrap:wrap}
  .btn-run{background:linear-gradient(150deg,#E79BB2,#C07A95);color:#fff;border:none;font-family:"Mulish";
    font-size:15px;font-weight:800;padding:14px 28px;border-radius:999px;cursor:pointer;
    box-shadow:0 10px 24px rgba(192,122,149,.35);transition:all .15s ease}
  .btn-run:disabled{background:#E7CDD6;box-shadow:none;cursor:not-allowed}
  .btn-run:not(:disabled):hover{background:linear-gradient(150deg,#E08AA5,#B56B86)}
  .run-note{font-size:13px;color:var(--slate);font-weight:600}

  .opts{display:flex;gap:22px;align-items:center;font-size:13px;color:var(--slate);flex-wrap:wrap;font-weight:600}
  .opts label{display:flex;align-items:center;gap:8px}
  .opts input[type=number]{width:64px;padding:6px 8px;border:1.5px solid var(--line);border-radius:8px;font-family:inherit}

  /* Resultados */
  .results-head{display:flex;justify-content:space-between;align-items:baseline;margin:32px 0 16px;flex-wrap:wrap;gap:12px}
  .results-head h2{font-family:"DM Serif Display",serif;font-weight:400;font-size:24px;color:var(--heading)}
  .summary-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
  .chip{font-size:12.5px;font-weight:800;padding:7px 14px;border-radius:999px;background:var(--brand-light);color:var(--brand-dark)}
  .chip.ok{background:var(--ok-bg);color:var(--ok)}
  .chip.alert{background:var(--alert-bg);color:var(--alert)}
  .chip.warn{background:#FBF1E3;color:#9A6E1E}

  .step-block{border:1px solid var(--line);border-radius:18px;margin-bottom:16px;overflow:hidden;background:var(--card);
    box-shadow:0 8px 22px rgba(158,104,126,.07)}
  .step-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;
    background:var(--brand-lighter);cursor:pointer;user-select:none}
  .step-head h4{font-family:"DM Serif Display",serif;font-weight:400;font-size:16px;color:var(--heading)}
  .step-head .count{font-family:"Mulish";font-size:12.5px;font-weight:700;color:var(--brand-dark)}
  .step-body{padding:6px 20px 16px}
  .step-head .lado{display:flex;align-items:center;gap:10px;min-width:0}
  .step-head .chev{font-size:11px;color:var(--brand-dark);flex-shrink:0;transition:transform .18s ease}
  .step-block.plegado .step-head .chev{transform:rotate(-90deg)}
  .step-block.plegado .step-body{display:none}
  .step-block.plegado{box-shadow:0 3px 10px rgba(158,104,126,.05)}
  .btn-plegar{background:none;border:none;color:var(--brand);font-weight:800;font-size:12.5px;cursor:pointer;padding:0}
  .btn-plegar:hover{color:var(--brand-dark);text-decoration:underline}
  .finding{display:flex;gap:14px;align-items:flex-start;padding:14px 4px;border-bottom:1px solid var(--line)}
  .finding:last-child{border-bottom:none}
  .finding input[type=checkbox]{margin-top:3px;width:18px;height:18px;accent-color:var(--brand);flex-shrink:0}
  .finding.done .ftxt{text-decoration:line-through;color:var(--slate);opacity:.6}
  .finding.done .famt{text-decoration:line-through;color:var(--slate);opacity:.6}
  .ftxt{font-size:14px;flex:1;min-width:0}
  .ftxt .src{display:block;font-size:12px;color:var(--slate);margin-top:3px;font-weight:600}
  .famt{font-family:"Mulish";font-size:14.5px;font-weight:800;color:var(--brand-dark);white-space:nowrap;
    margin-left:12px;flex-shrink:0}
  .empty-ok{font-size:14px;color:var(--ok);padding:14px 4px;font-weight:700}
  .empty-skip{font-size:14px;color:var(--slate);padding:14px 4px;font-weight:700;font-style:italic}
  .sinconf-block{margin-top:12px;border-top:1px dashed var(--line);padding-top:6px}
  .sinconf-head{font-size:13px;font-weight:800;color:#9A6E1E;padding:10px 4px 2px}
  .sinconf-head .sinconf-sub{display:block;font-size:12px;font-weight:600;color:var(--slate);margin-top:3px}
  .sinconf-block .finding .famt{color:#9A6E1E}
  .sinconf-block .finding input[type=checkbox]{accent-color:#C79A3A}
  .sinconf-block.transito .sinconf-head{color:#3C6E9A}
  .sinconf-block.transito .finding .famt{color:#3C6E9A}
  .sinconf-block.transito .finding input[type=checkbox]{accent-color:#5B8DEF}
  .sinconf-block.efectivo .sinconf-head{color:#4F7A52}
  .sinconf-block.efectivo .finding .famt{color:#4F7A52}
  .sinconf-block.efectivo .finding input[type=checkbox]{accent-color:#5FA463}
  .saldo-ctx{display:flex;align-items:flex-start;gap:10px;margin:8px 0 14px;padding:12px 14px;
    background:#EEF3FA;border:1px solid #D5E1F0;border-radius:12px}
  .saldo-ctx .ico{font-size:16px;line-height:1.4}
  .saldo-ctx .saldo-line{font-size:13.5px;font-weight:700;color:#3C5670}
  .saldo-ctx .saldo-sub{font-size:12.5px;color:#5B6472;margin-top:3px;line-height:1.5}

  .btn-export{background:#fff;border:1.5px solid var(--line);color:var(--brand);font-family:"Mulish";font-size:13.5px;font-weight:800;
    padding:10px 20px;border-radius:999px;cursor:pointer;box-shadow:0 6px 16px rgba(158,104,126,.08)}
  .btn-export:hover{background:var(--brand);color:#fff;border-color:var(--brand)}

  footer.note{font-size:12.5px;color:var(--slate);margin-top:34px;border-top:1px solid var(--line);padding-top:16px}

  /* Estado de paso cuadrado / bloqueado */
  .step-block.cuadrado{border-color:#BEE3CD;box-shadow:0 8px 22px rgba(79,152,120,.14)}
  .step-block.cuadrado .step-head{background:var(--ok-bg)}
  .step-block.cuadrado .step-head .count{color:var(--ok)}
  .cuadrado-badge{margin:14px 4px 2px;padding:12px;border-radius:12px;text-align:center;
    background:var(--ok-bg);color:var(--ok);font-weight:800;font-size:15px;letter-spacing:2px}
  .stage-opcional{border-style:dashed}
  .opt-badge{font-family:"Mulish";font-size:10.5px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;
    background:var(--brand-light);color:var(--brand-dark);padding:3px 8px;border-radius:999px;margin-left:6px}
  .cierre-panel{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
    margin:6px 0 20px;padding:18px 22px;border-radius:16px;background:var(--ok-bg);border:1px solid #BEE3CD}
  .cierre-panel .cierre-title{font-family:"DM Serif Display",serif;font-size:19px;color:var(--ok)}
  .cierre-panel .cierre-sub{font-size:13.5px;color:#3F6E56;margin-top:4px;max-width:560px;line-height:1.5}
  .cierre-caja{margin:6px 0 20px;padding:20px 22px;border-radius:16px;background:var(--ok-bg);border:1px solid #BEE3CD}
  .cierre-caja .cierre-title{font-family:"DM Serif Display",serif;font-size:20px;color:var(--ok);margin-bottom:14px}
  .cg-cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:760px){.cg-cols{grid-template-columns:1fr}}
  .cg-box{background:#fff;border:1px solid #CDE7D6;border-radius:12px;padding:14px 16px}
  .cg-h{font-weight:800;font-size:13px;color:var(--heading);margin-bottom:10px;text-transform:uppercase;letter-spacing:.3px}
  .cg-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;font-size:14px;color:var(--slate);border-bottom:1px solid #EEF4F0}
  .cg-row:last-child{border-bottom:none}
  .cg-row b{font-family:"Mulish";font-weight:800;color:var(--heading);white-space:nowrap}
  .cg-tot{border-top:2px solid #CDE7D6;margin-top:4px;font-weight:700}
  .cg-tot span{font-weight:800;color:var(--heading)}
  .cg-dif b{font-size:15px}
  .cg-src{font-style:normal;font-size:10.5px;color:var(--slate);opacity:.85;display:block}
  .cg-inp{width:130px;text-align:right;font-family:"Mulish";font-weight:800;font-size:14px;color:var(--heading);
    border:1.5px solid var(--brand);border-radius:8px;padding:5px 8px;background:#FFF8FB}
  .cg-note{font-size:12px;color:#3F6E56;margin-top:8px;line-height:1.4}
  .cg-h-btn{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .cg-print{background:#fff;border:1.5px solid var(--line);color:var(--brand);font-weight:800;font-size:11px;
    letter-spacing:.3px;padding:5px 13px;border-radius:999px;cursor:pointer;text-transform:none;flex-shrink:0}
  .cg-print:hover{background:var(--brand);color:#fff;border-color:var(--brand)}
  .cg-prov{background:#FDF3E7;border:1px solid #F0DCC2;border-radius:8px;padding:8px 10px;color:#8A6534}
  .cg-solo-head, .cg-solo-pie{display:none}   /* solo salen en el papel */
  .cg-pie-as{margin-top:18px;border-top:2px solid var(--line);padding-top:12px}
  .cg-asientos .cg-h{margin-bottom:8px}
  .as-item{background:#F7F4F9;border:1px solid #E2D9EA;border-radius:10px;padding:10px 12px;margin-bottom:10px}
  .as-item.as-hecho{background:#F2F9F5;border-color:#BEE3CD}
  .as-reg{display:inline-block;background:var(--ok);color:#fff;font-family:"Mulish";font-size:10px;font-weight:800;
    letter-spacing:.6px;padding:2px 8px;border-radius:999px;vertical-align:middle;margin-left:6px}
  .as-reg-nota{font-size:11.5px;color:#3F6E56;background:#EAF5EE;border-radius:8px;padding:7px 9px;margin:8px 0 4px;line-height:1.45}

function esc(s){
  if(s===null||s===undefined) return "";
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");

// claves internas siguen usando el número crudo.

// invalido para el control y el navegador lo deja VACIO — el campo se ve en blanco aunque haya dato.
function numInput(n){ var v=Number(n); return isNaN(v)? "" : String(Math.round(v*100)/100); }

  var v=Number(n); if(isNaN(v)) v=0;
  var neg=v<0, partes=Math.abs(v).toFixed(2).split(".");
  return (neg?"-":"")+partes[0].replace(/\B(?=(\d{3})+(?!\d))/g,",")+"."+partes[1];
}
function normTxt(s){
  if(s===null||s===undefined) return "";
  s = String(s);
  s = s.normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  s = s.toUpperCase().replace(/\s+/g," ").trim();
  // Toda comparacion de texto de la app pasa por aca: corregir la errata en este punto la corrige en todos.
  return s.replace(/[A-Z]{6,}/g, corregirErrata);

   Los asientos se digitan a mano y cada errata sacaba una linea del cotejo sin avisar: "VETA" por VENTA en
   febrero de 2026, "Banismto" por Banistmo en marzo (1,643.08 que la app no supo de que banco eran).
   Una palabra se corrige a la palabra clave mas parecida si esta a 1 letra (palabras de 6 o mas letras) o a
   2 letras (8 o mas): una letra cambiada, de mas, de menos o dos letras invertidas cuentan 1 cada una.
   Tres resguardos, porque corregir mal mueve plata de lugar:
   - Palabras de menos de 6 letras, exactas. A una letra, el apellido BLANCO seria BANCO y una retencion
     se iria al acreedor equivocado; CARLOS seria CARGOS.
   - Si la palabra queda igual de cerca de dos palabras clave (COMISION y REMISION) no se toca.
   - Palabras reales que no son la clave estan en el vocabulario para que no se "corrijan": OMITIDO no es
     EMITIDO, DEBIDO no es DEBITO, IMPORTE no es IMPORT.
   Nombres de personas y de meses quedan fuera del vocabulario a proposito. */
var VOCABULARIO_CLAVE = ("BANISTMO GEORGE GEORGES GENERAL YAPPYS DEPOSITO DEPOSITOS CHEQUE CHEQUES TARJETA TARJETAS " +
  "REMISION REMISIONES COMISION COMISIONES RETENCION RETENCIONES TIMBRE TIMBRES EFECTIVO BRINKS VENTAS " +
  "DESCARGO DESCARGOS TRANSITO CIRCULACION EMITIDO OMITIDO DEBITO DEBITOS DEBIDO CREDITO CREDITOS " +
  "AJUSTE AJUSTES AJUSTA ACREDITADO ACREDITADA ABORTED BALANCE INICIAL MOVIMIENTO MOSTRADO TOTALES " +
  "FALTANTE FALTANTES SOBRANTE SOBRANTES VENTANILLA PRESTAMO PRESTAMOS COOPERATIVA AHORRO DESCUENTO DESCUENTOS " +
  "QUINCENA NAVIDENO REFRESQUERIA FUNERAL FUNERALES SHOPPING ECASESO CASESO NALPMA COMERCIO NACIONAL NACIONALES " +
  "PENDIENTE PENDIENTES COMPENSO COMPENSADO COMPENSADA COMPENSACION DEVOLUCION TRANSFERENCIA BANCARIO " +
  "ESTABLECIMIENTO AFILIADO MASTER MARKET IMPORT IMPORTE DESCRIPCION REFERENCIA CONCEPTO COMPROBANTE " +
  "EMPRESA CAJERA BANCOS SALDOS HECHOS DESGLOSE").split(" ");
var VOCABULARIO_SET = {};
VOCABULARIO_CLAVE.forEach(function(w){ VOCABULARIO_SET[w] = true; });
var ERRATAS_CACHE = {};
function toleranciaErrata(largo){ return largo >= 8 ? 2 : (largo >= 6 ? 1 : 0); }
// Distancia de edicion con transposicion (dos letras invertidas = 1). Corta en cuanto supera el maximo.
function distanciaErrata(a, b, max){
  var la = a.length, lb = b.length;
  if(Math.abs(la - lb) > max) return max + 1;
  var d = [];
  for(var i=0;i<=la;i++){ d[i] = [i]; }
  for(var j=0;j<=lb;j++){ d[0][j] = j; }
  for(i=1;i<=la;i++){
    var minFila = d[i][0];
    for(j=1;j<=lb;j++){
      var costo = a.charCodeAt(i-1) === b.charCodeAt(j-1) ? 0 : 1;
      var v = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + costo);
      if(i>1 && j>1 && a.charCodeAt(i-1)===b.charCodeAt(j-2) && a.charCodeAt(i-2)===b.charCodeAt(j-1)) v = Math.min(v, d[i-2][j-2] + 1);
      d[i][j] = v;
      if(v < minFila) minFila = v;
    }
    if(minFila > max) return max + 1;
  }
  return d[la][lb];
}
function corregirErrata(w){
  if(VOCABULARIO_SET[w]) return w;
  if(Object.prototype.hasOwnProperty.call(ERRATAS_CACHE, w)) return ERRATAS_CACHE[w];
  var mejor = null, dMejor = 99, empate = false;
  for(var i=0;i<VOCABULARIO_CLAVE.length;i++){
    var v = VOCABULARIO_CLAVE[i];
    var tol = toleranciaErrata(Math.min(w.length, v.length));
    if(!tol) continue;
    var dd = distanciaErrata(w, v, tol);
    if(dd > tol) continue;
    if(dd < dMejor){ dMejor = dd; mejor = v; empate = false; }
    else if(dd === dMejor && v !== mejor){ empate = true; }
  }
  var r = (mejor && !empate) ? mejor : w;
  ERRATAS_CACHE[w] = r;
  return r;
}
/* ---- Celdas que no se pueden leer como número ----
   money() devolvía 0 ante cualquier cosa que no entendiera, así que "#REF!", "N/A" o una celda con texto
   se leían como cero y la partida desaparecía del cotejo SIN AVISAR. Probado sobre enero: corromper la
   celda del crédito de 1,341.20 dejaba el cierre en cero diferencias y mandaba esa partida al resumen del
   mes siguiente como si nunca hubiera compensado. Y "12ABC" devolvía 12: la partida quedaba con el
   importe equivocado. Ahora esos casos se registran y cada paso los reporta. */
var ilegiblesN = 0;      // cuántas celdas no se pudieron leer durante el paso
var ilegiblesVals = [];  // los valores distintos, para poder buscarlos en el Excel
function registrarIlegible(v){
  ilegiblesN++;
  var t = String(v).replace(/\s+/g," ").trim();   // completo: ubicarIlegible lo busca tal cual en el libro
  if(ilegiblesVals.length < 12 && ilegiblesVals.indexOf(t) === -1) ilegiblesVals.push(t);
}
/* ---- Donde esta la celda ilegible ----
   Decirle a alguien "hay una celda con texto, buscala" es dejarle el trabajo entero: el informe de
   cajeras tiene 30 columnas y dos filas de encabezado. Como el valor ilegible se guarda tal cual, se
   puede volver a buscar en los libros ya cargados y devolver archivo, hoja, celda, fila y columna.
   La busqueda es a posteriori, asi que ningun parser tiene que arrastrar coordenadas. */
function letraCol(n){
  var s = "";
  do { s = String.fromCharCode(65 + (n % 26)) + s; n = Math.floor(n/26) - 1; } while(n >= 0);
  return s;
}
function etiquetaEncabezado(v){ return String(v).replace(/\s*\n\s*/g, " / ").replace(/\s+/g, " ").trim(); }
function ubicarIlegible(raws, valor){
  if(!raws) return null;
  var buscado = String(valor).replace(/\s+/g," ").trim();
  var claves = Object.keys(raws);
  for(var q=0;q<claves.length;q++){
    var libro = raws[claves[q]]; if(!libro) continue;
    var hojas = libro.hojas || {"": libro};
    var nombres = Object.keys(hojas);
    for(var s=0;s<nombres.length;s++){
      var rows = hojas[nombres[s]]; if(!rows || !rows.length) continue;
      for(var r=0;r<rows.length;r++){
        var row = rows[r]; if(!row) continue;
        for(var c=0;c<row.length;c++){
          if(typeof row[c] !== "string") continue;
          if(row[c].replace(/\s+/g," ").trim() !== buscado) continue;
          return detalleCelda(claves[q], nombres[s], rows, r, c);
        }
      }
    }
  }
  return null;
}
// Encabezado de la columna y datos que identifican la fila. El encabezado es la celda no vacia mas
// cercana hacia arriba en esa misma columna; desde esa fila se leen las columnas de identificacion
// (Fecha, Cajera, Concepto, Referencia) que esten a la izquierda.
function detalleCelda(clave, hoja, rows, r, c){
  var hr = -1;
  for(var k=r-1;k>=0 && k>=r-40;k--){
    var v = rows[k] && rows[k][c];
    if(v!==null && v!==undefined && String(v).trim()!=="" && isNaN(Number(v))){ hr = k; break; }
  }
  var columna = hr>=0 ? etiquetaEncabezado(rows[hr][c]) : "";
  var fecha = "", quien = "";
  var fila = rows[r] || [];
  for(var j=0;j<c;j++){
    if(!fecha){ var iso = toISODate(fila[j], false); if(iso) fecha = iso; }
    if(hr>=0){
      var etq = normTxt(rows[hr][j]);
      if(/CAJERA|CONCEPTO|DESCRIPCION|REFERENCIA/.test(etq) && fila[j]!==null && fila[j]!==undefined &&
         String(fila[j]).trim()!==""){
        quien = etiquetaEncabezado(rows[hr][j]) + " " + String(fila[j]).trim();
      }
    }
  }
  return { clave:clave, hoja:hoja, celda:letraCol(c)+(r+1), fecha:fecha, quien:quien, columna:columna };
}
function textoUbicacion(u, nombreArchivo){
  if(!u) return "";
  var arch = nombreArchivo || (STATE.files[u.clave] && STATE.files[u.clave].name) || NOMBRE_TIPO[u.clave] || u.clave;
  var t = "Archivo: " + arch + (u.hoja ? " · hoja " + u.hoja.trim() : "") + " · celda " + u.celda;
  var det = [];
  if(u.fecha) det.push("la fila del " + u.fecha);
  if(u.quien) det.push("(" + u.quien + ")");
  if(u.columna) det.push("columna " + u.columna);
  if(!det.length) return t;
  var cola = det[0] + (det.length>1 && u.quien ? " " + det[1] : "");
  if(u.columna) cola += ", columna " + u.columna;
  return t + " — " + cola;
}
function money(v){
  if(v===null||v===undefined||v==="") return 0;
  if(typeof v==="number") return v;
  var s = String(v).replace(/B\/\.?/gi,"").replace(/\$/g,"").trim();
  if(s==="") return 0;   // solo espacios o el símbolo de moneda: celda vacía, no ilegible
  // Coma DECIMAL (se digita así a veces: "20,00"): una sola coma seguida de 1-2 dígitos al final y sin punto
  // decimal → se convierte en punto. Si hay punto, o el grupo tras la coma es de 3 dígitos, la coma es
  // separador de miles ("1,234.56", "1,234") y se elimina.
  if(/^[^.]*,\d{1,2}$/.test(s)) s = s.replace(",", ".");
  s = s.replace(/,/g,"");
  var neg = false;
  if(s.indexOf("(")===0){ neg=true; s=s.replace(/[()]/g,""); }
  if(s.indexOf("-")===0){ neg=true; s=s.replace("-",""); }
  s = s.trim();
  // Lo que queda tiene que ser un número y nada más. Si sobra texto ("12ABC", "#REF!", "N/A", "500 USD")
  // no se adivina: se devuelve 0, pero queda registrado — un cero inventado descuadra en silencio.
  if(!/^\d+(\.\d*)?$/.test(s) && !/^\.\d+$/.test(s)){
    registrarIlegible(v);
    return 0;
  }
  var n = parseFloat(s);
  if(isNaN(n)){ registrarIlegible(v); return 0; }
  return neg ? -n : n;
}
function toISODate(v, mdY){
  if(v===null||v===undefined||v==="") return null;
  if(v instanceof Date && !isNaN(v)) {
    return v.getFullYear()+"-"+String(v.getMonth()+1).padStart(2,"0")+"-"+String(v.getDate()).padStart(2,"0");
  }
  var s = String(v).trim();
  var m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if(m){
    var a = parseInt(m[1],10), b = parseInt(m[2],10), y = m[3];
    var mm, dd;
    if(mdY){ mm=a; dd=b; } else { dd=a; mm=b; }
    return y+"-"+String(mm).padStart(2,"0")+"-"+String(dd).padStart(2,"0");
  }
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return m[0].slice(0,10);
  // "31-Jan-2026" / "14-Dec-2012" / "5 Ene 2026": día - nombre de mes (inglés o español) - año
  m = s.match(/^(\d{1,2})[\-\/\s]([A-Za-z]{3,})[\-\/\s](\d{4})$/);
  if(m){
    var MES3 = {JAN:1,FEB:2,MAR:3,APR:4,MAY:5,JUN:6,JUL:7,AUG:8,SEP:9,OCT:10,NOV:11,DEC:12,
                ENE:1,ABR:4,AGO:8,SET:9,DIC:12};
    var mo = MES3[m[2].slice(0,3).toUpperCase()];
    if(mo) return m[3]+"-"+String(mo).padStart(2,"0")+"-"+String(parseInt(m[1],10)).padStart(2,"0");
  }
  return null;
}
function daysBetween(iso1, iso2){
  if(!iso1||!iso2) return Infinity;
  var d1 = new Date(iso1+"T00:00:00"), d2 = new Date(iso2+"T00:00:00");
  return Math.abs((d1-d2)/86400000);
}
/* ---- El .xls que exporta el sistema contable es una pagina web ----
   El navegador contable baja "Navegador_Contabilidad_Excel - <fecha>.xls", pero adentro no es un Excel:
   es una tabla HTML con renglones en blanco al principio y sin declarar la codificacion (los acentos vienen
   en Windows-1252). Leido como binario, SheetJS devolvia cada linea de HTML como una celda y la app lo
   rechazaba como "archivo equivocado"; habia que abrirlo y guardarlo como .xlsx a mano. Ahora se reconoce
   el HTML, se decodifica y se lee la tabla. */
function esLibroHtml(bytes){
  for(var i=0;i<bytes.length && i<4096;i++){
    var c = bytes[i];
    if(c===32 || c===9 || c===10 || c===13 || c===0xEF || c===0xBB || c===0xBF) continue;
    return c===60;   // "<"
  }
  return false;
}
function decodificarTexto(bytes){
  try{ return new TextDecoder("utf-8", {fatal:true}).decode(bytes); }
  catch(e){ return new TextDecoder("windows-1252").decode(bytes); }
}
function leerLibro(bytes){
  if(esLibroHtml(bytes)) return XLSX.read(decodificarTexto(bytes).trim(), {type:"string", cellDates:true});
  return XLSX.read(bytes, {type:"array", cellDates:true});
}
function readWorkbook(file, cb){
  var reader = new FileReader();
  reader.onload = function(e){
    try{
      var data = new Uint8Array(e.target.result);
      var wb = leerLibro(data);
      var rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, raw:true, defval:null});
      // Adjuntamos todas las hojas (ej. el reporte de cajeras trae una 2ª pestaña con el desglose de cheques).
      rows.hojas = {};
      wb.SheetNames.forEach(function(sn){ rows.hojas[sn] = XLSX.utils.sheet_to_json(wb.Sheets[sn], {header:1, raw:true, defval:null}); });
      cb(rows);
    }catch(err){ alert("No se pudo leer el archivo: "+err.message); }
  };
  reader.readAsArrayBuffer(file);
}

/* ---- Validación del archivo al subirlo ----
   Cada casilla espera un archivo con una forma reconocible. Si se sube otro, el error aparecía tarde y
   confuso: unas veces reventaba al ejecutar y otras —peor— el parser devolvía vacío y el paso salía
   "sin diferencias" con media información faltando. Se identifica el archivo por su CONTENIDO (no por el
   nombre, que ya nos mintió más de una vez) y si no corresponde se rechaza diciendo qué fue lo que se subió. */
// Cuenta contable de un navegador ("[1.1.8] Caja General" → "1.1.8 CAJA GENERAL"). null si no es uno.
function cuentaDeNavegador(rows){
  var h = findHeaderRow(rows, ["Account","Fecha","Referencia"]);
  if(h===-1) return null;
  var c = colIdx(rows[h],"Account");
  if(c<0) return null;
  for(var r=h+1;r<rows.length;r++){
    var v = rows[r] && rows[r][c];
    if(v!==null && v!==undefined && String(v).trim()!=="") return normTxt(v);
  }
  return null;
}
// Qué archivo es, mirando su contenido. Devuelve el tipo, o null si no se reconoce.
function identificarArchivo(rows){
  if(!rows || !rows.length) return null;
  var cta = cuentaDeNavegador(rows);
  if(cta){
    if(cta.indexOf("CAJA GENERAL")!==-1) return "diarioCaja";
    if(cta.indexOf("BANISTMO")!==-1) return "diarioBanistmo";
    if(cta.indexOf("GEORGE")!==-1) return "diarioStg";
    if(cta.indexOf("RETENCION")!==-1) return "retenciones";      // el del Módulo 2
    if(cta.indexOf("GENERAL")!==-1) return "diarioBancoGeneral";
    return "navegador"; // un navegador contable, pero de otra cuenta
  }
  if(findHeaderRow(rows,["Fecha","Banco","Monto","Concepto"])!==-1) return "transitoPrevio";
  if(findHeaderRow(rows,["Fecha","Cajera"])!==-1) return "reporte";
  if(findHeaderRow(rows,["Fecha","Descripcion","Debitos","Creditos"])!==-1) return "estado";
  if(findHeaderRow(rows,["Fecha","Descripcion","Debito","Credito"])!==-1) return "estado";
  // Banco General desde febrero de 2026: una sola columna "Monto" con signo en vez de Débito/Crédito.
  if(findHeaderRow(rows,["Fecha","Descripcion","Monto","Saldo"])!==-1) return "estado";
  try{ if(parseRetencionesVisa(rows).length) return "retVisa"; }catch(e){}
  return null;
}
var CASILLA_ESPERA = {
  transitoPrevio:     {acepta:["transitoPrevio"],     nombre:"el resumen en tránsito del mes anterior"},
  reporte:            {acepta:["reporte"],            nombre:"el informe de cajeras"},
  diarioCaja:         {acepta:["diarioCaja"],         nombre:"el navegador de Caja General"},
  diarioBanistmo:     {acepta:["diarioBanistmo"],     nombre:"el navegador del diario de Banistmo"},
  diarioStg:          {acepta:["diarioStg"],          nombre:"el navegador del diario de St. Georges"},
  diarioBancoGeneral: {acepta:["diarioBancoGeneral"], nombre:"el navegador del diario de Banco General"},
  estBanistmo:        {acepta:["estado"], tipo:"banistmo",     nombre:"el estado de cuenta de Banistmo"},
  estStg:             {acepta:["estado"], tipo:"stg",          nombre:"el estado de cuenta de St. Georges"},
  estBancoGeneral:    {acepta:["estado"], tipo:"bancogeneral", nombre:"el estado de cuenta de Banco General"},
  retVisa:            {acepta:["retVisa"],            nombre:"el informe de retenciones VISA"},
  retenciones:        {acepta:["retenciones"],        nombre:"el navegador de retenciones a empleados por pagar"}
};
// Los tres estados de cuenta se parecen, pero su encabezado los delata:
//   St. Georges  → Fecha | Descripción | Débitos(-) | Créditos(+) | Balance
//   Banco General→ Fecha | Referencia | Transacción | Descripción | Débito | Crédito | Saldo total
//   Banistmo     → Cuenta | Fecha | Hora | Cheque | Descripción | Débito | Crédito | Saldo | Signo
// El parser de Banistmo es tolerante y traga el de STG ("Débitos" contiene "Débito"), así que sin esto
// un estado en la casilla del otro banco pasaba sin chistar.
function bancoDeEstado(rows){
  var h = findHeaderRow(rows,["Fecha","Descripcion"]);
  if(h===-1) return null;
  var cab = (rows[h]||[]).map(function(c){ return normTxt(c); }).join(" | ");
  if(cab.indexOf("BALANCE")!==-1) return "stg";
  if(cab.indexOf("SALDO TOTAL")!==-1) return "bancogeneral";      // antes que "SALDO" a secas
  if(cab.indexOf("SIGNO")!==-1 || cab.indexOf("HORA")!==-1) return "banistmo";
  if(cab.indexOf("SALDO")!==-1) return "banistmo";
  return null;                                                    // no se puede afirmar: no se bloquea
}
var NOMBRE_ESTADO = {banistmo:"el estado de cuenta de Banistmo", stg:"el estado de cuenta de St. Georges",
                     bancogeneral:"el estado de cuenta de Banco General"};
var NOMBRE_TIPO = {
  transitoPrevio:"un resumen en tránsito", reporte:"un informe de cajeras",
  diarioCaja:"el navegador de Caja General", diarioBanistmo:"el navegador de Banistmo",
  diarioStg:"el navegador de St. Georges", diarioBancoGeneral:"el navegador de Banco General",
  navegador:"un navegador de otra cuenta contable", estado:"un estado de cuenta bancario",
  retVisa:"el informe de retenciones VISA",
  retenciones:"el navegador de retenciones a empleados por pagar"
};
// null si el archivo va en esa casilla; si no, el texto de la alerta.
/* ---- Celdas de importe ilegibles: el archivo no entra ----
   Una celda con texto donde va un numero (el clasico "273.49-255.60-164.08-292.62", los cheques del dia
   escritos uno detras de otro) se lee como CERO y esa partida no entra al cotejo: el paso puede salir
   "sin diferencias" con plata faltando. Antes se avisaba DESPUES de conciliar; ahora el archivo se
   rechaza al subirlo, que es cuando corregir el Excel cuesta menos. Se usa el parser que le toca a la
   casilla, asi que solo se miran las celdas que el cotejo va a leer de verdad.
   Los contadores son globales y los usa el aviso de cada paso: se guardan y se reponen. */
function ilegiblesDelArchivo(key, rows){
  var nAntes = ilegiblesN, valsAntes = ilegiblesVals;
  ilegiblesN = 0; ilegiblesVals = [];
  try{
    if(key==="reporte"){
      parseReporteConsolidado(rows);
      try{ parseChequesDetalle(rows); }catch(e){}
      try{ parseFaltantesSobrantes(rows); }catch(e){}
    }
    else if(key==="transitoPrevio") parseTransitoPrevio(rows);
    else if(key==="retVisa") parseRetencionesVisa(rows);
    else if(key==="estBanistmo") parseEstadoCuenta(rows, "banistmo");
    else if(key==="estStg") parseEstadoCuenta(rows, "stg");
    else if(key==="estBancoGeneral") parseEstadoCuenta(rows, "bancogeneral");
    else { parseDiario(rows, null); try{ parseSaldoCajaGeneral(rows); }catch(e){} }
  }catch(e){}   // si el parser revienta, de eso se encarga la validacion de formato
  var res = { n: ilegiblesN, vals: ilegiblesVals.slice() };
  ilegiblesN = nAntes; ilegiblesVals = valsAntes;
  return res;
}
// Texto de la ubicacion sin el nombre del archivo: al subirlo, el usuario ya sabe cual es.
function ubicacionCorta(rows, valor){
  var u = ubicarIlegible({ subido: rows }, valor);
  if(!u) return "";
  var t = (u.hoja ? "hoja " + u.hoja.trim() + " · " : "") + "celda " + u.celda;
  var det = [];
  if(u.fecha) det.push("la fila del " + u.fecha);
  if(u.quien) det.push("(" + u.quien + ")");
  var cola = det.join(" ");
  if(u.columna) cola += (cola ? ", " : "") + "columna " + u.columna;
  return t + (cola ? " — " + cola : "");
}
function validarArchivoParaCasilla(key, rows){
  var esp = CASILLA_ESPERA[key];
  if(!esp) return null;                 // casilla sin firma conocida: no se valida
  var id = identificarArchivo(rows);
  if(!id) return "Archivo equivocado: no se reconoce el formato. Acá va " + esp.nombre + ".";
  if(esp.acepta.indexOf(id) === -1){
    return "Archivo equivocado: esto es " + (NOMBRE_TIPO[id] || "otro archivo") +
           ", y en esta casilla va " + esp.nombre + ".";
  }
  // Los tres estados de cuenta comparten la firma genérica, así que se distinguen por su propio parser:
  // Banistmo trae Débito/Crédito/Saldo y St. Georges Débitos/Créditos/Balance.
  if(esp.tipo){
    var banco = bancoDeEstado(rows);
    if(banco && banco !== esp.tipo){
      return "Archivo equivocado: esto es " + NOMBRE_ESTADO[banco] + ", y en esta casilla va " + esp.nombre + ".";
    }
    var movs = null;
    try{ movs = parseEstadoCuenta(rows, esp.tipo); }catch(e){ movs = null; }
    if(!movs || !movs.length){
      return "Archivo equivocado: es un estado de cuenta, pero no tiene el formato de " + esp.nombre + ".";
    }
  }
  // Ultimo control: celdas de importe que no se pueden leer como numero.
  var il = ilegiblesDelArchivo(key, rows);
  if(il.n){
    var det = il.vals.slice(0,3).map(function(v){
      var d = ubicacionCorta(rows, v);
      return "«" + String(v).slice(0,60) + "»" + (d ? " — " + d : "");
    }).join("\n· ");
    return "Hay " + il.n + " celda(s) de importe que no se pueden leer como número:\n\n· " + det +
           (il.vals.length > 3 ? "\n(y " + (il.vals.length - 3) + " más)" : "") +
           "\n\nSe leerían como CERO y esas partidas quedarían fuera del cotejo, así que el paso podría " +
           "salir sin diferencias con plata faltando. Corregí la celda en el Excel, volvé a exportarlo y subilo de nuevo.";
  }
  return null;
}

function findHeaderRow(rows, tokens){
  for(var i=0;i<rows.length;i++){
    var row = rows[i];
    if(!row) continue;
    var norm = row.map(function(c){return normTxt(c);});
    var hits = 0;
    for(var t=0;t<tokens.length;t++){
      if(norm.some(function(c){return c.indexOf(normTxt(tokens[t]))!==-1;})) hits++;
    }
    if(hits >= Math.min(3, tokens.length)) return i;
  }
  return -1;
}
function colIdx(headerRow, token){
  for(var i=0;i<headerRow.length;i++){
    if(normTxt(headerRow[i]).indexOf(normTxt(token))!==-1) return i;
  }
  return -1;
}

/* ---------------- Parsers por fuente ---------------- */

// Normalización de fechas del reporte de cajeras (Excel manual):
// Excel a veces guarda las fechas ambiguas (día ≤ 12) como objetos Date con MES/DÍA invertidos
// (ej. "01/06/2026" = 1 de junio se guarda como 6 de enero). Las fechas con día > 12 quedan
// como texto DD/MM inequívoco. Estrategia robusta: deducir el/los meses reales desde esas filas
// de texto inequívocas y usarlos para desambiguar las celdas Date (elegir la orientación cuyo
// mes coincida con el mes dominante del reporte), en vez de invertir a ciegas.
function mesesDominantesReporte(rows, cFecha, startRow){
  var cuenta = {};
  for(var r=startRow;r<rows.length;r++){
    var row = rows[r]; if(!row) continue;
    var raw = row[cFecha];
    if(raw instanceof Date) continue; // ambigua, se resuelve luego
    var s = String(raw==null?"":raw).trim();
    var m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
    if(m){
      var d = parseInt(m[1],10), mo = parseInt(m[2],10);
      if(d>12 && mo>=1 && mo<=12) cuenta[mo] = (cuenta[mo]||0)+1; // DD/MM inequívoco (día>12)
    }
  }
  return Object.keys(cuenta).map(Number);
}
function fechaReporteConsolidado(raw, meses){
  if(raw instanceof Date && !isNaN(raw)){
    var y=raw.getFullYear(), mo=raw.getMonth()+1, da=raw.getDate();
    var opA={mes:mo, dia:da};          // tal cual
    var opB={mes:da, dia:mo};          // mes/día invertidos
    var aOk = meses.indexOf(opA.mes)!==-1;
    var bOk = meses.indexOf(opB.mes)!==-1 && opB.dia<=12;
    var pick = aOk ? opA : (bOk ? opB : opA); // preferir la orientación cuyo mes sea dominante
    return y+"-"+String(pick.mes).padStart(2,"0")+"-"+String(pick.dia).padStart(2,"0");
  }
  var s=String(raw==null?"":raw).trim();
  var mm=s.match(/^(\d{1,2})-(\d)(\d{4})$/); // texto roto tipo "6-62026" => 6-6-2026
  if(mm) return mm[3]+"-"+String(parseInt(mm[2],10)).padStart(2,"0")+"-"+String(parseInt(mm[1],10)).padStart(2,"0");
  return toISODate(raw, false); // DD/MM/YYYY normal
}

// 1) Reporte consolidado de caja (manual, por cajera)
// Soporta dos formatos:
//  a) Encabezado en 2 filas: fila de grupo (VISA/CLAVE/ACH/CHEQUE) + fila de sub-encabezado (Fecha, Cajera, Sr.George, Banistmo, Total)
//  b) Encabezado en 1 fila combinada (formato anterior: "Visa\nSr.George")
function parseReporteConsolidado(rows){
  var subIdx = findHeaderRow(rows, ["Fecha","Cajera","Sr.George","Banistmo"]);
  if(subIdx===-1) throw new Error("No se encontró el encabezado esperado en el reporte consolidado de caja.");
  var subRow = rows[subIdx];
  var cFecha = colIdx(subRow,"Fecha");
  var cCajera = colIdx(subRow,"Cajera");
  // Etiqueta legible de una columna: el encabezado del informe parte los títulos en dos renglones.
  function etiquetaCol(v){ return String(v||"").replace(/\s+/g," ").trim(); }
  var mapCols = [];
  var colsFuera = [];   // columnas con venta que no entran al cotejo por banco (se reportan en el Paso 1)
  var colsEfectivo = []; // Efectivo Brink y Efectivo Ventanilla: se cotejan contra Caja General en el Paso 1

  // Intento (a): dos filas de encabezado, con rellenado hacia adelante de la fila de grupo (celdas combinadas)
  var groupRow = rows[subIdx-1] || [];
  // Caja General acá NO es solo efectivo: es la cuenta puente de TODA la venta, así que hay que mapear
  // cada método que el informe reporte. Faltaban YAPPY (925.47 en junio) y el ACH de Banco General
  // (161.07): sin banco reconocido, esas columnas se descartaban en silencio y su venta nunca se cotejaba.
  var metodosValidos = ["VISA","CLAVE","ACH","CHEQUE","YAPPY"];
  var filledGroup = [];
  var last = "";
  for(var i=0;i<subRow.length;i++){
    var g = groupRow[i];
    if(g!==null && g!==undefined && normTxt(g)!=="") last = normTxt(g);
    filledGroup[i] = last;
  }
  for(var i=0;i<subRow.length;i++){
    var sub = normTxt(subRow[i]);
    if(sub==="TOTAL" || sub==="") continue; // evitar subtotal por grupo
    // El informe cierra con un bloque "Totales" (TOTAL Efectivo, Tot. Tarjetas, total yappy, …). Esas
    // columnas repiten lo ya contado: "total yappy" se colaba como venta y duplicaba el Yappy del mes.
    if(filledGroup[i].indexOf("TOTALES")!==-1) continue;
    // El método puede estar en la fila de grupo (ej. "VISA") o en el sub-encabezado (ej. "Visa\nSr.George").
    // Algunos reportes agrupan Visa+Clave bajo "TARJETA", así que combinamos ambos textos para detectarlo.
    var textoCol = filledGroup[i] + " " + sub;
    var metodo = null;
    for(var m=0;m<metodosValidos.length;m++){
      if(textoCol.indexOf(metodosValidos[m])!==-1){ metodo = metodosValidos[m]; break; }
    }
    if(!metodo){
      // Sin método reconocido tampoco se descarta en silencio: Caja General es la cuenta puente de TODA
      // la venta, así que una columna con monto que nadie mira es un hueco. Se anota para reportarla.
      // Efectivo Brink y Efectivo Ventanilla no son un metodo por banco, pero se cotejan contra Caja General.
      if(textoCol.indexOf("EFECTIVO")!==-1 && /BRINK|VENTANILLA/.test(sub)){
        colsEfectivo.push({ col:i, tipo: sub.indexOf("BRINK")!==-1 ? "BRINK" : "VENTANILLA" });
        continue;
      }
      if(!/FALTANTE|SOBRANTE|FECHA|EMPRESA|CAJERA/.test(sub)) colsFuera.push({col:i, etiqueta:etiquetaCol(subRow[i])});
      continue;
    }
    // "clb(+)" y "clb(-)" son columnas de ajuste entre efectivo y Yappy, no venta cobrada: se saltan.
    if(sub.indexOf("CLB")!==-1) continue;
    var banco = null;
    if(sub.indexOf("GEORGE")!==-1) banco="STG";
    else if(sub.indexOf("BANISTMO")!==-1) banco="Banistmo";
    // Yappy compensa siempre en Banco General, igual que lo resuelve clasificarBancoPorTexto para el
    // diario; y "ACH B. GENERAL" nombra el banco sin decir "Banistmo" ni "George".
    else if(sub.indexOf("GENERAL")!==-1 || metodo==="YAPPY") banco="Banco General";
    if(banco) mapCols.push({metodo:metodo, banco:banco, col:i});
    else colsFuera.push({col:i, etiqueta:etiquetaCol(subRow[i])});
  }

  // Intento (b, fallback): formato anterior con metodo+banco en la misma celda
  if(mapCols.length===0){
    function findPairCol(metodo, bancoTag){
      for(var i=0;i<subRow.length;i++){
        var raw = normTxt(subRow[i]);
        if(raw.indexOf(normTxt(metodo))!==-1 && raw.indexOf(normTxt(bancoTag))!==-1) return i;
      }
      return -1;
    }
    mapCols = [
      {metodo:"VISA", banco:"STG", col: findPairCol("Visa","George")},
      {metodo:"VISA", banco:"Banistmo", col: findPairCol("Visa","Banistmo")},
      {metodo:"CLAVE", banco:"STG", col: findPairCol("Clave","George")},
      {metodo:"CLAVE", banco:"Banistmo", col: findPairCol("Clave","Banistmo")},
      {metodo:"ACH", banco:"STG", col: findPairCol("ACH","George")},
      {metodo:"ACH", banco:"Banistmo", col: findPairCol("ACH","Banistmo")},
      {metodo:"CHEQUE", banco:"STG", col: findPairCol("Cheque","George")},
      {metodo:"CHEQUE", banco:"Banistmo", col: findPairCol("Cheque","Banistmo")}
    ].filter(function(m){return m.col>=0;});
  }

  var meses = mesesDominantesReporte(rows, cFecha, subIdx+1);
  var out = [], efectivo = [];
  var lastIso = null;
  for(var r=subIdx+1;r<rows.length;r++){
    var row = rows[r];
    if(!row) continue;
    var fechaRaw = row[cFecha];
    var cajera = cCajera>=0 ? row[cCajera] : "";
    var iso;
    if(fechaRaw===null||fechaRaw===undefined||normTxt(fechaRaw)===""){
      // Fila de continuación (2ª cajera del mismo día): la fecha viene vacía y hereda la del día anterior.
      // Se exige que tenga cajera para no arrastrar la fecha a filas de totales/basura sin fecha.
      if(!lastIso || !(cajera && normTxt(cajera)!=="")) continue;
      iso = lastIso;
    } else {
      if(normTxt(fechaRaw).indexOf("TOTAL")!==-1) continue;
      iso = fechaReporteConsolidado(fechaRaw, meses);
      if(!iso) continue;
      lastIso = iso;
    }
    mapCols.forEach(function(m){
      var val = money(row[m.col]);
      if(val){
        out.push({fecha:iso, cajera:cajera, banco:m.banco, metodo:m.metodo, monto:val, fila:r+1});
      }
    });
    colsFuera.forEach(function(c){ c.total = Math.round(((c.total||0) + money(row[c.col]))*100)/100; });
    colsEfectivo.forEach(function(c){
      var v = money(row[c.col]);
      if(v) efectivo.push({ fecha:iso, cajera:cajera, tipo:c.tipo, monto:v, fila:r+1 });
    });
  }
  // Se adjunta al resultado (como .hojas en readWorkbook) para que el Paso 1 las reporte sin cambiar la
  // firma de la función ni el resto de los llamadores.
  out.sinMapear = colsFuera.filter(function(c){ return Math.abs(c.total||0) > 0.005; });
  if(colsEfectivo.length) out.efectivo = efectivo;   // solo si el informe trae las columnas de efectivo
  return out;
}

/* ---- Diferencias que se cancelan entre sí ----
   Un mismo depósito anotado en otro día, o en otra columna del reporte, produce varias diferencias que
   SUMAN CERO: la plata está toda, lo que está mal es dónde quedó anotada. Pasó en febrero: los cheques
   del 11 (255.60 + 164.08 + 292.62 + 273.49 = 985.79) se depositaron el 12, el diario los registró ese
   día en dos asientos y el reporte solo puso 273.49 en su columna Cheque. Salían tres diferencias
   —−712.30, +985.79 y −273.49— que son la misma partida vista tres veces. Se colapsan en un aviso. */
// Busca un subconjunto de EXACTAMENTE n hallazgos (mismo banco, fechas cercanas) que sume cero.
function grupoQueSeCancela(hallazgos, idx, inicio, n, usados, tol){
  var base = hallazgos[idx[inicio]];
  var cand = idx.filter(function(i){
    if(usados[i] || i===idx[inicio]) return false;
    var h = hallazgos[i];
    if(String(h.banco||"") !== String(base.banco||"")) return false;
    if(!h.fecha || !base.fecha) return true;
    return daysBetween(base.fecha, h.fecha) <= 7; // un corrimiento de fecha es de días, no de semanas
  });
  var res = null;
  function rec(start, acc, suma){
    if(res) return;
    if(acc.length === n-1){
      if(Math.abs(suma + base.monto) <= tol) res = [idx[inicio]].concat(acc);
      return;
    }
    for(var j=start;j<cand.length;j++){
      acc.push(cand[j]);
      rec(j+1, acc, suma + hallazgos[cand[j]].monto);
      acc.pop();
      if(res) return;
    }
  }
  rec(0, [], 0);
  return res;
}
/* ---- Una de las dos mitades quedo como "fin de mes" ----
   El mismo deposito anotado en dos dias produce dos diferencias que suman cero, y eso es lo que colapsa
   esta regla. Pero si la mitad positiva cae en los ultimos dias del mes, el Paso 1 la clasifica EN TRANSITO
   —la cajera lo reporto y el credito va cuando el banco compense— y entonces las dos mitades ya no se
   cancelan entre si: una sale como diferencia y la otra viaja al resumen del mes siguiente. Paso en abril
   de 2026 con los 38.17 del cobro partido entre los dos POS: el informe los puso el 28 y la contabilidad
   el 29, y la app los conto dos veces.
   Se admiten al grupo, pero solo si hay al menos UNA diferencia real: dos partidas de fin de mes que se
   cancelen entre si no son un error de dia, y colapsarlas las sacaria del resumen sin motivo. */
function esFinDeMesTransito(h){
  return h && h.clase === "en_transito" && /fin de mes/i.test(String(h.motivo||""));
}
function colapsarCompensados(hallazgos, tolerancia){
  var tol = tolerancia || 0.01;
  var idx = [];
  hallazgos.forEach(function(h,i){
    var cl = h.clase||"diff";
    if(cl!=="diff" && !esFinDeMesTransito(h)) return;
    if(typeof h.monto !== "number" || Math.abs(h.monto) <= tol) return;
    idx.push(i);
  });
  if(idx.length < 2) return hallazgos;
  var usados = {}, grupos = [];
  // Grupos chicos primero: que dos diferencias se cancelen es la explicación más simple y más probable.
  for(var n=2; n<=4; n++){
    for(var a=0; a<idx.length; a++){
      if(usados[idx[a]]) continue;
      var g = grupoQueSeCancela(hallazgos, idx, a, n, usados, tol);
      if(!g) continue;
      // Al menos una diferencia real en el grupo, o no se toca.
      if(!g.some(function(i){ return (hallazgos[i].clase||"diff") === "diff"; })) continue;
      g.forEach(function(i){ usados[i]=true; }); grupos.push(g);
    }
  }
  if(!grupos.length) return hallazgos;
  var out = hallazgos.filter(function(h,i){ return !usados[i]; });
  grupos.forEach(function(g){
    var items = g.map(function(i){ return hallazgos[i]; })
                 .sort(function(a,b){ return (a.fecha||"") < (b.fecha||"") ? -1 : 1; });
    var bruto = items.reduce(function(s,h){ return s + Math.max(h.monto, 0); }, 0);
    var fechas = items.map(function(h){ return h.fecha; }).filter(Boolean);
    out.push({
      fecha: fechas[0] || "", banco: items[0].banco || "", monto: Math.round(bruto*100)/100, clase:"aviso",
      concepto:"Diferencias que se compensan", comprobante:"", motivo:"anotado en otro día o columna",
      texto: (items[0].banco ? items[0].banco + ": " : "") + "estas " + items.length +
             " diferencias se cancelan entre sí, así que la plata está completa — lo que cambia es el día o la columna en que quedó anotada: " +
             items.map(function(h){ return (h.fecha||"") + " B/ " + fmt(h.monto) + (esFinDeMesTransito(h) ? " (el informe lo reportó ese día)" : ""); }).join(" · ") +
             ". Suman cero, así que el cotejo cierra. Corregí el reporte para que cada depósito quede en su día y su columna." +
             (items.some(esFinDeMesTransito) ? " Una de las dos venía como depósito de fin de mes: al cancelarse con la otra ya no viaja al resumen del mes siguiente." : ""),
      fuente: items[0].fuente || "Reporte consolidado de caja / Diario Caja General"
    });
  });
  return out;
}

/* ---- Faltantes, sobrantes y ajustes ----
   No son un método de pago ni un depósito, pero afectan el saldo de Caja General directamente en su
   diario, así que el Paso 1 los coteja igual que las ventas: lo que la cajera reportó tiene que estar
   asentado, y todo asiento de faltante/sobrante tiene que venir del reporte. */
// Faltantes y sobrantes del informe de cajeras. Reutiliza el mismo parseo de fecha que
// parseReporteConsolidado: el informe a veces trae la fecha en D/M y hay que resolverla por el mes dominante.
function parseFaltantesSobrantes(rows){
  var subIdx = findHeaderRow(rows, ["Fecha","Cajera"]);
  if(subIdx===-1) return [];
  var subRow = rows[subIdx];
  var cFecha = colIdx(subRow,"Fecha"), cCajera = colIdx(subRow,"Cajera");
  var cFal = colIdx(subRow,"Faltante"), cSob = colIdx(subRow,"Sobrante");
  if(cFal<0 && cSob<0) return [];
  var meses = mesesDominantesReporte(rows, cFecha, subIdx+1);
  var out = [], lastIso = null;
  for(var r=subIdx+1;r<rows.length;r++){
    var row = rows[r]; if(!row) continue;
    var fechaRaw = row[cFecha], cajera = cCajera>=0 ? row[cCajera] : "", iso;
    if(fechaRaw===null||fechaRaw===undefined||normTxt(fechaRaw)===""){
      if(!lastIso || !(cajera && normTxt(cajera)!=="")) continue; // fila de continuación (2ª cajera del día)
      iso = lastIso;
    } else {
      if(normTxt(fechaRaw).indexOf("TOTAL")!==-1) continue;
      iso = fechaReporteConsolidado(fechaRaw, meses);
      if(!iso) continue;
      lastIso = iso;
    }
    var f = cFal>=0 ? money(row[cFal]) : 0, s = cSob>=0 ? money(row[cSob]) : 0;
    if(f) out.push({fecha:iso, cajera:cajera, tipo:"FALTANTE", monto:Math.abs(f), fila:r+1});
    if(s) out.push({fecha:iso, cajera:cajera, tipo:"SOBRANTE", monto:Math.abs(s), fila:r+1});
  }
  return out;
}
// Asientos de faltante/sobrante del diario de Caja General, agrupados POR COMPROBANTE: el asiento a veces
// viene en dos líneas de Caja General con la misma referencia —una al débito y otra al crédito, del mismo
// importe— y el faltante es ese importe, no la suma de los dos lados ni el neto (que daría cero).
function faltSobrDiario(diarioCaja){
  var g = {};
  (diarioCaja||[]).forEach(function(x){
    var n = normTxt(x.descripcion);
    if(!/FALTANTE|SOBRANTE/.test(n)) return;
    var k = x.fecha + "|" + (String(x.referencia||"").trim() || ("fila"+x.fila));
    g[k] = g[k] || {fecha:x.fecha, referencia:String(x.referencia||"").trim(), d:0, c:0,
                    tipos:{}, fila:x.fila, descripcion:(x.descripcion||"").trim()};
    g[k].d += (x.debito||0);
    g[k].c += (x.credito||0);
    g[k].tipos[/SOBRANTE/.test(n) ? "SOBRANTE" : "FALTANTE"] = true;
  });
  return Object.keys(g).map(function(k){
    var v = g[k], tipos = Object.keys(v.tipos);
    return { fecha:v.fecha, tipo: tipos.length===1 ? tipos[0] : "AMBOS", tipos: tipos,
             monto: Math.round(Math.max(v.d, v.c)*100)/100,
             descripcion:v.descripcion, referencia:v.referencia, fila:v.fila };
  });
}
// Coteja día por día lo que reportó la cajera contra lo que quedó asentado. Un faltante reportado que
// nadie asentó —o un asiento sin respaldo en el reporte— mueve el saldo de Caja General sin dejar rastro.
// Se compara POR DÍA el importe total, sin separar faltante de sobrante: en la práctica un mismo
// comprobante llega a llevar las dos etiquetas, y lo que tiene que cuadrar es cuánto se descuadró la caja
// ese día. Si el importe cuadra pero la etiqueta no, se avisa aparte (es un error de descripción).
function cotejarFaltantesSobrantes(delReporte, delDiario, tolerancia){
  var tol = tolerancia || 0.01;
  function agrupa(arr){
    var m = {};
    (arr||[]).forEach(function(x){
      var e = m[x.fecha] = m[x.fecha] || {monto:0, tipos:{}, cajera:""};
      e.monto = Math.round((e.monto + x.monto)*100)/100;
      (x.tipos || [x.tipo]).forEach(function(t){ if(t!=="AMBOS") e.tipos[t] = true; });
      if(!e.cajera && x.cajera) e.cajera = String(x.cajera).trim();
    });
    return m;
  }
  var R = agrupa(delReporte), D = agrupa(delDiario), out = [], vistas = {};
  Object.keys(R).concat(Object.keys(D)).forEach(function(f){
    if(vistas[f]) return;
    vistas[f] = true;
    var r = R[f] || {monto:0, tipos:{}, cajera:""}, d = D[f] || {monto:0, tipos:{}};
    var tr = Object.keys(r.tipos).sort().join("+"), td = Object.keys(d.tipos).sort().join("+");
    if(Math.abs(r.monto - d.monto) > tol){
      out.push({ fecha:f, clase:"monto", reporte:r.monto, diario:d.monto,
                 dif: Math.round((d.monto - r.monto)*100)/100,
                 tipoReporte:tr, tipoDiario:td, cajera:r.cajera });
    } else if(tr && td && tr !== td){
      out.push({ fecha:f, clase:"etiqueta", reporte:r.monto, diario:d.monto, dif:0,
                 tipoReporte:tr, tipoDiario:td, cajera:r.cajera });
    }
  });
  return out.sort(function(a,b){ return a.fecha < b.fecha ? -1 : 1; });
}
// Asientos de AJUSTE del mes (los de apertura ya los cuenta el cuadre del Paso 0). Afectan el saldo de
// Caja General directamente y no vienen del reporte de cajeras, así que se listan para revisión.
function ajustesDelMes(diarioCaja, fechaApertura){
  return (diarioCaja||[]).filter(function(x){
    if(normTxt(x.descripcion).indexOf("AJUST")===-1) return false;
    return !fechaApertura || x.fecha > fechaApertura;
  }).map(function(x){
    var neto = Math.round(((x.debito||0)-(x.credito||0))*100)/100;
    return { fecha:x.fecha, monto:Math.abs(neto), columna: neto>=0 ? "Débito" : "Crédito",
             descripcion:(x.descripcion||"").trim(), referencia:String(x.referencia||"").trim(), fila:x.fila };
  });
}

// 1b) Desglose individual de cheques (2ª pestaña del reporte de cajeras: "CK ...").
// Los cheques no compensan en bloque: cada uno clarea por separado, así que se listan uno a uno.
// Devuelve [{fecha, banco:"STG"|"Banistmo", monto}]. El banco lo da la columna (Cheque Sr.George / Banistmo).
function parseChequesDetalle(reporteRows){
  var hojas = reporteRows && reporteRows.hojas;
  if(!hojas) return [];
  var nombres = Object.keys(hojas);
  var hoja = null;
  for(var i=0;i<nombres.length;i++){ var n=normTxt(nombres[i]); if(n.indexOf("CK")!==-1 || n.indexOf("CHEQUE")!==-1){ hoja=hojas[nombres[i]]; break; } }
  if(!hoja && nombres.length>1) hoja = hojas[nombres[1]]; // fallback: 2ª pestaña
  if(!hoja) return [];
  // Encabezado del detalle: fila con "Fecha" + "Cheque…Sr.George" + "Cheque…Banistmo".
  var hIdx=-1;
  for(var r=0;r<hoja.length;r++){
    var row=hoja[r]; if(!row) continue;
    var f=false, g=false, b=false;
    row.forEach(function(c){ var t=normTxt(c);
      if(t==="FECHA") f=true;
      if(t.indexOf("CHEQUE")!==-1 && t.indexOf("GEORGE")!==-1) g=true;
      if(t.indexOf("CHEQUE")!==-1 && t.indexOf("BANISTMO")!==-1) b=true;
    });
    if(f && g && b){ hIdx=r; break; }
  }
  if(hIdx===-1) return [];
  var header=hoja[hIdx], cFecha=-1, cSTG=-1, cBan=-1;
  for(var i=0;i<header.length;i++){ var t=normTxt(header[i]);
    if(cFecha<0 && t==="FECHA") cFecha=i;
    if(cSTG<0 && t.indexOf("CHEQUE")!==-1 && t.indexOf("GEORGE")!==-1) cSTG=i;
    if(cBan<0 && t.indexOf("CHEQUE")!==-1 && t.indexOf("BANISTMO")!==-1) cBan=i;
  }
  var meses = mesesDominantesReporte(hoja, cFecha, hIdx+1);
  var out=[], fechaAct=null;
  for(var r=hIdx+1;r<hoja.length;r++){
    var row=hoja[r]; if(!row) continue;
    var raw = cFecha>=0?row[cFecha]:null;
    if(raw!==null && raw!==undefined && normTxt(raw)!=="" && normTxt(raw).indexOf("TOTAL")===-1){
      var iso = fechaReporteConsolidado(raw, meses); if(iso) fechaAct=iso;
    }
    if(!fechaAct) continue;
    var vs = cSTG>=0?money(row[cSTG]):0;
    var vb = cBan>=0?money(row[cBan]):0;
    if(vs>0) out.push({fecha:fechaAct, banco:"STG", monto:vs, fila:r+1});
    if(vb>0) out.push({fecha:fechaAct, banco:"Banistmo", monto:vb, fila:r+1});
  }
  return out;
}

// 2) Diario (navegador contabilidad) generico: Caja General / Banistmo / STG
function parseDiario(rows, accountFilter){
  var hIdx = findHeaderRow(rows, ["Fecha","Descripcion","Debito","Credito"]);
  if(hIdx===-1) throw new Error("No se encontró el encabezado esperado en el navegador de diario.");
  var cAccount = colIdx(rows[hIdx],"Account");
  var cFecha = colIdx(rows[hIdx],"Fecha");
  var cRef = colIdx(rows[hIdx],"Referencia");
  var cDesc = colIdx(rows[hIdx],"Descripcion");
  var cDeb = colIdx(rows[hIdx],"Debito");
  var cCred = colIdx(rows[hIdx],"Credito");
  var out = [];
  var lastAccount = "";
  for(var r=hIdx+1;r<rows.length;r++){
    var row = rows[r];
    if(!row) continue;
    if(normTxt(row.join(" ")).indexOf("SALDO TOTAL")!==-1) continue;
    if(normTxt(row.join(" ")).indexOf("MOVIMIENTO MOSTRADO")!==-1) continue;
    if(normTxt(row.join(" ")).indexOf("BALANCE FINAL")!==-1) continue;
    var acc = cAccount>=0 ? row[cAccount] : null;
    if(acc) lastAccount = acc;
    var fechaRaw = cFecha>=0 ? row[cFecha] : null;
    var iso = toISODate(fechaRaw, false);
    if(!iso) continue; // fila secundaria (glosa de detalle), no es movimiento
    var desc = cDesc>=0 ? String(row[cDesc]||"") : "";
    var deb = money(row[cDeb]);
    var cred = money(row[cCred]);
    if(accountFilter && lastAccount && normTxt(lastAccount).indexOf(normTxt(accountFilter))===-1) continue;
    out.push({fecha:iso, cuenta:lastAccount, referencia: cRef>=0?row[cRef]:"", descripcion:desc, debito:deb, credito:cred, fila:r+1});
  }
  return out;
}

// Saldo del diario de Caja General: Balance Inicial (arrastre del mes anterior, dinero en tránsito),
// movimiento del mes y Balance Final. Sirve para contemplar partidas en tránsito que compensan
// entre meses. Devuelve null si el archivo no trae esas filas.
function parseSaldoCajaGeneral(rows){
  function valorFila(row){ // último valor no vacío de la fila (la etiqueta va en la col 0, el monto al final)
    for(var i=row.length-1;i>=0;i--){
      var c=row[i];
      if(c!==null && c!==undefined && String(c).trim()!=="") return money(c);
    }
    return null;
  }
  var res = {inicial:null, movimiento:null, final:null, fechaInicial:null, fechaFinal:null};
  for(var r=0;r<rows.length;r++){
    var row = rows[r]; if(!row) continue;
    var etq = normTxt(row[0]); if(!etq) continue;
    // El navegador exporta "Balance Final al 2026-2-28:" — mes y dia SIN cero a la izquierda. Exigir dos
    // digitos dejaba el periodo en null, y con eso se caian los ajustes de apertura del cuadre del Paso 0
    // y la fecha de los asientos sugeridos.
    var mf = String(row[0]).match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
    var fecha = mf ? mf[1]+"-"+String(mf[2]).padStart(2,"0")+"-"+String(mf[3]).padStart(2,"0") : null;
    if(etq.indexOf("BALANCE INICIAL")!==-1){ res.inicial = valorFila(row); res.fechaInicial = fecha; }
    else if(etq.indexOf("MOVIMIENTO MOSTRADO")!==-1){ res.movimiento = valorFila(row); }
    else if(etq.indexOf("BALANCE FINAL")!==-1){ res.final = valorFila(row); res.fechaFinal = fecha; }
  }
  // Algunos navegadores llegan recortados y el saldo de apertura queda como un importe suelto en la
  // primera fila, sin su etiqueta "Balance Inicial (fecha):" — pasó con el de febrero. Sin esa cifra no
  // corre el cuadre del Paso 0, que es justo el control que avisa si el resumen en tránsito está mal, así
  // que vale la pena recuperarla. Se exige el patrón exacto: una sola celda y con forma de importe.
  if(res.inicial===null && rows.length){
    var f0 = (rows[0]||[]).filter(function(c){ return c!==null && c!==undefined && String(c).trim()!==""; });
    if(f0.length===1 && /B\/|^-?[\d,]*\d\.\d{2}$/.test(String(f0[0]).trim())){
      var v = money(f0[0]);
      if(!isNaN(v)){ res.inicial = v; res.inicialInferido = true; }
    }
  }
  return (res.inicial!==null || res.final!==null) ? res : null;
}

// 3) Estado de cuenta bancario (Banistmo, STG o Banco General)
function parseEstadoCuenta(rows, tipo){
  // "bancogeneral" usa detección flexible porque no conocemos su formato exacto todavía:
  // busca Fecha, Descripción y columnas de débito/crédito en singular o plural.
  var tokens = tipo==="banistmo" ? ["Fecha","Descripcion","Debito","Credito","Saldo"]
    : tipo==="stg" ? ["Fecha","Descripcion","Debitos","Creditos","Balance"]
    : ["Fecha","Descripcion","Debito","Credito"]; // bancogeneral (tolerante)
  var hIdx = findHeaderRow(rows, tokens);
  // Banco General cambió el formato de exportación entre enero y febrero de 2026: donde antes traía dos
  // columnas (Débito / Crédito) ahora trae una sola, "Monto", con el signo adentro. Sin este respaldo el
  // archivo de febrero ni siquiera se lee y se cae la conciliación entera.
  var cMonto = -1;
  if(hIdx===-1 && tipo!=="banistmo" && tipo!=="stg"){
    hIdx = findHeaderRow(rows, ["Fecha","Descripcion","Monto","Saldo"]);
    if(hIdx>=0) cMonto = colIdx(rows[hIdx],"Monto");
  }
  if(hIdx===-1) throw new Error("No se encontró el encabezado esperado en el estado de cuenta.");
  var cFecha = colIdx(rows[hIdx],"Fecha");
  var cDesc = colIdx(rows[hIdx],"Descripcion");
  var cDeb, cCred;
  if(tipo==="banistmo"){ cDeb = colIdx(rows[hIdx],"Debito"); cCred = colIdx(rows[hIdx],"Credito"); }
  else if(tipo==="stg"){ cDeb = colIdx(rows[hIdx],"Debitos"); cCred = colIdx(rows[hIdx],"Creditos"); }
  else { // bancogeneral: probar plural y luego singular
    cDeb = colIdx(rows[hIdx],"Debitos"); if(cDeb<0) cDeb = colIdx(rows[hIdx],"Debito");
    cCred = colIdx(rows[hIdx],"Creditos"); if(cCred<0) cCred = colIdx(rows[hIdx],"Credito");
    // Columna única con signo: negativo es lo que sale de la cuenta (débito), positivo lo que entra.
    if(cDeb<0 && cCred<0 && cMonto<0) cMonto = colIdx(rows[hIdx],"Monto");
  }
  var out = [];
  for(var r=hIdx+1;r<rows.length;r++){
    var row = rows[r];
    if(!row) continue;
    var iso = toISODate(cFecha>=0?row[cFecha]:null, false);
    if(!iso) continue;
    var desc = cDesc>=0 ? String(row[cDesc]||"") : "";
    var deb, cre;
    if(cMonto>=0 && cDeb<0 && cCred<0){
      var m = money(row[cMonto]);
      deb = m<0 ? -m : 0; cre = m>0 ? m : 0;
    } else { deb = money(row[cDeb]); cre = money(row[cCred]); }
    out.push({fecha:iso, descripcion:desc, debito:deb, credito:cre, fila:r+1});
  }
  return out;
}

// 4) Retenciones VISA STG (detalle transaccional con subtotales)
function parseRetencionesVisa(rows){
  var hIdx = findHeaderRow(rows, ["Fecha","Monto Bruto","Ret. Imp","Comision","ITBMS"]);
  if(hIdx===-1) throw new Error("No se encontró el encabezado esperado en el informe de retenciones VISA.");
  var cSuc = colIdx(rows[hIdx],"Sucursal");
  var cFecha = colIdx(rows[hIdx],"Fecha");
  var cBruto = colIdx(rows[hIdx],"Monto Bruto");
  var cRet = colIdx(rows[hIdx],"Ret. Imp");
  var cCom = colIdx(rows[hIdx],"Comision");
  var cItbms = colIdx(rows[hIdx],"ITBMS");
  var porDia = {};
  for(var r=hIdx+1;r<rows.length;r++){
    var row = rows[r];
    if(!row) continue;
    var sucVal = cSuc>=0 ? normTxt(row[cSuc]) : "";
    if(sucVal.indexOf("SUB TOTAL")!==-1 || sucVal.indexOf("COMERCIO")!==-1) continue;
    var iso = toISODate(cFecha>=0?row[cFecha]:null, true); // formato MM/DD/YYYY
    if(!iso) continue;
    var bruto = money(row[cBruto]);
    var ret = money(row[cRet]);
    var com = money(row[cCom]);
    var itbms = money(row[cItbms]);
    if(!porDia[iso]) porDia[iso] = {fecha:iso, bruto:0, retenciones:0};
    porDia[iso].bruto += bruto;
    porDia[iso].retenciones += (ret+com+itbms); // vienen en negativo
  }
  var out = [];
  Object.keys(porDia).forEach(function(k){
    var d = porDia[k];
    d.neto = d.bruto + d.retenciones; // retenciones ya es negativo
    out.push(d);
  });
  return out;
}

/* ---------------- Motor de conciliacion ---------------- */

function sumBy(arr, keyFn, valFn){
  var m = {};
  arr.forEach(function(x){
    var k = keyFn(x);
    m[k] = (m[k]||0) + valFn(x);
  });
  return m;
}

// Paso 1: Reporte consolidado (por banco/dia) vs Diario Caja General (por dia, clasificado por banco via texto)
function clasificarBancoPorTexto(desc){
  var n = normTxt(desc);
  if(n.indexOf("BTS")!==-1 || n.indexOf("BANISTMO")!==-1) return "Banistmo";
  // El banco se escribe de varias formas segun quien exporte: "STG", "ST GEORGES", "St. Georges".
  // Sin "GEORGE", el resumen en transito de junio de 2026 traia 1,972.60 con banco "ST GEORGES" y esas
  // cinco partidas quedaban fuera del cotejo del Paso 0: ni compensaban ni quedaban pendientes.
  if(n.indexOf("STG")!==-1 || n.indexOf("GEORGE")!==-1) return "STG";
  // Yappy compensa en Banco General (todo lo que diga YAPPY va a Banco General),
  // más menciones explícitas del banco ("BANCO GENERAL" / "B. GENERAL").
  if(n.indexOf("YAPPY")!==-1 || n.indexOf("BANCO GENERAL")!==-1 || n.indexOf("B. GENERAL")!==-1 || n.indexOf("B.GENERAL")!==-1) return "Banco General";
  return null;
}
// ¿La descripción es un depósito de ACH o cheque que el sistema a veces registra SIN banco?
// (ej. "DEPOSITO ACH DEL...", "DEPOSITO POR CK DEL..."). Se usa para reconocer que la plata
// está en el sistema aunque no lleve etiqueta de banco → hallazgo "sin confirmar" en vez de rojo.
function esAchOChequeSinBanco(desc){
  var n = normTxt(desc);
  if(clasificarBancoPorTexto(desc)) return false; // ya tiene banco
  return n.indexOf("ACH")!==-1 || /(^|\s)CK(\s|$)/.test(n) || n.indexOf("CHEQUE")!==-1;
}
// Rango de fechas dentro de la descripción de un depósito acumulado, ej. "DEL 1 AL 31 DE ENERO 2026"
// o "DEL 01/01/2026 AL 31/01/2026". Devuelve {ym:"YYYY-MM", diaIni, diaFin} o null si no es un rango.
var MESES_DEP = {ENERO:1,FEBRERO:2,MARZO:3,ABRIL:4,MAYO:5,JUNIO:6,JULIO:7,AGOSTO:8,SEPTIEMBRE:9,OCTUBRE:10,NOVIEMBRE:11,DICIEMBRE:12};
// El asiento se teclea a mano y el rango sale de varias formas: sin el "DEL" y con el dia pegado al "AL"
// ("DEPOSITO DE VISA 1AL 30 DE ABRIL 2026"), o sin el año ("DEPOSITOS POR YAPPY DEL 1 AL 30 DE ABRIL").
// Con la forma estricta, esas dos lineas no se reconocian como acumulado y cada dia del metodo salia
// como diferencia roja en el Paso 1 (abril de 2026: la VISA de STG y todo el Yappy del mes).
// Cuando falta el año se toma el de la FECHA DEL ASIENTO: un acumulado se asienta al cerrar el rango,
// nunca antes, asi que si el mes del texto es POSTERIOR al del asiento, el rango es del año anterior.
function rangoDeposito(desc, fechaAsiento){
  var n = normTxt(desc);
  function anioDe(mes){
    var f = String(fechaAsiento||"");
    if(f.length < 7) return null;
    var y = parseInt(f.slice(0,4),10), mo = parseInt(f.slice(5,7),10);
    if(!y || !mo) return null;
    return mes > mo ? y - 1 : y;
  }
  var m = n.match(/(?:DEL\s+)?(\d{1,2})\s*AL\s+(\d{1,2})\s+DE\s+([A-Z]+)(?:\s+DE)?\s*(\d{4})?/);
  if(m){
    var mes = MESES_DEP[m[3]]; if(!mes) return null;
    var d1 = parseInt(m[1],10), d2 = parseInt(m[2],10); if(d1===d2) return null;
    var anio = m[4] ? parseInt(m[4],10) : anioDe(mes);
    if(!anio) return null;
    return { ym: anio+"-"+String(mes).padStart(2,"0"), diaIni: Math.min(d1,d2), diaFin: Math.max(d1,d2) };
  }
  var m2 = n.match(/DEL\s+(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\s+AL\s+(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/);
  if(m2){
    var da=parseInt(m2[1],10), mo=parseInt(m2[5],10), yy=(m2[6]||m2[3]||"");
    var db=parseInt(m2[4],10); if(yy.length===2) yy="20"+yy;
    if(da===db && parseInt(m2[2],10)===mo) return null;
    var anio2 = yy ? parseInt(yy,10) : anioDe(mo);
    if(!anio2) return null;
    return { ym: anio2+"-"+String(mo).padStart(2,"0"), diaIni: Math.min(da,db), diaFin: Math.max(da,db) };
  }
  return null;
}
// Método de un depósito según su texto.
function metodoDeposito(desc){
  var n = normTxt(desc);
  if(n.indexOf("VISA")!==-1) return "VISA";
  if(n.indexOf("CLAVE")!==-1) return "CLAVE";
  if(n.indexOf("YAPPY")!==-1) return "YAPPY";
  if(n.indexOf("ACH")!==-1) return "ACH";
  if(n.indexOf("CHEQUE")!==-1 || /(^|\s)CK(\s|$)/.test(n)) return "CHEQUE";
  return null;
}
function paso1(reporte, diarioCaja, chequesDetalle, tolerancia, faltSobrReporte, aperturaCaja, transitoPrevio){
  // Se usan las lineas de CREDITO del diario (el deposito real ruteado a cada banco: "DEPOSITO DE
  // BANISTMO CK", "DEPOSITO POR TARJETA CLAVE STG", etc.), clasificadas por banco segun su texto.
  // El DEBITO es "la venta" (el desglose de lo cobrado que entra a caja) y es irrelevante para este
  // cuadre banco a banco. Se toma un solo lado (credito) para no doble-contar.
  // Un acumulado por rango que NO nombra banco ("DEPOSITO DE VISA 1AL 30 DE ABRIL 2026") entra igual:
  // el bloque de abajo lo saca del cotejo diario y lo rutea por monto. Sin esto se descartaba aca mismo
  // y cada dia de ese metodo salia como diferencia roja aunque el asiento estuviera hecho.
  var cajaFiltrada = diarioCaja.filter(function(x){
    if(!(x.credito>0)) return false;
    if(clasificarBancoPorTexto(x.descripcion)) return true;
    return !!(rangoDeposito(x.descripcion, x.fecha) && metodoDeposito(x.descripcion));
  });
  // Depósitos ACUMULADOS por rango de fechas (ej. "DEPOSITOS POR TARJETA VISA STG DEL 1 AL 31 DE ENERO"):
  // el sistema a veces difiere un método al fin de mes en un solo monto. Se sacan del cotejo día por día
  // y se reconcilian aparte contra la SUMA de los montos diarios de ese método+banco del reporte del rango.
  var batches = [];
  cajaFiltrada = cajaFiltrada.filter(function(x){
    var rango = rangoDeposito(x.descripcion, x.fecha), met = metodoDeposito(x.descripcion), bk = clasificarBancoPorTexto(x.descripcion);
    if(rango && met){
      batches.push({ banco:bk || "", sinBanco: !bk, metodo:met, ym:rango.ym, diaIni:rango.diaIni, diaFin:rango.diaFin,
        monto:x.credito, fecha:x.fecha, desc:x.descripcion, ref:x.referencia, cubierto:0, filas:[] });
      return false;
    }
    return true;
  });
  var cajaPorBancoDia = sumBy(cajaFiltrada, function(x){return clasificarBancoPorTexto(x.descripcion)+"|"+x.fecha;},
    function(x){ return x.credito; });
  function batchDe(entry){
    for(var i=0;i<batches.length;i++){ var b=batches[i];
      if(b.sinBanco) continue;   // sin banco en el texto no se puede rutear por banco: va por monto, mas abajo
      if(b.banco===entry.banco && b.metodo===entry.metodo && entry.fecha && entry.fecha.slice(0,7)===b.ym){
        var dia=parseInt(entry.fecha.slice(8,10),10);
        if(dia>=b.diaIni && dia<=b.diaFin) return b;
      }
    }
    return null;
  }
  // Un monto diario del reporte queda "cubierto" por un batch (se difirió limpio a fin de mes) si, al
  // QUITAR ese método diferido, el resto del banco ese día RECONCILIA con el diario. Si no reconcilia,
  // el día es anómalo (ej. todo el banco quedó registrado en otro banco) y su monto se deja en el cotejo
  // diario para que salga como diferencia real (y no se cuenta como cubierto por el batch).
  var repFullBD = sumBy(reporte, function(x){return x.banco+"|"+x.fecha;}, function(x){return x.monto;});
  var batchedBD = {};
  reporte.forEach(function(x){ if(batchDe(x)){ var k=x.banco+"|"+x.fecha; batchedBD[k]=(batchedBD[k]||0)+x.monto; } });
  // Un día es un "swap de banco completo" (el método NO se difirió, se registró en el banco equivocado)
  // si ese banco quedó ~vacío en el diario aunque el reporte esperaba depósitos, Y otro banco tiene un
  // excedente que cubre ese total esperado. En ese caso el monto se deja en el cotejo diario (sale como
  // "bancos diferentes"); en cualquier otro caso el método se difirió limpio y lo cubre el batch.
  var BANCOS_DEP = ["STG","Banistmo"];
  function swapDeBanco(B, D){
    // Solo hay swap entre los bancos que reciben los MISMOS metodos (tarjeta, cheque, ACH). El Yappy solo
    // entra a Banco General: sin esto, cada dia de Yappy se tomaba por "registrado en otro banco" porque
    // Banistmo tenia excedente ese dia, y el acumulado del mes quedaba con una diferencia inventada.
    if(BANCOS_DEP.indexOf(B) === -1) return false;
    if((cajaPorBancoDia[B+"|"+D]||0) >= tolerancia) return false;
    var esperado = repFullBD[B+"|"+D]||0; if(esperado <= tolerancia) return false;
    for(var i=0;i<BANCOS_DEP.length;i++){ var B2=BANCOS_DEP[i]; if(B2===B) continue;
