}
function esChequeDesc(desc){
  var n = normTxt(desc);
  return /(^|\s)CK(\s|$)/.test(n) || n.indexOf("CHEQUE")!==-1;
}
// Subset-sum recursivo: busca cualquier subconjunto de hasta maxN movimientos no usados (dentro de la
// ventana) que sumen 'objetivo'. Para cheques, que el banco junta de a varios (ej. 4 cheques = 798.23).
// direccion (opcional): "adelante" = el pool debe ser de fecha >= ref (un depósito clarea en/después del
// cheque); "atras" = el pool debe ser de fecha <= ref (los cheques de un depósito son de fecha anterior).
// Sin dirección, ventana absoluta (compatibilidad). Evita el "viaje en el tiempo" (cheque que clarea antes de emitirse).
// Tolerancia máxima admitida. Subirla "para que cuadre" borra partidas del cotejo sin decirlo: con 1.00,
// enero pasaba de 10 partidas en tránsito por 4,221.14 a 8 por 3,969.09 — desaparecían un depósito de
// 5.85 y una tarjeta de 246.20. Tres centavos cubren los redondeos reales y no se comen nada.
var TOLERANCIA_MAX = 0.03;
var SUBSET_TOPE = 300000;   // nodos de recursión por búsqueda
var subsetTruncado = 0;     // búsquedas cortadas por el tope; se lee al cerrar cada paso
function buscarSubsetSuma(pool, fecha, objetivo, ventanaDias, tolerancia, maxN, direccion){
  if(Math.abs(objetivo) <= tolerancia) return null;
  var idxs = [];
  for(var i=0;i<pool.length;i++){
    if(pool[i].usado || distanciaBancaria(fecha, pool[i].fecha) > ventanaDias) continue;
    if(direccion==="adelante" && pool[i].fecha < fecha) continue; // el depósito no puede ser anterior al cheque
    if(direccion==="atras" && pool[i].fecha > fecha) continue;    // el cheque no puede ser posterior al depósito
    idxs.push(i);
  }
  var res = null, nodos = 0, cortado = false;
  function rec(start, restante, acc){
    if(res || cortado) return;
    // Tope de exploración: la búsqueda es exponencial y cuando el objetivo NO se puede alcanzar recorre
    // todo el espacio. Medido con 28 partidas y maxN 60: 268 millones de nodos y 3,7 s — la pestaña se
    // congela sin decir nada. Una corrida real completa de los 4 pasos consume entre 2.500 y 10.000
    // nodos, así que 300.000 deja 30x de margen y corta el caso patológico en 6 ms.
    if(++nodos > SUBSET_TOPE){ cortado = true; subsetTruncado++; return; }
    if(Math.abs(restante) <= tolerancia && acc.length>0){ res = acc.slice(); return; }
    if(acc.length >= maxN) return;
    for(var j=start;j<idxs.length;j++){
      if(montoConc(pool[idxs[j]]) - restante > tolerancia) continue; // no puede pasarse
      acc.push(idxs[j]); rec(j+1, restante - montoConc(pool[idxs[j]]), acc); acc.pop();
      if(res) return;
    }
  }
  rec(0, objetivo, []);
  return res;
}
// Línea del estado de cuenta que corresponde a un DEPÓSITO (cheque/efectivo), no a una remisión de
// tarjeta ni a comisiones/retenciones. Se usa para emparejar cheques sin cruzarlos con esas líneas.
function esDepositoEstado(desc){
  var n = normTxt(desc);
  if(n.indexOf("REMISION")!==-1 || n.indexOf("RETENCION")!==-1 || n.indexOf("COMISION")!==-1 ||
     n.indexOf("ITBMS")!==-1 || n.indexOf("TIMBRE")!==-1) return false;
  return n.indexOf("DEPOSITO")!==-1 || n.indexOf("DEPÓSITO")!==-1;
}
function refComprobante(ref){
  return /^ME-/i.test(String(ref==null?"":ref).trim()) ? (" · Comprobante " + String(ref).trim()) : "";
}

// Concilia débitos del diario contra créditos del estado de cuenta permitiendo COMBINACIONES en ambos
// sentidos (una línea combinada del diario puede aparecer partida en varias del estado y viceversa;
// ej. el diario tiene 539.18 y el estado 211.82+132.05+195.31). Devuelve lo que quedó sin emparejar.
// Empareja un depósito Brinks del diario contra el crédito Brinks del estado más cercano (en fecha)
// dentro de una ventana amplia. Los depósitos Brinks clarean con varios días de rezago (el efectivo se
// entrega a Brinks y el banco lo acredita días después con la misma descripción "Brinks"), más que la
// ventana general; se restringe a líneas Brinks para no cruzar con otros montos iguales.
function buscarBrinks(pool, fecha, objetivo, ventanaDias, tolerancia){
  var mejor = -1, mejorDist = Infinity;
  for(var i=0;i<pool.length;i++){
    if(pool[i].usado || !esBrinks(pool[i].descripcion)) continue;
    if(Math.abs(pool[i].monto - objetivo) > tolerancia) continue;
    var dist = distanciaBancaria(fecha, pool[i].fecha);
    if(dist <= ventanaDias && dist < mejorDist){ mejor = i; mejorDist = dist; }
  }
  return mejor>=0 ? [mejor] : null;
}
// Traspaso interno de neto cero: un mismo comprobante (referencia) con un DÉBITO y un CRÉDITO del mismo
// monto en el diario = dinero que entra y sale (movimiento interno). No llega al estado de cuenta, así
// que el débito se marca "_neutro" para no compararlo contra el banco (si no, saldría como diferencia).
function marcarNeutros(diario){
  var noAborted = function(x){ return normTxt((x.descripcion||"")+" "+(x.referencia||"")).indexOf("ABORTED")===-1; };
  var credPorRef = {};
  (diario||[]).forEach(function(x){
    if(x.credito>0 && noAborted(x)){
      var ref = String(x.referencia||"").trim(); if(!ref) return;
      (credPorRef[ref] = credPorRef[ref] || []).push(x.credito);
    }
  });
  (diario||[]).forEach(function(x){
    if(x.debito>0 && noAborted(x)){
      var ref = String(x.referencia||"").trim(); var lista = credPorRef[ref]; if(!lista) return;
      for(var k=0;k<lista.length;k++){ if(Math.abs(lista[k]-x.debito)<=0.01){ lista.splice(k,1); x._neutro=true; break; } }
    }
  });
}
/* ---- Una transaccion ANULADA se va con su contrapartida ----
   El sistema anula un movimiento marcando UNA linea "ABORTED", pero la transaccion son las dos: la original y
   la que la reversa, bajo el mismo comprobante. Filtrando solo la que lleva la palabra, la otra se queda en el
   cotejo y compite con el asiento bueno por la misma linea del banco: una cuadra y la otra viaja al resumen
   mes tras mes sin poder compensar nunca.
   Dos casos reales, los dos traspasos entre cuentas propias que se anularon y se volvieron a registrar:
     27-mar-2026  PAY0004263 (anulado) + PAY0004264 por B/ 1,003.34 — el banco lo acredito una vez, el 27.
     24-abr-2026  PAY0004295 (anulado) + PAY0004300 por B/   650.00 — idem, el 24.
   Es la misma regla que el Modulo 2 ya aplica en parseRetenciones y que CLAUDE.md documenta: la anulada se
   excluye JUNTO CON su contrapartida. El Modulo 1 filtraba solo la linea marcada. */
function refsAnuladasDiario(arr){
  var refs = {};
  (arr||[]).forEach(function(x){
    if(normTxt((x.descripcion||"")+" "+(x.referencia||"")).indexOf("ABORTED") === -1) return;
    var r = String(x.referencia==null ? "" : x.referencia).trim();
    if(r) refs[r] = true;
  });
  return refs;
}
function conciliarBancoEstado(diarioDeb, estadoCred, ventanaDias, tolerancia, retVisaPorDia){
  marcarNeutros(diarioDeb);
  // Las dos listas se miran por separado: un comprobante anulado en el diario no anula nada en el estado.
  var anuladasDeb = refsAnuladasDiario(diarioDeb), anuladasCred = refsAnuladasDiario(estadoCred);
  function limpio(arr, campo){
    // Se excluyen: _chqUsado (ya emparejado por la pasada de cheques/Paso 0), _transitoUsado (línea del
    // estado que compensó una partida en tránsito del mes anterior: su asiento es del mes pasado, no de
    // este) y _neutro (traspaso interno de neto cero, no llega al estado de cuenta).
    var anuladas = (campo === "debito") ? anuladasDeb : anuladasCred;
    return arr.filter(function(x){ return x[campo]>0 && !x._chqUsado && !x._transitoUsado && !x._neutro &&
        normTxt((x.descripcion||"")+" "+(x.referencia||"")).indexOf("ABORTED")===-1 &&
        !anuladas[String(x.referencia==null ? "" : x.referencia).trim()]; })
      // _montoConc: el Paso 3 lo marca en un asiento acumulado que trae adentro el descargo del transito
      // anterior (ver marcarAcumuladosConDescargo). undefined deja que montoConc() use el monto, como siempre.
      .map(function(x){ return {fecha:x.fecha, monto:x[campo], montoConc:x._montoConc, descripcion:x.descripcion, referencia:x.referencia, fila:x.fila, usado:false}; });
  }
  var poolDiario = limpio(diarioDeb, "debito");
  var poolEstado = limpio(estadoCred, "credito");
  // VISA: el banco SIEMPRE compensa el NETO (bruto − retención del día). El diario registra el bruto, así
  // que se le adjunta el importe con el que hay que conciliarlo. Todas las búsquedas usan `montoConc`, de
  // modo que ninguna pasada —ni la directa ni la inversa— pueda engancharlo por el bruto.
  if(retVisaPorDia){
    poolDiario.forEach(function(d){
      if(normTxt(d.descripcion).indexOf("VISA")===-1) return;
      if(rangoDeposito(d.descripcion, d.fecha)) return; // acumulado del período: su retención es la del RANGO, no la de un día
      var r = retVisaPorDia[d.fecha];
      if(r==null) return;
      d.montoConc = Math.round((d.monto - r)*100)/100;
      d.retencion = r;
    });
  }
  var VENTANA_BRINKS = Math.max(ventanaDias, 10); // el Brinks clarea con rezago (varios días)
  // 0) efectivo del día consolidado por el banco (Brinks + ventanilla en un solo crédito). Va PRIMERO:
  // el emparejamiento genérico por monto separaría las partidas y dejaría una huérfana.
  consolidarEfectivoDelDia(poolDiario, poolEstado, ventanaDias, tolerancia);
  // 0b) asiento que acumula toda la tarjeta del mes contra sus remisiones diarias. También va primero:
  // consume de una vez las remisiones que si no se emparejarían sueltas con cualquier otro depósito.
  conciliarAcumuladoPeriodo(poolDiario, poolEstado, retVisaPorDia, tolerancia);
  // 1) cada débito del diario contra una combinación de créditos del estado
  poolDiario.forEach(function(d){
    // VISA: el banco SIEMPRE compensa el NETO (bruto − retención del día); el diario registra el bruto y la
    // 'Remisión V/Mc' del estado ya viene con la retención descontada. Por eso, cuando se conoce la
    // retención del día, el neto es la ÚNICA interpretación válida y se prueba PRIMERO: si se probara el
    // bruto antes, podría engancharse con cualquier crédito que coincidiera en importe (o con una
    // combinación de dos o tres) y dejar huérfana la remisión real.
    // El objetivo es el importe conciliable: el neto para la VISA con retención conocida, el monto en el
    // resto. Si la remisión no aparece por su neto es un pendiente real, no algo a emparejar por otra vía.
    var objetivo = montoConc(d);
    // Solo los créditos que este depósito PUEDE compensar (las remisiones de tarjeta quedan reservadas
    // para depósitos de tarjeta). Comparte los objetos, así que marcar `usado` marca el pool original.
    var cand = poolEstado.filter(function(e){ return compatibleConRemision(e.descripcion, d.descripcion); });
    var sent = sentidoDeposito(d.descripcion);   // los ACH pueden haber entrado antes del asiento
    var combo = buscarCombinacion(cand, d.fecha, objetivo, ventanaDias, tolerancia, sent);
    // Brinks: depósito Brinks del diario → crédito Brinks del estado, con ventana amplia (rezago).
    if(!combo && esBrinks(d.descripcion)){
      combo = buscarBrinks(cand, d.fecha, d.monto, VENTANA_BRINKS, tolerancia);
    }
    // Depósito combinado: el diario registra un depósito global (ej. ACH de varios certificados por
    // 1313.10) que el estado refleja partido en MÁS de 3 líneas y con unos días de rezago. Se prueba una
    // combinación de hasta 5 créditos con ventana algo más amplia.
    if(!combo){
      combo = buscarSubsetSuma(cand, d.fecha, objetivo, Math.max(ventanaDias, 8), tolerancia, 5, sent);
    }
    if(combo){ combo.forEach(function(i){ cand[i].usado=true; }); d.usado=true; }
  });
  // 2) cada crédito del estado no usado contra una combinación de débitos del diario no usados
  poolEstado.forEach(function(e){
    if(e.usado) return;
    var cand = poolDiario.filter(function(d){ return compatibleConRemision(e.descripcion, d.descripcion); });
    // Mirado desde el estado, el asiento que le corresponde es de la misma fecha o ANTERIOR.
    var combo = buscarCombinacion(cand, e.fecha, e.monto, ventanaDias, tolerancia,
                                  esAchDesc(e.descripcion) ? null : "atras");
    if(combo){ combo.forEach(function(i){ cand[i].usado=true; }); e.usado=true; }
  });
  /* ---- 3) GRUPO contra GRUPO: el mismo total repartido de otra forma ----
     Las pasadas 1 y 2 prueban un asiento contra varios creditos y un credito contra varios asientos, pero
     no grupo contra grupo, y el banco hace justo eso. Dos casos de marzo de 2026:
     - Un asiento acumula el metodo de todo el mes sin declarar el rango en su texto ("DEPOSITOS POR YAPPY
       404.49" del 31-mar) mientras el banco lo fue acreditando dia por dia en siete depositos. Como la
       descripcion no dice "DEL 1 AL 31", conciliarAcumuladoPeriodo no lo ve, y siete lineas exceden el
       tope de cinco de la pasada 1.
     - El banco reagrupa: las tarjetas del 27 y 28 (VISA 546.65 + 739.62) entraron el 30 como dos
       remisiones de 824.01 + 462.26. El total es el mismo —1,286.27— pero ninguna linea coincide con
       ninguna, asi que las remisiones salian como diferencia Y los asientos inflaban el transito.
     Resguardos: mismo tipo de linea a los dos lados, suma EXACTA, ventana, y —lo que de verdad protege—
     la combinacion tiene que ser UNICA. Con dos formas de llegar al mismo total, elegir una seria
     adivinar: se deja como diferencia, que es lo que paso con los 270.30 y 328.16 del 11-mar, depositos
     que no estan en ningun archivo y tienen que seguir apareciendo. */
  function tipoConc(desc, esEstado){
    if(esEstado){
      if(esRemisionVisa(desc)) return "VMC";
      if(esRemisionClave(desc)) return "CLAVE";
      return "OTRO";
    }
    var n = normTxt(desc);
    if(n.indexOf("VISA")!==-1 || n.indexOf("V/MC")!==-1) return "VMC";
    if(n.indexOf("CLAVE")!==-1) return "CLAVE";
    return "OTRO";
  }
  var bloques = [];
  var VENT_BLOQUE = Math.max(ventanaDias, 10);
  function cerrarBloque(ds, es){
    var fd = ds.map(function(x){ return x.fecha; }).sort();
    var fe = es.map(function(x){ return x.fecha; }).sort();
    if(distanciaBancaria(fd[0], fe[fe.length-1]) > VENT_BLOQUE) return false;
    ds.forEach(function(x){ x.usado = true; });
    es.forEach(function(x){ x.usado = true; });
    bloques.push({ debitos:ds.slice(), creditos:es.slice(),
                   total: Math.round(ds.reduce(function(a,x){ return a + montoConc(x); },0)*100)/100 });
    return true;
  }
  // Una sola manera de llegar al total, o no se toca.
  function unica(montos, objetivo, maxN){
    var sols = solucionesSuma(montos, objetivo, tolerancia, maxN, 1);
    return (sols && sols.length === 1) ? sols[0] : null;
  }
  ["VMC","CLAVE","OTRO"].forEach(function(t){
    function pend(arr, esEstado){
      return arr.filter(function(x){ return !x.usado && tipoConc(x.descripcion, esEstado) === t; });
    }
    /* a) un asiento que acumula el metodo de varios dias del periodo y se digita al cierre: sus creditos
       son ANTERIORES al asiento. Se exige que abarquen 3 o mas DIAS distintos, porque con uno o dos lo
       normal es al reves —el banco acredita el dia del deposito o despues— y aceptar lo anterior daria por
       compensado un efectivo antes de entregarse: el Brinks de 1,313.10 del 27-jun-2026 "cuadraria" con
       los cuatro certificados del 22 y el 23 que no son suyos. */
    function diasDe(xs){ var m = {}; xs.forEach(function(x){ m[x.fecha] = true; }); return Object.keys(m).length; }
    pend(poolDiario, false).forEach(function(d){
      if(d.usado) return;
      var es = pend(poolEstado, true).filter(function(e){ return e.fecha <= d.fecha; });
      if(es.length < 3 || diasDe(es) < 3) return;
      // Hasta 20 lineas: el acumulado de un mes son tantas como dias acredito el banco. Con el tope en 8
      // se caia justo cuando mas hacia falta —el Yappy de abril de 2026 entro en 9 depositos— y ademas el
      // corte no se notaba: la partida salia como diferencia igual que si no existiera. solucionesSuma
      // tiene su propio tope de nodos y devuelve null si se corta, asi que un mes patologico no cuelga la
      // pestaña: simplemente no cuadra y se reporta.
      var idx = unica(es.map(function(e){ return e.monto; }), montoConc(d), 20);
      if(!idx || idx.length < 3) return;
      var sel = idx.map(function(i){ return es[i]; });
      if(diasDe(sel) < 3) return;
      cerrarBloque([d], sel);
    });
    // b) varios asientos contra varios creditos, con el mismo total repartido distinto.
    var es2 = pend(poolEstado, true);
    for(var a=0; a<es2.length; a++){
      for(var b=a+1; b<es2.length; b++){
        if(es2[a].usado || es2[b].usado) continue;
        var grupoE = [es2[a], es2[b]];
        var suma = Math.round((es2[a].monto + es2[b].monto)*100)/100;
        var ultima = grupoE.map(function(x){ return x.fecha; }).sort().slice(-1)[0];
        var ds = pend(poolDiario, false).filter(function(x){ return x.fecha <= ultima; });
        if(ds.length < 2) continue;
        var idxD = unica(ds.map(function(x){ return montoConc(x); }), suma, 4);
        if(!idxD || idxD.length < 2) continue;
        cerrarBloque(idxD.map(function(i){ return ds[i]; }), grupoE);
      }
    }
  });
  /* ---- 4) El asiento no dice el metodo y su linea del estado es una remision ----
     compatibleConRemision reserva las remisiones de tarjeta para depositos que digan tarjeta, y con razon:
     sin eso el efectivo se come la remision de una venta con tarjeta. Pero deja afuera al asiento que
     describe el PROBLEMA en vez del metodo — el 29-abr-2026 "DEPOSITO BANISTMO SE LE DESCONTO AL CLIENTE
     38.17 EL DIA 28/4 EN ST GEORGES, BANISTMO NO REFLEJA BAUCHER..." tenia su remision CLAVE de 38.17 en el
     estado, el mismo dia y por el mismo importe, y no la podia tomar: salia como diferencia por los dos
     lados (el asiento sin compensar y la linea sin asiento).
     Va al final, cuando todos los que SI nombran su metodo ya eligieron, y con tres candados: el asiento no
     nombra ningun metodo, la fecha es la MISMA (no una ventana) y hay UNA sola linea libre con ese importe
     ese dia. Con dos posibles no se toca. */
  poolDiario.forEach(function(d){
    if(d.usado || metodoDeposito(d.descripcion) || esEfectivoConNombre(d.descripcion)) return;
    var cand = poolEstado.filter(function(e){
      return !e.usado && e.fecha === d.fecha && Math.abs(e.monto - montoConc(d)) <= tolerancia;
    });
    if(cand.length !== 1) return;
    cand[0].usado = true; d.usado = true;
  });
  return {
    faltanEnBanco: poolDiario.filter(function(d){ return !d.usado; }),   // en el diario, no en el estado
    faltanEnDiario: poolEstado.filter(function(e){ return !e.usado; }),  // en el estado, no en el diario
    bloques: bloques                                                    // cuadraron como bloque, no 1 a 1
  };
}

// Paso 2: Cotejo de lo que Caja General registró como depositado a cada banco (el resultado del
// Paso 1: reporte → Caja General) contra el ESTADO DE CUENTA real de cada banco. Reglas:
//  - Empareja por monto dentro de la ventana de días; acepta que el banco parta un depósito
//    combinado en varias líneas (busca combinaciones que sumen el total).
//  - VISA compensa NETO en el banco: si hay informe de retenciones, para STG también se intenta
//    emparejar el depósito menos la retención del día (bruto − retención = neto).
//  - Los CHEQUES no compensan en bloque: si se sube el reporte con el desglose individual (2ª pestaña),
//    cada cheque se cuadra por separado contra el banco; los que no compensan quedan en tránsito.
//  - Un cheque que no aparece en su banco se busca en los otros bancos; si aparece en otro, se marca
//    como banco mal asignado; si no aparece en ninguno, queda "en tránsito" (pendiente por cambiar).
// estBancoGeneral, retVisa, chequesDetalle y reporte son opcionales.
//
// El INFORME DE CAJA es la fuente de referencia del desglose: el navegador a veces registra un depósito
// consolidado bajo una sola etiqueta (ej. "DEPOSITO POR TARJETA VISA BANISTMO" por 1,127.27) cuando en
// realidad son varios métodos que el banco acredita por separado (VISA 733.55 + CLAVE 393.72). Ante un
// depósito que no aparece en el estado se consulta el informe de ese día y banco: si sus partidas suman lo
// mismo, el asiento COTEJA aunque la etiqueta del navegador esté incompleta. Devuelve las partidas o null.
function desgloseDelInforme(reporte, fecha, banco, monto, tolerancia){
  if(!reporte || !reporte.length) return null;
  var partes = reporte.filter(function(r){ return r.fecha===fecha && r.banco===banco && r.monto>0; });
  if(partes.length < 2) return null; // con una sola partida no aporta nada nuevo
  // NO se mira el método: el comprobante puede decir "VISA" y contener también CLAVE. Lo que vale es que
  // los importes cuadren. Primero se prueba con todas las partidas del día...
  var suma = Math.round(partes.reduce(function(a,r){ return a+r.monto; },0)*100)/100;
  if(Math.abs(suma - monto) <= tolerancia) return partes;
  // ...y si no, con el subconjunto que sume el monto (el asiento pudo consolidar solo algunos métodos).
  var pool = partes.map(function(p){ return {fecha:fecha, monto:p.monto, usado:false}; });
  var idxs = buscarSubsetSuma(pool, fecha, monto, 1, tolerancia, 8);
  if(idxs && idxs.length >= 2) return idxs.map(function(i){ return partes[i]; });
  return null;
}
/* ---- Asientos de DESCARGO del transito del mes anterior ----
   Con la mecanica nueva, cada mes arranca descargando de Caja General lo que quedo en transito y ya
   compenso (debito al banco / credito a Caja General). Esos asientos no son depositos nuevos: su linea
   del estado de cuenta ya la consumio el Paso 0, asi que el cotejo normal no los encuentra y salian como
   en transito otra vez — en febrero de 2026 el ME-1896 (1,354.25) y el ME-1855 (1,324.90) inflaban el
   resumen en 2,679.15. Dos vias de reconocimiento:
   - Heuristica: el importe suma partidas del transito previo de ese banco que YA COMPENSARON. Se exige
     la evidencia de compensacion para no tragarse un deposito nuevo que coincida por casualidad.
   - Convencion: si el concepto dice DESCARGO, se acepta contra cualquier partida del transito previo
     (la etiqueta es intencion explicita); si ni asi coincide, se avisa en vez de callar. */
function esDescargoDesc(desc){ return normTxt(desc).indexOf("DESCARGO")!==-1; }
/* ---- Una sola casa por comparacion ----
   Cada pregunta contable se decide en UN paso y los siguientes heredan la decision en vez de volver a
   leer los archivos y decidir otra vez por su cuenta. Antes el transito anterior se cotejaba en los Pasos
   0, 2 y 3; el descargo se reconocia con reglas distintas en los Pasos 1, 2 y 3; y la VISA se asignaba en
   tres lugares sin compartir resultado. Dos pasos podian contradecirse sobre la misma linea.
     transito anterior ⇄ estados .......... Paso 0  → lo heredan los Pasos 2 y 3
     descargo del transito ................ Paso 1  → lo heredan los Pasos 2 y 3
     efectivo de la cajera ⇄ Caja General . Paso 1  → el Paso 2 lo busca en el banco
     que remision VISA pago cada venta .... Paso 2  → el Paso 4 controla contra esa asignacion
   Cada decision guarda la FIRMA de los archivos con que se tomo. Si un paso recibe otros archivos (se
   cambio un Excel, o una prueba llama al paso suelto) no usa una decision vieja: decide por su cuenta. */
function firmaFilas(rows){
  var n = 0, cr = 0, db = 0, fmin = "", fmax = "";
  (rows||[]).forEach(function(x){
    n++; cr += Math.round((+x.credito||0)*100); db += Math.round((+x.debito||0)*100);
    var f = x.fecha || ""; if(f && (!fmin || f < fmin)) fmin = f; if(f > fmax) fmax = f;
  });
  return n + "|" + cr + "|" + db + "|" + fmin + "|" + fmax;
}
function firmaEstado(rows){ return firmaFilas(rows); }
function firmaDiario(rows){ return firmaFilas(rows); }
function firmaTransito(items){
  return (items||[]).map(function(t){ return (t.banco||"") + "|" + (t.fecha||"") + "|" + Math.round((+t.monto||0)*100); }).join(";");
}
function decisiones(){ if(!STATE.decisiones) STATE.decisiones = {}; return STATE.decisiones; }
// Paso 0: que partidas compensaron y con que lineas (banco + fila) de cada estado de cuenta.
function guardarDecisionTransito(transitoPrevio, estados, res){
  var firmas = {};
  Object.keys(estados).forEach(function(b){ firmas[b] = firmaEstado(estados[b]||[]); });
  function copia(ch){
    return { fecha:ch.fecha, fechaOrig:ch.fechaOrig, monto:ch.monto, concepto:ch.concepto, comprobante:ch.comprobante,
             sentido:ch.sentido, creditoCG:ch.creditoCG, partes:ch.partes, banco:ch.banco,
             compensoEn: ch.compensoEn ? { fecha: ch.compensoEn.fecha } : null };
  }
  decisiones().transito = { firmaTransito: firmaTransito(transitoPrevio), firmas: firmas, consumidas: res.consumidas || {},
    compensadas: res.compensadas.map(copia), pendientes: res.pendientes.map(copia), fechasRaras: res.fechasRaras || [] };
}
// Pasos 2 y 3: heredan lo que decidio el Paso 0. Si los archivos no son los mismos, cotejan por su cuenta.
function transitoDelPaso0(transitoPrevio, estados, tolerancia){
  var dec = STATE.decisiones && STATE.decisiones.transito;
  var vale = !!dec && dec.firmaTransito === firmaTransito(transitoPrevio) && Object.keys(estados).every(function(b){
    var rows = estados[b];
    return !rows || !rows.length || dec.firmas[b] === firmaEstado(rows);
  });
  if(!vale) return consumirTransitoPrevio(transitoPrevio, estados, tolerancia);
  Object.keys(estados).forEach(function(b){
    var usadas = dec.consumidas[b] || {};
    (estados[b]||[]).forEach(function(x){ if(usadas[x.fila]) x._transitoUsado = true; });
  });
  return { compensadas: dec.compensadas, pendientes: dec.pendientes, fechasRaras: dec.fechasRaras, heredado: true };
}
// Paso 1: que creditos de Caja General son descargo del transito, con sus lineas y partidas.
function guardarDecisionDescargos(diarioCaja, transitoPrevio, lista){
  decisiones().descargos = { firmaCaja: firmaDiario(diarioCaja), firmaTransito: firmaTransito(transitoPrevio),
    lista: (lista||[]).map(function(dg){
      return { banco:dg.banco, fecha:dg.fecha, monto:dg.monto, ref:dg.ref, dif: dg.soloDecision ? dg.dif : null,
        partidas:(dg.partidas||[]).map(function(p){ return { banco:p.banco, fecha:p.fecha, monto:p.monto, concepto:p.concepto }; }),
        lineas:(dg.lineas||[]).map(function(l){ return { fecha:l.fecha, monto:l.monto, descripcion:l.descripcion, referencia:l.referencia }; }) };
    }) };
}
function descargosHeredados(transitoPrevio, diarioCaja){
  var dec = STATE.decisiones && STATE.decisiones.descargos;
  if(!dec || !transitoPrevio || !transitoPrevio.length) return null;
  if(dec.firmaTransito !== firmaTransito(transitoPrevio)) return null;
  if(diarioCaja && dec.firmaCaja !== firmaDiario(diarioCaja)) return null;
  return dec.lista;
}
// Ubica en un diario (Caja General o el del banco) las lineas de un descargo ya decidido. Devuelve las filas
// halladas; si no estan todas, no marca ninguna.
function marcarLineasHeredadas(filas, lineas, campo, marca){
  var halladas = [];
  var todas = (lineas||[]).every(function(l){
    for(var i=0;i<filas.length;i++){
      var x = filas[i];
      if(x[marca] || halladas.indexOf(x) !== -1 || x.fecha !== l.fecha || Math.abs((x[campo]||0) - l.monto) > 0.005) continue;
      var r1 = String(x.referencia==null ? "" : x.referencia).trim(), r2 = String(l.referencia==null ? "" : l.referencia).trim();
      if(/^ME-/i.test(r1) && /^ME-/i.test(r2) && r1 !== r2) continue;
      halladas.push(x);
      return true;
    }
    return false;
  });
  if(!todas || !halladas.length) return [];
  halladas.forEach(function(x){ x[marca] = true; });
  return halladas;
}
function refME(ref){ var r = String(ref==null ? "" : ref).trim(); return /^ME-/i.test(r) ? r : ""; }
/* ---- El acumulado del navegador del banco trae adentro un descargo ya compensado ----
   El Paso 1 detecta que un asiento acumulado registra el metodo del mes MAS el descargo de una partida que
   venia en transito (ver "El acumulado trae adentro el DESCARGO"). Del lado del banco ese asiento es un solo
   debito por el total, pero su linea del estado ya no esta libre: el Paso 0 la consumio cuando vio compensar
   la partida. Buscando el total, el Paso 3 no lo encuentra nunca y devuelve una diferencia por CADA credito
   del estado — en mayo de 2026 el Yappy salia en 15. Se le marca el importe conciliable (total menos
   descargo) y el cotejo busca eso, que es lo que el banco todavia tiene por acreditar.
   Solo con la decision del Paso 1 y sobre el diario del mismo banco: sin eso no se toca nada. */
function marcarAcumuladosConDescargo(banco, diario, tolerancia){
  var dec = STATE.decisiones && STATE.decisiones.acumDescargo;
  if(!dec || !dec.lista || !dec.lista.length || !diario || !diario.length) return;
  dec.lista.forEach(function(a){
    if(a.banco !== banco || !(a.descargo > 0)) return;
    for(var i=0;i<diario.length;i++){
      var x = diario[i];
      if(x._montoConc != null || !(x.debito > 0)) continue;
      if(x.fecha !== a.fecha || Math.abs(x.debito - a.monto) > 0.005) continue;
      x._montoConc = Math.round((a.monto - a.descargo)*100)/100;
      return;
    }
  });
}
// Cheques: los clarea el Paso 2 contra el desglose del informe. El Paso 3 recibe que lineas del estado se
// usaron y cuanto suma el desglose, y solo verifica que el navegador del banco registre ese mismo total.
/* ---- Asiento repetido en el navegador del banco ----
   Todo lo que esta en el navegador y no en el estado se da por rezago del banco y viaja al resumen. Si el
   MISMO asiento esta dos veces —igual comprobante, fecha, importe y descripcion— y ninguna de las dos
   compenso, no es rezago: es el movimiento registrado dos veces, y asi se arrastraba mes tras mes sin que
   nadie lo notara. No se compara importe contra importe con Caja General a proposito: el navegador parte
   lo que la cuenta puente trae junto (el efectivo del 29-jun-2026 son 321.12 en Caja General y 320.00 +
   1.12 en el banco), y esa comparacion daba diferencias que no existen. */
function repetidoEnNavegador(diario, f){
  var ref = refME(f.referencia), n = 0;
  (diario||[]).forEach(function(x){
    if(!(x.debito > 0) || refME(x.referencia) !== ref) return;
    if(x.fecha !== f.fecha || Math.abs(x.debito - f.monto) > 0.005) return;
    if(normTxt(x.descripcion) !== normTxt(f.descripcion)) return;
    n++;
  });
  return n;
}
function chequesDelPaso2(banco, estado){
  var dec = STATE.decisiones && STATE.decisiones.cheques;
  if(!dec || !dec.porBanco || !dec.porBanco[banco]) return null;
  if(dec.firmas[banco] !== firmaEstado(estado||[])) return null;
  return dec.porBanco[banco];
}
/* ---- Fecha de origen escrita en la descripcion ----
   El descargo del transito se asienta con la fecha del dia en que se registra (1-mar), bajo el mismo
   comprobante que las ventas de ese dia. Lo unico que dice que es de febrero es el texto: "tarjeta visa 28/2",
   "ck 1463.08 del 27/2/2026". Devuelve esa fecha si es de un MES ANTERIOR al del asiento; si no, null (la
   fecha del propio dia, "DEL 01/03/2026", no es de origen). Los importes con punto no se confunden. */
function fechaOrigenEnTexto(desc, fechaAsiento){
  if(!desc || !fechaAsiento) return null;
  var re = /(^|[^\d\/.,])(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?(?![\d\/])/g, m;
  var ya = parseInt(String(fechaAsiento).slice(0,4),10), ma = parseInt(String(fechaAsiento).slice(5,7),10);
  while((m = re.exec(String(desc)))){
    var dia = parseInt(m[2],10), mes = parseInt(m[3],10);
    if(dia < 1 || dia > 31 || mes < 1 || mes > 12) continue;
    // "DEPOSITO BRINKS DEL 02/01/2025" en un asiento del 02-ene-2026: es el propio dia con el año mal
    // tecleado, no una venta de otro mes. Tomarla como origen sacaba el efectivo del dia del cotejo.
    if(dia === parseInt(String(fechaAsiento).slice(8,10),10) && mes === ma) continue;
    var y = m[4] ? parseInt(m[4],10) : (mes > ma ? ya - 1 : ya);
    if(y < 100) y += 2000;
    var iso = y + "-" + String(mes).padStart(2,"0") + "-" + String(dia).padStart(2,"0");
    if(iso.slice(0,7) < String(fechaAsiento).slice(0,7)) return iso;
  }
  return null;
}
// Orden de preferencia de una linea para ser parte de un descargo: primero las que citan una fecha de origen,
// despues las que no tienen fecha y al final las que citan la fecha del propio dia (esas son ventas del dia).
function prioridadDescargo(l){
  if(fechaOrigenEnTexto(l.descripcion, l.fecha)) return 0;
  return /\d{1,2}\/\d{1,2}/.test(String(l.descripcion||"")) ? 2 : 1;
}
/* ---- Descargo repartido en varias lineas ----
   El reconocimiento de siempre toma CADA credito y busca que partidas del transito lo forman: sirve para
   varias partidas descargadas en un solo asiento (los cinco Brinks de febrero de 2026). Falla en el caso
   contrario, una partida descargada en varias lineas: el 1-mar-2026 el deposito de fin de mes de 3,571.60
   del 27-feb se asento como ck 1,463.08 + visa 1,124.69 + clave 983.83, ninguna linea suelta coincide con
   nada y los 4,591.04 salian como diferencia. Aca se agrupan las lineas de un banco por (dia del asiento,
   fecha de origen citada) y el grupo se cruza contra las partidas del transito de ESA fecha. */
function descargosPorFechaOrigen(lineas, pool, banco, tolerancia, campoUsado){
  var grupos = {}, orden = [];
  (lineas||[]).forEach(function(l){
    var o = fechaOrigenEnTexto(l.descripcion, l.fecha);
    if(!o) return;
    var k = l.fecha + "|" + o;
    if(!grupos[k]){ grupos[k] = { fecha:l.fecha, origen:o, lineas:[], total:0 }; orden.push(k); }
    grupos[k].lineas.push(l);
    grupos[k].total = Math.round((grupos[k].total + l.monto)*100)/100;
  });
  var hechos = [], cercanos = [];
  orden.forEach(function(k){
    var g = grupos[k];
    var cand = (pool||[]).filter(function(p){ return p.banco===banco && !p[campoUsado] && p.fecha===g.origen; });
    if(!cand.length){
      // Ninguna partida de esa fecha: igual es un descargo (la linea dice de que dia es). Se reporta contra la
      // partida del banco que mas se le acerca, o contra ninguna, para que no vuelva al cotejo del dia.
      var otras = (pool||[]).filter(function(p){ return p.banco===banco && !p[campoUsado] && String(p.fecha||"").slice(0,7) < String(g.fecha).slice(0,7); });
      var cerca = null;
      otras.forEach(function(p){ var d = Math.abs(p.monto - g.total); if(!cerca || d < cerca.d) cerca = { p:p, d:d }; });
      cercanos.push({ fecha:g.fecha, origen:g.origen, banco:banco, monto:g.total, lineas:g.lineas, partida: cerca ? cerca.p : null,
                      dif: Math.round((g.total - (cerca ? cerca.p.monto : 0))*100)/100, otraFecha:true });
      return;
    }
    var idx = buscarSubsetSuma(cand, g.origen, g.total, 0, tolerancia, 12);
    if(idx){
      var usadas = idx.map(function(i){ return cand[i]; });
      usadas.forEach(function(p){ p[campoUsado] = true; });
      hechos.push({ fecha:g.fecha, origen:g.origen, banco:banco, monto:g.total, lineas:g.lineas, partidas:usadas });
      return;
    }
    var mejor = null;
    cand.forEach(function(p){ var d = Math.abs(p.monto - g.total); if(!mejor || d < mejor.d) mejor = { p:p, d:d }; });
    cercanos.push({ fecha:g.fecha, origen:g.origen, banco:banco, monto:g.total, lineas:g.lineas, partida:mejor.p,
                    dif: Math.round((g.total - mejor.p.monto)*100)/100 });
  });
  return { hechos:hechos, cercanos:cercanos };
}
/* ---- Descargo que no coincide con el transito ----
   Una linea que cita una fecha del mes anterior ("deposito brinks St georges 28/2") nunca es un deposito de
   las ventas del dia en que se asienta. Antes, si no sumaba lo mismo que la partida del resumen, volvia al
   cotejo del dia y se comparaba contra lo que reportaron las cajeras ESE dia, que no la pueden traer: el
   1-mar-2026 los descargos de STG de 282.32 y 2,384.88 salieron como una diferencia de 2,667.20 contra un
   reporte en cero, cuando lo que no cuadraba era el resumen (282.29 y 1,116.10, bajado con una version vieja).
   Ahora se apartan del cotejo del dia y la diferencia se marca donde esta: entre el descargo y su partida. */
function avisoDescargoNoCoincide(c, fuente){
  var lineasTxt = c.lineas.map(function(l){ return String(l.descripcion||"").trim().slice(0,40) + " B/ " + fmt(l.monto); }).join("; ");
  var cab = c.banco + " " + c.fecha + ": " + c.lineas.length + " línea(s) de Caja General citan el " + c.origen +
            " y suman B/ " + fmt(c.monto) + " (" + lineasTxt + "). Son el descargo de un depósito del mes anterior, así que no se comparan con lo que reportaron las cajeras este día. ";
  var cuerpo = c.partida
    ? (c.otraFecha
        ? "El resumen en tránsito no trae ninguna partida de " + c.banco + " del " + c.origen + "; la más parecida es la de B/ " + fmt(c.partida.monto) + " del " + c.partida.fecha + ". "
        : "La partida en tránsito de esa fecha es de B/ " + fmt(c.partida.monto) + ". ") +
      "Diferencia: B/ " + fmt(c.dif) + (c.dif > 0 ? " más en Caja General que en el resumen" : " menos en Caja General que en el resumen") + ". " +
      "Revisá el importe de la partida en el resumen del Paso 0 (si se bajó con una versión anterior, volvé a correr el mes pasado y bajalo de nuevo) o el asiento."
    : "El resumen en tránsito no trae ninguna partida pendiente de " + c.banco + ". Confirmá que ese depósito quedó en tránsito el mes pasado; si no, el asiento está de más.";
  return { fecha:c.fecha, banco:c.banco, monto:c.dif, clase:"diff", concepto:"Descargo que no coincide con el tránsito",
    comprobante:"", motivo:"descargo con diferencia",
    partidas: c.partida ? [{ banco:c.partida.banco, fecha:c.partida.fecha, monto:c.partida.monto, concepto:c.partida.concepto }] : [],
    lineas: c.lineas.map(function(l){ return { fecha:l.fecha, monto:l.monto, descripcion:String(l.descripcion||"").trim() }; }),
    texto: cab + cuerpo + comprobanteDeLineas(c.lineas),
    fuente: fuente };
}
// Cuando el reporte de cajeras del dia SI respalda esas lineas, se quedan en el cotejo del dia y solo se avisa
// a que partida se parecen.
function avisoCercanoEnCotejo(c, fuente){
  return { fecha:c.fecha, banco:c.banco, monto:c.monto, clase:"aviso", concepto:"Descargo que no coincide con el tránsito",
    comprobante:"", motivo:"descargo con diferencia",
    texto: c.banco + " " + c.fecha + ": " + c.lineas.length + " línea(s) citan el " + c.origen + " y suman B/ " + fmt(c.monto) +
           ". Parecen el descargo de la partida en tránsito de B/ " + fmt(c.partida.monto) + " del " + c.origen +
           ", pero no coinciden (diferencia B/ " + fmt(c.dif) + ") y el reporte de cajeras de ese día las respalda, así que quedan en el cotejo del día." +
           comprobanteDeLineas(c.lineas),
    fuente: fuente };
}
function comprobanteDeLineas(lineas){
  var rs = [];
  (lineas||[]).forEach(function(l){ var r = refME(l.referencia); if(r && rs.indexOf(r) === -1) rs.push(r); });
  return rs.length ? " · Comprobante " + rs.join(" / ") : "";
}
// Todas las soluciones (hasta maxSol+1) de un subconjunto de montos que sume el objetivo. null si la busqueda
// se corta por tamaño. Sirve para aceptar una combinacion SOLO cuando es la unica posible.
function solucionesSuma(montos, objetivo, tolerancia, maxN, maxSol){
  var sols = [], nodos = 0, cortado = false;
  function rec(start, restante, acc){
    if(sols.length > maxSol || cortado) return;
    if(++nodos > 200000){ cortado = true; return; }
    if(Math.abs(restante) <= tolerancia && acc.length) sols.push(acc.slice());
    if(acc.length >= maxN) return;
    for(var j=start;j<montos.length;j++){
      if(montos[j] - restante > tolerancia) continue;
      acc.push(j); rec(j+1, restante - montos[j], acc); acc.pop();
      if(sols.length > maxSol || cortado) return;
    }
  }
  rec(0, objetivo, []);
  return cortado ? null : sols;
}
// Claves (fecha|centavos) de las lineas que son descargo, contadas. Cada paso reporta el mismo asiento, asi que
// se cuenta una sola vez por asiento; y se consume de a una para no excluir un deposito del dia de igual monto.
function clavesDescargo(r){
  var claves = {}, vistos = {};
  ["paso1","paso2","paso3"].forEach(function(k){
    (Array.isArray(r[k]) ? r[k] : []).forEach(function(x){
      // El descargo que no coincide con el transito (clase "diff") tambien saca esas lineas del dia: si no
      // se cuentan, sus creditos parecen pagar la venta del dia y el cierre se confunde.
      if((x.clase!=="informativo" && x.clase!=="diff") || String(x.concepto||"").indexOf("Descargo")===-1) return;
      var id = String(x.banco||"") + "|" + (x.fecha||"") + "|" + Math.round((x.monto||0)*100);
      if(vistos[id]) return;
      vistos[id] = true;
      var ls = (x.lineas && x.lineas.length) ? x.lineas : [{ fecha:x.fecha, monto:x.monto }];
      ls.forEach(function(l){ var c = (l.fecha||"") + "|" + Math.round((l.monto||0)*100); claves[c] = (claves[c]||0) + 1; });
    });
  });
  return claves;
}
function consumirClaveDescargo(claves, fecha, monto){
  var c = (fecha||"") + "|" + Math.round((monto||0)*100);
  if(claves[c] > 0){ claves[c]--; return true; }
  return false;
}
function poolParaDescargos(transitoPrevio, compensadas){
  var objs = (transitoPrevio||[]).filter(pasaPorCajaGeneral).map(function(t){
    return { banco:t.banco, fecha:t.fecha, monto:t.monto, concepto:t.concepto,
             compensada:false, usadoDescargo:false, usado:false };
  });
  (compensadas||[]).forEach(function(ch){
    if(ch.sentido==="debito") return;
    for(var i=0;i<objs.length;i++){
      var o = objs[i];
      if(!o.compensada && o.banco===ch.banco && Math.abs(o.monto-ch.monto)<0.005 &&
         o.fecha===(ch.fechaOrig||ch.fecha)){ o.compensada = true; break; }
    }
  });
  return objs;
}
// Devuelve {partidas:[...]} si el movimiento es un descargo, {partidas:null} si dice DESCARGO pero no
// corresponde a nada, y null si no es un descargo. Marca las partidas usadas: dos asientos no pueden
// descargar la misma partida.
function reconocerDescargo(monto, fecha, banco, desc, poolDescargo, tolerancia){
  if(!poolDescargo || !poolDescargo.length) return null;
  var etiquetado = esDescargoDesc(desc);
  var pases = etiquetado ? [true, false] : [true];   // [solo compensadas, cualquiera]
  for(var k=0;k<pases.length;k++){
    var soloComp = pases[k];
    var pool = poolDescargo.filter(function(p){ return p.banco===banco && !p.usadoDescargo && (!soloComp || p.compensada); });
    var idx = buscarSubsetSuma(pool, fecha, monto, 400, tolerancia, 12);
    if(idx){
      var us = idx.map(function(i){ return pool[i]; });
      us.forEach(function(p){ p.usadoDescargo = true; });
      return { partidas: us, etiquetado: etiquetado };
    }
  }

function hallazgoDescargo(banco, fecha, monto, desc, dsc, comprobante, fuente, lineas){
  if(dsc.partidas){
    return { fecha:fecha, banco:banco, monto:monto, clase:"informativo", concepto:"Descargo de transito",
      // Las partidas que descarga viajan en el hallazgo: el desglose del saldo las necesita para saber
      // cuales de las que compensaron siguen sin asiento de descargo.
      partidas: dsc.partidas.map(function(p){ return { banco:p.banco, fecha:p.fecha, monto:p.monto, concepto:p.concepto }; }),
      // Las lineas del diario que forman el descargo: un asiento puede venir repartido por medio de pago.
      lineas: (lineas||[]).map(function(l){ return { fecha:l.fecha, monto:l.monto, descripcion:String(l.descripcion||"").trim() }; }),
      comprobante:comprobante||"", motivo:"descargo del transito del mes anterior",
      texto: banco + " " + fecha + ": " + (lineas && lineas.length > 1
               ? "el asiento repartido en " + lineas.length + " líneas por B/ " + fmt(monto) + " (" +
                 lineas.map(function(l){ return String(l.descripcion||"").trim().slice(0,40) + " B/ " + fmt(l.monto); }).join("; ") + ") "
               : "el asiento de B/ " + fmt(monto) + " (" + String(desc||"").trim().slice(0,80) + ") ") +
             "descarga " + dsc.partidas.length + " partida(s) del transito del mes anterior — no es un deposito nuevo: " +
             dsc.partidas.map(function(p){ return p.fecha + " B/ " + fmt(p.monto); }).join(", ") + "." +
             (comprobante ? " · Comprobante " + comprobante : ""),
      fuente: fuente };
  }
  return { fecha:fecha, banco:banco, monto:monto, clase:"aviso", concepto:"Descargo sin correspondencia",
    comprobante:comprobante||"", motivo:"dice DESCARGO pero no coincide con el transito previo",
    texto: banco + " " + fecha + ": el asiento de B/ " + fmt(monto) + " dice DESCARGO pero no coincide con ninguna " +
           "partida del transito del mes anterior — revisa el importe del asiento o el resumen del Paso 0." +
           (comprobante ? " · Comprobante " + comprobante : ""),
    fuente: fuente };
}
function paso2(diarioCaja, estBanistmo, estStg, estBancoGeneral, retVisaPorDia, chequesDetalle, ventanaDias, tolerancia, reporte, transitoPrevio, diariosBanco){
  var hallazgos = [];
  var estados = { "Banistmo": estBanistmo, "STG": estStg };
  if(estBancoGeneral) estados["Banco General"] = estBancoGeneral;
  var usarDetalleCheques = !!(chequesDetalle && chequesDetalle.length);

  // Las líneas del estado que compensan partidas en tránsito del mes anterior (Paso 0) se apartan antes de
  // conciliar: su asiento es del mes pasado. Si no, un depósito de este mes podría engancharse con ellas
  // por coincidencia de importe y dejar huérfano el movimiento que sí le correspondía.
  var consumo = (transitoPrevio && transitoPrevio.length) ? transitoDelPaso0(transitoPrevio, estados, tolerancia) : null;
  var poolDescargo = poolParaDescargos(transitoPrevio, consumo && consumo.compensadas);

  var bancoCred = {};

    bancoCred[b] = (estados[b]||[]).filter(function(x){ return x.credito>0 && !x._transitoUsado && normTxt(x.descripcion).indexOf("ABORTED")===-1; })
      .map(function(x){ return {fecha:x.fecha, monto:x.credito, desc:x.descripcion, fila:x.fila, usado:false}; });

  var heredadosP2 = descargosHeredados(transitoPrevio, diarioCaja);

  Object.keys(estados).forEach(function(banco){
    var cajaDep = diarioCaja.filter(function(x){ return clasificarBancoPorTexto(x.descripcion)===banco && x.credito>0; });

       El banco junta en UNA sola remision las partidas del mismo metodo de dos dias seguidos: en marzo de
       2026 la CLAVE del 1-mar (752.77) y la del 2-mar (590.65) entraron como una remision de 1,343.42 el
       3-mar, y la del 15 (98.81) con la del 16 (143.17) como 241.98 el 17. Buscando cada parte sola no
       aparece ninguna y los cuatro asientos de VISA Banistmo —2,536.20— salian como diferencia teniendo su

      });

    }
    var cubiertasPorAgrupada = {};
    function clavePorParte(p){ return String(p.fecha) + "|" + normTxt(p.metodo) + "|" + Math.round((p.monto||0)*100); }
    // Descargo repartido en varias lineas que citan su fecha de origen: se aparta entero antes de conciliar,
    // igual que el descargo de una sola linea (ver el punto 0 de abajo).

      // El Paso 1 ya decidio que creditos son descargo: aca solo se ubican y se apartan.
      heredadosP2.filter(function(dg){ return dg.banco === banco; }).forEach(function(dg){
        if(!marcarLineasHeredadas(cajaDep, dg.lineas, "credito", "_descargo").length) return;
        dg.partidas.forEach(function(p){
          for(var i=0;i<poolDescargo.length;i++){
            var q = poolDescargo[i];
            if(!q.usadoDescargo && q.banco===p.banco && q.fecha===p.fecha && Math.abs(q.monto - p.monto) < 0.005){ q.usadoDescargo = true; break; }
          }
        });
        if(dg.dif != null) return;   // descargo con diferencia: el Paso 1 ya la marco contra su partida

          "Paso 1 (descargo decidido ahí) / Diario Caja General", dg.lineas));
      });
    } else {
      descargosPorFechaOrigen(cajaDep.map(function(x){ return { fecha:x.fecha, monto:x.credito, descripcion:x.descripcion, referencia:x.referencia, src:x }; }),
                              poolDescargo, banco, tolerancia, "usadoDescargo").hechos.forEach(function(g){

        hallazgos.push(hallazgoDescargo(banco, g.fecha, g.monto, g.lineas[0].descripcion, { partidas:g.partidas }, refG,
          "Resumen en transito del mes anterior / Diario Caja General", g.lineas));

    }
    cajaDep.forEach(function(dep){
      if(dep._descargo) return;
      // Si usamos el desglose individual, los cheques de Caja General se ignoran acá (se cuadran uno a uno abajo).

      var pool = bancoCred[banco];
      var objetivo = dep.credito;
      // 0) El asiento que DESCARGA el transito del mes anterior no es un deposito nuevo: no tiene
      // contrapartida propia en el estado, porque las lineas que le corresponden ya las consumio el Paso 0
      // al ver compensar esas partidas. Tiene que ir ANTES de buscar match. Dejado para el final, el
      // matching le adjudicaba lineas de OTROS depositos y se las comia: en febrero de 2026 el descargo de
      // 1,354.25 se llevo la remision V/Mc del 2-feb, y sin esa linea el acumulado de VISA del mes ya no
      // podia cuadrar — 4,148.70 salian "en transito" habiendo compensado completos.
      // Tambien va antes de la regla de fin de mes, que se tragaba los descargos fechados el ultimo dia.

      // certificado ni en un ACH. Sin esa restricción el motor arma combinaciones que cuadran de pura

      function comboEnPool(objetivo){

        if(!c) return null;
        if(poolBusq === pool) return c;
        return c.map(function(k){ return pool.indexOf(poolBusq[k]); }).filter(function(k){ return k>=0; });
      }
      var combo = comboEnPool(objetivo);
      // 2) STG con retenciones VISA: el banco muestra el neto → probar bruto − retención del día
      if(!combo && banco==="STG" && retVisaPorDia && retVisaPorDia[dep.fecha]!=null){
        combo = comboEnPool(Math.round((objetivo - retVisaPorDia[dep.fecha])*100)/100);
      }
      // 2b) DEPÓSITO ACUMULADO DEL PERÍODO: algunos meses el diario registra la VISA de todo el mes en un
      // solo asiento del último día ("DEPOSITOS POR TARJETA VISA STG DEL 1 AL 31 DE ENERO 2026") mientras el
      // banco la fue acreditando en remisiones diarias. El monto del diario es el BRUTO del período, así que
      // se le restan las retenciones de esos días y se busca el conjunto de créditos que sumen el neto.
      // Sin esto, el acumulado del mes queda como "en tránsito" aunque ya haya compensado completo.
      if(!combo && retVisaPorDia && normTxt(dep.descripcion).indexOf("VISA")!==-1){
        var rg = rangoDeposito(dep.descripcion, dep.fecha);
        if(rg){
          var retPeriodo = 0;
          Object.keys(retVisaPorDia).forEach(function(f){
            if(f.slice(0,7)!==rg.ym) return;
            var dd = parseInt(f.slice(8,10),10);
            if(dd>=rg.diaIni && dd<=rg.diaFin) retPeriodo += retVisaPorDia[f];
          });
          var netoPeriodo = Math.round((objetivo - retPeriodo)*100)/100;
          // Ventana sin límite práctico y varias partidas: el asiento es del último día pero cubre todo el mes.
          // El pool se restringe a las remisiones DEL MISMO MÉTODO (como en conciliarAcumuladoPeriodo):
          // es lo correcto —un acumulado de VISA compensa en remisiones V/Mc— y de paso baja el pool de
          // 87 créditos a ~15, que es lo que hacía de esta búsqueda la más cara de la app.
          var poolMet = poolDelMetodo(pool, dep.descripcion) || pool;
          combo = buscarSubsetSuma(poolMet, dep.fecha, netoPeriodo, 366, tolerancia, 60, "atras");
          if(combo) combo = combo.map(function(i){ return pool.indexOf(poolMet[i]); }).filter(function(i){ return i>=0; });
        }

      // asiento y el banco la acredita separada, un abono por cada quien transfirio: el ACH de B/
      // 1,313.10 del 27-jun-2026 entro como 100.00 + 579.10 + 25.00 el 22 y 609.00 el 23. Son CUATRO
      // lineas y buscarCombinacion solo prueba hasta tres, asi que hace falta el subset-sum. Sin
      // direccion, porque los ACH se ordenan antes de que el asiento se digite. Se limita a los ACH: en
      // los demas metodos, abrir la busqueda a seis lineas invita a las combinaciones de casualidad.

        var poolAch = poolParaAch(pool) || pool;
        combo = buscarSubsetSuma(poolAch, dep.fecha, objetivo, Math.max(ventanaDias, 10), tolerancia, 6);
        if(combo && poolAch !== pool){
          combo = combo.map(function(k){ return pool.indexOf(poolAch[k]); }).filter(function(k){ return k>=0; });
        }
      }
      /* 2d) EL ASIENTO ACUMULA VARIOS DIAS Y NO LO DICE EN SU TEXTO. El Yappy de marzo de 2026 se asienta
         el 31 en un solo credito ("DEPOSITOS POR YAPPY 404.49") y el banco lo fue acreditando dia por dia
         en siete depositos del 19 al 29: son mas lineas de las que prueba el match directo, y como el texto

         Mismos resguardos que el cotejo por bloques del Paso 3: la combinacion tiene que ser UNICA y
         abarcar 3 o mas DIAS distintos. Con uno o dos dias lo normal es al reves —el banco acredita el dia

        if(libresAc.length >= 3 && Object.keys(diasAc).length >= 3){
          // Hasta 20 lineas, por lo mismo que la pasada de bloques del Paso 3: el acumulado de un mes son
          // tantas lineas como dias acredito el banco.

            }
          }
        }
      }
      // 3) el navegador consolidó varios métodos en un solo asiento y el banco los acreditó por separado.
      // Se consulta el INFORME DE CAJA —la referencia del desglose— y se busca cada partida en el estado.

          // partidas se buscan con una ventana más amplia que la del match directo.

            // algunas es lo que distingue un depósito en tránsito de un problema real.
            // El pool se restringe a las líneas del MISMO MÉTODO (una partida VISA compensa en una
            // remisión V/Mc, no en un ACH de Brinks). Sin eso la búsqueda armaba combinaciones falsas:
            // el 22-jun-2026 la VISA de 243.61 "cuadraba" con 55.00 + 185.00 + 3.61 de tres ACH de otros
            // días, consumía esas tres líneas legítimas y tapaba el match real.
            var poolP = poolDelMetodo(pool, p.metodo) || pool;
            var c = buscarCombinacion(poolP, dep.fecha, p.monto, ventDesglose, tolerancia);
            // La VISA de STG compensa NETA: el banco acredita la remisión con la retención ya descontada
            // (esa misma venta de 243.61 entró al banco como 231.70). El match directo ya lo contemplaba;
            // el del desglose no, así que la partida VISA no se encontraba nunca.
