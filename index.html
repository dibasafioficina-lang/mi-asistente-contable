               normTxt(p.metodo).indexOf("VISA")!==-1){
              c = buscarCombinacion(poolP, dep.fecha, Math.round((p.monto - retVisaPorDia[p.fecha])*100)/100,
                                    ventDesglose, tolerancia);
            }
            // Ya la pago una remision agrupada que consumio el dia contiguo: cuenta como hallada y no
            // consume ninguna linea (el array vacio hace que el marcado de abajo no toque el pool).
            if(!c && cubiertasPorAgrupada[clavePorParte(p)]) c = [];
            // Si no, se prueba la suma con la partida del MISMO metodo de un dia contiguo. Se exige que la
            // remision exista por el total exacto: sin eso, sumar de a dos convertiria cualquier importe en
            // "compensado" a fuerza de probar combinaciones.
            if(!c){
              var vecinas = (reporte||[]).filter(function(q){
                return q.banco===banco && normTxt(q.metodo)===normTxt(p.metodo) && q.fecha!==p.fecha &&
                       q.monto>0 && daysBetween(q.fecha, p.fecha)<=3 && !cubiertasPorAgrupada[clavePorParte(q)];
              }).sort(function(a,b){ return daysBetween(a.fecha,p.fecha) - daysBetween(b.fecha,p.fecha); });
              for(var v=0; v<vecinas.length && !c; v++){
                var juntas = Math.round((p.monto + vecinas[v].monto)*100)/100;
                var cj = buscarCombinacion(poolP, dep.fecha, juntas, ventDesglose, tolerancia);
                if(!cj) continue;
                cubiertasPorAgrupada[clavePorParte(vecinas[v])] = true;
                c = cj;
              }
            }
            if(c){
              c.forEach(function(k){
                var idx = pool.indexOf(poolP[k]);   // poolP puede ser un subconjunto: se marca en el pool real
                if(idx>=0){ pool[idx].usado = true; pool[idx].asignadoA = dep.fecha; idxs.push(idx); }
              });
              halladasN++;
            }
            else todas = false;
          });
          if(todas){ partesHalladas = desglose; }
          else { idxs.forEach(function(i){ pool[i].usado = false; delete pool[i].asignadoA; }); } // revertir: o cotejan todas, o ninguna
        }
      }
      /* 3b) EL ASIENTO CONSOLIDA VARIOS METODOS Y EL INFORME NO TIENE ESE DIA.
         Cuando el informe esta, el punto 3 desglosa el asiento y busca cada parte donde le toca. Sin el
         informe no hay desglose: el asiento del 11-abr-2026 por 1,550.76 lleva la etiqueta "TARJETA VISA"
         pero son VISA 982.09 + CLAVE 568.67, las dos acreditadas el 13-abr, y como poolDelMetodo reserva las
         remisiones V/MC para los depositos que dicen VISA, la de CLAVE nunca podia entrar. Al informe de
         cajeras de abril le falta la fila del 11, asi que salia como diferencia teniendo su plata en el banco.
         Se prueba una combinacion de remisiones de tarjeta de CUALQUIER metodo, con cuatro candados: suma
         exacta, combinacion UNICA, dentro de la ventana y hacia adelante, y tiene que MEZCLAR metodos —si
         fueran todas del mismo, el punto 1 ya lo habria encontrado y esto no aporta nada. */
      if(!combo && !partesHalladas && esDepositoTarjeta(dep.descripcion)){
        var remis = pool.filter(function(e){
          return !e.usado && (esRemisionVisa(e.desc) || esRemisionClave(e.desc)) && e.fecha >= dep.fecha &&
                 distanciaBancaria(dep.fecha, e.fecha) <= Math.max(ventanaDias, 10);
        });
        if(remis.length >= 2){
          var solsR = solucionesSuma(remis.map(function(e){ return e.monto; }), objetivo, tolerancia, 4, 1);
          if(solsR && solsR.length === 1 && solsR[0].length >= 2){
            var tiposR = {};
            solsR[0].forEach(function(i){ tiposR[esRemisionVisa(remis[i].desc) ? "VMC" : "CLAVE"] = true; });
            if(Object.keys(tiposR).length >= 2){
              combo = solsR[0].map(function(i){ return pool.indexOf(remis[i]); }).filter(function(i){ return i >= 0; });
            }
          }
        }
      }
      if(combo){
        // A que venta pago cada linea: el Paso 4 no puede volver a usar una remision que ya pago otra venta.
        combo.forEach(function(i){ pool[i].usado = true; pool[i].asignadoA = rangoDeposito(dep.descripcion, dep.fecha) ? "rango" : dep.fecha; });
        return;
      } // cuadrado
      if(partesHalladas) return; // coteja: el banco lo reflejó separado, tal como lo desglosa el informe

      var ref = refComprobante(dep.referencia);
      // Si el informe desglosa el monto pero el banco no tiene todas las partidas, se informa el desglose
      // para que el cotejo sea directo (el navegador solo muestra el consolidado).
      var textoDesglose = desglose ? " Según el informe de caja, ese día " + banco + " se compone de: " +
        desglose.map(function(p){ return p.metodo + " B/ " + fmt(p.monto); }).join(" + ") + "." : "";
      var refRaw = /^ME-/i.test(String(dep.referencia==null?"":dep.referencia).trim()) ? String(dep.referencia).trim() : "";
      var concepto = String(dep.descripcion||"").trim();
      // 3a) borde de mes: lo del último día del mes queda en tránsito para el mes siguiente (no compensa aún).
      if(ultimoDia && dep.fecha===ultimoDia){
        hallazgos.push({
          fecha:dep.fecha, banco:banco, monto:objetivo, clase:"en_transito",
          // Si el asiento consolida varios metodos, se anota su desglose: el Paso 3 ve esos metodos por
          // separado en el diario del banco, y sin esto la parte se sumaba ademas del total.
          partes: desglose ? desglose.map(function(p){ return { metodo:p.metodo, monto:p.monto }; }) : null,
          concepto:concepto, comprobante:refRaw, motivo:"último día del mes",
          texto: banco + " " + dep.fecha + ": B/ " + fmt(objetivo) + " (\"" + concepto +
                 "\") es del último día del mes — queda en tránsito para el mes siguiente (aún no compensa en el banco)." + ref,
          fuente: "Diario Caja General / Estado de cuenta " + banco
        });
        return;
      }
      // 3b) cheque no encontrado en su banco → buscar en los otros bancos
      if(esChequeDesc(dep.descripcion) || chequeSegunInforme(dep.fecha, dep.credito)){
        var otro = null, comboOtro = null;
        Object.keys(bancoCred).forEach(function(b2){
          if(b2===banco || otro) return;
          var c = buscarCombinacion(bancoCred[b2], dep.fecha, objetivo, ventanaDias, tolerancia);
          if(c){ comboOtro = {banco:b2, idxs:c}; otro = b2; }
        });
        if(otro){
          comboOtro.idxs.forEach(function(i){ bancoCred[otro][i].usado = true; });
          hallazgos.push({
            fecha:dep.fecha, banco:banco, monto:objetivo, clase:"diff",
            texto: "Cheque de B/ " + fmt(objetivo) + " (" + dep.fecha + ") que Caja General asignó a " + banco +
                   " aparece depositado en " + otro + ". Verifica el banco de destino." + ref,
            fuente: "Diario Caja General / Estado de cuenta " + otro
          });
        } else {
          hallazgos.push({
            fecha:dep.fecha, banco:banco, monto:objetivo, clase:"en_transito",
            concepto:concepto, comprobante:refRaw, motivo:"cheque pendiente por cambiar",
            texto: "Cheque de B/ " + fmt(objetivo) + " (" + dep.fecha + ") registrado como depósito a " + banco +
                   " no aparece en ningún estado de cuenta — probablemente en tránsito (pendiente por cambiar)." + ref,
            fuente: "Diario Caja General / Estados de cuenta"
          });
        }
        return;
      }

      // 3c) DEPÓSITO CONSOLIDADO QUE TODAVÍA NO COMPENSA. El asiento registra la suma del día —varios
      // métodos en una sola línea, con la etiqueta de uno solo— y el informe de caja confirma que el
      // importe es exactamente esa suma. Si el banco no acreditó NINGUNA de esas partidas, no hay nada
      // mal registrado: es dinero en tránsito que compensa el mes siguiente. Pasó en febrero de 2026 con
      // los 2,108.52 del 27-feb (VISA 1,124.69 + CLAVE 983.83), que el banco acreditó recién en marzo.
      // Si compensaron ALGUNAS pero no todas, no se toca: media compensación no es un corte de mes
      // limpio y hay que mirarla.
      if(desglose && halladasN === 0){
        hallazgos.push({
          fecha:dep.fecha, banco:banco, monto:objetivo, clase:"en_transito",
          // Igual que el de fin de mes: el Paso 3 ve cada metodo por separado en el diario del banco. Sin el
          // desglose el resumen de enero de 2026 llevo los 590.02 del 30-ene Y ADEMAS sus partes (VISA 230.31 +
          // CLAVE 359.71), y el reingreso que se registro siguiendo ese resumen salio por el doble: 1,180.04.
          partes: desglose.map(function(p){ return { metodo:p.metodo, monto:p.monto }; }),
          concepto:concepto, comprobante:refRaw, motivo:"depósito consolidado — aún no compensa",
          texto: banco + " " + dep.fecha + ": B/ " + fmt(objetivo) + " (\"" + concepto + "\") es el total del día " +
                 "registrado en un solo asiento." + textoDesglose +
                 " Ninguna de esas partidas aparece todavía en el estado de cuenta, así que queda en tránsito " +
                 "para el mes siguiente." + ref,
          fuente: "Diario Caja General / Estado de cuenta " + banco
        });
        return;
      }

      // 4) resto: diferencia real
      hallazgos.push({
        fecha:dep.fecha, banco:banco, monto:objetivo, clase:"diff",
        texto: banco + " " + dep.fecha + ": B/ " + fmt(objetivo) + " que el reporte/Caja General registró como depósito a " +
               banco + " (\"" + String(dep.descripcion||"").trim() + "\") no aparece en el estado de cuenta de " + banco + "." + textoDesglose + ref,
        fuente: "Diario Caja General / Estado de cuenta " + banco
      });
    });
  });

  // Cheques individuales (2ª pestaña del reporte): no compensan en bloque ni cada uno por separado —
  // el banco a veces junta varios cheques en un solo depósito o los reparte, y clarean días después.
  // Por eso se reconcilia el CONJUNTO de cheques del reporte contra los DEPÓSITOS del estado de cuenta,
  // permitiendo combinaciones en ambos sentidos y sin límite de fecha (solo dentro del mes).
  if(usarDetalleCheques){
    var VENTANA_CHEQUE = 366; // sin límite práctico dentro del mes
    var decCheques = {};   // por banco: lo que este paso decidio, para que el Paso 3 no los vuelva a clarear
    Object.keys(bancoCred).forEach(function(banco){
      // Cheques del reporte de este banco. Los del último día quedan en tránsito (clarean el mes siguiente).
      var chs = [];
      chequesDetalle.filter(function(x){return x.banco===banco;}).forEach(function(x){
        if(ultimoDia && x.fecha===ultimoDia){
          hallazgos.push({ fecha:x.fecha, banco:banco, monto:x.monto, clase:"en_transito",
            concepto:"Cheque (detalle individual)", comprobante:"", motivo:"último día del mes",
            texto:"Cheque de B/ "+fmt(x.monto)+" ("+x.fecha+", "+banco+") es del último día del mes — queda en tránsito para el mes siguiente.",
            fuente:"Desglose de cheques / Estado de cuenta "+banco });
        } else {
          chs.push({ fecha:x.fecha, monto:x.monto, usado:false });
        }
      });
      // Depósitos del estado de cuenta (no remisiones/comisiones), referencias con .usado compartido.
      var depos = bancoCred[banco].filter(function(x){ return esDepositoEstado(x.desc); });
      var usadoAntesCk = depos.map(function(d){ return d.usado; });   // foto antes de la pasada de cheques
      // Paso A: cada cheque contra una combinación de depósitos (un cheque puede clarear en varios depósitos).
      chs.forEach(function(ch){
        if(ch.usado) return;
        var combo = buscarSubsetSuma(depos, ch.fecha, ch.monto, VENTANA_CHEQUE, tolerancia, 8, "adelante");
        if(combo){ combo.forEach(function(i){ depos[i].usado=true; }); ch.usado=true; }
      });
      // Paso B: cada depósito no usado contra una combinación de cheques (el banco junta varios cheques en un depósito).
      depos.forEach(function(d){
        if(d.usado) return;
        var combo = buscarSubsetSuma(chs, d.fecha, d.monto, VENTANA_CHEQUE, tolerancia, 12, "atras");
        if(combo){ combo.forEach(function(i){ chs[i].usado=true; }); d.usado=true; }
      });
      // Cheques que no clarearon → en tránsito (pendiente por cambiar).
      chs.forEach(function(ch){
        if(ch.usado) return;
        hallazgos.push({ fecha:ch.fecha, banco:banco, monto:ch.monto, clase:"en_transito",
          concepto:"Cheque (detalle individual)", comprobante:"", motivo:"cheque pendiente por cambiar",
          texto:"Cheque de B/ "+fmt(ch.monto)+" ("+ch.fecha+", "+banco+") aún no aparece en el estado de cuenta — en tránsito (pendiente por cambiar).",
          fuente:"Desglose de cheques / Estado de cuenta "+banco });
      });
      var filasCheque = {};
      // Solo las lineas que consumieron los CHEQUES: el pool ya venia con lineas usadas por los depositos
      // normales del mes (los Yappy de Banco General, por ejemplo) y esas no son asunto de esta decision.
      depos.forEach(function(d, i){ if(d.usado && !usadoAntesCk[i] && d.fila != null) filasCheque[d.fila] = true; });
      decCheques[banco] = {
        filasUsadas: filasCheque,
        clareados: chs.filter(function(c){ return c.usado; }).map(function(c){ return { fecha:c.fecha, monto:c.monto }; }),
        pendientes: chs.filter(function(c){ return !c.usado; }).map(function(c){ return { fecha:c.fecha, monto:c.monto }; }),
        total: Math.round(chequesDetalle.filter(function(x){ return x.banco===banco; }).reduce(function(a,x){ return a + x.monto; }, 0)*100)/100
      };
    });
    var firmasCheque = {};
    Object.keys(estados).forEach(function(b){ firmasCheque[b] = firmaEstado(estados[b]||[]); });
    decisiones().cheques = { firmas:firmasCheque, porBanco:decCheques };
  }

  /* ---- Efectivo: Caja General contra el banco ----
     Hereda del Paso 1 que lineas de Caja General son el efectivo (no nombran banco) y las busca en el estado
     con las mismas reglas que el Paso 3: primero cada partida por su importe, despues la suma del dia
     (Brinks + ventanilla que el banco acredita consolidados), con rezago de hasta 10 dias habiles. Solo corre
     con la decision del Paso 1: sin ella no hay forma de saber que lineas son el efectivo del dia. */
  var efH = STATE.decisiones && STATE.decisiones.efectivo;
  if(efH && efH.firmaCaja === firmaDiario(diarioCaja)){
    var lineasEfP2 = diarioCaja.filter(function(x){ return x.credito>0 && efH.filas[x.fila]; });
    if(lineasEfP2.length){
      var bancoEf = (efH.banco && bancoCred[efH.banco]) ? efH.banco : null;
      if(!bancoEf){
        var conBrinks = Object.keys(bancoCred).filter(function(b){ return bancoCred[b].some(function(e){ return esBrinks(e.desc); }); });
        bancoEf = conBrinks.length === 1 ? conBrinks[0] : null;
      }
      if(!bancoEf){
        hallazgos.push({ fecha:"", banco:"", monto:0, clase:"aviso", concepto:"Efectivo sin banco", comprobante:"", motivo:"banco del efectivo desconocido",
          texto:"No se pudo determinar a qué banco va el efectivo de Caja General (ningún asiento ni estado de cuenta lo indica sin ambigüedad), así que no se buscó en el banco.",
          fuente:"Diario Caja General / Estados de cuenta" });
      } else {
        var poolEstEf = bancoCred[bancoEf].map(function(e){ return { fecha:e.fecha, monto:e.monto, descripcion:e.desc, usado:e.usado, ref:e }; });
        var poolDiaEf = lineasEfP2.map(function(x){ return { fecha:x.fecha, monto:x.credito, descripcion:x.descripcion, usado:false, src:x }; });
        consolidarEfectivoDelDia(poolDiaEf, poolEstEf, ventanaDias, tolerancia);
        var candEf = poolEstEf.filter(function(e){ return !esRemisionVisa(e.descripcion) && !esRemisionClave(e.descripcion); });
        poolDiaEf.forEach(function(d){
          if(d.usado) return;
          // Los ACH cuyo retiro es muy posterior al asiento no son de este efectivo (ver fechaRetiroBrinks).
          // Comparte los objetos del pool, asi que marcar `usado` en el subconjunto marca el pool real.
          var poolD = candEf.filter(function(e){ return retiroCompatible(e.descripcion, d.fecha); });
          var c = esBrinks(d.descripcion) ? buscarBrinks(poolD, d.fecha, d.monto, Math.max(ventanaDias, 10), tolerancia) : null;
          if(!c) c = combinacionMasCercana(poolD, d.fecha, d.monto, Math.max(ventanaDias, 10), tolerancia);
          if(c){ c.forEach(function(i){ poolD[i].usado = true; }); d.usado = true; }
        });
        /* Deposito MIXTO: Brinks retira el efectivo de Caja General junto con otra plata que no pasa por
           Caja General (la caja menuda que los duenos prestan, registrada solo en el diario del banco) y el
           banco lo acredita en una sola linea. Caso real: el 04-feb-2026 STG acredito 4,465.00 = 265.00 del
           Brinks del 02-feb + 4,200.00 del PDN-000000044. Buscando solo lineas iguales al efectivo, los 265.00
           salian como "no aparece en el estado de cuenta". Solo se acepta si el resto esta EXPLICADO por
           debitos del diario del banco que no vienen de Caja General (sin comprobante ME- del navegador): un
           resto sin explicar no alcanza, o cualquier deposito grande se tragaria cualquier efectivo chico. */
        var diarioBk = (diariosBanco && diariosBanco[bancoEf]) || [];
        var refsCaja = {};
        diarioCaja.forEach(function(x){ var r = refME(x.referencia); if(r) refsCaja[r] = true; });
        var ajenos = diarioBk.filter(function(x){ return x.debito>0 && !refsCaja[refME(x.referencia)]; })
          .map(function(x){ return { fecha:x.fecha, monto:x.debito, descripcion:x.descripcion, referencia:x.referencia, usado:false }; });
        var mixtos = [];
        if(ajenos.length) poolDiaEf.forEach(function(d){
          if(d.usado) return;
          for(var i=0;i<candEf.length;i++){
            var e = candEf[i];
            if(e.usado || e.fecha < d.fecha || e.monto - d.monto <= tolerancia) continue;
            if(distanciaBancaria(d.fecha, e.fecha) > Math.max(ventanaDias, 10)) continue;
            var otros = buscarSubsetSuma(ajenos, e.fecha, Math.round((e.monto - d.monto)*100)/100, Math.max(ventanaDias, 10), tolerancia, 3, "atras");
            if(!otros) continue;
            otros.forEach(function(k){ ajenos[k].usado = true; });
            e.usado = true; d.usado = true;
            mixtos.push({ d:d, e:e, otros: otros.map(function(k){ return ajenos[k]; }) });
            return;
          }
        });
        /* ---- Efectivo asentado en UNA linea que el banco parte en dos ----
           Desde marzo de 2026 el asiento junta el camion y la ventanilla del dia en un solo credito
           ("DEPOSITO BRINKS DEL 12/03/2026" por 25.28 = 25.00 de Brinks + 0.28 de ventanilla); antes venian
           en dos lineas y consolidarEfectivoDelDia las sumaba, asi que ese mecanismo quedo sin efecto.
           El banco los sigue acreditando separados: la ventanilla como linea suelta y el Brinks dentro de
           su ACH —solo, junto con el de otros dias, o dentro de un deposito mixto—. Buscando el total tal
           cual no aparece ninguna de las dos partes: los 25.28 del 12-mar salian como diferencia teniendo
           sus 0.28 en el estado del 16 y sus 25.00 dentro del ACH de 5,025.00 de ese mismo dia (el resto,
           5,000.00, es el prestamo de los duenos que solo esta en el diario del banco).
           Se parte el credito en dos, con dos resguardos para no partir por conveniencia: la parte de
           ventanilla tiene que estar en el estado por su importe EXACTO y ser chica (el maximo visto en un
           dia es 12.87, de ahi el tope de 20), y la parte del camion tiene que encontrarse despues por sus
           propios medios. Si cualquiera de las dos falla, el efectivo sigue saliendo como diferencia. */
        var TOPE_VENTANILLA = 20;
        // Lineas chicas del estado que pueden ser la ventanilla de ese dia.
        function sueltasEf(d){
          return candEf.filter(function(cv){
            return !cv.usado && cv.fecha >= d.fecha && cv.monto <= TOPE_VENTANILLA && cv.monto < d.monto &&
                   distanciaBancaria(d.fecha, cv.fecha) <= Math.max(ventanaDias, 10);
          });
        }
        function marcarPartido(d, cv, resto, e, otros){
          cv.usado = true; d.usado = true;
          partidosOk.push({ d:d, centavos:cv, resto:resto, e:e, otros:otros||[] });
        }
        var partidosOk = [];
        /* 1) Uno o dos dias en un solo ACH del camion. La suma de los creditos menos el ACH es lo que se
           fue por ventanilla, y tiene que estar en el estado como una linea suelta por cada dia: el ACH de
           80.00 del 19-mar-2026 trae los 40.00 del 16 y los 40.00 del 17, y sus ventanillas entraron el 18
           como 1.56 y 4.29 (41.56 + 44.29 - 80.00 = 5.85 = 1.56 + 4.29). */
        candEf.forEach(function(e){
          if(e.usado || !esBrinks(e.descripcion)) return;
          var cand = poolDiaEf.filter(function(d){
            return !d.usado && d.fecha <= e.fecha && distanciaBancaria(d.fecha, e.fecha) <= Math.max(ventanaDias, 10);
          });
          function probar(S){
            if(e.usado) return false;
            var suma = Math.round(S.reduce(function(a,x){ return a + x.monto; }, 0)*100)/100;
            var falta = Math.round((suma - e.monto)*100)/100;
            if(falta <= tolerancia) return false;            // sin ventanilla que explicar no es un partido
            var vistas = [];
            S.forEach(function(d){ sueltasEf(d).forEach(function(cv){ if(vistas.indexOf(cv) === -1) vistas.push(cv); }); });
            var ps = vistas.map(function(cv){ return { fecha:cv.fecha, monto:cv.monto, usado:false, ref:cv }; });
            var combo = buscarSubsetSuma(ps, e.fecha, falta, 400, tolerancia, S.length);
            if(!combo || combo.length !== S.length) return false;   // una linea de ventanilla por dia, ni mas ni menos
            /* A que dia va cada linea de ventanilla. El total cuadra con cualquier asignacion, pero el
               hallazgo nombra importes: con 41.56 y 44.29 contra el ACH de 80.00, asignar 1.56 al primero y
               4.29 al segundo deja 40.00 y 40.00 —lo que el camion entrego—, y al reves daria 37.27 y 42.73,
               que no existieron. Gana la asignacion cuyos restos quedan mas cerca de un multiplo de 5. */
            var lineas = combo.map(function(k){ return ps[k].ref; });
            var mejor = null;
            function evaluar(asig){
              var suciedad = 0;
              for(var i=0;i<S.length;i++){
                if(asig[i].monto >= S[i].monto) return;
                var r = Math.round((S[i].monto - asig[i].monto)*100)/100;
                if(r <= tolerancia) return;
                var mod = Math.round(r*100) % 500;
                suciedad += Math.min(mod, 500 - mod);
              }
              if(!mejor || suciedad < mejor.suciedad) mejor = { asig:asig.slice(), suciedad:suciedad };
            }
            evaluar(lineas);
            if(S.length === 2) evaluar([lineas[1], lineas[0]]);
            if(!mejor) return false;
            S.forEach(function(d, i){
              var cv = mejor.asig[i];
              marcarPartido(d, cv, Math.round((d.monto - cv.monto)*100)/100, e, []);
            });
            e.usado = true;
            return true;
          }
          for(var a=0; a<cand.length; a++){
            if(probar([cand[a]])) return;
            for(var b=a+1; b<cand.length; b++){ if(probar([cand[a], cand[b]])) return; }
          }
        });
        /* 2) La parte del camion dentro de un deposito MIXTO: el sobrante lo explican debitos del diario
           del banco que no pasan por Caja General. Igual que la pasada de mixtos de arriba, pero restando
           solo la parte del camion: los 25.28 del 12-mar-2026 son 0.28 de ventanilla (acreditada el 16) y
           25.00 dentro del ACH de 5,025.00 de ese dia, cuyo resto son los 5,000.00 del prestamo interno.
           Se prueban TODAS las particiones posibles: quedarse con la primera linea suelta que encaje
           dejaba el resto en un importe que el camion nunca entrego y el efectivo seguia sin aparecer. */
        if(ajenos.length) poolDiaEf.forEach(function(d){
          if(d.usado) return;
          var opciones = sueltasEf(d);
          for(var o=0; o<opciones.length && !d.usado; o++){
            var cv = opciones[o];
            var resto = Math.round((d.monto - cv.monto)*100)/100;
            if(resto <= tolerancia) continue;
            for(var i=0;i<candEf.length;i++){
              var e = candEf[i];
              if(e.usado || e === cv || e.fecha < d.fecha || e.monto - resto <= tolerancia) continue;
              if(distanciaBancaria(d.fecha, e.fecha) > Math.max(ventanaDias, 10)) continue;
              var otros2 = buscarSubsetSuma(ajenos, e.fecha, Math.round((e.monto - resto)*100)/100, Math.max(ventanaDias, 10), tolerancia, 3, "atras");
              if(!otros2) continue;
              otros2.forEach(function(k){ ajenos[k].usado = true; });
              e.usado = true;
              marcarPartido(d, cv, resto, e, otros2.map(function(k){ return ajenos[k]; }));
              break;
            }
          }
        });
        partidosOk.forEach(function(m){
          var desc = String(m.d.descripcion||"").trim();
          hallazgos.push({ fecha:m.d.fecha, banco:bancoEf, monto:m.d.monto, clase:"informativo", concepto:desc,
            comprobante: refME(m.d.src.referencia), motivo:"el banco lo acredit\u00f3 partido en dos",
            texto: bancoEf + " " + m.d.fecha + ": el efectivo de B/ " + fmt(m.d.monto) + " (\"" + desc + "\") lo acredit\u00f3 el banco " +
                   "en dos partes: B/ " + fmt(m.centavos.monto) + " de ventanilla el " + m.centavos.fecha + " y B/ " + fmt(m.resto) +
                   " del cami\u00f3n" + (m.otros.length
                     ? " dentro del dep\u00f3sito de B/ " + fmt(m.e.monto) + " del " + m.e.fecha + ", junto con " +
                       m.otros.map(function(o){ return "B/ " + fmt(o.monto) + " de " + (String(o.referencia||"").trim() || "otro asiento"); }).join(" y ") +
                       ", que est\u00e1 en el diario de " + bancoEf + " y no pasa por Caja General"
                     : " en el ACH de B/ " + fmt(m.e.monto) + " del " + m.e.fecha + (Math.abs(m.e.monto - m.resto) > tolerancia ? ", que trae tambi\u00e9n el de otros d\u00edas" : "")) +
                   ". El asiento junta las dos partes en una sola l\u00ednea, as\u00ed que no hay nada que registrar." + refComprobante(m.d.src.referencia),
            fuente: "Diario Caja General / Diario " + bancoEf + " / Estado de cuenta " + bancoEf });
        });
        mixtos.forEach(function(m){
          var desc = String(m.d.descripcion||"").trim();
          hallazgos.push({ fecha:m.d.fecha, banco:bancoEf, monto:m.d.monto, clase:"informativo", concepto:desc,
            comprobante: refME(m.d.src.referencia), motivo:"compensó en un depósito mixto",
            texto: bancoEf + " " + m.d.fecha + ": el efectivo de B/ " + fmt(m.d.monto) + " (\"" + desc + "\") compensó el " + m.e.fecha +
                   " dentro de un depósito de B/ " + fmt(m.e.monto) + " (\"" + String(m.e.descripcion||"").trim() + "\"), junto con " +
                   m.otros.map(function(o){ return "B/ " + fmt(o.monto) + " de " + (String(o.referencia||"").trim() || "otro asiento") +
                     " (\"" + String(o.descripcion||"").trim().slice(0,50) + "\")"; }).join(" y ") +
                   ", que está en el diario de " + bancoEf + " y no pasa por Caja General. No hay nada que registrar." + refComprobante(m.d.src.referencia),
            fuente: "Diario Caja General / Diario " + bancoEf + " / Estado de cuenta " + bancoEf });
        });
        poolEstEf.forEach(function(e){ if(e.usado) e.ref.usado = true; });
        poolDiaEf.forEach(function(d){
          if(d.usado) return;
          var desc = String(d.descripcion||"").trim(), refE = refME(d.src.referencia);
          var finMes = ultimoDia && d.fecha <= ultimoDia && daysBetween(d.fecha, ultimoDia) <= 5;
          if(finMes){
            // Como parte "EFECTIVO": el navegador del banco suele traer ese mismo asiento partido (320.00 + 1.12
            // del 321.12 del 29-jun-2026) y sin esto el resumen lo sumaba dos veces.
            hallazgos.push({ fecha:d.fecha, banco:bancoEf, monto:d.monto, clase:"en_transito", concepto:desc, comprobante:refE,
              partes:[{ metodo:"EFECTIVO", monto:d.monto }],
              motivo:"efectivo de fin de mes",
              texto: bancoEf + " " + d.fecha + ": el efectivo de B/ " + fmt(d.monto) + " (\"" + desc + "\") es de los últimos días del mes y todavía no aparece en el estado de cuenta — queda en tránsito." + refComprobante(d.src.referencia),
              fuente: "Diario Caja General / Estado de cuenta " + bancoEf });
            return;
          }
          hallazgos.push({ fecha:d.fecha, banco:bancoEf, monto:d.monto, clase:"diff", concepto:desc, comprobante:refE,
            texto: bancoEf + " " + d.fecha + ": el efectivo de B/ " + fmt(d.monto) + " (\"" + desc + "\") que Caja General acreditó no aparece en el estado de cuenta de " + bancoEf +
                   " dentro de 10 días hábiles." + refComprobante(d.src.referencia),
            fuente: "Diario Caja General / Estado de cuenta " + bancoEf });
        });
      }
    }
  }

  // Remisiones VISA de STG y la venta a la que quedaron asignadas: el Paso 4 controla contra esto.
  if(estStg){
    var asignadas = {};
    (bancoCred["STG"]||[]).forEach(function(e){ if(e.usado && e.asignadoA && e.fila != null && esRemisionVisa(e.desc)) asignadas[e.fila] = e.asignadoA; });
    decisiones().remisiones = { firma: firmaEstado(estStg), asignadas: asignadas };
  }
  return hallazgos;
}

// Conciliación de CHEQUES para el Paso 3: los cheques del diario (depósitos "CK") y los cheques en
// tránsito de meses anteriores (Paso 0) se emparejan contra los DEPÓSITOS del estado de cuenta con
// subset-sum hacia adelante (un cheque clarea en su fecha o después; el banco a veces junta varios).
// Marca `_chqUsado` en las filas emparejadas para que conciliarBancoEstado no las vea, y empuja los
// cheques del diario que no clarearon como "en tránsito". Los cheques del Paso 0 que no clarean NO se
// reportan acá (los reporta el Paso 0). Deja los depósitos sin emparejar para el flujo normal.
function conciliarChequesPaso3(diario, estado, prevCheques, ultimoDia, tolerancia, banco, hallazgos, poolDescargo, soloSinBanco){
  var VENTANA = 366;
  var ckDiario = (diario||[]).filter(function(x){ return x.debito>0 && !x._chqUsado && esChequeDesc(x.descripcion) && normTxt((x.descripcion||"")+" "+(x.referencia||"")).indexOf("ABORTED")===-1; });
  var depos = (estado||[]).filter(function(x){ return x.credito>0 && !x._transitoUsado && esDepositoEstado(x.descripcion) && normTxt(x.descripcion).indexOf("ABORTED")===-1; });
  if(!ckDiario.length && !(prevCheques && prevCheques.length)) return;
  var chq = [];
  ckDiario.forEach(function(x){
    if(ultimoDia && x.fecha===ultimoDia){ // último día → en tránsito para el mes siguiente
      // Salvo que sea el asiento de DESCARGO del transito previo (suele fecharse el ultimo dia).
      var dscU = (poolDescargo && (!soloSinBanco || !clasificarBancoPorTexto(x.descripcion))) ? reconocerDescargo(x.debito, x.fecha, banco, x.descripcion, poolDescargo, tolerancia) : null;
      if(dscU){
        x._chqUsado = true;
        hallazgos.push(hallazgoDescargo(banco, x.fecha, x.debito, x.descripcion, dscU, "",
          "Resumen en transito del mes anterior / Diario " + banco));
        return;
      }
      x._chqUsado = true;
      hallazgos.push({ fecha:x.fecha, banco:banco, monto:x.debito, clase:"en_transito",
        concepto:(x.descripcion||"").trim(), comprobante:"", motivo:"último día del mes",
        texto: banco + " " + x.fecha + ": B/ " + fmt(x.debito) + " (\"" + (x.descripcion||"").trim() +
               "\") es del último día del mes — queda en tránsito para el mes siguiente (aún no compensa en el estado de cuenta).",
        fuente: "Diario " + banco + " / Estado de cuenta " + banco });
      return;
    }
    chq.push({ src:x, fecha:x.fecha, monto:x.debito, usado:false, origen:"diario" });
  });
  (prevCheques||[]).forEach(function(t){ chq.push({ src:null, fecha:t.fecha, monto:t.monto, usado:false, origen:"prev" }); });
  var dep = depos.map(function(x){ return { src:x, fecha:x.fecha, monto:x.credito, usado:false }; });
  // Paso A: cada cheque contra una combinación de depósitos hacia adelante.
  chq.forEach(function(c){ if(c.usado) return; var combo = buscarSubsetSuma(dep, c.fecha, c.monto, VENTANA, tolerancia, 8, "adelante"); if(combo){ combo.forEach(function(i){ dep[i].usado=true; }); c.usado=true; } });
  // Paso B: cada depósito no usado contra una combinación de cheques hacia atrás (el banco los junta).
  dep.forEach(function(d){ if(d.usado) return; var combo = buscarSubsetSuma(chq, d.fecha, d.monto, VENTANA, tolerancia, 12, "atras"); if(combo){ combo.forEach(function(i){ chq[i].usado=true; }); d.usado=true; } });
  // Marcar usados en las filas fuente (para que conciliarBancoEstado los ignore).
  chq.forEach(function(c){ if(c.usado && c.src) c.src._chqUsado = true; });
  dep.forEach(function(d){ if(d.usado) d.src._chqUsado = true; });
  // Cheques del diario que no clarearon → en tránsito (pendiente por cambiar).
  chq.forEach(function(c){
    if(c.usado || c.origen!=="diario") return;
    // Un descargo con concepto de cheque nunca clarea: su linea del estado la consumio el Paso 0.
    // Paso con el ME-1855 (los 6 cheques de enero, 1,324.90).
    var dscC = (poolDescargo && (!soloSinBanco || !clasificarBancoPorTexto(c.src.descripcion))) ? reconocerDescargo(c.monto, c.fecha, banco, c.src.descripcion, poolDescargo, tolerancia) : null;
    if(dscC){
      c.src._chqUsado = true;
      hallazgos.push(hallazgoDescargo(banco, c.fecha, c.monto, c.src.descripcion, dscC, "",
        "Resumen en transito del mes anterior / Diario " + banco));
      return;
    }
    c.src._chqUsado = true;
    hallazgos.push({ fecha:c.fecha, banco:banco, monto:c.monto, clase:"en_transito",
      concepto:(c.src.descripcion||"").trim(), comprobante:"", motivo:"cheque pendiente por cambiar",
      texto: "Cheque de B/ " + fmt(c.monto) + " (" + c.fecha + ", " + banco + ") registrado en el diario aún no aparece en el estado de cuenta — en tránsito (pendiente por cambiar).",
      fuente: "Diario " + banco + " / Estado de cuenta " + banco });
  });
}
/* ---- SALIDAS del banco: fuera del alcance de este módulo ----
   Este módulo concilia lo que pasa por CAJA GENERAL: el dinero que entra por caja y se deposita al banco.
   Los pagos (cheques emitidos, ACH a proveedores, planillas) y los cargos propios del banco (comisiones,
   ITBMS, retenciones de tarjeta, timbres) salen directo de la cuenta bancaria sin tocar Caja General, así
   que no se cotejan acá. No se descartan en silencio: se cuenta y se totaliza lo que quedó fuera para que
   la exclusión sea explícita. */
function resumenSalidas(diario, estado){
  var noAborted = function(x){ return normTxt((x.descripcion||"")+" "+(x.referencia||"")).indexOf("ABORTED")===-1; };
  function junta(arr, campo){
    var xs = arr.filter(function(x){ return x[campo]>0 && !x._neutro && noAborted(x); });
    return { n: xs.length, total: Math.round(xs.reduce(function(a,x){ return a+x[campo]; },0)*100)/100 };
  }
  return { pagos: junta(diario, "credito"),   // lo que la empresa registró que salió del banco
           cargos: junta(estado, "debito") }; // lo que el banco efectivamente cobró
}

// diarioBancoGeneral/estBancoGeneral son opcionales: si faltan, ese banco no se concilia.
function paso3(diarioBanistmo, diarioStg, estBanistmo, estStg, diarioBancoGeneral, estBancoGeneral, ventanaDias, tolerancia, retVisaPorDia, transitoPrevio){
  var hallazgos = [];
  var cfgs = [
    {nombre:"Banistmo", diario:diarioBanistmo, estado:estBanistmo},
    {nombre:"STG", diario:diarioStg, estado:estStg, retVisa:retVisaPorDia}
  ];
  if(diarioBancoGeneral && estBancoGeneral) cfgs.push({nombre:"Banco General", diario:diarioBancoGeneral, estado:estBancoGeneral});
  // PRIMERO: consumir las partidas en tránsito del mes anterior (Paso 0). Sus líneas del estado ya tienen
  // asiento —el del mes pasado— así que no deben salir como "no aparece registrado en el diario contable".
  // Lo que queda pendiente se le pasa a la pasada de cheques, que empareja de forma más permisiva.
  var resPrev = null;
  var pendientesPrev = transitoPrevio || [];
  if(transitoPrevio && transitoPrevio.length){
    var estadosPrev = {};
    cfgs.forEach(function(c){ estadosPrev[c.nombre] = c.estado; });
    resPrev = transitoDelPaso0(transitoPrevio, estadosPrev, tolerancia);
    pendientesPrev = resPrev.pendientes.map(function(p){ return {fecha:p.fechaOrig, banco:p.banco, monto:p.monto, concepto:p.concepto, comprobante:p.comprobante, sentido:p.sentido}; });
  }
  // Bordes de mes: el último día lo pendiente queda en tránsito al mes siguiente; el primer día lo del
  // estado de cuenta suele ser una compensación que venía en tránsito del mes anterior.
  var poolDescargoP3 = poolParaDescargos(transitoPrevio, resPrev && resPrev.compensadas);
  var dupAvisado = {};   // un solo aviso por asiento repetido, no uno por cada copia
  var heredadosP3 = descargosHeredados(transitoPrevio, null);
  var todasFechas = [];
  cfgs.forEach(function(c){ (c.diario||[]).forEach(function(x){todasFechas.push(x.fecha);}); (c.estado||[]).forEach(function(x){todasFechas.push(x.fecha);}); });
  var ultimoDia = ultimoDiaMes(todasFechas), primerDia = primerDiaMes(todasFechas);
  cfgs.forEach(function(cfg){
    // Pasada de cheques (diario CK + cheques del Paso 0 del mes anterior) vs depósitos del estado.
    // Así los cheques de meses anteriores ya compensados no salen como diferencia.
    // Descargo repartido en varias lineas del diario del banco que citan su fecha de origen.
    if(heredadosP3){
      // El Paso 1 ya decidio que asientos son descargo: se ubican en el diario del banco y se apartan.
      heredadosP3.filter(function(dg){ return dg.banco === cfg.nombre; }).forEach(function(dg){
        if(!marcarLineasHeredadas(cfg.diario||[], dg.lineas, "debito", "_chqUsado").length) return;
        dg.partidas.forEach(function(p){
          for(var i=0;i<poolDescargoP3.length;i++){
            var q = poolDescargoP3[i];
            if(!q.usadoDescargo && q.banco===p.banco && q.fecha===p.fecha && Math.abs(q.monto - p.monto) < 0.005){ q.usadoDescargo = true; break; }
          }
        });
        if(dg.dif != null) return;   // descargo con diferencia: el Paso 1 ya la marco contra su partida
        hallazgos.push(hallazgoDescargo(cfg.nombre, dg.fecha, dg.monto, dg.lineas[0].descripcion, { partidas:dg.partidas }, refME(dg.ref),
          "Paso 1 (descargo decidido ahí) / Diario " + cfg.nombre, dg.lineas));
      });
    }
    // Lo que NO nombra banco no lo pudo ver el Paso 1 (su cotejo es por el banco que dice el texto): ese
    // descargo lo decide el Paso 3, que sabe de que banco es por el archivo. En junio de 2026 eran los
    // asientos de 224.89 y 1,082.89. Lo que SI nombra banco ya lo decidio el Paso 1 y no se reabre: el
    // cheque de 164.08 del 27-jun era un deposito del mes, no el descargo de otro 164.08 de mayo.
    {
      descargosPorFechaOrigen((cfg.diario||[]).filter(function(x){ return x.debito>0 && !x._chqUsado && (!heredadosP3 || !clasificarBancoPorTexto(x.descripcion)); }).map(function(x){ return { fecha:x.fecha, monto:x.debito, descripcion:x.descripcion, referencia:x.referencia, src:x }; }),
                              poolDescargoP3, cfg.nombre, tolerancia, "usadoDescargo").hechos.forEach(function(g){
        g.lineas.forEach(function(l){ l.src._chqUsado = true; });
        hallazgos.push(hallazgoDescargo(cfg.nombre, g.fecha, g.monto, g.lineas[0].descripcion, { partidas:g.partidas }, "",
          "Resumen en transito del mes anterior / Diario " + cfg.nombre, g.lineas));
      });
    }
    var prevChq = pendientesPrev.filter(function(t){ return t.banco===cfg.nombre; });
    var chq2 = chequesDelPaso2(cfg.nombre, cfg.estado);
    if(chq2){
      // El Paso 2 ya los clareo: aca solo se apartan las lineas que uso y se verifica el navegador.
      (cfg.estado||[]).forEach(function(x){ if(chq2.filasUsadas[x.fila]) x._chqUsado = true; });
      var ckNav = (cfg.diario||[]).filter(function(x){ return x.debito>0 && !x._chqUsado && esChequeDesc(x.descripcion) &&
        normTxt((x.descripcion||"")+" "+(x.referencia||"")).indexOf("ABORTED")===-1; });
      var totalNav = Math.round(ckNav.reduce(function(a, x){ return a + x.debito; }, 0)*100)/100;
      ckNav.forEach(function(x){ x._chqUsado = true; });
      // El navegador tiene que registrar al menos los cheques que CLAREARON. Los que siguen pendientes
      // pueden no tener asiento todavia: los de fin de mes se asientan el mes siguiente (en febrero de
      // 2026 eran 1,643.08 que entraron en marzo). Y si registra mas que todo el desglose, hay un
      // deposito de cheque que el informe de cajeras no trae.
      var sumClareados = Math.round((chq2.clareados||[]).reduce(function(a, c){ return a + c.monto; }, 0)*100)/100;
      var faltaCk = Math.round((sumClareados - totalNav)*100)/100;
      var sobraCk = Math.round((totalNav - chq2.total)*100)/100;
      if(faltaCk > tolerancia || sobraCk > tolerancia){
        hallazgos.push({
          fecha:"", banco:cfg.nombre, monto:Math.max(faltaCk, sobraCk), clase:"aviso",
          concepto:"Cheques: el navegador del banco no cuadra", comprobante:"", motivo:"asientos de cheque que faltan o sobran",
          texto: cfg.nombre + ": los cheques que clarearon en el banco suman B/ " + fmt(sumClareados) + " y el navegador registra B/ " +
                 fmt(totalNav) + " en depósitos de cheque" +
                 (faltaCk > tolerancia ? " — faltan B/ " + fmt(faltaCk) + " de asientos" : "") +
                 (sobraCk > tolerancia ? " — sobran B/ " + fmt(sobraCk) + " sobre el desglose del informe (B/ " + fmt(chq2.total) + ")" : "") +
                 ". El Paso 2 ya cotejó cada cheque contra el estado de cuenta.",
          fuente: "Desglose de cheques / Diario " + cfg.nombre
        });
      }
    } else {
      conciliarChequesPaso3(cfg.diario, cfg.estado, prevChq, ultimoDia, tolerancia, cfg.nombre, hallazgos, poolDescargoP3, !!heredadosP3);
    }
    // Un acumulado que trae adentro el descargo del transito anterior se coteja por el importe que el banco
    // todavia tiene por acreditar, no por el total del asiento (el resto lo consumio el Paso 0).
    marcarAcumuladosConDescargo(cfg.nombre, cfg.diario, tolerancia);
    // Concilia diario vs estado permitiendo combinaciones (un depósito combinado del diario que el
    // estado refleja partido en varias líneas, ej. 539.18 = 211.82+132.05+195.31, se da por cuadrado).
    var conc = conciliarBancoEstado(cfg.diario, cfg.estado, ventanaDias, tolerancia, cfg.retVisa);
    // Registrado en el diario/informe pero NO en el estado de cuenta = dinero que la empresa ya registró
    // como depósito y el banco todavía no reflejó → EN TRÁNSITO (pendiente por compensar en banco). No es
    // diferencia: o clarea con rezago (Brinks/tarjeta), o es de fin de mes, o simplemente el banco aún no
    // lo procesó. Se distingue el motivo (fin de mes vs pendiente) solo para el texto; la clase es la misma.
    conc.faltanEnBanco.forEach(function(f){
      var desc = (f.descripcion||"").trim();
      var n = normTxt(desc);
      // Descargo del transito previo: antes que el motivo de fin de mes (suele fecharse el ultimo dia).
      var dscF = (heredadosP3 && clasificarBancoPorTexto(desc)) ? null : reconocerDescargo(f.monto, f.fecha, cfg.nombre, desc, poolDescargoP3, tolerancia);
      if(dscF){
        hallazgos.push(hallazgoDescargo(cfg.nombre, f.fecha, f.monto, desc, dscF, "",
          "Resumen en transito del mes anterior / Diario " + cfg.nombre));
        return;
      }
      var refNav = refME(f.referencia);
      var claveDup = refNav + "|" + f.fecha + "|" + Math.round(f.monto*100) + "|" + normTxt(desc).slice(0, 40);
      var veces = refNav ? repetidoEnNavegador(cfg.diario, f) : 1;
      if(veces > 1 && !dupAvisado[claveDup]){
        dupAvisado[claveDup] = true;
        hallazgos.push({
          fecha:f.fecha, banco:cfg.nombre, monto:f.monto, clase:"aviso",
          concepto:"Asiento repetido en el navegador", comprobante:refNav, motivo:"mismo comprobante, fecha, importe y descripción",
          texto: cfg.nombre + " " + f.fecha + ": el asiento de B/ " + fmt(f.monto) + " (\"" + desc + "\", comprobante " + refNav +
                 ") aparece " + veces + " veces en el navegador del banco y ninguna compensó en el estado de cuenta. " +
                 "Si es el mismo movimiento registrado dos veces, corregilo en el navegador: mientras esté duplicado va a viajar " +
                 "al resumen del mes siguiente una y otra vez.",
          fuente: "Diario " + cfg.nombre + " (fila " + f.fila + ")"
        });
      }
      var lag = esBrinks(desc) ? 5
        : (n.indexOf("TARJETA")!==-1 || n.indexOf("VISA")!==-1 || n.indexOf("CLAVE")!==-1 || n.indexOf("YAPPY")!==-1) ? 3 : 0;
      var diasAlCierre = ultimoDia ? daysBetween(f.fecha, ultimoDia) : 999;
      var finDeMes = ultimoDia && diasAlCierre <= lag;
      var motivo = finDeMes ? (f.fecha===ultimoDia ? "último día del mes" : "depósito de fin de mes") : "pendiente por compensar en banco";
      var texto = finDeMes
        ? cfg.nombre + " " + f.fecha + ": B/ " + fmt(f.monto) + " (\"" + desc +
          "\") es un depósito de los últimos días del mes que aún no compensa en el estado — queda en tránsito para el mes siguiente."
        : cfg.nombre + " " + f.fecha + ": B/ " + fmt(f.monto) + " (\"" + desc +
          "\") está registrado en el diario/informe pero aún no aparece en el estado de cuenta — pendiente por compensar en banco.";
      hallazgos.push({
        fecha:f.fecha, banco:cfg.nombre, monto:f.monto, clase:"en_transito",
        concepto:desc, comprobante:"", motivo:motivo, texto:texto,
        fuente: "Diario " + cfg.nombre + " (fila " + f.fila + ") / Estado de cuenta " + cfg.nombre
      });
    });
    // En el estado de cuenta pero no registrado en el diario.
    conc.faltanEnDiario.forEach(function(f){
      var desc = (f.descripcion||"").trim();
      // Depósitos "Ach De Brinks Panama" = efectivo brinks del reporte (no es diferencia).
      if(esBrinks(desc)){
        hallazgos.push({
          fecha:f.fecha, banco:cfg.nombre, monto:f.monto, clase:"efectivo",
          texto: cfg.nombre + " " + f.fecha + ": B/ " + fmt(f.monto) + " es un depósito en efectivo (Brinks: \"" + desc +
                 "\") — corresponde al efectivo del reporte de cajeras, no es diferencia.",
          fuente: "Estado de cuenta " + cfg.nombre + " (fila " + f.fila + ") / Reporte (efectivo brinks)"
        });
        return;
      }
      // Compensacion del mes anterior que entra al arranque del mes: su asiento vive en el diario del
      // MES PASADO, asi que aca no hay nada que registrar. Dos afinamientos que eran fuente de falsos:
      // - El limite no es el dia 1 del calendario sino el PRIMER DIA CON MOVIMIENTO del estado: en
      //   febrero de 2026 el dia 1 fue domingo, el banco arranco el 02 y la regla no disparaba (la
      //   remision V/MC de 230.31 del 02-feb salia como diferencia).
      // - Las remisiones de tarjeta clarean con rezago: las ventas del 30/31 se acreditan hasta 3 dias
      //   habiles despues del arranque, no solo el primer dia.
      var iniMov = primeraFecha(cfg.estado);
      var esRemTarjeta = esRemisionVisa(desc) || esRemisionClave(desc);
      var margenEntrada = esRemTarjeta ? 3 : 0;   // dias habiles desde el arranque del estado
      if(iniMov && f.fecha >= iniMov && distanciaBancaria(iniMov, f.fecha) <= margenEntrada){
        // La regla del arranque daba por buena cualquier linea de los primeros dias por su fecha. Con un
        // resumen del mes anterior cargado se puede decir mas: si ninguna partida pendiente coincide con
        // ese importe, el resumen no la explica y hay que confirmarla (no se silencia como transito normal).
        // No se marca como diferencia porque puede ser legitima: en enero de 2026 las remisiones de 230.31
        // y 359.71 entraron el 02-feb y su asiento estaba en el navegador de enero, no en el resumen.
        var loExplica = !(transitoPrevio && transitoPrevio.length) ||
          pendientesPrev.some(function(p){ return p.banco === cfg.nombre && Math.abs(p.monto - f.monto) <= tolerancia; });
        hallazgos.push({
          fecha:f.fecha, banco:cfg.nombre, monto:f.monto, clase: loExplica ? "en_transito" : "sin_confirmar",
          concepto:desc, comprobante:"", motivo: loExplica ? "compensación del mes anterior (confirmar)" : "el resumen del mes anterior no la trae",
          texto: cfg.nombre + " " + f.fecha + ": B/ " + fmt(f.monto) + " (" + desc + ") " +
                 (loExplica
                   ? (esRemTarjeta
                     ? "es una remisión de tarjeta de los primeros días del mes: corresponde a ventas de los últimos días del mes anterior, y su asiento está en el diario del mes pasado. No es una diferencia."
                     : "aparece el primer día con movimiento del mes — probablemente una compensación en tránsito del mes anterior. Confirmá que estaba en circulación (o cargá el Paso 0 para validarlo).")
                   : "entró en los primeros días del mes, así que parece una compensación del mes anterior, pero el resumen en tránsito no trae ninguna partida de ese importe. " +
                     "Confirmá que su asiento está en el mes pasado; si no está, es plata que entró al banco y nadie registró."),
          fuente: "Estado de cuenta " + cfg.nombre + " (fila " + f.fila + ") / Diario " + cfg.nombre
        });
        return;
      }
      hallazgos.push({
        fecha:f.fecha, banco:cfg.nombre, monto:f.monto, clase:"diff",
        texto: cfg.nombre + " " + f.fecha + ": B/ " + fmt(f.monto) + " en el estado de cuenta no aparece registrado en el diario contable — " + desc,
        fuente: "Estado de cuenta " + cfg.nombre + " (fila " + f.fila + ") / Diario " + cfg.nombre
      });
    });

    // Lo que cuadro como BLOQUE, no linea por linea: se informa con los dos lados a la vista para que la
    // equivalencia se pueda auditar. No es una diferencia ni hay nada que registrar.
    (conc.bloques||[]).forEach(function(b){
      var lado = function(xs, campo){
        return xs.map(function(x){ return x.fecha + " B/ " + fmt(campo==="monto" ? x.monto : montoConc(x)); }).join(" + ");
      };
      hallazgos.push({
        fecha: b.creditos.map(function(x){ return x.fecha; }).sort().slice(-1)[0], banco: cfg.nombre,
        monto: b.total, clase:"informativo", concepto:"Cuadra como bloque", comprobante:"",
        motivo:"el banco lo acreditó repartido de otra forma",
        texto: cfg.nombre + ": " + b.debitos.length + " asiento(s) del diario por B/ " + fmt(b.total) + " (" + lado(b.debitos) +
               ") cuadran contra " + b.creditos.length + " línea(s) del estado por el mismo total (" + lado(b.creditos, "monto") +
               "). Ninguna coincide una a una —el banco acreditó el mismo dinero repartido de otra forma— y la suma solo " +
               "se alcanza de una manera, así que el bloque cuadra. No hay nada que registrar.",
        fuente: "Diario " + cfg.nombre + " / Estado de cuenta " + cfg.nombre
      });
    });
    /* ---- SALIDAS: fuera del alcance ----
       Este módulo coteja lo que pasa por CAJA GENERAL. Los pagos (cheques emitidos, ACH a proveedores,
       planillas) y los cargos propios del banco (comisiones, ITBMS, retenciones, timbres) salen directo de
       la cuenta sin tocar Caja General. No se concilian acá, pero se deja constancia de cuánto quedó
       fuera: si no, parecería que nadie los miró. */
    var sal = resumenSalidas(cfg.diario, cfg.estado);
    if(sal.pagos.n || sal.cargos.n){
      hallazgos.push({
        fecha:"", banco:cfg.nombre, monto:sal.cargos.total, clase:"informativo",
        concepto:"Salidas del banco", comprobante:"",
        texto: cfg.nombre + ": las salidas no se cotejan en este módulo, que concilia lo que pasa por Caja General. " +
               "Quedaron fuera " + sal.pagos.n + " pago(s) registrados en el diario por B/ " + fmt(sal.pagos.total) +
               " y " + sal.cargos.n + " cargo(s) del estado de cuenta por B/ " + fmt(sal.cargos.total) +
               " (cheques emitidos, ACH, planillas, comisiones, ITBMS, retenciones y timbres).",
        fuente: "Diario " + cfg.nombre + " / Estado de cuenta " + cfg.nombre
      });
    }
  });
  return hallazgos;
}

// Paso 4: Retenciones VISA (neto por dia) vs Remision V/Mc del estado de cuenta STG (ventana de dias)
function paso4(retVisa, estStg, ventanaDias, tolerancia){
  // El Paso 2 decidio que remision pago cada venta. Aca se controla el neto del informe contra ESA
  // asignacion: una remision que ya pago otra venta, o que compenso transito del mes anterior, no cubre este dia.
  var decR = STATE.decisiones && STATE.decisiones.remisiones;
  var asign = (decR && decR.firma === firmaEstado(estStg)) ? decR.asignadas : null;
  var remisiones = estStg.filter(function(x){ return !x._transitoUsado && normTxt(x.descripcion).indexOf("REMISION")!==-1 && normTxt(x.descripcion).indexOf("V/MC")!==-1; });
  var usadas = new Array(remisiones.length).fill(false);
  var hallazgos = [];
  retVisa.forEach(function(d){
    // Día sin ventas VISA (el informe trae la fila en cero): no hay nada que compensar en el banco.
    if(Math.abs(d.neto) <= tolerancia) return;
    var mejor=-1, mejorDist=Infinity;
    remisiones.forEach(function(r, idx){
      if(usadas[idx]) return;
      var asignadaA = asign ? asign[r.fila] : undefined;
      if(asignadaA && asignadaA !== "rango" && asignadaA !== d.fecha) return;   // ya pago otra venta
      if(Math.abs(r.credito - d.neto) <= tolerancia){
        // El deposito bancario ocurre el mismo dia del cierre o hasta N dias despues, nunca antes.
        if(r.fecha < d.fecha) return;
        var dist = distanciaBancaria(d.fecha, r.fecha);
        var propia = asignadaA === d.fecha;                 // la que el Paso 2 le asigno a esta venta va primero
        var orden = propia ? -1 : dist;
        if((dist<=ventanaDias || propia) && orden<mejorDist){ mejor=idx; mejorDist=orden; }
      }
    });
    if(mejor>=0){ usadas[mejor]=true; }
    else {
      hallazgos.push({
        fecha:d.fecha, banco:"STG", monto:d.neto,
        texto:"VISA " + d.fecha + ": venta bruta B/ " + fmt(d.bruto) + " menos retenciones B/ " + fmt(Math.abs(d.retenciones)) +
              " = neto esperado B/ " + fmt(d.neto) + " sin depósito 'Remisión V/Mc' correspondiente en el estado de cuenta STG",
        fuente:"Informe de retenciones VISA STG / Estado de cuenta STG"
      });
    }
  });
  return hallazgos;
}

/* ---------------- Ejecución por paso (individual o global) ---------------- */
// Cada paso puede correrse solo (si tiene sus propios archivos) o como parte de la
// conciliación completa. r[pasoKey] === undefined -> nunca se ejecutó en esta sesión;
// === null -> se intentó pero faltan archivos de ese paso (se omite); array -> resultado real.
// PASO_ORDEN gobierna la cadena condicionada (cada paso exige que cuadre el anterior) y el "todo
// cuadrado". El Paso 0 NO está en la lista pero es OBLIGATORIO: el Paso 1 exige que cuadre primero
// (ver pasoDesbloqueado/propagarBloqueo). Se corre antes de las conciliaciones bancarias.
var PASO_ORDEN = ["paso1","paso2","paso3"];
var PASO_REQS = {
  // Paso 0 (obligatorio): su ÚNICO archivo requerido es el resumen en tránsito del mes anterior.
  // Los estados de cuenta son opcionales acá (se suben en el Paso 2): si están, valida cuáles de esas
  // partidas ya compensaron; si no, todas quedan en tránsito hasta que se corra con los estados.
  paso0: ["transitoPrevio"],
  paso1: ["reporte","diarioCaja"],
  // Paso 2: coteja lo que Caja General registró como depositado a cada banco contra el estado de cuenta real.
  paso2: ["diarioCaja","estBanistmo","estStg"],
  // Paso 3: concilia el diario contable de cada banco contra su estado de cuenta real.
  paso3: ["diarioBanistmo","diarioStg","estBanistmo","estStg"]
};
// Archivos opcionales por paso: se leen si están subidos, pero no hacen falta para habilitar el paso.
// El Paso 3 incluye la validación VISA: si se sube el informe de retenciones, además de conciliar
// diario vs estado de cuenta, valida el neto VISA contra el estado de cuenta STG.
var PASO_OPCIONALES = {
  // Estados de cuenta: opcionales en el Paso 0. Se leen si están (subidos en el Paso 2) para validar
  // cuáles partidas del mes anterior ya compensaron; si no, todas quedan en tránsito.
  paso0: ["estBanistmo","estStg","estBancoGeneral"],
  // retVisa: para el neto VISA. reporte: para el desglose individual de cheques (2ª pestaña).
  // transitoPrevio: para apartar las líneas del estado que compensan partidas del mes anterior.
  // diarios de banco: para reconocer el deposito mixto (el banco acredita el efectivo de Caja General junto
  // con un deposito que solo esta en el diario del banco, como la caja menuda).
  paso2: ["estBancoGeneral","retVisa","reporte","transitoPrevio","diarioBanistmo","diarioStg","diarioBancoGeneral"],
  // diarioCaja es opcional en Paso 3 solo para leer su saldo inicial (contexto de partidas en tránsito).
  // transitoPrevio: cheques del Paso 0, para no marcar como diferencia lo que compensa cheques anteriores.
  paso3: ["diarioBancoGeneral","estBancoGeneral","retVisa","diarioCaja","transitoPrevio"]
};

function pasoListo(pasoKey){
  return PASO_REQS[pasoKey].every(function(k){ return !!STATE.files[k]; });
}
function archivosDePaso(pasoKey){
  return PASO_REQS[pasoKey].concat((PASO_OPCIONALES[pasoKey]||[]).filter(function(k){ return !!STATE.files[k]; }));
}

/* Envoltura del cálculo de un paso: si alguna búsqueda de combinaciones se cortó por el tope, hay que
   decirlo. Un corte silencioso se leería como "no compensa" y mandaría al resumen del mes siguiente una
   partida que en realidad sí cuadraba. */
function computePasoResult(pasoKey, raws, opts){
  subsetTruncado = 0; ilegiblesN = 0; ilegiblesVals = [];
  var res = computaPaso(pasoKey, raws, opts);
  if(subsetTruncado && Array.isArray(res)){
    res.push({
      fecha:"", banco:"", monto:0, clase:"aviso",
      concepto:"Búsqueda de combinaciones incompleta", comprobante:"", motivo:"demasiadas combinaciones",
      texto:"En este paso " + subsetTruncado + " búsqueda(s) de combinaciones se cortaron por tamaño: había " +
            "demasiadas partidas para probarlas todas. Puede que alguna diferencia sí cuadre con una " +
            "combinación que no se alcanzó a evaluar — revisala a mano antes de darla por buena.",
      fuente:"Motor de conciliación"
    });
  }
  // Una celda de importe ilegible se tomó como cero, así que su partida no entró al cotejo. Sin este
  // aviso el paso saldría "sin diferencias" con plata faltando, que es la peor forma de fallar.
  if(ilegiblesN && Array.isArray(res)){
    res.push({
      fecha:"", banco:"", monto:0, clase:"aviso",
      concepto:"Celdas que no se pudieron leer", comprobante:"", motivo:"dato ilegible en el archivo",
      // Cada valor ilegible se vuelve a buscar en los libros cargados para decir en qué archivo, hoja y
      // celda está. Sin eso el aviso obliga a rastrear a mano un informe de 30 columnas.
      texto:"En este paso hubo " + ilegiblesN + " celda(s) de importe que no se pudieron leer como número. " +
            "Se tomaron como cero, así que esas partidas NO entraron al cotejo y el resultado puede estar " +
            "incompleto. Corregilas en el Excel y volvé a exportarlo." +
            ilegiblesVals.map(function(v){
              var u = textoUbicacion(ubicarIlegible(raws, v));
              return "\n" + "· «" + v.slice(0,60) + "»" +
                     (u ? " — " + u : " (no se encontró la celda en los archivos cargados)");
            }).join(""),
      fuente:"Lectura de los archivos"
    });
  }
  return res;
}
/* ---- Partidas "ya acreditadas" que volvieron a entrar a Caja General ----
   El resumen en transito guarda, partida por partida, si su credito a Caja General ya se hizo. Es una foto
   del dia en que se bajo: si despues, en el mismo mes anterior, se registro el asiento de REINGRESO (debito a
   Caja General por los depositos que se acreditaron al entregarlos y el banco todavia no reflejaba), esas
   partidas volvieron a la cuenta y el resumen sigue diciendo "hecho". Paso en febrero de 2026: el 18-sep se
   reingresaron en enero B/ 1,180.04 (ME-1853) y B/ 1,354.25 (ME-1854), Caja General abrio febrero con el
   total del resumen (6,755.43) y el Paso 0 acusaba B/ 4,105.39 "de mas" que en realidad estaban bien.
   El navegador del mes no trae las lineas del mes anterior, asi que la prueba es el saldo: si la apertura es
   EXACTAMENTE el total de todas las partidas, las marcadas "hecho" estan dentro. Se corrigen aca, una vez,
   para que el Paso 0, el descargo, el Paso 2 y el panel del saldo lean lo mismo. */
function corregirAcreditadasReingresadas(tr, saldoCG, diarioCaja){
  if(!tr || !tr.length) return tr;
  var c = cuadreSaldoInicialPaso0(tr, saldoCG, diarioCaja);
  if(!c || c.ok || !c.esResumenCompleto) return tr;
  var n = 0, total = 0;
  tr.forEach(function(t){
    if(t.creditoCG !== "hecho") return;
    t.creditoCG = "pendiente"; t.reingresada = true; n++; total += t.monto;
  });
  tr.reingresadas = { n: n, total: Math.round(total*100)/100 };
  return tr;
}
/* ---- Consolidado que viaja junto con sus propias partes ----
   Un resumen bajado con una version anterior a 2026.10.07 podia traer el deposito consolidado del dia Y
   ADEMAS las partidas que lo forman: enero de 2026 trajo los 590.02 del 30-ene (Banistmo) y tambien VISA
   230.31 + CLAVE 359.71. El banco solo acredita las partes, asi que el consolidado quedaba pendiente para
   siempre, y el reingreso registrado siguiendo ese resumen salio por el doble. Se lo reconoce porque otras
   2 a 4 partidas del MISMO banco y el MISMO dia suman exactamente su importe; se lo saca de la lista y se
   avisa. Va DESPUES del control de reingreso: ese mira el total tal como se registro. */
function quitarConsolidadosDuplicados(tr){
  if(!tr || tr.length < 3) return tr;
  var quitar = [];
  tr.forEach(function(t, i){
    if(quitar.indexOf(i) !== -1) return;
    var pool = [];
    tr.forEach(function(o, j){
      if(j === i || quitar.indexOf(j) !== -1 || o.banco !== t.banco || o.fecha !== t.fecha || o.monto >= t.monto) return;
      pool.push({ fecha:o.fecha, monto:o.monto, usado:false, j:j });
    });
    if(pool.length < 2) return;
    var combo = buscarSubsetSuma(pool, t.fecha, t.monto, 0, 0.01, 4);
    if(!combo || combo.length < 2) return;
    quitar.push(i);
    t._partesEnResumen = combo.map(function(k){ return tr[pool[k].j]; });
  });
  if(!quitar.length) return tr;
  var dup = quitar.map(function(i){ return tr[i]; });
  for(var k = tr.length - 1; k >= 0; k--) if(quitar.indexOf(k) !== -1) tr.splice(k, 1);
  tr.duplicados = dup;
  return tr;
}
function transitoPrevioDe(raws){
  if(!raws.transitoPrevio) return null;
  var tr = corregirAcreditadasReingresadas(parseTransitoPrevio(raws.transitoPrevio), STATE.saldoCajaGeneral, STATE.diarioCaja);
  return quitarConsolidadosDuplicados(tr);
}
function computaPaso(pasoKey, raws, opts){
  // La ventana de días se mide sobre los días con movimiento bancario, no sobre el calendario.
  fijarCalendarioBancario(raws);
  // Si tenemos el archivo de Caja General, leemos su saldo (inicial/movimiento/final) para
  // mostrarlo como contexto de partidas en tránsito entre meses.
  if(raws.diarioCaja){
    try{ STATE.saldoCajaGeneral = parseSaldoCajaGeneral(raws.diarioCaja); }catch(e){}
    // El diario queda a mano para buscar asientos de ajuste ya registrados (cuadre del saldo inicial).
    try{ STATE.diarioCaja = parseDiario(raws.diarioCaja,"Caja General"); }catch(e){}
  }
  if(pasoKey==="paso0"){
    if(!raws.transitoPrevio) return null; // único archivo requerido: el resumen en tránsito
    var trPrev = transitoPrevioDe(raws);
    STATE.transitoPrevio = trPrev; // lo usa el cuadre contra el saldo inicial de Caja General
    // Estados de cuenta opcionales: si no están, se valida contra vacío (todo queda en tránsito).
    var eB = raws.estBanistmo ? parseEstadoCuenta(raws.estBanistmo,"banistmo") : [];
    var eS = raws.estStg ? parseEstadoCuenta(raws.estStg,"stg") : [];
    var eBG = raws.estBancoGeneral ? parseEstadoCuenta(raws.estBancoGeneral,"bancogeneral") : null;
    return paso0(trPrev, eB, eS, eBG, opts.ventana, opts.tol);
  }
  if(pasoKey==="paso1"){
    if(!raws.reporte || !raws.diarioCaja) return null;
    // Faltantes/sobrantes del informe y fecha de apertura: para cotejar lo que mueve el saldo de Caja
    // General sin ser un depósito (los ajustes de apertura los cuenta el Paso 0, no el Paso 1).
    var apertura = STATE.saldoCajaGeneral ? STATE.saldoCajaGeneral.fechaInicial : null;
    return paso1(parseReporteConsolidado(raws.reporte), parseDiario(raws.diarioCaja,"Caja General"),
                 parseChequesDetalle(raws.reporte), opts.tol, parseFaltantesSobrantes(raws.reporte), apertura,
                 transitoPrevioDe(raws));
  }
  if(pasoKey==="paso2"){
    if(!raws.diarioCaja || !raws.estBanistmo || !raws.estStg) return null;
    var diarioCaja = parseDiario(raws.diarioCaja,"Caja General");
    var estBanistmo = parseEstadoCuenta(raws.estBanistmo,"banistmo");
    var estStg = parseEstadoCuenta(raws.estStg,"stg");
    var estBG = raws.estBancoGeneral ? parseEstadoCuenta(raws.estBancoGeneral,"bancogeneral") : null;
    // Se guardan para el desglose de la diferencia entre el saldo de Caja General y el tránsito: sin
    // ellos ese panel solo podría mostrar totales, no de dónde sale cada cifra.
    STATE.estados = { "Banistmo": estBanistmo, "STG": estStg };
    if(estBG) STATE.estados["Banco General"] = estBG;
    try{ STATE.retVisaDetalle = raws.retVisa ? parseRetencionesVisa(raws.retVisa) : null; }catch(e){ STATE.retVisaDetalle = null; }
    // Retención VISA por día (magnitud positiva) para cuadrar el neto en STG: bruto − retención = neto del banco.
    var retVisaDia = null;
    if(raws.retVisa){
      retVisaDia = {};
      parseRetencionesVisa(raws.retVisa).forEach(function(d){ retVisaDia[d.fecha] = Math.abs(d.retenciones); });
    }
    // Desglose individual de cheques (2ª pestaña del reporte): si está, los cheques se cuadran uno a uno.
    var chequesDet = raws.reporte ? parseChequesDetalle(raws.reporte) : null;
    STATE.chequesDetalle = chequesDet;   // el desglose del saldo los cruza contra los creditos CK del diario
    var reporteCajas = raws.reporte ? parseReporteConsolidado(raws.reporte) : null;
    STATE.reporteCajas = reporteCajas;   // el cierre lo usa para deducir el banco de un deposito pendiente
    var trPrev2 = transitoPrevioDe(raws);
    var diariosBanco = {};
    try{
      if(raws.diarioBanistmo) diariosBanco["Banistmo"] = parseDiario(raws.diarioBanistmo, "Banistmo");
      if(raws.diarioStg) diariosBanco["STG"] = parseDiario(raws.diarioStg, null).filter(function(x){ return normTxt(x.cuenta).indexOf("BANISTMO")===-1; });
      if(raws.diarioBancoGeneral) diariosBanco["Banco General"] = parseDiario(raws.diarioBancoGeneral, null);
    }catch(e){}
    return paso2(diarioCaja, estBanistmo, estStg, estBG, retVisaDia, chequesDet, opts.ventana, opts.tol, reporteCajas, trPrev2, diariosBanco);
  }
  if(pasoKey==="paso3"){
    if(!raws.diarioBanistmo || !raws.diarioStg || !raws.estBanistmo || !raws.estStg) return null;
    var diarioBanistmo = parseDiario(raws.diarioBanistmo,"Banistmo");
    var diarioStg = parseDiario(raws.diarioStg,null).filter(function(x){ return normTxt(x.cuenta).indexOf("BANISTMO")===-1; });
    var estBanistmo = parseEstadoCuenta(raws.estBanistmo,"banistmo");
    var estStg = parseEstadoCuenta(raws.estStg,"stg");
    var diarioBG = raws.diarioBancoGeneral ? parseDiario(raws.diarioBancoGeneral, null) : null;
    var estBG = raws.estBancoGeneral ? parseEstadoCuenta(raws.estBancoGeneral, "bancogeneral") : null;
    // Retención VISA por día (magnitud positiva): el diario STG registra el bruto y el estado el neto,
    // así que el matching prueba bruto − retención = neto (igual que en el Paso 2).
    var retVisaLista = raws.retVisa ? parseRetencionesVisa(raws.retVisa) : null;
    var retVisaDia = null;
    if(retVisaLista){ retVisaDia = {}; retVisaLista.forEach(function(d){ retVisaDia[d.fecha] = Math.abs(d.retenciones); }); }
    // Cheques en tránsito del mes anterior (Paso 0): si están, se usan para no marcar como diferencia
    // los depósitos de junio que en realidad compensan cheques de meses anteriores.
    var transitoPrevio = transitoPrevioDe(raws);
    if(transitoPrevio) STATE.transitoPrevio = transitoPrevio;
    var hallazgos = paso3(diarioBanistmo, diarioStg, estBanistmo, estStg, diarioBG, estBG, opts.ventana, opts.tol, retVisaDia, transitoPrevio);
    // Validación VISA (antes Paso 4): chequeo independiente de que el neto VISA del informe tiene su
    // 'Remisión V/Mc' en el estado de cuenta STG (además del cuadre diario↔estado de arriba).
    if(retVisaLista){
      hallazgos = hallazgos.concat(paso4(retVisaLista, estStg, opts.ventana, opts.tol));
    }
    return hallazgos;
  }
  return null;
}

function readMany(keys, cb){
  var uniq = keys.filter(function(k,i){ return keys.indexOf(k)===i; });
  var raws = {};
  var pending = uniq.length;
  if(pending===0){ cb(raws); return; }
  uniq.forEach(function(k){
    readWorkbook(STATE.files[k], function(rows){
      raws[k] = rows;
      pending--;
      if(pending===0) cb(raws);
    });
  });
}

function ensureResults(){
  if(!STATE.results) STATE.results = {paso0:undefined, paso1:undefined, paso2:undefined, paso3:undefined};
}

/* ---- Validación del PERÍODO de cada archivo ----
   Un archivo exportado con el rango equivocado produce un reporte lleno de hallazgos falsos que parecen
   reales: todos los movimientos salen como "no compensados" simplemente porque no hay nada contra qué
   compararlos. Pasó con "BANISTMO ENERO 2026.xlsx", que se llama enero, cuyo encabezado dice "ESTADO DE
   CUENTA PETTY ENERO", y cuyas 14 filas son del 17 al 24 de julio.
   REGLA: el nombre del archivo y su encabezado NO son control de nada. El período se determina únicamente
   por las FECHAS DE LOS REGISTROS, y el mes de trabajo se decide por mayoría entre los archivos — no por
   uno tomado como referencia, porque el equivocado podría ser justamente ese. */
function periodoDe(arr){
  if(!arr || !arr.length) return null;
  var f = arr.map(function(x){ return x.fecha; }).filter(Boolean).sort();
  return f.length ? {desde:f[0], hasta:f[f.length-1]} : null;
}
function seSolapan(a, b){ return !!(a && b) && a.desde <= b.hasta && b.desde <= a.hasta; }
// Meses (YYYY-MM) presentes en un conjunto de movimientos, con cuántos registros tiene cada uno.
function mesesDe(arr){
  var m = {};
  (arr||[]).forEach(function(x){ if(x.fecha) { var k=String(x.fecha).slice(0,7); m[k]=(m[k]||0)+1; } });
  return m;
}
// Mes dominante de un conjunto de REGISTROS (objetos con .fecha): aquel con más movimientos.
// Ojo: existe otra mesDominante() que opera sobre un array de FECHAS (strings) y la usan ultimoDiaMes /
// primerDiaMes. Son cosas distintas y no deben compartir nombre.
function mesDominanteDeRegistros(arr){
  var m = mesesDe(arr), mejor = null, max = 0;
  Object.keys(m).forEach(function(k){ if(m[k] > max){ max = m[k]; mejor = k; } });
  return mejor;
}
// Mes que menciona el NOMBRE del archivo (solo para avisar de nombres engañosos: nunca decide el período).
var MESES_NOMBRE = {ENERO:"01",FEBRERO:"02",MARZO:"03",ABRIL:"04",MAYO:"05",JUNIO:"06",JULIO:"07",
  AGOSTO:"08",SEPTIEMBRE:"09",SETIEMBRE:"09",OCTUBRE:"10",NOVIEMBRE:"11",DICIEMBRE:"12"};
function mesEnNombre(nombre){
  var n = normTxt(nombre||""), mes = null;
  Object.keys(MESES_NOMBRE).forEach(function(k){ if(!mes && n.indexOf(k)!==-1) mes = MESES_NOMBRE[k]; });
  return mes;
}
// Lee TODOS los archivos cargados y determina el período de cada uno por las fechas de sus registros.
/* ---- Control de integridad entre archivos ----
   Un asiento de deposito tiene dos lados: debito al banco y credito a Caja General, los dos bajo el mismo
   comprobante ME-. Si el navegador de Caja General se exporto filtrado o se le borraron filas a mano,
   falta un lado y el cotejo del Paso 1 marca como "asiento faltante" algo que si esta registrado — con el
   agravante de que sugiere un asiento que ya existe. Paso en febrero de 2026: el ME-00000001876 aparecia
   en Caja General solo con la venta, sin sus depositos por 3,571.60, y el ME-00000001877 no aparecia del
   todo (2,662.52), mientras el diario de Banistmo tenia los dos completos.
   Se compara el TOTAL de depositos del comprobante en todos los bancos contra el TOTAL de creditos del
   mismo comprobante en Caja General: que el credito sea mayor no es problema (lleva descargos y ajustes),
   que sea MENOR significa que faltan lineas. */
function integridadComprobantes(diarioCaja, diariosBanco){
  function refME(r){ var s = String(r==null?"":r).trim(); return /^ME-/i.test(s) ? s : null; }
  if(!diarioCaja || !diarioCaja.length) return [];
  var enCaja = {}, existeEnCaja = {};
  diarioCaja.forEach(function(x){
    var r = refME(x.referencia); if(!r) return;
    existeEnCaja[r] = true;
    enCaja[r] = Math.round(((enCaja[r]||0) + x.credito)*100)/100;
  });
  var depos = {}, bancosDe = {};
  Object.keys(diariosBanco||{}).forEach(function(banco){
    (diariosBanco[banco]||[]).forEach(function(x){
      if(!(x.debito > 0)) return;
      if(normTxt(x.descripcion).indexOf("DEPOSITO") === -1) return;
      var r = refME(x.referencia); if(!r) return;
      depos[r] = Math.round(((depos[r]||0) + x.debito)*100)/100;
      (bancosDe[r] = bancosDe[r] || {})[banco] = true;
    });
  });
  var out = [];
  Object.keys(depos).sort().forEach(function(r){
    // Solo se denuncia lo INEQUIVOCO: el comprobante tiene depositos en el banco y en Caja General no
    // tiene NI UN credito. Si tiene algunos, la diferencia puede ser legitima —hay depositos que no vienen
    // de Caja General, como el ingreso de otra cuenta— y avisar ahi seria alarmar sin fundamento: en enero
    // de 2026 eso marcaba dos comprobantes por 83.15 que estaban correctos.
    if((enCaja[r]||0) > 0.03) return;
    var falta = depos[r];
    out.push({ ref:r, deposito:depos[r], enCaja:(enCaja[r]||0), falta:falta,
               ausente:!existeEnCaja[r], bancos:Object.keys(bancosDe[r]||{}).sort() });
  });
  return out;
}

/* Control cruzado, sentido inverso: al navegador de un BANCO le faltan lineas.
   Arriba se controla banco -> Caja General. Falta el otro sentido: el navegador del banco exportado con
   un filtro que dejo fuera los depositos de ventas. Pasa seguido con Banistmo, y el dano es silencioso:
   el Paso 3 compara un diario casi vacio contra un estado de cuenta lleno y devuelve decenas de
   "diferencias" que no existen. Se denuncia solo lo INEQUIVOCO: el diario del banco no comparte NI UN
   comprobante con Caja General, teniendo su estado de cuenta entradas ese mes. */
function integridadDiariosBanco(diarioCaja, diariosBanco, estados){
  function refME(r){ var s = String(r==null?"":r).trim(); return /^ME-/i.test(s) ? s : null; }
  if(!diarioCaja || !diarioCaja.length) return [];
  var crCaja = {}, hayCaja = false;
  diarioCaja.forEach(function(x){
    var r = refME(x.referencia); if(!r || !(x.credito > 0)) return;
    crCaja[r] = Math.round(((crCaja[r]||0) + x.credito)*100)/100;
    hayCaja = true;
  });
  if(!hayCaja) return [];
  // Debitos por comprobante en TODOS los diarios de banco cargados: mide cuanto credito de Caja General
  // se quedo sin su contrapartida en algun banco.
  var dbTodos = {};
  Object.keys(diariosBanco||{}).forEach(function(b){
    (diariosBanco[b]||[]).forEach(function(x){
      var r = refME(x.referencia); if(!r || !(x.debito > 0)) return;
      dbTodos[r] = Math.round(((dbTodos[r]||0) + x.debito)*100)/100;
    });
  });
  var sinRespaldo = 0, nSin = 0;
  Object.keys(crCaja).forEach(function(r){
    var f = Math.round((crCaja[r] - (dbTodos[r]||0))*100)/100;
    if(f > 0.02){ sinRespaldo += f; nSin++; }
  });
  sinRespaldo = Math.round(sinRespaldo*100)/100;
  var out = [];
  Object.keys(diariosBanco||{}).forEach(function(banco){
    var diario = diariosBanco[banco] || [];
    var comunes = 0;
    diario.forEach(function(x){ var r = refME(x.referencia); if(r && crCaja[r]!==undefined) comunes++; });
    if(comunes > 0) return;                    // comparte comprobantes: el archivo esta completo
    var est = (estados && estados[banco]) || [];
    var creditos = 0, nCred = 0;
    est.forEach(function(m){ if(m.credito > 0){ creditos += m.credito; nCred++; } });
    if(nCred === 0) return;                    // sin entradas en el estado: no hay nada que registrar
    out.push({ banco:banco, movimientos:diario.length, creditos:Math.round(creditos*100)/100,
               nCreditos:nCred, sinRespaldo:sinRespaldo, nSinRespaldo:nSin });
  });
  return out;
}
