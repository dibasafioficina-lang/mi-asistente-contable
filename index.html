  var dep = depos.map(function(x){ return { src:x, fecha:x.fecha, monto:x.credito, usado:false }; });
  // Paso A: cada cheque contra una combinación de depósitos hacia adelante.
  chq.forEach(function(c){ if(c.usado) return; var combo = buscarSubsetSuma(dep, c.fecha, c.monto, VENTANA, tolerancia, 8, "adelante"); if(combo){ combo.forEach(function(i){ dep[i].usado=true; }); c.usado=true; } });
  // Paso B: cada depósito no usado contra una combinación de cheques hacia atrás (el banco los junta).
  dep.forEach(function(d){ if(d.usado) return; var combo = buscarSubsetSuma(chq, d.fecha, d.monto, VENTANA, tolerancia, 12, "atras"); if(combo){ combo.forEach(function(i){ chq[i].usado=true; }); d.usado=true; } });
  // Marcar usados en las filas fuente (para que conciliarBancoEstado los ignore).
  chq.forEach(function(c){ if(c.usado && c.src) c.src._chqUsado = true; });
  dep.forEach(function(d){ if(d.usado) d.src._chqUsado = true; });
  // Cheques del diario que no clarearon → en tránsito (pendiente por cambiar).
  chq.forEach(function(c){
    if(c.usado || c.origen!=="diario") return;
    c.src._chqUsado = true;
    hallazgos.push({ fecha:c.fecha, banco:banco, monto:c.monto, clase:"en_transito",
      concepto:(c.src.descripcion||"").trim(), comprobante:"", motivo:"cheque pendiente por cambiar",
      texto: "Cheque de B/ " + fmt(c.monto) + " (" + c.fecha + ", " + banco + ") registrado en el diario aún no aparece en el estado de cuenta — en tránsito (pendiente por cambiar).",
      fuente: "Diario " + banco + " / Estado de cuenta " + banco });
  });
}
// diarioBancoGeneral/estBancoGeneral son opcionales: si faltan, ese banco no se concilia.
function paso3(diarioBanistmo, diarioStg, estBanistmo, estStg, diarioBancoGeneral, estBancoGeneral, ventanaDias, tolerancia, retVisaPorDia, transitoPrevio){
  var hallazgos = [];
  var cfgs = [
    {nombre:"Banistmo", diario:diarioBanistmo, estado:estBanistmo},
    {nombre:"STG", diario:diarioStg, estado:estStg, retVisa:retVisaPorDia}
  ];
  if(diarioBancoGeneral && estBancoGeneral) cfgs.push({nombre:"Banco General", diario:diarioBancoGeneral, estado:estBancoGeneral});
  // Bordes de mes: el último día lo pendiente queda en tránsito al mes siguiente; el primer día lo del
  // estado de cuenta suele ser una compensación que venía en tránsito del mes anterior.
  var todasFechas = [];
  cfgs.forEach(function(c){ (c.diario||[]).forEach(function(x){todasFechas.push(x.fecha);}); (c.estado||[]).forEach(function(x){todasFechas.push(x.fecha);}); });
  var ultimoDia = ultimoDiaMes(todasFechas), primerDia = primerDiaMes(todasFechas);
  cfgs.forEach(function(cfg){
    // Pasada de cheques (diario CK + cheques del Paso 0 del mes anterior) vs depósitos del estado.
    // Así los cheques de meses anteriores ya compensados no salen como diferencia.
    var prevChq = (transitoPrevio||[]).filter(function(t){ return t.banco===cfg.nombre; });
    conciliarChequesPaso3(cfg.diario, cfg.estado, prevChq, ultimoDia, tolerancia, cfg.nombre, hallazgos);
    // Concilia diario vs estado permitiendo combinaciones (un depósito combinado del diario que el
    // estado refleja partido en varias líneas, ej. 539.18 = 211.82+132.05+195.31, se da por cuadrado).
    var conc = conciliarBancoEstado(cfg.diario, cfg.estado, ventanaDias, tolerancia, cfg.retVisa);
    // Registrado en el diario/informe pero NO en el estado de cuenta = dinero que la empresa ya registró
    // como depósito y el banco todavía no reflejó → EN TRÁNSITO (pendiente por compensar en banco). No es
    // diferencia: o clarea con rezago (Brinks/tarjeta), o es de fin de mes, o simplemente el banco aún no
    // lo procesó. Se distingue el motivo (fin de mes vs pendiente) solo para el texto; la clase es la misma.
    conc.faltanEnBanco.forEach(function(f){
      var desc = (f.descripcion||"").trim();
      var n = normTxt(desc);
      var lag = esBrinks(desc) ? 5
        : (n.indexOf("TARJETA")!==-1 || n.indexOf("VISA")!==-1 || n.indexOf("CLAVE")!==-1 || n.indexOf("YAPPY")!==-1) ? 3 : 0;
      var diasAlCierre = ultimoDia ? daysBetween(f.fecha, ultimoDia) : 999;
      var finDeMes = ultimoDia && diasAlCierre <= lag;
      var motivo = finDeMes ? (f.fecha===ultimoDia ? "último día del mes" : "depósito de fin de mes") : "pendiente por compensar en banco";
      var texto = finDeMes
        ? cfg.nombre + " " + f.fecha + ": B/ " + fmt(f.monto) + " (\"" + desc +
          "\") es un depósito de los últimos días del mes que aún no compensa en el estado — queda en tránsito para el mes siguiente."
        : cfg.nombre + " " + f.fecha + ": B/ " + fmt(f.monto) + " (\"" + desc +
          "\") está registrado en el diario/informe pero aún no aparece en el estado de cuenta — pendiente por compensar en banco.";
      hallazgos.push({
        fecha:f.fecha, banco:cfg.nombre, monto:f.monto, clase:"en_transito",
        concepto:desc, comprobante:"", motivo:motivo, texto:texto,
        fuente: "Diario " + cfg.nombre + " (fila " + f.fila + ") / Estado de cuenta " + cfg.nombre
      });
    });
    // En el estado de cuenta pero no registrado en el diario.
    conc.faltanEnDiario.forEach(function(f){
      var desc = (f.descripcion||"").trim();
      // Depósitos "Ach De Brinks Panama" = efectivo brinks del reporte (no es diferencia).
      if(esBrinks(desc)){
        hallazgos.push({
          fecha:f.fecha, banco:cfg.nombre, monto:f.monto, clase:"efectivo",
          texto: cfg.nombre + " " + f.fecha + ": B/ " + fmt(f.monto) + " es un depósito en efectivo (Brinks: \"" + desc +
                 "\") — corresponde al efectivo del reporte de cajeras, no es diferencia.",
          fuente: "Estado de cuenta " + cfg.nombre + " (fila " + f.fila + ") / Reporte (efectivo brinks)"
        });
        return;
      }
      // Primer día del mes → probablemente una compensación en tránsito del mes anterior.
      if(primerDia && f.fecha===primerDia){
        hallazgos.push({
          fecha:f.fecha, banco:cfg.nombre, monto:f.monto, clase:"en_transito",
          concepto:desc, comprobante:"", motivo:"compensación del mes anterior (confirmar)",
          texto: cfg.nombre + " " + f.fecha + ": B/ " + fmt(f.monto) + " (\"" + desc +
                 "\") aparece el primer día del mes — probablemente una compensación en tránsito del mes anterior. Confirmá que estaba en circulación (o cargá el Paso 0 para validarlo).",
          fuente: "Estado de cuenta " + cfg.nombre + " (fila " + f.fila + ") / Diario " + cfg.nombre
        });
        return;
      }
      hallazgos.push({
        fecha:f.fecha, banco:cfg.nombre, monto:f.monto, clase:"diff",
        texto: cfg.nombre + " " + f.fecha + ": B/ " + fmt(f.monto) + " en el estado de cuenta no aparece registrado en el diario contable — " + desc,
        fuente: "Estado de cuenta " + cfg.nombre + " (fila " + f.fila + ") / Diario " + cfg.nombre
      });
    });
  });
  return hallazgos;
}

// Paso 4: Retenciones VISA (neto por dia) vs Remision V/Mc del estado de cuenta STG (ventana de dias)
function paso4(retVisa, estStg, ventanaDias, tolerancia){
  var remisiones = estStg.filter(function(x){ return normTxt(x.descripcion).indexOf("REMISION")!==-1 && normTxt(x.descripcion).indexOf("V/MC")!==-1; });
  var usadas = new Array(remisiones.length).fill(false);
  var hallazgos = [];
  retVisa.forEach(function(d){
    var mejor=-1, mejorDist=Infinity;
    remisiones.forEach(function(r, idx){
      if(usadas[idx]) return;
      if(Math.abs(r.credito - d.neto) <= tolerancia){
        // El deposito bancario ocurre el mismo dia del cierre o hasta N dias despues, nunca antes.
        if(r.fecha < d.fecha) return;
        var dist = daysBetween(d.fecha, r.fecha);
        if(dist<=ventanaDias && dist<mejorDist){ mejor=idx; mejorDist=dist; }
      }
    });
    if(mejor>=0){ usadas[mejor]=true; }
    else {
      hallazgos.push({
        fecha:d.fecha, banco:"STG", monto:d.neto,
        texto:"VISA " + d.fecha + ": venta bruta B/ " + fmt(d.bruto) + " menos retenciones B/ " + fmt(Math.abs(d.retenciones)) +
              " = neto esperado B/ " + fmt(d.neto) + " sin depósito 'Remisión V/Mc' correspondiente en el estado de cuenta STG",
        fuente:"Informe de retenciones VISA STG / Estado de cuenta STG"
      });
    }
  });
  return hallazgos;
}

/* ---------------- Ejecución por paso (individual o global) ---------------- */
// Cada paso puede correrse solo (si tiene sus propios archivos) o como parte de la
// conciliación completa. r[pasoKey] === undefined -> nunca se ejecutó en esta sesión;
// === null -> se intentó pero faltan archivos de ese paso (se omite); array -> resultado real.
// PASO_ORDEN gobierna la cadena condicionada (cada paso exige que cuadre el anterior) y el "todo
// cuadrado". El Paso 0 NO está en la lista pero es OBLIGATORIO: el Paso 1 exige que cuadre primero
// (ver pasoDesbloqueado/propagarBloqueo). Se corre antes de las conciliaciones bancarias.
var PASO_ORDEN = ["paso1","paso2","paso3"];
var PASO_REQS = {
  // Paso 0 (obligatorio): su ÚNICO archivo requerido es el resumen en tránsito del mes anterior.
  // Los estados de cuenta son opcionales acá (se suben en el Paso 2): si están, valida cuáles de esas
  // partidas ya compensaron; si no, todas quedan en tránsito hasta que se corra con los estados.
  paso0: ["transitoPrevio"],
  paso1: ["reporte","diarioCaja"],
  // Paso 2: coteja lo que Caja General registró como depositado a cada banco contra el estado de cuenta real.
  paso2: ["diarioCaja","estBanistmo","estStg"],
  // Paso 3: concilia el diario contable de cada banco contra su estado de cuenta real.
  paso3: ["diarioBanistmo","diarioStg","estBanistmo","estStg"]
};
// Archivos opcionales por paso: se leen si están subidos, pero no hacen falta para habilitar el paso.
// El Paso 3 incluye la validación VISA: si se sube el informe de retenciones, además de conciliar
// diario vs estado de cuenta, valida el neto VISA contra el estado de cuenta STG.
var PASO_OPCIONALES = {
  // Estados de cuenta: opcionales en el Paso 0. Se leen si están (subidos en el Paso 2) para validar
  // cuáles partidas del mes anterior ya compensaron; si no, todas quedan en tránsito.
  paso0: ["estBanistmo","estStg","estBancoGeneral"],
  // retVisa: para el neto VISA. reporte: para el desglose individual de cheques (2ª pestaña).
  paso2: ["estBancoGeneral","retVisa","reporte"],
  // diarioCaja es opcional en Paso 3 solo para leer su saldo inicial (contexto de partidas en tránsito).
  // transitoPrevio: cheques del Paso 0, para no marcar como diferencia lo que compensa cheques anteriores.
  paso3: ["diarioBancoGeneral","estBancoGeneral","retVisa","diarioCaja","transitoPrevio"]
};

function pasoListo(pasoKey){
  return PASO_REQS[pasoKey].every(function(k){ return !!STATE.files[k]; });
}
function archivosDePaso(pasoKey){
  return PASO_REQS[pasoKey].concat((PASO_OPCIONALES[pasoKey]||[]).filter(function(k){ return !!STATE.files[k]; }));
}

function computePasoResult(pasoKey, raws, opts){
  // Si tenemos el archivo de Caja General, leemos su saldo (inicial/movimiento/final) para
  // mostrarlo como contexto de partidas en tránsito entre meses.
  if(raws.diarioCaja){ try{ STATE.saldoCajaGeneral = parseSaldoCajaGeneral(raws.diarioCaja); }catch(e){} }
  if(pasoKey==="paso0"){
    if(!raws.transitoPrevio) return null; // único archivo requerido: el resumen en tránsito
    var trPrev = parseTransitoPrevio(raws.transitoPrevio);
    // Estados de cuenta opcionales: si no están, se valida contra vacío (todo queda en tránsito).
    var eB = raws.estBanistmo ? parseEstadoCuenta(raws.estBanistmo,"banistmo") : [];
    var eS = raws.estStg ? parseEstadoCuenta(raws.estStg,"stg") : [];
    var eBG = raws.estBancoGeneral ? parseEstadoCuenta(raws.estBancoGeneral,"bancogeneral") : null;
    return paso0(trPrev, eB, eS, eBG, opts.ventana, opts.tol);
  }
  if(pasoKey==="paso1"){
    if(!raws.reporte || !raws.diarioCaja) return null;
    return paso1(parseReporteConsolidado(raws.reporte), parseDiario(raws.diarioCaja,"Caja General"), parseChequesDetalle(raws.reporte), opts.tol);
  }
  if(pasoKey==="paso2"){
    if(!raws.diarioCaja || !raws.estBanistmo || !raws.estStg) return null;
    var diarioCaja = parseDiario(raws.diarioCaja,"Caja General");
    var estBanistmo = parseEstadoCuenta(raws.estBanistmo,"banistmo");
    var estStg = parseEstadoCuenta(raws.estStg,"stg");
    var estBG = raws.estBancoGeneral ? parseEstadoCuenta(raws.estBancoGeneral,"bancogeneral") : null;
    // Retención VISA por día (magnitud positiva) para cuadrar el neto en STG: bruto − retención = neto del banco.
    var retVisaDia = null;
    if(raws.retVisa){
      retVisaDia = {};
      parseRetencionesVisa(raws.retVisa).forEach(function(d){ retVisaDia[d.fecha] = Math.abs(d.retenciones); });
    }
    // Desglose individual de cheques (2ª pestaña del reporte): si está, los cheques se cuadran uno a uno.
    var chequesDet = raws.reporte ? parseChequesDetalle(raws.reporte) : null;
    var reporteCajas = raws.reporte ? parseReporteConsolidado(raws.reporte) : null;
    return paso2(diarioCaja, estBanistmo, estStg, estBG, retVisaDia, chequesDet, opts.ventana, opts.tol, reporteCajas);
  }
  if(pasoKey==="paso3"){
    if(!raws.diarioBanistmo || !raws.diarioStg || !raws.estBanistmo || !raws.estStg) return null;
    var diarioBanistmo = parseDiario(raws.diarioBanistmo,"Banistmo");
    var diarioStg = parseDiario(raws.diarioStg,null).filter(function(x){ return normTxt(x.cuenta).indexOf("BANISTMO")===-1; });
    var estBanistmo = parseEstadoCuenta(raws.estBanistmo,"banistmo");
    var estStg = parseEstadoCuenta(raws.estStg,"stg");
    var diarioBG = raws.diarioBancoGeneral ? parseDiario(raws.diarioBancoGeneral, null) : null;
    var estBG = raws.estBancoGeneral ? parseEstadoCuenta(raws.estBancoGeneral, "bancogeneral") : null;
    // Retención VISA por día (magnitud positiva): el diario STG registra el bruto y el estado el neto,
    // así que el matching prueba bruto − retención = neto (igual que en el Paso 2).
    var retVisaLista = raws.retVisa ? parseRetencionesVisa(raws.retVisa) : null;
    var retVisaDia = null;
    if(retVisaLista){ retVisaDia = {}; retVisaLista.forEach(function(d){ retVisaDia[d.fecha] = Math.abs(d.retenciones); }); }
    // Cheques en tránsito del mes anterior (Paso 0): si están, se usan para no marcar como diferencia
    // los depósitos de junio que en realidad compensan cheques de meses anteriores.
    var transitoPrevio = raws.transitoPrevio ? parseTransitoPrevio(raws.transitoPrevio) : null;
    var hallazgos = paso3(diarioBanistmo, diarioStg, estBanistmo, estStg, diarioBG, estBG, opts.ventana, opts.tol, retVisaDia, transitoPrevio);
    // Validación VISA (antes Paso 4): chequeo independiente de que el neto VISA del informe tiene su
    // 'Remisión V/Mc' en el estado de cuenta STG (además del cuadre diario↔estado de arriba).
    if(retVisaLista){
      hallazgos = hallazgos.concat(paso4(retVisaLista, estStg, opts.ventana, opts.tol));
    }
    return hallazgos;
  }
  return null;
}

function readMany(keys, cb){
  var uniq = keys.filter(function(k,i){ return keys.indexOf(k)===i; });
  var raws = {};
  var pending = uniq.length;
  if(pending===0){ cb(raws); return; }
  uniq.forEach(function(k){
    readWorkbook(STATE.files[k], function(rows){
      raws[k] = rows;
      pending--;
      if(pending===0) cb(raws);
    });
  });
}

function ensureResults(){
  if(!STATE.results) STATE.results = {paso0:undefined, paso1:undefined, paso2:undefined, paso3:undefined};
}

// Un hallazgo cuenta como "diferencia roja" salvo que sea clase "sin_confirmar" (plata presente pero
// sin etiqueta de banco) o "en_transito" (cheque pendiente por cambiar). Esas dos NO bloquean el paso.
function esSinConfirmar(item){ return item && item.clase==="sin_confirmar"; }
function esEnTransito(item){ return item && item.clase==="en_transito"; }
function esEfectivo(item){ return item && item.clase==="efectivo"; } // depósito en efectivo (Brinks), no es diferencia
function esNoRojo(item){ return esSinConfirmar(item) || esEnTransito(item) || esEfectivo(item); }
function contarRojas(items){ return Array.isArray(items) ? items.filter(function(i){return !esNoRojo(i);}).length : 0; }
function contarSinConfirmar(items){ return Array.isArray(items) ? items.filter(esSinConfirmar).length : 0; }
function contarEnTransito(items){ return Array.isArray(items) ? items.filter(esEnTransito).length : 0; }
function contarEfectivo(items){ return Array.isArray(items) ? items.filter(esEfectivo).length : 0; }

// Cuadre limpio para el confetti: cero diferencias ROJAS en todo lo evaluado
// (los "sin confirmar" no lo bloquean: la plata cuadra, solo falta la etiqueta de banco).
function tieneCuadreLimpio(keys, r){
  var evaluados = keys.filter(function(k){ return Array.isArray(r[k]); });
  if(evaluados.length===0) return false;
  return evaluados.every(function(k){ return contarRojas(r[k])===0; });
}

// Un paso está "cuadrado" cuando se ejecutó y no tiene diferencias rojas (los "sin confirmar" no cuentan).
function pasoCuadrado(pasoKey){
  var r = STATE.results && STATE.results[pasoKey];
  return Array.isArray(r) && contarRojas(r)===0;
}
// Cada paso se desbloquea cuando el paso anterior cuadra. El Paso 0 es OBLIGATORIO: el Paso 1 exige que
// el Paso 0 esté cuadrado (ejecutado sin diferencias). El Paso 0 en sí siempre está desbloqueado.
function pasoDesbloqueado(pasoKey){
  var idx = PASO_ORDEN.indexOf(pasoKey);
  if(idx<0) return true;                       // Paso 0 (no está en PASO_ORDEN)
  if(idx===0) return pasoListo("paso0");       // Paso 1: requiere los archivos del Paso 0 (que se ejecuta junto)
  return pasoCuadrado(PASO_ORDEN[idx-1]);
}
// Paso previo requerido para desbloquear pasoKey (el Paso 0 es el previo del Paso 1).
function pasoPrevio(pasoKey){
  var idx = PASO_ORDEN.indexOf(pasoKey);
  return idx<=0 ? "paso0" : PASO_ORDEN[idx-1];
}
function nombreCortoPaso(pasoKey){
  if(pasoKey==="paso0") return "Paso 0";
  return "Paso " + (PASO_ORDEN.indexOf(pasoKey)+1);
}
// Si un paso deja de cuadrar (o no se ejecutó), los siguientes quedan bloqueados: se marcan con "bloqueado".
function propagarBloqueo(){
  ensureResults();
  // Paso 0 obligatorio: si no cuadró, el Paso 1 (y por cascada el resto) queda bloqueado.
  if(!pasoCuadrado("paso0") && STATE.results[PASO_ORDEN[0]]!==undefined){
    STATE.results[PASO_ORDEN[0]] = "bloqueado";
  }
  for(var i=1;i<PASO_ORDEN.length;i++){
    if(!pasoCuadrado(PASO_ORDEN[i-1])){
      STATE.results[PASO_ORDEN[i]] = "bloqueado";
    }
  }
}
// Refresca toda la vista del módulo (zonas de carga + botones + resultados) tras ejecutar un paso,
// para que el desbloqueo condicional y las etiquetas CUADRADO queden al día.
function refrescarModulo(nota){
  renderModulo1();
  var n = document.getElementById("runNote");
  if(n && nota) n.textContent = nota;
}

function ejecutarPaso(pasoKey){
  if(pasoKey==="paso0") return; // el Paso 0 no se ejecuta solo: corre junto con el Paso 1 (es requisito).
  if(!pasoListo(pasoKey) || !pasoDesbloqueado(pasoKey)) return; // condicionado a que el paso anterior cuadre
  var note = document.getElementById("runNote");
  if(note) note.textContent = "Leyendo archivos de este paso...";
  // El Paso 1 (primer paso de la cadena) ejecuta primero el Paso 0 obligatorio; para eso lee sus archivos.
  var esPrimero = pasoKey===PASO_ORDEN[0];
  var keys = esPrimero ? archivosDePaso("paso0").concat(archivosDePaso(pasoKey)) : archivosDePaso(pasoKey);
  readMany(keys, function(raws){
    try{
      var opts = {ventana: STATE.options.ventanaDias, tol: STATE.options.tolerancia};
      ensureResults();
      if(esPrimero){
        STATE.results.paso0 = computePasoResult("paso0", raws, opts);
        if(!pasoCuadrado("paso0")){
          propagarBloqueo();
          refrescarModulo("El Paso 0 (obligatorio) no cuadró — revisá las partidas en tránsito del mes anterior antes de continuar.");
          return;
        }
      }
      var result = computePasoResult(pasoKey, raws, opts);
      Object.keys(STATE.checks).forEach(function(k){ if(k.indexOf(pasoKey+"_")===0) delete STATE.checks[k]; });
      STATE.results[pasoKey] = result;
      propagarBloqueo();
      var cuadro = Array.isArray(result) && contarRojas(result)===0;
      refrescarModulo(cuadro ? (nombreCortoPaso(pasoKey)+" cuadrado.") : "Paso ejecutado.");
      if(cuadro){
        if(PASO_ORDEN.indexOf(pasoKey)>=0 && tieneCuadreLimpio(PASO_ORDEN, STATE.results) && PASO_ORDEN.every(pasoCuadrado)) celebrarTodo();
        else celebrarPaso(pasoKey);
      }
    }catch(err){
      if(note) note.textContent = "Error: " + err.message;
    }
  });
}

function ejecutarConciliacion(){
  var note = document.getElementById("runNote");
  note.textContent = "Leyendo archivos...";
  var allKeys = ["transitoPrevio","reporte","diarioCaja","diarioBanistmo","diarioStg","estBanistmo","estStg","estBancoGeneral","diarioBancoGeneral","retVisa"]
    .filter(function(k){ return STATE.files[k]; });
  readMany(allKeys, function(raws){
    try{
      var opts = {ventana: STATE.options.ventanaDias, tol: STATE.options.tolerancia};
      ensureResults();
      // Paso 0 OBLIGATORIO: se corre primero. Si falta o no cuadra, se bloquean las conciliaciones.
      STATE.results.paso0 = computePasoResult("paso0", raws, opts);
      if(!pasoCuadrado("paso0")){
        PASO_ORDEN.forEach(function(k){ STATE.results[k] = "bloqueado"; });
        STATE.checks = {};
        refrescarModulo("Paso 0 obligatorio: subí el resumen en tránsito del mes anterior (y los estados de cuenta) para continuar.");
        return;
      }
      // Cada paso se corre solo si el anterior cuadró; en cuanto uno no cuadra, los siguientes quedan bloqueados.
      var corridos = 0, frenado = false;
      PASO_ORDEN.forEach(function(pasoKey, i){
        if(frenado){ STATE.results[pasoKey] = "bloqueado"; return; }
        var res = computePasoResult(pasoKey, raws, opts);
        STATE.results[pasoKey] = res;
        if(res===null){ frenado = true; return; } // faltan archivos → no seguir
        corridos++;
        if(!(Array.isArray(res) && contarRojas(res)===0)) frenado = true; // no cuadró → frenar los siguientes
      });
      STATE.checks = {};
      var todoCuadrado = corridos>0 && PASO_ORDEN.every(pasoCuadrado);
      refrescarModulo(todoCuadrado ? "¡Conciliación completa!" : "Conciliación ejecutada.");
      if(todoCuadrado) celebrarTodo();
    }catch(err){
      note = document.getElementById("runNote"); if(note) note.textContent = "Error: " + err.message;
    }
  });
}

/* ---------------- UI ---------------- */
var app = document.getElementById("app");

/* ================= MÓDULO 2 — Retención a empleados por pagar ================= */
// Destino (acreedor/concepto) al que corresponde una retención, a partir de un texto.
function destinoRet(txt){
  var n = normTxt(txt);
  if(n.indexOf("SON")!==-1) return "Son Import";
  // Refresquería: la razón social cambió con el tiempo pero es el mismo acreedor/servicio retenido:
  // "Refresquería", "Shopping Market", "Shopping Refresquería", "Maryan Safi", "Mayi".
  if(n.indexOf("REFRES")!==-1 || n.indexOf("MAYI")!==-1 || n.indexOf("SHOPPING")!==-1 || n.indexOf("MARYAN")!==-1) return "Refresquería";
  if(n.indexOf("FUNERAL")!==-1 || n.indexOf("CASA FUN")!==-1 || n.indexOf("FUN VIDA")!==-1) return "Casa de Funerales";
  if(n.indexOf("CAJA DE AHORRO")!==-1 || n.indexOf("BANCO")!==-1 || n.indexOf("PRESTAMO")!==-1 || n.indexOf("GEORGE")!==-1 || n.indexOf("STG")!==-1 || n.indexOf("NACIONAL")!==-1 || n.indexOf("NALPMA")!==-1) return "Banco / Préstamo";
  if(n.indexOf("COOPERATIVA")!==-1 || n.indexOf("CASESO")!==-1 || n.indexOf("AHORRO")!==-1) return "Cooperativa / Ahorro";
  return null;
}
// Separa "TEXTO monto" → {texto, monto} (monto 0 si la línea no termina en número).
function partirMontoRet(s){
  var m = String(s).match(/^(.*?)[\s:.\-]*(-?[\d]+[.,]\d{2})\s*$/);
  // El guion en el detalle es solo cómo se digitó, NO un signo negativo: el signo real lo da la columna
  // Débito/Crédito del movimiento. Las sub-líneas son siempre magnitudes → valor absoluto.
  return m ? {texto:m[1].trim(), monto:Math.abs(money(m[2]))} : {texto:String(s).trim(), monto:0};
}
// Como partirMontoRet pero el monto puede estar en el MEDIO: "AMABELIS 7.00 CASA FUN VIDA" →
// {texto:"AMABELIS", monto:7.00, hint:"CASA FUN VIDA"} (el hint es el acreedor específico de la línea).
function partirLineaRet(s){
  // El separador entre el nombre y el monto varía: espacio, ":" pegado al número ("YENIFER MUÑOZ :20.00"),
  // ": " o "-". Si solo se aceptara el espacio, esas líneas devolverían monto 0 y el detalle no cuadraría.
  var m = String(s).match(/^(.*?)[\s:]+(-?[\d]+[.,]\d{2})\b(.*)$/);
  // El guion es solo cómo se digitó, no un negativo (ej. "Aracellys -85.67" = 85.67); el signo real lo
  // da la columna Débito/Crédito del movimiento. Se toma el valor absoluto.
  return m ? {texto:m[1].trim(), monto:Math.abs(money(m[2])), hint:m[3].trim()} : {texto:String(s).trim(), monto:0, hint:""};
}
// ¿El texto es PURO concepto (sin nombre de empleado)? → es un sub-total de concepto, no un empleado.
function esSoloConceptoRet(texto){
  var n = normTxt(texto).replace(/DESCUENTO|DESC\.?|NAVIDENO|BANCOS?|AHORRO|IMPORT|\bSON\b|REFRESQUERIA|REFRESQ|REFRES|SHOPPING|MARKET|MARYAN|SAFI|MAYI|COOPERATIVA|ECASESO|CASESO|PRESTAMO|FUNERAL|CASA FUN|VIDA|NALPMA|\bDE\b|\bDEL\b|QUINCENA|PAGO|RETENCION/g,"");
  return n.replace(/[^A-Z]/g,"").length===0;
}
// Una línea es un SUB-TOTAL de concepto si EMPIEZA con una palabra de concepto, aunque después traiga un
// nombre de empleado (ej. "REFRESQUERIA MABE : 2.00"). Se distingue de una línea de empleado, que empieza
// con el NOMBRE (ej. "ARACELYS BANCO 94.13"). Así los créditos multi-concepto se parten aunque una de sus
// líneas de concepto identifique al empleado.
var CONCEPTO_LIDER_RET = /^(DESC|DESCUENTO|BANCOS?|AHORRO|\bSON\b|REFRESQUERIA|REFRESQ|REFRES|COOPERATIVA|ECASESO|CASESO|PRESTAMO|CASA|FUNERAL|NALPMA|MAYI|SHOPPING|MARYAN)\b/;
function esConceptoLiderRet(texto){
  var n = normTxt(texto);
  return CONCEPTO_LIDER_RET.test(n) && destinoRet(n)!==null;
}
// ALIAS de empleados: una misma persona registrada con nombres de pila distintos (nombre compuesto o error
// de digitación). La fusión automática por typos (mismoNombreRet, ≤4 letras) NO los une —y no debe: unir dos
// nombres de pila distintos sería riesgoso (pueden ser familiares)— así que se declaran a mano.
// Clave = nombre alterno normalizado; valor = nombre con el que se lo debe agrupar.
// Confirmado por Diba (2026-08-04): Omaira Villarreal es Esther Villarreal (nombre compuesto).
var ALIAS_EMPLEADO_RET = {
  "OMAIRA VILLARREAL": "ESTHER VILLARREAL"
};
// Destino "de cabecera" de un asiento: el concepto que aplica a las líneas de empleado que no lo indican.
// Puede venir (a) de la descripción, (b) de una línea suelta sin monto ("DESCUENTO DE BANCOS"), o
// (c) de una línea de concepto que YA trae importe y empleado ("DESC DE SON IMPORT AMABELIS: 10.00") —
// sin este último caso, las demás líneas del asiento se quedaban sin destino y el detalle no cuadraba.
function headerDestinoRet(m){
  var h=destinoRet(m.desc);
  if(!h) m.subs.forEach(function(s){ if(partirLineaRet(s).monto===0 && destinoRet(s)) h=destinoRet(s); });
  if(!h) m.subs.forEach(function(s){ var p=partirLineaRet(s); if(!h && esConceptoLiderRet(p.texto)) h=destinoRet(p.texto); });
  return h;
}
function empleadoRet(texto){
  var t = normTxt(partirLineaRet(texto).texto);
  t = t.replace(/^(DESCUENTO|DESC\.?)( DE)?\s+/,"").replace(/^(SON IMPORT|BANCOS?|AHORRO( NAVIDENO)?|REFRESQUERIA|COOPERATIVA|PRESTAMO|SON)\s+/,"");
  // Limpia puntuación de borde (ej. "ARACELYS GAITAN:" → "ARACELYS GAITAN") para no romper la fusión de
  // nombres ni el emparejamiento empleado↔pago.
  t = t.replace(/^[^A-Z0-9]+/,"").replace(/[^A-Z0-9]+$/,"").trim();
  return ALIAS_EMPLEADO_RET[t] || t;
}
// Mes (YYYY-MM) al que CORRESPONDE la retención/pago según la descripción (ej. "QUINCENA DE ENERO",
// "MES DE MAYO", "DICIEMBRE"). Usa el año que aparezca en el texto; si no, el año de la transacción,
// restando 1 si el mes nombrado es posterior al de registro (ej. "diciembre" registrado en enero = año anterior).
// Si la descripción no nombra un mes, cae en el mes de la fecha de la transacción.
var MESES_RET={ENERO:1,FEBRERO:2,MARZO:3,ABRIL:4,MAYO:5,JUNIO:6,JULIO:7,AGOSTO:8,SEPTIEMBRE:9,SETIEMBRE:9,OCTUBRE:10,NOVIEMBRE:11,DICIEMBRE:12};
function mesRetencion(m){
  var texto = normTxt(m.desc+" "+(m.subs||[]).join(" "));
  var mm = texto.match(/\b(ENERO|FEBRERO|MARZO|ABRIL|MAYO|JUNIO|JULIO|AGOSTO|SEPTIEMBRE|SETIEMBRE|OCTUBRE|NOVIEMBRE|DICIEMBRE)\b/);
  if(!mm) return m.fecha ? m.fecha.slice(0,7) : "?";
  var mesNum = MESES_RET[mm[1]];
  var anioM = texto.match(/\b(20\d{2})\b/);
  var anio;
  if(anioM) anio = parseInt(anioM[1],10);
  else if(m.fecha){ var ty=parseInt(m.fecha.slice(0,4),10), tm=parseInt(m.fecha.slice(5,7),10); anio = mesNum>tm ? ty-1 : ty; }
  else return "?";
  return anio+"-"+String(mesNum).padStart(2,"0");
}
// Distancia de edición (Levenshtein) entre dos cadenas.
function levenshtein(a,b){
  var m=a.length, n=b.length; if(!m) return n; if(!n) return m;
  var prev=[], cur=[]; for(var j=0;j<=n;j++) prev[j]=j;
  for(var i=1;i<=m;i++){ cur[0]=i; for(var j=1;j<=n;j++){ var c=a.charAt(i-1)===b.charAt(j-1)?0:1; cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+c); } for(var k=0;k<=n;k++) prev[k]=cur[k]; }
  return prev[n];
}
// Dos nombres son el MISMO empleado si difieren en ≤4 letras (typos) o son las mismas letras reordenadas.
function mismoNombreRet(a,b){
  a=normTxt(a).replace(/[^A-Z ]/g,""); b=normTxt(b).replace(/[^A-Z ]/g,"");
  if(a===b) return true; if(!a||!b) return false;
  if(levenshtein(a,b)<=4) return true;
  var sa=a.replace(/[^A-Z]/g,"").split("").sort().join(""), sb=b.replace(/[^A-Z]/g,"").split("").sort().join("");
  return sa.length>0 && sa===sb;
}
// Mapa nombre-normalizado → nombre canónico (agrupa variantes). Canónico = la variante más frecuente.
function canonicalizarNombresRet(nombres){
  var cuenta={}; nombres.forEach(function(n){ var nn=normTxt(n); if(nn) cuenta[nn]=(cuenta[nn]||0)+1; });
  var canon=[], mapa={};
  Object.keys(cuenta).sort(function(a,b){ return cuenta[b]-cuenta[a] || (a<b?-1:1); }).forEach(function(nn){
    var found=null; for(var i=0;i<canon.length;i++){ if(mismoNombreRet(nn,canon[i])){ found=canon[i]; break; } }
    if(found) mapa[nn]=found; else { canon.push(nn); mapa[nn]=nn; }
  });
  return mapa;
}
function parseRetenciones(rows){
  var saldoInicial = 0;
  for(var i=0;i<Math.min(rows.length,3);i++){ if(!rows[i]) continue;
    for(var j=0;j<rows[i].length;j++){ if(/BALANCE INICIAL/i.test(String(rows[i][j]||""))){
      for(var k=j;k<rows[i].length;k++){ var v=money(rows[i][k]); if(v){ saldoInicial=v; break; } } } } }
  var hIdx = findHeaderRow(rows, ["Fecha","Débito","Crédito"]); if(hIdx<0) hIdx=1;

          (pagos[ip].aplicado=pagos[ip].aplicado||[]).push({emp:x.emp, monto:aplica, fecha:x.fecha, mes:x.mes, ref:x.ref, saldoIni:x.saldoIni});
          r-=aplica; usado+=aplica;
          if(pagos[ip].monto-usado<=0.001){ ip++; usado=0; }
        }
        if(r>0.001){ pendientes.push({fecha:x.fecha, mes:x.mes, emp:x.emp, monto:r, saldoIni:x.saldoIni, ref:x.ref, sub:k}); porMes[x.mes||"?"]=(porMes[x.mes||"?"]||0)+r; }
      });
      // Lo que sobra de los pagos (sin deducción que los respalde) son "pagos sin descuento". Se registra
      // igual en `aplicado` —marcado como sobrante— para que el desglose cubra el 100% del pago y el libro
      // por persona no pierda importes.
      for(var i=ip;i<pagos.length;i++){
        var sobra=pagos[i].monto-(i===ip?usado:0);
        if(sobra>0.001){
          pagosSinDesc.push({fecha:pagos[i].fecha, monto:sobra, acr:pagos[i].acr, ref:pagos[i].ref});
          (pagos[i].aplicado=pagos[i].aplicado||[]).push({emp:k, monto:sobra, sobrante:true});
        }
      }
    });
    pendientes.sort(function(a,b){ return (a.mes||a.fecha||"")<(b.mes||b.fecha||"")?-1:1; });
    pagosSinDesc.sort(function(a,b){ return (a.fecha||"")<(b.fecha||"")?-1:1; });
    detalle[d]={pendientes:pendientes, pagosSinDesc:pagosSinDesc};
    aging[d]=porMes;
  });
  // ---- Comprobantes SIN detalle por empleado (hay que pedir su corrección) ----
  // Un ME- cuyo detalle no nombra a los empleados (o cuyas sub-líneas no cuadran con el monto del asiento)
  // no permite aplicar los pagos de forma individual: su monto queda atribuido a "(sin detalle)" y arrastra
  // el pendiente sin dueño. Se listan para solicitar la corrección en el sistema de origen.
  // Desglose de los comprobantes que SÍ traen detalle, agrupado por comprobante y destino. Sirve para
  // sugerir —por intuición— cómo se compone un comprobante que no lo trae: si otro mes del mismo acreedor
  // suma exactamente lo mismo, lo más probable es que se reparta igual entre las mismas personas.
  var patronPorDest={};
  Object.keys(ded).forEach(function(d){ var porRef={};
    ded[d].forEach(function(x){ if(x.saldoIni) return; if(x.emp==="(sin detalle)"||x.emp==="(sin clasificar)") return;
      var k=x.ref||("?"+x.fecha); if(!porRef[k]) porRef[k]={ref:x.ref, fecha:x.fecha, total:0, lineas:[]};
      porRef[k].total=Math.round((porRef[k].total+x.monto)*100)/100; porRef[k].lineas.push({emp:x.emp, monto:x.monto}); });
    patronPorDest[d]=Object.keys(porRef).map(function(k){ return porRef[k]; });
  });
  function sugerirDesglose(destino, monto, fecha){
    var cands=(patronPorDest[destino]||[]).filter(function(p){ return Math.abs(p.total-monto)<=0.02 && p.lineas.length>1; });
    if(!cands.length) return null;
    // el más cercano en el tiempo: la nómina cambia poco entre meses contiguos
    cands.sort(function(a,b){ return Math.abs(new Date(a.fecha)-new Date(fecha)) - Math.abs(new Date(b.fecha)-new Date(fecha)); });
    return cands[0];
  }
  var sinDetalle=[];
  Object.keys(ded).forEach(function(d){ ded[d].forEach(function(x){
    if(x.saldoIni) return;
    if(x.emp==="(sin detalle)" || x.emp==="(sin clasificar)"){
      var sug=sugerirDesglose(d, x.monto, x.fecha);
      sinDetalle.push({ref:x.ref||"(sin comprobante)", fecha:x.fecha, destino:d, monto:x.monto,
        motivo:(x.emp==="(sin clasificar)"?"el asiento no indica el acreedor":"el detalle no nombra a los empleados o no cuadra con el monto del asiento"),
        sugerencia:sug});
    }
  }); });
  sinDetalle.sort(function(a,b){ return (a.fecha||"")<(b.fecha||"")?-1:1; });
  // Aplicación de cada pago: a qué empleados se imputó (clave para los acreedores que cobran en lote).
  var aplicaciones=[];
  Object.keys(pag).forEach(function(d){ pag[d].forEach(function(x){
    if(!x.aplicado || !x.aplicado.length) return;
    aplicaciones.push({fecha:x.fecha, ref:x.ref, acr:x.acr, destino:d, monto:x.monto, lotes:x.aplicado.slice()});
  }); });
  aplicaciones.sort(function(a,b){ return (a.fecha||"")<(b.fecha||"")?-1:1; });
  // ---- Sobrepagos y pagos adelantados (por acreedor; "Banco / Préstamo" se abre por banco/empleado) ----
  // Dentro de "Banco / Préstamo" cada banco es la cuenta de un empleado (St. Georges=Yenifer, Banco Nacional=
  // Itza, Caja de Ahorros=Aracelys/Esther). La sub-cuenta se LLAVEA por el NOMBRE DEL BANCO (el campo acr del
  // pago viene siempre limpio; el nombre del empleado a veces trae mojibake "MUÃ‘OZ"). Las retenciones nombran
  // al empleado → se mapea empleado→banco desde los pagos. Se arma un libro cronológico: retención (+) vs
  // pago (−). Dos señales, separadas:
  //   • PAGO ADELANTADO (informativo): un pago deja el saldo del PERÍODO en negativo — se pagó antes de que se
  //     registrara la retención — pero al final del período la cuenta cuadra (o solo queda debiendo).
  //   • SOBREPAGO NETO REAL (alerta): incluyendo el saldo inicial del Paso 0, la cuenta TERMINA pagada de más.
  var openSub={}, subEmp={};
  function addEmp(k,e){ if(e){ (subEmp[k]=subEmp[k]||{})[e]=1; } }
  (saldoIniDet||[]).forEach(function(r){ var monto=Math.abs(parseFloat(r.monto)); if(isNaN(monto)||monto<=0.001) return;
    var concepto=String(r.concepto||"").trim(); var d=destinoRet(concepto)||"Otros";
    var k=d; if(d===BANCO){ var e=empEnTexto(concepto)||empEnConcepto(concepto); k=subDeEmp(e)||"Banco / Préstamo (sin banco)"; addEmp(k,e); }
    openSub[k]=(openSub[k]||0)+monto; });
  var subEv={};
  function evPush(k,e){ (subEv[k]=subEv[k]||[]).push(e); }
  Object.keys(ded).forEach(function(d){ ded[d].forEach(function(x){ if(x.saldoIni) return;
    var k=d; if(d===BANCO){ k=subDeEmp(x.emp)||"Banco / Préstamo (sin banco)"; addEmp(k,x.emp); }
    evPush(k,{fecha:x.fecha||"",t:"R",monto:x.monto}); }); });
  Object.keys(pag).forEach(function(d){ pag[d].forEach(function(x){ var k=d===BANCO?subDePago(x):d;
    evPush(k,{fecha:x.fecha||"",t:"P",monto:x.monto,ref:x.acr}); }); });
  // Solo interesa el SOBREPAGO NETO REAL: incluyendo el saldo inicial, la cuenta terminó pagada de más.
  // (El reporte de "pagos adelantados" se quitó: pagar antes de registrar la retención no es un hallazgo
  // accionable mientras la cuenta cuadre al final del período.)
  var sobrepagos=[];
  Object.keys(subEv).forEach(function(k){
    var sumR=0, sumP=0;
    subEv[k].forEach(function(e){ if(e.t==="R") sumR+=e.monto; else sumP+=e.monto; });
    var op=openSub[k]||0; var finalReal=Math.round((op+sumR-sumP)*100)/100;
    if(finalReal<-0.01) sobrepagos.push({acreedor:k, empleado:Object.keys(subEmp[k]||{}).join(", "), monto:Math.round(-finalReal*100)/100, opening:op});
  });
  // ---- Retenciones SALTADAS: una retención vieja quedó sin pagar mientras se pagaron períodos POSTERIORES ----
  // El neteo por saldo corrido (FIFO) las esconde porque un adelanto anterior tapa el hueco. Se matchea por el
  // PERÍODO que declara cada pago (mes + quincena, ej. "2DA DE MARZO"), y POR MONTO (un pago mensual de 126.54
  // cubre dos quincenas). Los pagos sin período se aplican FIFO pero solo a retenciones YA existentes. Solo se
  // evalúan las CUENTAS BANCARIAS INDIVIDUALES (cada retención tiene su pago dedicado); los destinos bulk
  // (Son Import, Cooperativa, Refresquería) se pagan en lote y no se pueden atribuir por período/empleado.
  function mesEnDesc(txt){ var n=normTxt(txt); for(var mk in MESES_RET){ if(n.indexOf(mk)!==-1) return MESES_RET[mk]; } return null; }
  function quincenaEnDesc(txt){ var n=normTxt(txt); if(/\b(SEGUNDA|2DA|2 DA|2A)\b/.test(n)) return 2; if(/\b(PRIMERA|1RA|1 RA|1A)\b/.test(n)) return 1; return null; }
  function periodoRet(m){ var iso=mesRetencion(m); var q=quincenaEnDesc(m.desc); if(!q){ var d=parseInt((m.fecha||"").slice(8,10),10); q=(d&&d<=15)?1:2; } return iso+"-Q"+q; }
  function periodoPago(m){ if(mesEnDesc(m.desc)==null) return null; var iso=mesRetencion(m); var q=quincenaEnDesc(m.desc); return iso+"-Q"+(q||"M"); }
  var retB={}, pagB={};
  movs.forEach(function(m){
    if(m.deb>0){ if(destinoRet(m.acr||m.desc)!==BANCO) return; var kp=bancoDe(m.acr);
      (pagB[kp]=pagB[kp]||[]).push({fecha:m.fecha||"", monto:m.deb, ref:m.ref, per:periodoPago(m)}); return; }
    if(m.cred<=0) return;
    var hdr=headerDestinoRet(m);
    m.subs.forEach(function(s){ var p=partirLineaRet(s); if(p.monto<=0) return; if(destinoRet(p.texto)&&esConceptoLiderRet(p.texto)) return;
      var emp=empleadoRet(s); var dl=destinoRet(p.hint)||mapa[emp+"|"+p.monto.toFixed(2)]||destinoRet(p.texto)||hdr; if(dl!==BANCO) return;
      var kr=subDeEmp(nc(emp))||"Banco / Préstamo (sin banco)";
      (retB[kr]=retB[kr]||[]).push({fecha:m.fecha||"", monto:p.monto, ref:m.ref, per:periodoRet(m), emp:emp?nc(emp):""}); });
  });
  var saltadas=[];
  Object.keys(retB).forEach(function(k){
    var rets=retB[k].slice().sort(function(a,b){return (a.fecha||"")<(b.fecha||"")?-1:1;});
    var pagos=(pagB[k]||[]).slice().sort(function(a,b){return (a.fecha||"")<(b.fecha||"")?-1:1;});
    var pers={}, orden=[];
    rets.forEach(function(r){ if(!pers[r.per]){ pers[r.per]={per:r.per,pend:0,fecha:r.fecha,lines:[]}; orden.push(r.per); } var P=pers[r.per]; P.pend+=r.monto; P.lines.push(r); if((r.fecha||"")<(P.fecha||"")) P.fecha=r.fecha; });
    orden.sort();
    function aplicar(monto, filtro){ for(var i=0;i<orden.length && monto>0.001;i++){ var P=pers[orden[i]]; if(P.pend<=0.001) continue; if(filtro && !filtro(P)) continue; var u=Math.min(monto,P.pend); P.pend-=u; monto-=u; } return monto; }
    pagos.forEach(function(p){ if(!p.per) return; var q=p.per.slice(-1), mes=p.per.slice(0,7);
      // Regla de Diba: si el período declarado AÚN NO EXISTE a la fecha del pago (ninguna retención de ese
      // período registrada hasta esa fecha), la etiqueta está mal puesta (ej. "SEGUNDA DE JULIO" pagada el
      // 03-jul cuando la retención de jul-Q2 se registró el 27-jul) → se ignora y el pago se aplica FIFO.
      var existe=orden.some(function(per){ return (q==="M"? per.slice(0,7)===mes : per===p.per) && (pers[per].fecha||"")<=(p.fecha||""); });
      if(!existe){ p.per=null; return; }
      p.rem=aplicar(p.monto, function(P){ return q==="M"? P.per.slice(0,7)===mes : P.per===p.per; }); });
    pagos.forEach(function(p){ var mm=p.per?(p.rem||0):p.monto; if(mm<=0.001) return; aplicar(mm, function(P){ return (P.fecha||"")<=(p.fecha||""); }); });
    var pagadosPers=orden.filter(function(per){ return pers[per].pend<=0.01; });
    orden.filter(function(per){ return pers[per].pend>0.01; }).forEach(function(per){
      if(pagadosPers.some(function(pp){ return pp>per; })){ var P=pers[per]; saltadas.push({acreedor:k, empleado:P.lines.map(function(l){return l.emp;}).filter(Boolean).join(", "), fecha:P.fecha, periodo:per, monto:Math.round(P.pend*100)/100, ref:P.lines[0]?P.lines[0].ref:""}); }
    });
  });
  return { porDestino:porDestino, detalle:detalle, aging:aging, totalDesc:totalDesc, totalPago:totalPago, totalSaldoIni:totalSaldoIni, sinClasificar:sinClasificar, sobrepagos:sobrepagos, saltadas:saltadas,
    // Movimientos ya clasificados por destino — el libro mayor los reusa para que sus cifras coincidan
    // exactamente con el resumen (ded incluye los fallbacks del clasificador; empBanco mapea banco↔empleado).
    ded:ded, pag:pag, empBanco:empBanco, sinDetalle:sinDetalle, aplicaciones:aplicaciones };
}

// Sube el navegador de retenciones: guarda el archivo, lee el saldo inicial (para el Paso 0) y re-renderiza.
function subirRetenciones(file){
  STATE.files.retenciones=file; STATE.mod2.saldoIni=null; STATE.mod2.verIgual=false; renderModulo2();
  readWorkbook(file, function(rows){ try{ STATE.mod2.saldoIni=parseRetenciones(rows).saldoInicial; }catch(e){} renderModulo2(); });
}
function ejecutarModulo2(){
  var note=document.getElementById("runNote2"); if(note) note.textContent="Leyendo archivo...";
  readWorkbook(STATE.files.retenciones, function(rows){
    try{
      var parsed=parseRetenciones(rows);
      var net=netearRetenciones(parsed.movs, saldoIniDetMod2());
      STATE.mod2.result={ parsed:parsed, net:net };
      STATE.mod2.verIgual=false; // archivo nuevo → el bloqueo vuelve a aplicar
      renderModulo2();
    }catch(err){ if(note) note.textContent="Error: "+err.message; }
  });
}
function mesNombre(k){ if(!k||k==="?") return "sin fecha"; var m=["","ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"]; var p=k.split("-"); return (m[parseInt(p[1],10)]||p[1])+" "+p[0]; }
// Mes siguiente a "YYYY-MM" (la retención de un mes se paga el mes siguiente).
function mesSiguiente(k){ if(!k||k==="?") return k; var p=k.split("-"); var y=parseInt(p[0],10), m=parseInt(p[1],10)+1; if(m>12){m=1;y++;} return y+"-"+String(m).padStart(2,"0"); }
/* -------- Paso 0 de Retenciones: detalle del saldo inicial / deuda anterior (manual o Excel) -------- */

  return STATE.mod2.saldoIni!=null ? STATE.mod2.saldoIni : null;

/* -------- Libro mayor por persona / acreedor -------- */
// Arma el libro cronológico de un empleado o acreedor: retención en POSITIVO (aumenta la deuda), pago en
// NEGATIVO (la cancela), con saldo corrido. Reusa la misma clasificación del neteo para que las cifras
// coincidan con el resto del módulo. El filtro `q` matchea el empleado de la sub-línea (retenciones) o el
// acreedor/descripción (pagos); así "itza" trae sus retenciones y los pagos del banco que la nombran.
function libroMayorRet(net, q, dest){
  var nq=normTxt(q); if(!nq) return null;
  function coincide(txt){ return normTxt(txt).indexOf(nq)!==-1; }
  var BANCO="Banco / Préstamo";
  // ¿Lo buscado es un empleado que aparece en las retenciones? Se ignoran las líneas del saldo inicial: su
  // "empleado" es el concepto del Paso 0 (ej. "Son Import"), que haría pasar un acreedor por empleado.
  var buscaEmpleado=false;
  Object.keys(net.ded).forEach(function(d){ net.ded[d].forEach(function(x){ if(!x.saldoIni && x.emp && coincide(x.emp)) buscaEmpleado=true; }); });
  // Si es un ACREEDOR: a qué destino pertenece y —para un banco puntual— qué empleados paga. Se filtra por ese
  // destino para que el libro de un banco no arrastre la cooperativa ni Son Import del mismo empleado.
  var destAcr=null, empsDelAcr={};
  Object.keys(net.pag).forEach(function(d){ net.pag[d].forEach(function(x){
    if(!coincide((x.acr||"")+" "+(x.desc||""))) return;
    destAcr=destAcr||d;
    Object.keys(net.empBanco||{}).forEach(function(e){ if(coincide(net.empBanco[e])) empsDelAcr[e]=1; }); }); });
  // Un acreedor de pago EN LOTE (Son Import, Cooperativa, Refresquería) no nombra empleados en sus pagos:
  // ahí el libro son todas las retenciones de SU destino.
  var acrEnLote = !buscaEmpleado && destAcr && destAcr!==BANCO;
  var filas=[], suj={};
  Object.keys(net.ded).forEach(function(d){ net.ded[d].forEach(function(x){
    // El saldo inicial del Paso 0 se incluye como fila de APERTURA: es deuda que la cuenta ya traía, y el
    // detalle de pendientes también lo netea. Si se omitiera, el saldo del libro no coincidiría con el detalle.
    var ok = !!(x.emp && coincide(x.emp)) || !!(x.sub && coincide(x.sub));
    if(!ok && !buscaEmpleado && destAcr) ok = acrEnLote ? (d===destAcr) : (d===destAcr && !!empsDelAcr[x.emp]);
    if(!ok) return;
    filas.push({fecha:x.fecha||"", tipo:(x.saldoIni?"Saldo inicial":"Retención"), concepto:x.emp||"(sin detalle)", destino:d, ref:x.ref||"", mes:x.mes, monto:x.monto, saldoIni:x.saldoIni});
    if(x.emp) suj[x.emp]=1; }); });
  Object.keys(net.pag).forEach(function(d){ net.pag[d].forEach(function(x){
    // Se usa la MISMA atribución que el neteo (x.sub): el nombre en la desc del pago trae typos ("ARALYS"
    // por ARACELYS) que un match textual dejaría afuera, y entonces el saldo del libro no coincidiría con el
    // detalle de pendientes. En un acreedor de pago en lote se toman todos los pagos de su destino, porque la
    // razón social cambia entre pagos (Refresquería / Shopping Market / Maryan Safi).
    var ok = coincide((x.acr||"")+" "+(x.desc||"")) || !!(x.sub && coincide(x.sub)) || (acrEnLote && d===destAcr);
    if(!ok) return;
    filas.push({fecha:x.fecha||"", tipo:"Pago", concepto:x.acr||x.desc||"", destino:d, ref:x.ref||"", monto:-x.monto});
    if(x.acr) suj[normTxt(x.acr)]=1; }); });
  if(!filas.length) return null;
  // Destinos presentes ANTES de filtrar (para poblar el selector); luego se aplica el filtro y el saldo
  // corrido se recalcula solo sobre las filas visibles, así el libro de un destino cuadra por sí mismo.
  var dests={}; filas.forEach(function(f){ dests[f.destino]=1; });
  var destinos=Object.keys(dests).sort();
  if(dest && dests[dest]) filas=filas.filter(function(f){ return f.destino===dest; });
  else dest=null;
  if(!filas.length) return null;
  filas.sort(function(a,b){ if((a.fecha||"")!==(b.fecha||"")) return (a.fecha||"")<(b.fecha||"")?-1:1; return b.monto-a.monto; }); // retención antes que pago el mismo día
  var saldo=0, totRet=0, totPago=0;
  filas.forEach(function(f){ saldo=Math.round((saldo+f.monto)*100)/100; f.saldo=saldo; if(f.monto>0) totRet+=f.monto; else totPago+=-f.monto; });
  return { filas:filas, totalRet:Math.round(totRet*100)/100, totalPago:Math.round(totPago*100)/100, saldo:saldo, sujetos:Object.keys(suj), destinos:destinos, destino:dest };
}
// Nombres de empleados y acreedores presentes, para las sugerencias del buscador. Los nombres de empleado se
// canonicalizan (el archivo trae variantes con typos: "ARACELLY"/"ARACELYS"/"AEACELLY GAITAN").
function sujetosRet(movs){
  var nombres=[], acr={};
  movs.forEach(function(m){
    if(m.deb>0){ var a=String(m.acr||"").trim(); if(a) acr[a]=1; return; }
    if(m.cred<=0) return;
    m.subs.forEach(function(s){ var p=partirLineaRet(s); if(p.monto<=0) return; if(destinoRet(p.texto)&&esConceptoLiderRet(p.texto)) return;
      var e=empleadoRet(s); if(e) nombres.push(e); });
  });
  var canon=canonicalizarNombresRet(nombres), emp={};
  nombres.forEach(function(n){ emp[canon[normTxt(n)]||normTxt(n)]=1; });
  return { empleados:Object.keys(emp).sort(), acreedores:Object.keys(acr).sort() };
}

function renderResultadosMod2(){
  var area=document.getElementById("resultsArea2"); if(!area) return;
  var R=STATE.mod2.result;
  // Se recalcula el neteo en cada render con el detalle del Paso 0 vigente, para que al editar/subir el
  // saldo inicial las obligaciones de apertura se emparejen con los pagos sin volver a pulsar "Analizar".
  var net=netearRetenciones(R.parsed.movs, saldoIniDetMod2()); R.net=net;
  var pd=net.porDestino;
  var pendPeriodo=net.totalDesc-net.totalPago;
  var saldoIni=R.parsed.saldoInicial;
  var deudaArchivo = saldoIni<0 ? -saldoIni : 0; // saldo acreedor (deuda) de antes del período, según el archivo
  var totalSaldoIni = net.totalSaldoIni||0;      // saldo inicial ya desglosado en el Paso 0 (y neteado)
  var deudaVieja = Math.max(0, Math.round((deudaArchivo-totalSaldoIni)*100)/100); // remanente aún SIN desglosar
  var pendTotal = pendPeriodo + totalSaldoIni + deudaVieja;
  // Mes más reciente presente en el aging (lo pendiente de ESE mes es normal → se paga el mes siguiente;
  // lo de meses anteriores es un saldo VIEJO por revisar).
  var meses=[]; Object.keys(net.aging).forEach(function(d){ Object.keys(net.aging[d]).forEach(function(k){ if(k!=="?") meses.push(k); }); });
  var mesActual = meses.length? meses.sort().slice(-1)[0] : null;
  // BLOQUEO: mientras haya comprobantes sin detalle por empleado, no se muestran los resultados. Cualquier
  // cifra por persona saldría incompleta y los pagos no se pueden imputar, así que mostrarlas induciría a
  // error de interpretación. Queda una salida explícita ("Ver de todos modos") para poder inspeccionar sin
  // dar el reporte por bueno; se reinicia al volver a analizar, para que nunca quede desbloqueado por inercia.
  // El cuadre contra los totales del archivo se verifica ANTES que nada: si la lectura perdió movimientos,
  // ninguna otra cifra sirve. Bloquea igual que los comprobantes sin detalle.
  var cuadre=cuadreRetenciones(R.parsed, net);
  var bloqueado = (!cuadre.ok || (net.sinDetalle||[]).length>0) && !STATE.mod2.verIgual;
  var html='<div class="results-head"><h2>Retenciones pendientes por pagar</h2>' +
    (bloqueado?'':'<button class="btn-export" id="exportBtn2">Descargar Excel</button>')+'</div>';
  html+=cuadreHtml(cuadre);
  html+=sinDetalleHtml(net); // condiciona la lectura de todo lo demás
  if(bloqueado){
    var motivos=[];
    if(!cuadre.ok) motivos.push("la lectura del archivo no cuadra con los totales que él mismo declara");
    if((net.sinDetalle||[]).length) motivos.push("hay comprobantes sin desglose por empleado");
    html+='<div class="bloq-panel">' +
      '<div class="bloq-txt"><b>Los resultados están bloqueados</b> porque '+motivos.join(" y ")+'. Corregí lo señalado arriba, volvé a exportar el navegador y subilo de nuevo.</div>' +
      '<button class="bloq-btn" id="verIgualBtn">Ver de todos modos (cifras no confiables)</button>' +
    '</div>';
    area.innerHTML=html;
    bindSinDetalle(net);
    var vb=document.getElementById("verIgualBtn");
    if(vb) vb.onclick=function(){ STATE.mod2.verIgual=true; renderResultadosMod2(); };
    return;
  }
  if(STATE.mod2.verIgual && (!cuadre.ok || (net.sinDetalle||[]).length)){
    var av=[];
    if(!cuadre.ok) av.push("<b>la lectura no cuadra con el archivo</b>");
    if((net.sinDetalle||[]).length) av.push(net.sinDetalle.length+" comprobante(s) sin detalle");
    html+='<div class="bloq-aviso">⚠ Estás viendo el reporte con '+av.join(" y ")+': las cifras no son confiables. <button class="bloq-relink" id="volverBloq">Volver a bloquear</button></div>';
  }
  html+='<div class="summary-bar">' +
    '<span class="chip">Descontado: B/ '+fmt(net.totalDesc)+'</span>' +
    (totalSaldoIni>0.01 ? '<span class="chip">Saldo inicial: B/ '+fmt(totalSaldoIni)+'</span>' : '') +
    '<span class="chip">Pagado: B/ '+fmt(net.totalPago)+'</span>' +
    '<span class="chip">Pendiente del período: B/ '+fmt(pendPeriodo)+'</span>' +
    (deudaVieja>0.01 ? '<span class="chip warn">+ saldo anterior sin desglosar: B/ '+fmt(deudaVieja)+'</span>' : '') +
    '<span class="chip alert">Pendiente total: B/ '+fmt(pendTotal)+'</span></div>';
  html+=sobrepagosHtml(net);
  html+=libroMayorHtml(R.parsed.movs, net);
  html+='<div class="step-block"><div class="step-body">';
  html+='<table class="ret-tabla"><thead><tr><th>Empleado / acreedor</th><th>Fecha</th><th>Descontado</th><th>Pagado</th><th>Pendiente</th></tr></thead><tbody>';
  // Orden: de más ANTIGUO a más reciente (por el mes más viejo con pendiente); los sin pendiente al final.
  function mesViejo(d){ var ag=net.aging[d]||{}; var ks=Object.keys(ag).filter(function(k){return k!=="?";}).sort(); return ks.length? ks[0] : "9999"; }
  var destinos=Object.keys(pd).sort(function(a,b){ var ma=mesViejo(a), mb=mesViejo(b); if(ma!==mb) return ma<mb?-1:1; return a<b?-1:1; });
  destinos.forEach(function(d){ var x=pd[d]; var si=x.saldoIni||0; var p=x.desc+si-x.pago;
    html+='<tr class="ret-dest"><td>'+esc(d)+'</td><td></td><td>B/ '+fmt(x.desc)+(si>0.01?' <span class="ret-siLabel">+ ini '+fmt(si)+'</span>':'')+'</td><td>B/ '+fmt(x.pago)+'</td>' +
      '<td class="'+(p>0.01?'pend-pos':(p<-0.01?'pend-neg':''))+'"><b>B/ '+fmt(p)+'</b></td></tr>';
    if(si>0.01) html+='<tr class="ret-aging"><td colspan="5">↳ incluye saldo inicial (deuda anterior) B/ '+fmt(si)+' — los pagos lo cubren primero (FIFO); lo que quede aparece abajo como pendiente «Saldo inicial».</td></tr>';
    // Aging: en qué mes se generó lo pendiente (marca lo viejo).
    var ag=net.aging[d]||{}; var keys=Object.keys(ag).sort();
    if(keys.length){
      // Una retención se paga el mes SIGUIENTE al de su generación; solo es "vieja" (atrasada) si su mes
      // de pago (M+1) ya quedó atrás respecto al mes más reciente. Así el mes en curso y el anterior
      // (dentro de su ventana normal de pago) NO se marcan como atrasados.
      var partes=keys.map(function(k){ var viejo=mesActual && k!=="?" && mesSiguiente(k)<mesActual;
        return '<span class="'+(viejo?'ret-viejo':'ret-reciente')+'">'+mesNombre(k)+': B/ '+fmt(ag[k])+(viejo?' ⚠ viejo':'')+'</span>'; });
      html+='<tr class="ret-aging"><td colspan="5">Pendiente generado en → '+partes.join(' &nbsp;·&nbsp; ')+'</td></tr>';
    }
    // Detalle a nivel de MOVIMIENTO: solo descuentos NO pagados (pendientes) y pagos SIN descuento, con fecha.
    var det=net.detalle[d]||{pendientes:[],pagosSinDesc:[]};
    var filas=[];
    det.pendientes.forEach(function(r){ filas.push({fecha:r.fecha, nombre:(r.saldoIni?"⌛ Saldo inicial — "+String(r.emp||""):r.emp), desc:r.monto, pago:null, pend:r.monto, saldoIni:r.saldoIni}); });
    det.pagosSinDesc.forEach(function(r){ filas.push({fecha:r.fecha, nombre:"⚠ pago sin descuento — "+String(r.acr||"").slice(0,42), desc:null, pago:r.monto, pend:-r.monto}); });
    filas.sort(function(a,b){ return (a.fecha||"")<(b.fecha||"")?-1:1; });
    filas.forEach(function(f){
      html+='<tr class="ret-emp'+(f.pago!=null?' ret-pagosd':'')+'"><td>'+esc(f.nombre)+'</td><td>'+esc(f.fecha||"")+'</td>' +
        '<td>'+(f.desc!=null?"B/ "+fmt(f.desc):"—")+'</td>' +
        '<td>'+(f.pago!=null?"B/ "+fmt(f.pago):"—")+'</td>' +
        '<td class="'+(f.pend>0.01?'pend-pos':(f.pend<-0.01?'pend-neg':''))+'">B/ '+fmt(f.pend)+'</td></tr>';
    });
    // Destinos que se pagan EN LOTE (un pago cubre a varios empleados): si hay confusión (pagos sin
    // descuento), el sistema no puede atribuirlo por quincena/empleado — se pide el desglose al contador.
    if(d!=="Banco / Préstamo" && det.pagosSinDesc.length){
      html+='<tr class="ret-aging"><td colspan="5">✉ Este acreedor se paga en lote y hay pagos que no calzan con las retenciones — <b>pedí al contador el desglose del lote pagado</b> para atribuirlos.</td></tr>';
    }
  });
  html+='</tbody></table>';
  if(deudaVieja>0.01){
    html+='<div class="ret-saldoini">⚠ <b>Saldo anterior sin desglosar: B/ '+fmt(deudaVieja)+'</b> (saldo inicial del archivo '+fmt(saldoIni)+'; ya desglosado en el Paso 0: B/ '+fmt(totalSaldoIni)+'). Esta parte todavía no tiene detalle en el Paso 0, así que no se pudo emparejar con pagos — completá el Paso 0 para que se netee como los demás.</div>';
  }
  html+='<p class="ret-nota">El detalle muestra SOLO lo pendiente: cada descuento que aún no se pagó (con su fecha y empleado) y los pagos que se hicieron sin descuento (⚠). Los descuentos ya pagados se dejan por fuera. Como la retención de un mes se paga el mes SIGUIENTE, lo pendiente del mes en curso y del mes anterior (dentro de su ventana normal de pago) NO se marca como atrasado; solo lleva ⚠ viejo lo que ya debió pagarse (su mes de pago quedó atrás). Los nombres se normalizan (typos/variantes).</p>' +
    '</div></div>';
  html+=pieReporteHtml(R.parsed, "Retenciones a empleados por pagar");
  area.innerHTML=html;
  var eb=document.getElementById("exportBtn2"); if(eb) eb.onclick=exportarRetenciones;
  var vlb=document.getElementById("volverBloq"); if(vlb) vlb.onclick=function(){ STATE.mod2.verIgual=false; renderResultadosMod2(); };
  bindLibroMayor(R.parsed.movs);
  bindSinDetalle(net);
}
function exportarRetenciones(){
  var R=STATE.mod2.result, net=R.net, pd=net.porDestino;
  var rows=[["Destino","Empleado / acreedor","Fecha","Descontado","Pagado","Pendiente"]];
  Object.keys(pd).sort().forEach(function(d){ var x=pd[d]; var si=x.saldoIni||0;
    rows.push([d,(si>0.01?"(incluye saldo inicial "+si.toFixed(2)+")":""),"",(x.desc+si).toFixed(2),x.pago.toFixed(2),(x.desc+si-x.pago).toFixed(2)]);
    var det=net.detalle[d]||{pendientes:[],pagosSinDesc:[]};
    var filas=[];
    det.pendientes.forEach(function(r){ filas.push([r.fecha,(r.saldoIni?"Saldo inicial - "+(r.emp||""):r.emp),r.monto.toFixed(2),"",r.monto.toFixed(2)]); });
    det.pagosSinDesc.forEach(function(r){ filas.push([r.fecha,"pago sin descuento - "+(r.acr||""),"",r.monto.toFixed(2),(-r.monto).toFixed(2)]); });
    filas.sort(function(a,b){ return (a[0]||"")<(b[0]||"")?-1:1; });
    filas.forEach(function(f){ rows.push([d,f[1],f[0],f[2],f[3],f[4]]); });
  });
  var totalSaldoIni=net.totalSaldoIni||0;
  var deudaArchivo = R.parsed.saldoInicial<0 ? -R.parsed.saldoInicial : 0;
  var deudaVieja = Math.max(0, Math.round((deudaArchivo-totalSaldoIni)*100)/100);
  if(deudaVieja>0.01) rows.push(["Saldo anterior sin desglosar","","","","", deudaVieja.toFixed(2)]);
  rows.push(["TOTAL PENDIENTE","","","","",(net.totalDesc-net.totalPago+totalSaldoIni+deudaVieja).toFixed(2)]);
  var ws=XLSX.utils.aoa_to_sheet(rows); ws['!cols']=[{wch:22},{wch:26},{wch:12},{wch:12},{wch:12},{wch:12}];
  var wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"Retenciones pendientes");
  // Hoja 2: saltadas, sobrepagos y pagos adelantados (diagnóstico por acreedor)
  if((net.saltadas&&net.saltadas.length)||(net.sobrepagos&&net.sobrepagos.length)){
    var sr=[["Tipo","Acreedor","Empleado","Fecha / Período","Pago","Monto"]];
    (net.saltadas||[]).forEach(function(s){ sr.push(["RETENCION SALTADA",s.acreedor,s.empleado||"",quincenaLabel(s.periodo)+(s.ref?" ("+s.ref+")":""),"",s.monto.toFixed(2)]); });
    (net.sobrepagos||[]).forEach(function(s){ sr.push(["SOBREPAGO NETO",s.acreedor,s.empleado||"","","",s.monto.toFixed(2)]); });
    var ws2=XLSX.utils.aoa_to_sheet(sr); ws2['!cols']=[{wch:18},{wch:24},{wch:22},{wch:30},{wch:12},{wch:14}];
    XLSX.utils.book_append_sheet(wb,ws2,"Hallazgos de pago");
  }
  XLSX.writeFile(wb,"retenciones_pendientes_por_pagar.xlsx");
}

  document.getElementById("backBtn").onclick = function(){ STATE.view="menu"; render(); };
  document.getElementById("printBtn1").onclick = function(){ window.print(); };
  function assignFile(key, file){
    if(!file) return;
    STATE.files[key] = file;
    renderModulo1();
    if(STATE.results) renderResultados();
  }
  document.querySelectorAll('input[type=file]').forEach(function(inp){
    inp.addEventListener("change", function(e){
      assignFile(e.target.getAttribute("data-key"), e.target.files[0]);
    });
  });
  document.querySelectorAll('.dz').forEach(function(dz){
    var key = dz.getAttribute("data-key");
    dz.addEventListener("dragover", function(e){ e.preventDefault(); dz.classList.add("dragover"); });
    dz.addEventListener("dragleave", function(e){ dz.classList.remove("dragover"); });
    dz.addEventListener("drop", function(e){
      e.preventDefault();
      dz.classList.remove("dragover");
      assignFile(key, e.dataTransfer.files[0]);
    });
  });
  document.querySelectorAll('.btn-step-run').forEach(function(btn){
    btn.onclick = function(){ ejecutarPaso(btn.getAttribute("data-paso")); };
  });
  var ventInp = document.getElementById("ventana");
  var tolInp = document.getElementById("tolerancia");
  ventInp.addEventListener("change", function(){ STATE.options.ventanaDias = parseFloat(ventInp.value)||0; });
  tolInp.addEventListener("change", function(){ STATE.options.tolerancia = parseFloat(tolInp.value)||0.01; });

  var runBtn = document.getElementById("runBtn");
  var algunoListo = ["paso0"].concat(PASO_ORDEN).some(function(k){ return pasoListo(k); });
  if(algunoListo){
    document.getElementById("runNote").textContent = "Ejecuta los pasos con archivos completos; los demás se omiten.";
  } else {
    runBtn.disabled = true;
  }
  runBtn.onclick = ejecutarConciliacion;

  if(STATE.results) renderResultados();
}

function saldoCtxHtml(s, pasoKey){
  function bal(v){ return (v<0?"-":"")+"B/ "+fmt(Math.abs(v)); }
  var partes = [];
  if(s.inicial!==null) partes.push('saldo inicial'+(s.fechaInicial?" ("+s.fechaInicial+")":"")+': <b>'+bal(s.inicial)+'</b>');
  if(s.movimiento!==null) partes.push('movimiento del mes: <b>'+bal(s.movimiento)+'</b>');
  if(s.final!==null) partes.push('saldo final'+(s.fechaFinal?" ("+s.fechaFinal+")":"")+': <b>'+bal(s.final)+'</b>');
  var sub = pasoKey==="paso2"
    ? 'El saldo inicial es lo que quedó en tránsito del mes anterior y debía compensar este mes: validá que las entradas de los primeros días del banco lo cubren. Y lo del último día del mes queda en tránsito para el mes siguiente (ver "En tránsito").'
    : 'Ese saldo es dinero en tránsito arrastrado del mes anterior. Algunas partidas sin emparejar de este mes pueden corresponder a operaciones anteriores que compensan ahora — revísalas contra el saldo antes de darlas por diferencia.';
  return '<div class="saldo-ctx"><span class="ico">🔄</span><div class="txt">' +
    '<div class="saldo-line">Caja General — ' + partes.join(' · ') + '</div>' +
    '<div class="saldo-sub">' + sub + '</div>' +
    '</div></div>';
}

function renderResultados(){
  var area = document.getElementById("resultsArea");
  var r = STATE.results;
  var pasosMeta = [];
  // Paso 0 es obligatorio: siempre se muestra.
  pasosMeta.push({key:"paso0", corto:"Paso 0", titulo:"Paso 0 — Partidas en tránsito del mes anterior → bancos de este mes (obligatorio)"});
  pasosMeta.push(
    {key:"paso1", corto:"Paso 1", titulo:"Paso 1 — Reporte de cajeras vs. Diario Caja General"},
    {key:"paso2", corto:"Paso 2", titulo:"Paso 2 — Reporte / Caja General vs. Estados de cuenta bancarios"},
    {key:"paso3", corto:"Paso 3", titulo:"Paso 3 — Diario bancario vs. Estado de cuenta + validación VISA"}
  );
  var keysRender = pasosMeta.map(function(p){return p.key;});
  var totalRojas = keysRender.reduce(function(sum,k){ return sum + contarRojas(r[k]); }, 0);
  var totalSinConf = keysRender.reduce(function(sum,k){ return sum + contarSinConfirmar(r[k]); }, 0);

  function findingHtml(p, item, idx){
    var ckKey = p.key+"_"+idx;
    var checked = STATE.checks[ckKey] ? "checked" : "";
    var montoTxt = (item.monto<0?"-":"")+"B/ "+fmt(Math.abs(item.monto));
    return '<div class="finding'+(STATE.checks[ckKey]?" done":"")+'">' +
      '<input type="checkbox" data-ck="'+ckKey+'" '+checked+'>' +
      '<div class="ftxt">'+item.texto+'<span class="src">'+item.fuente+'</span></div>' +
      '<div class="famt">'+montoTxt+'</div></div>';
  }
  // Fila de subtotal (alineada con la columna de montos, con espaciador de la casilla).
  function filaTotal(label, monto){
    return '<div class="finding transito-total" style="border-top:2px solid var(--line)"><span style="width:18px;flex-shrink:0"></span>' +
      '<div class="ftxt"><b>'+label+'</b></div><div class="famt"><b>B/ '+fmt(monto)+'</b></div></div>';
  }
  // Una partida "en tránsito" es ENTRANTE si es una compensación del mes anterior (aparece el primer día);
  // el resto SALE al próximo mes (fin de mes o cheque pendiente por cambiar).
  function esTransitoEntrante(item){ return /mes anterior/i.test(item.motivo||""); }

  var html = '<div class="results-head"><h2>Hallazgos</h2>' +
    '<button class="btn-export" id="exportBtn">Descargar checklist (Excel)</button></div>';
  var totalTransito = keysRender.reduce(function(sum,k){ return sum + contarEnTransito(r[k]); }, 0);

  var todoCuadrado = tieneCuadreLimpio(PASO_ORDEN, r) && PASO_ORDEN.every(pasoCuadrado);
  // Barra resumen (chips) — siempre visible.
  html += '<div class="summary-bar">' +
    '<span class="chip'+(totalRojas===0?" ok":" alert")+'">'+totalRojas+' diferencia(s) en total</span>' +
    (totalSinConf>0 ? '<span class="chip warn">'+totalSinConf+' sin confirmar banco</span>' : '') +
    (totalTransito>0 ? '<span class="chip warn">'+totalTransito+' en tránsito</span>' : '');
  pasosMeta.forEach(function(p){
    var items = r[p.key];
    var chipTxt = items===undefined ? "—" : items===null ? "omitido" : String(contarRojas(items));
    html += '<span class="chip">'+p.corto+': '+chipTxt+'</span>';
  });
  html += '</div>';

  // Cuando la CAJA (Paso 1 y 2) cuadra, se muestra el cierre CONSOLIDADO de Caja General arriba, y abajo
  // SOLO los pasos que todavía tengan diferencias (no se repiten los cuadrados). Si la caja aún no cuadra,
  // se muestra el detalle por paso + el panel de partidas en tránsito.
  // Paso 0 de Caja General: detalle del saldo inicial (visible siempre que haya un saldo de Caja General).
  if(STATE.saldoCajaGeneral && STATE.saldoCajaGeneral.inicial!=null){ html += saldoIniDetalleHtml(); }
  var cajaLista = pasoCuadrado("paso1") && pasoCuadrado("paso2");
  if(cajaLista){
    html += cierreCajaHtml();
  }
  var tt = totalesEnTransitoPorBanco();
  if(!cajaLista && tt.count > 0){
    var bancosTxt = Object.keys(tt.porBanco).sort().map(function(b){
      var x = tt.porBanco[b];
      var detalle = x.otros>0.005 ? " (cheques B/ "+fmt(x.cheques)+" + otros B/ "+fmt(x.otros)+")" : "";
      return b + ": B/ " + fmt(x.total) + detalle;
    }).join("<br>");
    html += '<div class="cierre-panel"><div class="cierre-txt">' +
      '<div class="cierre-title">📋 Partidas en tránsito</div>' +
      '<div class="cierre-sub"><strong>Total en tránsito para el próximo mes: B/ '+fmt(tt.total)+'</strong> ('+tt.count+' partida(s))' +
      '<br>Cheques: B/ '+fmt(tt.cheques)+' · Otros depósitos (tarjeta/fin de mes): B/ '+fmt(tt.otros) +
      (bancosTxt ? '<br>'+bancosTxt : '') +
      '<br>Aún quedan diferencias por resolver; el resumen ya está listo (sale del Paso 0 y del Paso 2).</div>' +
      '</div><button class="btn-run" id="btnTransito">Descargar resumen en tránsito</button></div>';
  }

  pasosMeta.forEach(function(p){
    var items = r[p.key];
    // Si la caja ya está cuadrada (cierre consolidado arriba), no repetimos los pasos que cuadran; solo
    // se muestran abajo los que todavía tengan diferencias rojas (ej. Paso 3 con partidas de banco).
    if(cajaLista && Array.isArray(items) && contarRojas(items)===0) return;
    var esArray = Array.isArray(items);
    var bloqueado = items==="bloqueado";
    var cuadrado = esArray && contarRojas(items)===0;
    var rojas = esArray ? items.filter(function(i){return !esNoRojo(i);}) : [];
    var sinConf = esArray ? items.filter(esSinConfirmar) : [];
    var enTransito = esArray ? items.filter(esEnTransito) : [];
    var efectivo = esArray ? items.filter(esEfectivo) : [];
    var countTxt = items===undefined ? "sin ejecutar" : items===null ? "omitido" : bloqueado ? "bloqueado"
      : (rojas.length+' diferencia(s)' + (sinConf.length? ' · '+sinConf.length+' sin confirmar' : '') + (enTransito.length? ' · '+enTransito.length+' en tránsito' : '') + (efectivo.length? ' · '+efectivo.length+' efectivo' : ''));
    var idxPaso = PASO_ORDEN.indexOf(p.key);
    html += '<div class="step-block'+(cuadrado?' cuadrado':'')+'"><div class="step-head"><h4>'+p.titulo+'</h4>' +
      '<span class="count">'+countTxt+'</span></div><div class="step-body">';
    // Contexto del saldo inicial de Caja General (Pasos 2 y 3): dinero en tránsito arrastrado del mes anterior.
    if((p.key==="paso2" || p.key==="paso3") && esArray && STATE.saldoCajaGeneral){
      html += saldoCtxHtml(STATE.saldoCajaGeneral, p.key);
    }
    if(items===undefined){
      html += '<div class="empty-skip">Aún no se ejecutó este paso — usa "Ejecutar solo este paso" o el botón global.</div>';
    } else if(bloqueado){
      html += '<div class="empty-skip">🔒 Bloqueado — primero debe cuadrar el '+nombreCortoPaso(pasoPrevio(p.key))+'.</div>';
    } else if(items===null){
      html += '<div class="empty-skip">'+(p.key==="paso1"
        ? "Paso omitido: no se subió el reporte de cajeras."
        : "Paso omitido: faltan archivos de este paso.")+'</div>';
    } else {
      if(rojas.length===0){
        html += '<div class="empty-ok">Sin diferencias detectadas en este paso.</div>';
      } else {
        items.forEach(function(item, idx){ if(!esNoRojo(item)) html += findingHtml(p, item, idx); });
      }
      if(enTransito.length){
        var salen = enTransito.filter(function(i){ return !esTransitoEntrante(i); });
        var entraron = enTransito.filter(esTransitoEntrante);
        var totSalen = salen.reduce(function(s,i){ return s + i.monto; }, 0);
        var totEntraron = entraron.reduce(function(s,i){ return s + i.monto; }, 0);
        var head = entraron.length
          ? 'sale al próximo mes B/ '+fmt(totSalen)+' · entró del mes anterior B/ '+fmt(totEntraron)
          : 'Total B/ '+fmt(totSalen);
        html += '<div class="sinconf-block transito"><div class="sinconf-head">En tránsito ('+enTransito.length+') · '+head +
          '<span class="sinconf-sub">Partidas que aún no compensan (salen al próximo mes) o que compensaron este mes viniendo del anterior. No son diferencias.</span></div>';
        // Grupo 1: sale al próximo mes (fin de mes + cheques pendientes).
        items.forEach(function(item, idx){ if(esEnTransito(item) && !esTransitoEntrante(item)) html += findingHtml(p, item, idx); });
        if(salen.length) html += filaTotal(entraron.length ? "Sale al próximo mes" : "Total en tránsito de este paso", totSalen);
        // Grupo 2: entró del mes anterior (compensó este mes).
        if(entraron.length){
          items.forEach(function(item, idx){ if(esEnTransito(item) && esTransitoEntrante(item)) html += findingHtml(p, item, idx); });
          html += filaTotal("Entró del mes anterior (compensó este mes)", totEntraron);
        }
        html += '</div>';
      }
      if(sinConf.length){
        html += '<div class="sinconf-block"><div class="sinconf-head">Sin confirmar el banco ('+sinConf.length+')' +
          '<span class="sinconf-sub">La plata está en el sistema, pero el depósito no trae etiqueta de banco. Verifica manualmente.</span></div>';
        items.forEach(function(item, idx){ if(esSinConfirmar(item)) html += findingHtml(p, item, idx); });
        html += '</div>';
      }
      if(efectivo.length){
        html += '<div class="sinconf-block efectivo"><div class="sinconf-head">Depósitos en efectivo — Brinks ('+efectivo.length+')' +
          '<span class="sinconf-sub">Movimientos "Ach De Brinks Panama" del estado de cuenta: son el efectivo del reporte de cajeras, no una diferencia.</span></div>';
        items.forEach(function(item, idx){ if(esEfectivo(item)) html += findingHtml(p, item, idx); });
        html += '</div>';
      }
      // Etiqueta CUADRADO al pie del bloque cuando el paso no tiene diferencias rojas.
      if(cuadrado) html += '<div class="cuadrado-badge">CUADRADO</div>';
    }
    html += '</div></div>';
  });
  area.innerHTML = html;

  area.querySelectorAll('input[type=checkbox]').forEach(function(cb){
    cb.addEventListener("change", function(){
      var k = cb.getAttribute("data-ck");
      STATE.checks[k] = cb.checked;
      renderResultados();
    });
  });
  document.getElementById("exportBtn").onclick = exportarChecklist;
  var btnT = document.getElementById("btnTransito");
  if(btnT) btnT.onclick = exportarEnTransito;
  if(cajaLista) bindCajaInputs(); // campos editables del cierre de Caja General (saldo inicial / sistema)
  bindSaldoIniDetalle(); // Paso 0: detalle editable del saldo inicial (manual o por Excel)
}

  var pasosMeta = [["Paso 0","paso0"],["Paso 1","paso1"],["Paso 2","paso2"],["Paso 3","paso3"]];
