      h += '<table class="dif-tabla"><thead><tr><th>Compensó</th><th>Banco</th><th>Concepto</th><th class="num">Monto</th></tr></thead><tbody>';
      apert.forEach(function(x){
        h += '<tr><td>'+esc(x.fecha||"")+'</td><td>'+esc(x.banco||"")+'</td><td>'+esc(String(x.concepto||"").slice(0,44))+
             '</td><td class="num">'+fmt(x.monto)+'</td></tr>';
      });
      h += '<tr class="tot"><td colspan="3">Total</td><td class="num">'+
           fmt(Math.round(apert.reduce(function(a,x){ return a+x.monto; },0)*100)/100)+'</td></tr></tbody></table>';
    }
    // El total sale de la aritmetica del saldo y el detalle de cruzar partidas: si no coinciden, el
    // detalle esta incompleto y hay que decirlo en vez de dejar una tabla que no suma lo que dice arriba.
    var sumaAp = Math.round(apert.reduce(function(a,x){ return a+x.monto; },0)*100)/100;
    if(Math.abs(sumaAp - d.compenso) > 0.03){
      h += '<div class="cg-note cg-prov">El detalle suma B/ '+fmt(sumaAp)+' y el renglón B/ '+fmt(d.compenso)+'. ' +
        'No coinciden: falta algún navegador de banco para reconocer todos los asientos de descargo, o alguno ' +
        'no cruza con su partida. Subí los navegadores de los tres bancos y volvé a ejecutar.</div>';
    }
  }

  // (1) Efectivo que sigue en transito pero cuyo asiento ya salio de Caja General. NO es un componente de la
  // diferencia —el renglon de arriba ya lo separa del saldo—, pero se lista para saber cuales son.
  var ya = partidasYaAcreditadas();
  if(Math.abs(d.soloBanco) > 0.005){
    h += '<div class="dif-sub">Aparte: en tránsito pero ya acreditado en Caja General <b>B/ '+fmt(d.soloBanco)+'</b>' +
      '<span>El asiento del depósito se hizo el día que se entregó al banco, así que estas partidas ya salieron ' +
      'de la cuenta y no explican la diferencia. Viajan en el resumen hasta que el banco las refleje.</span></div>';
    if(ya.length){ h += '<table class="dif-tabla"><thead><tr><th>Fecha</th><th>Banco</th><th>Concepto</th><th class="num">Monto</th></tr></thead><tbody>';
    ya.forEach(function(x){
      h += '<tr><td>'+esc(x.fecha||"")+'</td><td>'+esc(x.banco||"")+'</td><td>'+esc(String(x.concepto||"").slice(0,44))+
           '</td><td class="num">'+fmt(x.monto)+'</td></tr>';
    });
      h += '<tr class="tot"><td colspan="3">Total</td><td class="num">'+fmt(d.soloBanco)+'</td></tr></tbody></table>'; }
  }

  // Las ventas que entraron y no salieron por ningun deposito YA estan en el resumen en transito, asi que
  // no son un componente de la diferencia: se cancelan solas. Pero hay que decir de donde salieron, porque
  // no vienen de ningun paso y en el resumen aparecen sin explicacion.
  if(Math.abs(d.sinDepositar) > 0.005){
    h += '<div class="dif-sub">Dentro del tránsito: ventas que entraron y no salieron por ningún depósito <b>B/ '+fmt(d.sinDepositar)+'</b>' +
      '<span>La venta del día entra a Caja General y sale cuando se deposita. Estos días entró la venta y el ' +
      'depósito no aparece: ni acreditado en la cuenta, ni reportado por la cajera. <b>Quedan en tránsito y viajan al mes ' +
      'que viene</b>, así que si el depósito nunca aparece se van a seguir arrastrando. Revisá si el depósito se hizo y ' +
      'no se reportó, si el efectivo todavía está en la caja esperando a Brinks, o si falta una línea en el informe de cajeras.</span></div>';
    h += '<table class="dif-tabla"><thead><tr><th>Fecha</th><th>Comprobante</th><th class="num">Venta del día</th>' +
         '<th class="num">Acreditado</th><th class="num">Reportó la cajera</th><th class="num">Queda en tránsito</th></tr></thead><tbody>';
    (d.ventasSinDeposito||[]).forEach(function(x){
      h += '<tr><td>'+esc(x.fecha||"")+'</td><td>'+esc(x.ref||"")+'</td><td class="num">'+fmt(x.venta)+'</td>' +
           '<td class="num">'+fmt(Math.round((x.acreditado+x.visa)*100)/100)+'</td><td class="num">'+fmt(x.reportado)+'</td>' +
           '<td class="num"><b>'+fmt(x.pendiente)+'</b></td></tr>';
    });
    h += '<tr class="tot"><td colspan="5">Total</td><td class="num">'+fmt(d.sinDepositar)+'</td></tr></tbody></table>';
    var bkE = bancoDelEfectivo();
    h += '<div class="cg-note">' + (bkE
      ? 'En el resumen quedan a nombre de <b>'+esc(bkE)+'</b>, que es donde compensó el efectivo de este mes. Si esos depósitos van a otro banco, corregilo en el resumen antes de usarlo el mes que viene.'
      : '<b>Quedan sin banco.</b> No se pudo deducir dónde compensan, y sin banco el Paso 0 del mes que viene no las puede cotejar contra ningún estado de cuenta: completalo a mano en el resumen.') + '</div>';
  }

  // (2) Retenciones y comisiones de tarjeta: lo que el banco se quedó y nunca va a acreditar.
  // Menos de un dolar es el redondeo de los faltantes y sobrantes del mes, no un renglon del reporte.
  if(Math.abs(d.resto) >= 1){
    nBloque++;
    // El residuo puede quedar NEGATIVO cuando el asiento de cargos del mes ya se registro: entonces de la
    // cuenta salio mas de lo que quedaba por salir, y titularlo "retenciones + B/ -1,000.54" no se
    // entiende. Se separan los dos casos.
    var restoPos = d.resto >= 0;
    h += '<div class="dif-sub">'+nBloque+' · ' +
      (restoPos ? 'Retenciones y comisiones de tarjeta <b>+ B/ '+fmt(d.resto)+'</b>'
                : 'Cargos y ajustes que ya salieron de la cuenta <b>− B/ '+fmt(-d.resto)+'</b>') +
      '<span>' + (restoPos
        ? 'La venta entra BRUTA a Caja General y el depósito sale NETO: la diferencia se queda en la cuenta. El banco nunca la va a acreditar, se la descontó.'
        : 'Este mes se registraron asientos que sacaron de Caja General más de lo que quedaba por salir — el de cargos de tarjeta es el más común. No hay nada que hacer con este renglón: es lo que ya se corrigió.') +
      '</span></div>';
    var rv = STATE.retVisaDetalle;
    if(rv && rv.length){
      var totB=0, totR=0, totN=0;
      h += '<table class="dif-tabla"><thead><tr><th colspan="4">VISA St. Georges — informe de retenciones</th></tr>' +
        '<tr><th>Fecha de venta</th><th class="num">Bruto</th><th class="num">Retenido</th><th class="num">Neto</th></tr></thead><tbody>';
      rv.forEach(function(x){
        if(Math.abs(x.bruto) < 0.005 && Math.abs(x.neto) < 0.005) return;
        totB += x.bruto; totR += Math.abs(x.retenciones); totN += x.neto;
        h += '<tr><td>'+esc(x.fecha)+'</td><td class="num">'+fmt(x.bruto)+'</td><td class="num">'+fmt(Math.abs(x.retenciones))+
             '</td><td class="num">'+fmt(x.neto)+'</td></tr>';
      });
      h += '<tr class="tot"><td>Total</td><td class="num">'+fmt(Math.round(totB*100)/100)+'</td><td class="num">' +
        fmt(Math.round(totR*100)/100)+'</td><td class="num">'+fmt(Math.round(totN*100)/100)+'</td></tr></tbody></table>';
    }
    var cg = cargosTarjetaPorBanco();
    if(cg){
      cg.forEach(function(b){
        h += '<table class="dif-tabla"><thead><tr><th colspan="2">'+esc(b.banco)+' — cargos de tarjeta del estado de cuenta ('+b.n+' partidas)</th></tr></thead><tbody>';
        Object.keys(b.porTipo).sort().forEach(function(t){
          h += '<tr><td>'+esc(t)+'</td><td class="num">'+fmt(b.porTipo[t])+'</td></tr>';
        });
        h += '<tr class="tot"><td>Total</td><td class="num">'+fmt(b.total)+'</td></tr></tbody></table>';
      });
      var tc = cg.reduce(function(a,b){ return a+b.total; },0);
      var tv = rv ? Math.round(rv.reduce(function(a,x){ return a+Math.abs(x.retenciones); },0)*100)/100 : 0;
      // El residuo de la cuenta NO sirve como monto del asiento: si hay partidas que salieron y no se
      // repusieron, arrastra ese descuadre a gastos bancarios. El asiento va por los cargos del estado.
      var totCg = Math.round((tc+tv)*100)/100;
      h += '<div class="cg-note">Los cargos del período suman <b>B/ '+fmt(totCg)+'</b> según los estados de cuenta, ' +
        'y en la cuenta quedó un residuo de B/ '+fmt(d.resto)+'. ' +
        (Math.abs(totCg - d.resto) <= 0.03
          ? "Coinciden: el asiento sale por esa cifra."
          : "Si no coinciden es por corte de mes (el banco cobra este mes retenciones de ventas del anterior) " +
            "o porque quedan partidas que salieron de la cuenta y todavía no se repusieron. El asiento de gastos " +
            "bancarios va por los cargos del estado, no por el residuo.") + '</div>';
    }
  }
  if(Math.abs(d.resto) >= 1) h += pistasResiduoHtml(d);
  // Lo que falta depende del mes. Cuando el residuo es cero, decirle que salde retenciones contra gastos
  // bancarios lo manda a hacer un asiento que descuadraria la cuenta.
  var pasos = [];
  if(d.resto >= 1) pasos.push('saldar las retenciones y comisiones de tarjeta contra gastos bancarios');
  if(d.compenso > 0.005) pasos.push('descargar lo que venía en tránsito y el banco ya acreditó');
  if(Math.abs(d.sinDepositar) > 0.005) pasos.push('averiguar dónde están las ventas que entraron y no salieron por ningún depósito, que quedaron en tránsito');
  if(Math.abs(d.arrastre) > 0.005) pasos.push('resolver el arrastre de meses anteriores, que no se corrige con asientos de este mes');
  h += '<div class="cg-note"><b>Qué falta para que cuadre:</b> ' +
    (pasos.length ? pasos.join('; ') + '. ' : '') +
    'Lo demás se corrige solo al acreditar Caja General el día que el banco compensa, no el día del depósito.</div>';
  return cerrar(h);
}
// El cuadro de "donde buscar": el residuo abierto dia por dia, de mayor a menor, y los asientos que no
// son ni venta ni deposito. Es lo que responde "por donde empiezo".
function pistasResiduoHtml(d){
  var p = pistasResiduo();
  if(!p) return "";
  var MAX = 12;
  var h = '<div class="dif-sub">Dónde buscar' +
    '<span>El residuo, día por día, con la aritmética del navegador de Caja General: lo que entró, lo que ' +
    'salió y lo que quedó en tránsito ese día. <b>Un día normal deja solo la retención de tarjeta</b> — la venta ' +
    'entra bruta y el depósito sale neto —, así que al lado va la retención que dice el informe de VISA. ' +
    'El día donde «sin explicar» no se le parece es el que hay que mirar. Están ordenados de mayor a menor: ' +
    'empezá por arriba. <b>Ojo con el desfase de un día</b>: el depósito de la venta de un día suele asentarse al ' +
    'siguiente, así que un día puede salir con un hueco y el otro con el mismo sobrante — esos dos se cancelan ' +
    'entre sí y no hay nada que buscar ahí.</span></div>';
  h += '<table class="dif-tabla"><thead><tr><th>Día</th><th>Comprobante</th><th class="num">Entró</th>' +
       '<th class="num">Salió</th><th class="num">Quedó en tránsito</th><th class="num">Sin explicar</th>' +
       '<th class="num">Retención del informe</th></tr></thead><tbody>';
  if(Math.abs(p.apertura) > 0.005){
    h += '<tr><td colspan="5">Con lo que abrió el mes: apertura en tránsito B/ '+fmt(p.aperturaTransito)+
         (p.compenso > 0.005 ? ', menos B/ '+fmt(p.compenso)+' que ya compensó y falta descargar' : '') +
         (Math.abs(p.transViejo) > 0.005 ? ', menos B/ '+fmt(p.transViejo)+' que sigue en tránsito de meses anteriores' : '') +
         (Math.abs(p.descargos) > 0.005 ? ', menos B/ '+fmt(p.descargos)+' que ya se descargó con su asiento' : '') +
         '</td><td class="num"><b>'+fmt(p.apertura)+'</b></td><td></td></tr>';
  }
  if(Math.abs(p.ajuste) > 0.005){
    h += '<tr><td colspan="5">Ajustes de apertura que el navegador ya trae dentro del saldo inicial</td>' +
         '<td class="num"><b>'+fmt(p.ajuste)+'</b></td><td></td></tr>';
  }
  p.dias.slice(0, MAX).forEach(function(x){
    h += '<tr><td>'+esc(x.fecha)+'</td><td>'+esc(x.ref||"")+'</td><td class="num">'+fmt(x.deb)+'</td>' +
         '<td class="num">'+fmt(x.cred)+'</td><td class="num">'+(x.transito ? fmt(x.transito) : "—")+'</td>' +
         '<td class="num"><b>'+fmt(x.sinExplicar)+'</b></td>' +
         '<td class="num">'+(x.retencion ? fmt(x.retencion) : "—")+'</td></tr>';
  });
  if(p.dias.length > MAX){
    var rst = Math.round(p.dias.slice(MAX).reduce(function(a, x){ return a + x.sinExplicar; }, 0)*100)/100;
    h += '<tr><td colspan="5">Otros '+(p.dias.length-MAX)+' día(s), todos menores</td><td class="num"><b>'+fmt(rst)+'</b></td><td></td></tr>';
  }
  h += '<tr class="tot"><td colspan="5">Total</td><td class="num">'+fmt(p.total)+'</td><td></td></tr></tbody></table>';
  if(Math.abs(p.ajuste) > 0.005){
    h += '<div class="cg-note">El renglón de ajustes de apertura sale de asientos que el navegador ya trae dentro ' +
      'de su saldo inicial y además asienta como línea del mes — el típico «ajusta saldo errado de Caja General» ' +
      'del primer día. Está contado dos veces, y por eso se resta acá: se cancela con el día que lo muestra arriba.</div>';
  }
  if(p.otros.length){
    h += '<div class="cg-note"><b>Asientos que no son la venta del día ni un depósito.</b> Entran a Caja General ' +
         'y no salen por el banco, así que ningún paso los coteja y se quedan en el saldo hasta que alguien los revisa.</div>';
    h += '<table class="dif-tabla"><thead><tr><th>Fecha</th><th>Comprobante</th><th>Asiento</th><th class="num">Débito</th></tr></thead><tbody>';
    p.otros.slice(0, 10).forEach(function(x){
      h += '<tr><td>'+esc(x.fecha)+'</td><td>'+esc(x.ref||"")+'</td><td>'+esc(x.descripcion.slice(0, 60))+
           '</td><td class="num">'+fmt(x.monto)+'</td></tr>';
    });
    if(p.otros.length > 10) h += '<tr><td colspan="4">… y '+(p.otros.length-10)+' más</td></tr>';
    h += '</tbody></table>';
  }
  return h;
}
function cierreCajaHtml(){
  var tm = transitoPorMetodo();
  var saldo = STATE.saldoCajaGeneral || {};
  if(!STATE.caja) STATE.caja = {};
  var inicial = STATE.caja.inicial!=null ? STATE.caja.inicial : (saldo.inicial!=null ? saldo.inicial : 0);
  var sistema = STATE.caja.sistema!=null ? STATE.caja.sistema : (saldo.final!=null ? saldo.final : 0);
  // Movimiento en tránsito: editable (Diba lo define). Se precarga con el movimiento del mes del sistema
  // (para que el balance cuadre de entrada); el total en tránsito por método se muestra aparte como referencia.
  var movimiento = STATE.caja.movimiento!=null ? STATE.caja.movimiento : (saldo.movimiento!=null ? saldo.movimiento : tm.total);
  var finalEsp = Math.round((inicial + movimiento)*100)/100;
  var dif = Math.round((finalEsp - sistema)*100)/100;
  var ok = Math.abs(dif) < 0.01;
  var filasMetodo = Object.keys(tm.porMetodo).sort().map(function(m){
    return '<div class="cg-row"><span>'+m+'</span><b>B/ '+fmt(tm.porMetodo[m])+'</b></div>';
  }).join("");
  var h = '<div class="cierre-caja">' +
    '<div class="cierre-title">🎉 Caja General cuadrada — cierre del período</div>' +
    '<div class="cg-cols">' +
      '<div class="cg-box"><div class="cg-h">En tránsito para el próximo mes · por método de pago</div>' +
        filasMetodo +
        '<div class="cg-row cg-tot"><span>Movimiento en tránsito</span><b>B/ '+fmt(tm.total)+'</b></div>' +
        '<div class="cg-note">'+tm.count+' partida(s). Este es el dinero que la empresa registró y el banco reflejará el mes siguiente.</div>' +
      '</div>' +
      '<div class="cg-box"><div class="cg-h">Balance de Caja General</div>' +
        '<div class="cg-row"><span>Saldo inicial'+(saldo.fechaInicial?' <i class="cg-src">del sistema · '+saldo.fechaInicial+'</i>':'')+'</span><input id="cajaInicial" class="cg-inp" type="number" step="0.01" value="'+numInput(inicial)+'"></div>' +
        '<div class="cg-row"><span>+ Movimiento del mes <i class="cg-src">según el sistema</i></span><input id="cajaMov" class="cg-inp" type="number" step="0.01" value="'+numInput(movimiento)+'"></div>' +
        '<div class="cg-row cg-tot"><span>= Saldo final esperado</span><b id="cajaFinalEsp">B/ '+fmt(finalEsp)+'</b></div>' +
        '<div class="cg-row"><span>Saldo final del sistema'+(saldo.fechaFinal?' <i class="cg-src">'+saldo.fechaFinal+'</i>':'')+'</span><input id="cajaSistema" class="cg-inp" type="number" step="0.01" value="'+numInput(sistema)+'"></div>' +
        '<div class="cg-row cg-dif"><span>Diferencia</span><b id="cajaDif" style="color:'+(ok?"var(--ok)":"#B54B4B")+'">'+(ok?"✓ Coincide":"B/ "+fmt(dif))+'</b></div>' +
        // Los tres valores salen del mismo navegador, así que la resta cierra sola: solo dice algo si se
        // editan a mano. Se aclara para que ese "✓ Coincide" no se lea como una validación del cierre.
        '<div class="cg-note">Los tres importes vienen del navegador, así que la resta cierra sola — sirve para probar cifras a mano, no valida el cierre. El cuadre real es el del recuadro de al lado.</div>' +
        (saldo.inicial==null && saldo.final==null ? '<div class="cg-note">Los saldos no se pudieron leer del navegador de Caja General — ingresalos a mano para que la comparación tenga sentido.</div>' : '') +
      '</div>' +
      desgloseSaldoCajaHtml() +
      tablaTransitoHtml() +
    '</div>' +
    '<button class="btn-run" id="btnTransito">Descargar resumen en tránsito</button>' +
  '</div>';
  return h;
}
// Recalcula en vivo el saldo final esperado y la diferencia al editar los campos (sin re-render completo).
// Imprime SOLO el reporte de Caja General. No abre una ventana nueva (los bloqueadores de pop-ups las
// matan y ahi se pierde el reporte): marca el body y deja que el CSS de impresion apague el resto.
function bindPrintCG(){
  var b = document.getElementById("btnPrintCG");
  if(!b) return;
  b.onclick = function(){
    var body = document.body;
    body.classList.add("solo-cg");
    // El navegador dispara afterprint tanto al imprimir como al cancelar; el timer es el respaldo por si
    // el navegador no lo emite, para que la clase no se quede pegada y rompa la impresion normal.
    var limpiar = function(){ body.classList.remove("solo-cg"); window.removeEventListener("afterprint", limpiar); };
    window.addEventListener("afterprint", limpiar);
    setTimeout(limpiar, 1500);
    window.print();
  };
}

/* ---- Recoger y desplegar cada paso ----
   Con cuatro pasos abiertos hay que hacer mucho scroll para llegar a lo que falta; recoger los que ya se
   revisaron deja a la vista solo lo pendiente. Se cambia la clase en el bloque en vez de volver a
   dibujar todo: un re-render completo perdería la posición del scroll justo cuando se está revisando. */
function bindPlegado(area){
  if(!area) return;
  area.querySelectorAll(".step-head[data-plegar]").forEach(function(h){
    function alternar(){
      var bloque = h.parentNode;
      var plegado = !bloque.classList.contains("plegado");
      bloque.classList.toggle("plegado", plegado);
      h.setAttribute("aria-expanded", plegado ? "false" : "true");
      plegarPaso(h.getAttribute("data-plegar"), plegado);
      pintarBotonPlegarTodos(area);
    }
    h.addEventListener("click", alternar);
    h.addEventListener("keydown", function(e){
      if(e.key === "Enter" || e.key === " " || e.key === "Spacebar"){ e.preventDefault(); alternar(); }
    });
  });
  var todos = document.getElementById("btnPlegarTodos");
  if(todos){
    todos.onclick = function(){
      var bloques = area.querySelectorAll(".step-head[data-plegar]");
      var plegar = !todosPlegados(area);   // si ya están todos recogidos, el botón despliega
      bloques.forEach(function(h){
        h.parentNode.classList.toggle("plegado", plegar);
        h.setAttribute("aria-expanded", plegar ? "false" : "true");
        plegarPaso(h.getAttribute("data-plegar"), plegar);
      });
      pintarBotonPlegarTodos(area);
    };
  }
  pintarBotonPlegarTodos(area);
}
function todosPlegados(area){
  var hs = area.querySelectorAll(".step-head[data-plegar]");
  if(!hs.length) return false;
  for(var i=0;i<hs.length;i++){ if(!hs[i].parentNode.classList.contains("plegado")) return false; }
  return true;
}
function pintarBotonPlegarTodos(area){
  var b = document.getElementById("btnPlegarTodos");
  if(!b) return;
  var hay = area.querySelectorAll(".step-head[data-plegar]").length;
  b.style.display = hay ? "" : "none";
  b.textContent = todosPlegados(area) ? "Desplegar todos" : "Recoger todos";
}
function bindCajaInputs(){
  var ci = document.getElementById("cajaInicial");
  var cs = document.getElementById("cajaSistema");
  if(!ci || !cs) return;
  var cm = document.getElementById("cajaMov");
  function recalc(){
    var ini = parseFloat(ci.value); if(isNaN(ini)) ini = 0;
    var sis = parseFloat(cs.value); if(isNaN(sis)) sis = 0;
    var mov = cm ? parseFloat(cm.value) : transitoPorMetodo().total; if(isNaN(mov)) mov = 0;
    STATE.caja = { inicial: ini, sistema: sis, movimiento: mov };
    var fe = Math.round((ini + mov)*100)/100;
    var dif = Math.round((fe - sis)*100)/100;
    var ok = Math.abs(dif) < 0.01;
    document.getElementById("cajaFinalEsp").textContent = "B/ " + fmt(fe);
    var d = document.getElementById("cajaDif");
    d.textContent = ok ? "✓ Coincide" : "B/ " + fmt(dif);
    d.style.color = ok ? "var(--ok)" : "#B54B4B";
  }
  ci.addEventListener("input", recalc);
  cs.addEventListener("input", recalc);
  if(cm) cm.addEventListener("input", recalc);
}

/* -------- Paso 0 de Caja General: detalle del saldo inicial (manual o por Excel) -------- */
function sumaSaldoIniDetalle(){

// Lee un resumen de partidas en tránsito exportado (para el Paso 0 del mes siguiente).
/* ---- Fechas invertidas en el resumen en transito ----
   Excel guarda las fechas ambiguas (dia <= 12) como Date con MES/DIA cambiados: el cheque del 07-abr
   quedaba como 04-jul y el del 12-may como 05-dic. Con eso la partida "viaja al futuro", nunca compensa
   —el matching va hacia adelante— y encima el historial la marca vencida por mas de 4 meses.
   Las filas con dia > 12 son inequivocas: de ellas sale el rango de meses real del resumen, y la fecha
   ambigua se resuelve eligiendo la orientacion que caiga dentro de ese rango. */
function mesesInequivocos(rows, cF, desde){
  var meses = {};
  for(var r=desde;r<rows.length;r++){
    var row = rows[r]; if(!row) continue;
    var v = row[cF];
    if(v instanceof Date && !isNaN(v)){
      // Celda Date: solo aporta si el dia no puede confundirse con un mes.
      if(v.getDate() > 12) meses[v.getFullYear()+"-"+String(v.getMonth()+1).padStart(2,"0")] = true;
      continue;
    }
    // Celda de TEXTO: Excel la dejo asi justamente porque no es ambigua ("19/3/2026"). Son las que mas
    // aportan — en el resumen de junio de 2026 las unicas inequivocas venian como texto.
    var m = String(v==null?"":v).trim().match(/^(\d{1,2})[/-](\d{1,2})[/-](\d{4})$/);
    if(m && parseInt(m[1],10) > 12) meses[m[3]+"-"+String(parseInt(m[2],10)).padStart(2,"0")] = true;
  }
  return Object.keys(meses).sort();
}
function fechaTransito(raw, meses){
  if(!(raw instanceof Date) || isNaN(raw) || !meses.length) return toISODate(raw, false);
  var y = raw.getFullYear(), mo = raw.getMonth()+1, da = raw.getDate();
  function iso(m, d){ return y+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0"); }
  var directa = iso(mo, da);
  if(da > 12) return directa;                                  // inequivoca
  var dentro = function(f){ return f.slice(0,7) >= meses[0] && f.slice(0,7) <= meses[meses.length-1]; };
  if(dentro(directa)) return directa;
  var invertida = iso(da, mo);
  return dentro(invertida) ? invertida : directa;
}
function parseTransitoPrevio(rows){
  var hIdx = findHeaderRow(rows, ["Fecha","Banco","Monto"]);
  if(hIdx===-1) throw new Error("No se encontró el encabezado (Fecha, Banco, Monto) en el resumen en tránsito.");
  var h = rows[hIdx];
  var cF=colIdx(h,"Fecha"), cB=colIdx(h,"Banco"), cM=colIdx(h,"Monto"), cC=colIdx(h,"Concepto"), cR=colIdx(h,"Comprobante");
  // Si el credito a Caja General de la partida ya se hizo. Lo escribe el cierre del mes anterior, que es
  // el unico que lo sabe (ve el diario de ese mes). Sin esto, un cheque acreditado al depositarlo volvia
  // el mes siguiente como si siguiera dentro de la cuenta y el panel pedia acreditarlo otra vez.
  var cCG=colIdx(h,"Caja General");
  // Desglose por medio de pago de un deposito de fin de mes ("CHEQUE 1463.08 + VISA 1124.69 + CLAVE 983.83"):
  // el descargo suele asentarse asi, una linea por medio, y con el total solo no se lo puede reconocer.
  var cDes=colIdx(h,"Desglose");
  var mesesOK = cF>=0 ? mesesInequivocos(rows, cF, hIdx+1) : [];
  var out = [];
  for(var r=hIdx+1;r<rows.length;r++){
    var row = rows[r]; if(!row) continue;
    var iso = cF>=0 ? fechaTransito(row[cF], mesesOK) : null;
    var monto = money(cM>=0?row[cM]:0);
    if(!iso || !monto) continue;
    // Normaliza el nombre del banco a la forma canónica (acepta "stg"/"STG", "banistmo", "general", etc.).
    var bancoRaw = cB>=0?String(row[cB]||"").trim():"";
    var banco = clasificarBancoPorTexto(bancoRaw);
    if(!banco && normTxt(bancoRaw).indexOf("GENERAL")!==-1) banco = "Banco General"; // "general" → Banco General
    if(!banco) banco = bancoRaw;
    var concepto = cC>=0?String(row[cC]||"").trim():"";
    var comprobante = cR>=0?String(row[cR]||"").trim():"";
    // Sentido: un cheque EMITIDO (pago / débito en circulación) compensa como DÉBITO en el estado. Se
    // detecta por la nota "débito en circulación" en la fila, o por el comprobante/referencia que empieza
    // con "PAY" (los pagos llevan referencia PAY). Por defecto, crédito (cobros/depósitos).
    var rowTxt = normTxt(row.join(" "));
    var sentido = (rowTxt.indexOf("DEBITO")!==-1 || /^PAY/i.test(comprobante)) ? "debito" : "credito";
    out.push({ fecha:iso, banco: banco, monto:monto, concepto: concepto,
               comprobante: comprobante, sentido: sentido, creditoCG: leerCreditoCG(cCG>=0?row[cCG]:null),
               partes: leerDesglose(cDes>=0?row[cDes]:null, monto) });
  }
  // Un resumen bajado con una version anterior no trae la columna: el Paso 0 lo avisa.
  out.sinColumnaCredito = cCG < 0;
  return out;
}
// "CHEQUE 1463.08 + VISA 1124.69" -> [{metodo, monto}]. Solo si suma el monto de la partida; si no, null.
function leerDesglose(v, monto){
  var t = String(v==null ? "" : v).toUpperCase();
  if(!t.trim()) return null;
  var out = [], re = /([A-Z][A-Z .\/]*?)\s*(-?\d+(?:\.\d+)?)/g, m;
  while((m = re.exec(t))){
    var met = m[1].replace(/[+\s]+$/, "").trim(), mo = parseFloat(m[2]);
    if(met && !isNaN(mo)) out.push({ metodo:met, monto:mo });
  }
  if(out.length < 2) return null;
  var suma = Math.round(out.reduce(function(a, p){ return a + p.monto; }, 0)*100)/100;
  return Math.abs(suma - monto) <= 0.02 ? out : null;
}
function desgloseTexto(partes){
  if(!Array.isArray(partes) || partes.length < 2) return "";
  return partes.map(function(p){ return String(p.metodo||"").trim() + " " + Number(p.monto||0).toFixed(2); }).join(" + ");
}
// "ya hecho" / "pendiente" -> "hecho" / "pendiente". Vacio o irreconocible -> null (se trata como hasta ahora).
function leerCreditoCG(v){
  var n = normTxt(v==null?"":String(v)).trim();
  if(!n) return null;
  if(n.indexOf("HECHO")!==-1 || n.indexOf("ACREDITAD")!==-1 || n==="SI") return "hecho";
  if(n.indexOf("PENDIENTE")!==-1 || n==="NO") return "pendiente";
  return null;
}

// Línea del estado que es una "Remisión Clave" (compensación de tarjeta CLAVE).
function esRemisionClave(desc){ var n = normTxt(desc); return n.indexOf("REMISION")!==-1 && n.indexOf("CLAVE")!==-1; }
// Línea del estado que es una "Remisión V/Mc" (compensación de tarjeta VISA/MasterCard).
function esRemisionVisa(desc){ var n = normTxt(desc); return n.indexOf("REMISION")!==-1 && (n.indexOf("V/MC")!==-1 || n.indexOf("VISA")!==-1); }
// Combinación de 2+ líneas del MISMO día que sumen el objetivo. Un depósito que el banco parte en varias
// líneas las acredita todas la misma fecha; permitir que se arme con líneas de días distintos convierte
// cualquier importe chico en "compensado" a fuerza de sumar céntimos sueltos.
function comboMismoDia(pool, fecha, objetivo, ventanaDias, tolerancia, maxN){
  var dias = {};
  for(var i=0;i<pool.length;i++){
    if(pool[i].usado || pool[i].fecha < fecha) continue;          // la compensación nunca es anterior
    if(daysBetween(fecha, pool[i].fecha) > ventanaDias) continue;
    (dias[pool[i].fecha] = dias[pool[i].fecha] || []).push(i);
  }
  var fechas = Object.keys(dias).sort();
  for(var d=0; d<fechas.length; d++){
    var idxs = dias[fechas[d]];
    if(idxs.length < 2) continue;
    var sub = idxs.map(function(i){ return pool[i]; });
    var combo = buscarSubsetSuma(sub, fechas[d], objetivo, 0, tolerancia, maxN);
    if(combo && combo.length >= 2) return combo.map(function(k){ return idxs[k]; });
  }
  return null;
}
// Primera fecha de un arreglo de movimientos (inicio real del período del estado de cuenta).
function primeraFecha(arr){
  var f = (arr||[]).map(function(x){ return x.fecha; }).filter(Boolean).sort();
  return f.length ? f[0] : null;
}

// Consume las partidas en tránsito del mes anterior (Paso 0) contra los estados de cuenta de ESTE mes.
// Es la pasada que hace de puente entre meses: una partida ya registrada en el diario del mes anterior
// (ej. la VISA del 31-dic en el ME-00000001826) compensa en el banco a principios de este mes, así que su
// línea del estado NO es una diferencia — no hay asiento de este mes que la respalde porque el asiento es
// del mes pasado. Marca `_transitoUsado` en la fila del estado para que los Pasos 2 y 3 no la reporten.
// Una partida puede tardar semanas o meses, así que NO se limita por días: se empareja hacia adelante
// (la compensación nunca es anterior a la partida). Según su TIPO compensa distinto:
//  - Cheque por depositar → CRÉDITO "depósito" del estado.
//  - Depósito en tránsito → cualquier CRÉDITO del estado.
//  - Cheque EMITIDO (pago, "débito en circulación") → DÉBITO del estado (cargo).
//  - Clave en tránsito → crédito "Remisión Clave"; VISA en tránsito → crédito "Remisión V/Mc".
// Devuelve {compensadas, pendientes, fechasRaras} — el llamador decide cómo reportarlas.
/* ---- Cuánto puede tardar en compensar cada tipo de partida ----
   El Paso 0 emparejaba TODO con una ventana de 366 días. Para un cheque está bien —puede clarear hasta
   4 meses después— pero para el resto es un colador: un depósito de ventanilla de B/ 1.92 del 20-mar-2026
   "compensó" con otro 1.92 del 03-jun (75 días después) y un depósito Brinks de 470.00 del 30-may con un
   ACH del 29-jun (30 días). El efectivo y las tarjetas se acreditan en días, no en meses: emparejarlos
   tan lejos es coincidencia de importe, y encima tapa lo que se quiere detectar — una partida que se
   arrastra mes tras mes es justo la señal de que un depósito quedó sin hacer.
   Las ventanas van en días HÁBILES del banco (ver distanciaBancaria). */
function ventanaTransito(item){
  var c = normTxt((item && item.concepto) || "");
  if(/CHEQUE|CK|CIRCULACION/.test(c)) return 90;   // ~4 meses de calendario
  if(/VISA|V\/MC|CLAVE|TARJETA/.test(c)) return 12;
  return 15;                                       // efectivo, ventanilla, ACH, Yappy
}
function consumirTransitoPrevio(transitoPrevio, estados, tolerancia){
  var consumidas = {};   // banco -> {fila:true}: las lineas del estado que compensaron partidas del transito
  // La ventana ya no es unica: la fija ventanaTransito segun el tipo de partida. En el Paso B los
  // candidatos vienen prefiltrados por su propia ventana, asi que aca alcanza con no volver a acotar.
  var VENTANA = 366;
  var compensadas = [], pendientes = [], fechasRaras = [];
  Object.keys(estados).forEach(function(banco){
    var items = (transitoPrevio||[]).filter(function(t){ return t.banco===banco; });
    if(!items.length) return;
    var estado = estados[banco] || [];
    var noAborted = function(x){ return normTxt((x.descripcion||"")+" "+(x.referencia||"")).indexOf("ABORTED")===-1; };
    // Un solo objeto por fila del estado, COMPARTIDO entre los pools: así `usado` es global y una misma
    // línea no puede consumirse dos veces (antes cada pool tenía su copia y podían pisarse entre sí).
    var credObjs = estado.filter(function(x){ return x.credito>0 && !x._transitoUsado && noAborted(x); })
      .map(function(x){ return {fecha:x.fecha, monto:x.credito, desc:x.descripcion, src:x, usado:false}; });
    var poolDeb = estado.filter(function(x){ return x.debito>0 && !x._transitoUsado && noAborted(x); })
      .map(function(x){ return {fecha:x.fecha, monto:x.debito, desc:x.descripcion, src:x, usado:false}; });
    var poolCred  = credObjs;                                                                        // cualquier crédito
    var poolDep   = credObjs.filter(function(o){ return esDepositoEstado(o.desc); });                 // depósitos
    var poolClave = credObjs.filter(function(o){ return esRemisionClave(o.desc); });                  // remisión CLAVE
    var poolVisa  = credObjs.filter(function(o){ return esRemisionVisa(o.desc); });                   // remisión V/MC
    // Clasifica cada partida y le asigna su pool de compensación (según concepto y sentido).
    function poolDe(item){
      if(item.sentido==="debito") return poolDeb;                          // cheque emitido (pago) → débito del estado
      var c = normTxt(item.concepto);
      if(c.indexOf("CLAVE")!==-1) return poolClave;                        // clave en tránsito → remisión clave
      if(c.indexOf("VISA")!==-1 || c.indexOf("V/MC")!==-1) return poolVisa;// visa en tránsito → remisión V/Mc
      if(c.indexOf("DEPOSITO")!==-1) return poolCred;                      // depósito en tránsito → cualquier crédito
      return poolDep;                                                      // cheque por depositar → depósito
    }
    // Una partida "del mes anterior" no puede tener fecha DENTRO (ni después) del período del estado: si la
    // tiene, es un error de tecleo en el Paso 0 (pasó con "31/12/2026" por "31/12/2025"). El matching es
    // hacia adelante, así que una fecha futura hace que nunca compense y salga como diferencia falsa. Se
    // empareja con la fecha corregida al inicio del período y se levanta un aviso nombrando la partida.
    var iniEstado = primeraFecha(estado);
    var chs = items.map(function(t){
      var fechaEf = t.fecha;
      if(iniEstado && t.fecha >= iniEstado){
        fechaEf = iniEstado;
        fechasRaras.push({banco:banco, item:t, iniEstado:iniEstado});
      }
      return {fecha:fechaEf, fechaOrig:t.fecha, monto:t.monto, concepto:t.concepto, comprobante:t.comprobante,
              sentido:t.sentido, creditoCG:t.creditoCG, partes:t.partes, banco:banco, usado:false, pool:poolDe(t)};
    });
    // Paso A: cada partida contra su pool, hacia adelante. Primero 1:1; si no aparece, una combinación de
    // líneas DEL MISMO DÍA, porque cuando el banco parte un depósito lo acredita el mismo día (el depósito
    // de 92.97 del 29-dic entró el 02-ene como 60.41 + 32.56). La restricción de día es imprescindible:
    // sin ella un importe chico se arma sumando céntimos sueltos de fechas distintas y se da por
    // compensado algo que sigue pendiente — pasó con el depósito de 5.85, que se "cuadró" con
    // 1.63 del 28-ene + 0.72 del 26-ene + 3.50 del 19-ene y encima dejó huérfanos esos tres depósitos.
    chs.forEach(function(ch){
      if(ch.usado) return;
      var vent = ventanaTransito(ch);
      var combo = buscarSubsetSuma(ch.pool, ch.fecha, ch.monto, vent, tolerancia, 1, "adelante");
      if(!combo) combo = comboMismoDia(ch.pool, ch.fecha, ch.monto, vent, tolerancia, 3);
      if(combo){ combo.forEach(function(i){ ch.pool[i].usado=true; ch.compensoEn=ch.pool[i]; }); ch.usado=true; }
    });
    /* Paso A2: la partida compenso POR PARTES, no de una vez.
       Una partida de fin de mes trae su desglose por medio de pago —el deposito del 27-feb-2026 son
       CHEQUE 1,463.08 + VISA 1,124.69 + CLAVE 983.83— y el banco acredita cada medio por su cuenta: las
       dos tarjetas el 2-mar, y los cheques repartidos en tres depositos (864.62 el 2, mas 270.30 y 328.16
       el 11). Buscando el total de 3,571.60 no aparece nunca, asi que la partida viajaba al resumen del
       mes siguiente habiendo compensado completa, y sus dos depositos del 11 salian como plata que nadie
       registro. Se coteja medio por medio contra el pool que le toca a cada uno.
       Dos resguardos: tienen que cuadrar TODAS las partes —con una sola que falte la partida sigue
       pendiente entera, porque media compensacion no es una compensacion— y la combinacion de cada parte
       tiene que ser UNICA, que es lo que impide armar el importe juntando depositos de cualquier lado. */
    function poolDeMetodo(metodo){
      var m = normTxt(metodo);
      if(m.indexOf("CLAVE")!==-1) return poolClave;
      if(m.indexOf("VISA")!==-1 || m.indexOf("V/MC")!==-1) return poolVisa;
      if(m.indexOf("CHEQUE")!==-1 || m==="CK") return poolDep;
      return poolCred;
    }
    chs.forEach(function(ch){
      if(ch.usado || !Array.isArray(ch.partes) || ch.partes.length < 2) return;
      var usar = [];
      var todas = ch.partes.every(function(pt){
        if(!(pt.monto > tolerancia)) return true;                 // una parte en cero no pide nada
        var pool = poolDeMetodo(pt.metodo);
        var vent = ventanaTransito({ concepto: pt.metodo });
        var libres = pool.filter(function(o){
          return !o.usado && usar.indexOf(o) === -1 && o.fecha >= ch.fecha &&
                 distanciaBancaria(ch.fecha, o.fecha) <= vent;
        });
        if(!libres.length) return false;
        var sols = solucionesSuma(libres.map(function(o){ return o.monto; }), pt.monto, tolerancia, 6, 1);
        if(!sols || sols.length !== 1) return false;
        sols[0].forEach(function(i){ usar.push(libres[i]); });
        return true;
      });
      if(!todas || !usar.length) return;
      usar.forEach(function(o){ o.usado = true; });
      ch.usado = true;
      ch.porPartes = true;
      // La fecha en que termino de compensar: la ultima linea que consumio.
      ch.compensoEn = usar.slice().sort(function(a,b){ return a.fecha < b.fecha ? -1 : 1; }).slice(-1)[0];
    });
    // Paso B: cada línea del estado no usada contra una combinación de partidas del MISMO pool (el banco
    // a veces junta varias en una), hacia atrás.
    [poolDeb, poolCred, poolDep, poolClave, poolVisa].forEach(function(pool){
      pool.forEach(function(d){
        if(d.usado) return;
        var candidatos = chs.filter(function(c){
          return !c.usado && c.pool===pool && distanciaBancaria(d.fecha, c.fecha) <= ventanaTransito(c);
        });
        var combo = buscarSubsetSuma(candidatos, d.fecha, d.monto, VENTANA, tolerancia, 12, "atras");
        if(combo){ combo.forEach(function(i){ candidatos[i].usado=true; candidatos[i].compensoEn=d; }); d.usado=true; }
      });
    });
    // Marca la fila real del estado: los Pasos 2 y 3 la saltan (su asiento es del mes anterior).
    poolDeb.concat(credObjs).forEach(function(o){
      if(!o.usado || !o.src) return;
      o.src._transitoUsado = true;
      if(o.src.fila != null) (consumidas[banco] = consumidas[banco] || {})[o.src.fila] = true;
    });
    chs.forEach(function(ch){ (ch.usado ? compensadas : pendientes).push(ch); });
  });
  return {compensadas:compensadas, pendientes:pendientes, fechasRaras:fechasRaras, consumidas:consumidas};
}

/* ---- Cuadre del Paso 0 contra el saldo inicial de Caja General ----
   Caja General es una cuenta PUENTE: se acredita cuando se registra un depósito al banco y se salda cuando
   el banco lo refleja. Por eso su saldo al arrancar el mes ES, en teoría, lo que quedó en tránsito del mes
   anterior — o sea, el total del resumen del Paso 0. Si no coinciden, al resumen le falta (o le sobra) una
   partida, y la conciliación va a dar por "pendientes" cosas que ya compensaron o al revés. */
// Una partida del Paso 0 pasó por Caja General si es dinero que la empresa registró como depositado y el
// banco todavía no reflejó: depósito, cheque POR DEPOSITAR, tarjeta, Yappy. Los cheques EMITIDOS (en
// circulación) son pagos que salen de la cuenta bancaria — nunca tocan Caja General, así que no suman.
function pasaPorCajaGeneral(t){
  // Ya acreditada en el mes anterior (cheque o Brinks, que se acreditan al depositar): esta en transito del
  // lado del banco, no dentro de Caja General. No suma a la apertura ni puede ser parte de un descargo.
  if(t.creditoCG==="hecho") return false;
  if(t.sentido==="debito") return false;
  var c = normTxt(t.concepto);
  return c.indexOf("CIRCULACION")===-1 && c.indexOf("EMITIDO")===-1;
}
// Asiento de AJUSTE DE APERTURA: corrige el saldo con el que arranca el mes. Puede estar fechado el
// primer día del período (queda dentro del navegador, que es lo práctico para dejar la traza) o en el mes
// anterior (ahí el Balance Inicial ya viene corregido y no hay nada que sumar). Los ajustes de fecha
// posterior son movimientos del mes, no tocan la apertura.
function ajustesDeApertura(diarioCaja, fechaInicial){
  if(!diarioCaja || !fechaInicial) return [];
  return diarioCaja.filter(function(x){
    return x.fecha && x.fecha <= fechaInicial && normTxt(x.descripcion).indexOf("AJUST")!==-1;
  }).map(function(x){
    return { fecha:x.fecha, monto: Math.round((x.debito - x.credito)*100)/100,
             columna: x.debito>0 ? "Débito" : "Crédito", desc:(x.descripcion||"").trim(),
             referencia: String(x.referencia||"").trim() };
  });
}
function cuadreSaldoInicialPaso0(transitoPrevio, saldoCG, diarioCaja){
  if(!transitoPrevio || !transitoPrevio.length) return null;
  if(!saldoCG || saldoCG.inicial==null) return null;
  var dentro = [], fuera = [], acreditadas = [];
  transitoPrevio.forEach(function(t){
    if(pasaPorCajaGeneral(t)) dentro.push(t);
    else { fuera.push(t); if(t.creditoCG==="hecho") acreditadas.push(t); }
  });
  function suma(arr){ return Math.round(arr.reduce(function(a,t){ return a+t.monto; },0)*100)/100; }
  var total = suma(dentro);
  var porBanco = {};
  dentro.forEach(function(t){ porBanco[t.banco] = Math.round(((porBanco[t.banco]||0) + t.monto)*100)/100; });
  // El saldo con el que realmente arranca el mes = Balance Inicial + los ajustes de apertura ya asentados.
  var aj = ajustesDeApertura(diarioCaja, saldoCG.fechaInicial);
  var totalAj = Math.round(aj.reduce(function(a,x){ return a+x.monto; },0)*100)/100;
  var apertura = Math.round((saldoCG.inicial + totalAj)*100)/100;
  var dif = Math.round((total - apertura)*100)/100;
  return { saldoInicial: saldoCG.inicial, fecha: saldoCG.fechaInicial, total: total, n: dentro.length,
           totalFuera: suma(fuera), nFuera: fuera.length, porBanco: porBanco,
           // Lo que el resumen trae con su credito a Caja General YA hecho: no suma a la apertura, y cuando la
           // diferencia es justo eso, el saldo de cierre del mes pasado se dejo en el total del resumen.
           totalAcreditadas: suma(acreditadas), nAcreditadas: acreditadas.length,
           esResumenCompleto: acreditadas.length > 0 && Math.abs(apertura - (total + suma(acreditadas))) < 0.01,
           ajustes: aj, totalAjustes: totalAj, apertura: apertura,
           dif: dif, ok: Math.abs(dif) < 0.01 };
}
// Asiento de ajuste que hay que registrar para que el saldo de apertura de Caja General refleje lo que
// realmente quedó en tránsito. El signo manda la columna: todo lo que viene en tránsito es dinero
// registrado como depositado, o sea DÉBITO; un saldo acreedor (negativo) en esta cuenta no tiene sentido.
// Se fecha el PRIMER DÍA DEL PERÍODO que se está revisando: el ejercicio anterior ya está declarado y no
// se toca, así que la corrección entra en el período abierto. Fechado ese día queda antes de todos los
// movimientos del mes, o sea que corrige la apertura y no el movimiento — y `ajustesDeApertura` lo suma
// al Balance Inicial (que el navegador sigue mostrando sin corregir, porque lo calcula al corte).
function ajusteCajaGeneral(c){
  if(!c || c.ok) return null;
  return {
    fecha: c.fecha || "",
    columna: c.dif > 0 ? "Débito" : "Crédito",
    monto: Math.round(Math.abs(c.dif)*100)/100,
    cuenta: "[1.1.8] Caja General",
    concepto: "Ajuste al saldo en tránsito de Caja General — lleva el saldo de apertura a B/ " + fmt(c.total) +
              ", el total de las partidas en tránsito del mes anterior"
  };
}
function ajusteTexto(a){
  return "Fecha: " + a.fecha + "\nCuenta: " + a.cuenta + "\n" + a.columna + ": " + fmt(a.monto) +
         "\nConcepto: " + a.concepto;
}
// Asientos que YA dicen "ajuste" en el diario de Caja General del mes: se listan para no proponer uno que
// ya se hizo, o para ver que el que se hizo no alcanza.
function ajustesEnCajaGeneral(diarioCaja){
  return (diarioCaja||[]).filter(function(x){ return normTxt(x.descripcion).indexOf("AJUSTE")!==-1; })
    .map(function(x){
      return { fecha:x.fecha, monto: x.debito>0 ? x.debito : x.credito, columna: x.debito>0 ? "Débito" : "Crédito",
               desc: (x.descripcion||"").trim(), referencia: String(x.referencia||"").trim() };
    });
}

      : c.esResumenCompleto

      : 'Primero revisá el resumen del Paso 0. <b>Si confirmás que está completo</b>, entonces el descuadre es del navegador y se corrige con este asiento.') +
    '</p>' +

    previos +

function bindAjusteCopy(c){
  var b = document.getElementById("ajusteCopy");
  if(!b) return;
  var a = ajusteCajaGeneral(c);
  b.onclick = function(){
    var txt = ajusteTexto(a);
    try{ navigator.clipboard.writeText(txt).then(function(){ b.textContent="✓ Copiado"; setTimeout(function(){ b.textContent="📋 Copiar el asiento"; },1800); }); }
    catch(e){ alert(txt); }
  };
}
function cuadreSaldoIniHtml(c){

  }).join("");
  var partidas = c.n===1 ? "1 partida" : c.n+" partidas";
  // El caso mas comun de descuadre: el saldo de cierre del mes pasado se ajusto al TOTAL del resumen en vez

    : "";
  var nCirc = c.nFuera - c.nAcreditadas, totalCirc = Math.round((c.totalFuera - c.totalAcreditadas)*100)/100;

    ? '<p class="per-nota">No se '+(nCirc===1?'cuenta 1 cheque':'cuentan '+nCirc+' cheques')+' en circulación por B/ '+fmt(totalCirc)+
      ': son pagos que salen de la cuenta bancaria y nunca pasan por Caja General.</p>'
    : "";
  // Ajustes de apertura ya asentados: se muestran siempre, cuadre o no, para que se vea de dónde sale la cifra.

    return '<tr><td style="padding-left:26px;opacity:.85">'+(x.monto>=0?'+':'−')+' Ajuste de apertura ya asentado — '+esc(x.desc)+
      (x.referencia?' <span class="per-arch">'+esc(x.referencia)+' · '+x.fecha+'</span>':'')+'</td>' +
      '<td class="per-rango">B/ '+fmt(Math.abs(x.monto))+'</td></tr>';
  }).join("");
  if(c.ok){
    return '<div class="per-panel" style="background:#EDF7F0;border-color:#A9CFB6;color:#2F6B45">' +
      '<div class="per-title" style="color:#2F6B45">✓ El Paso 0 cuadra con el saldo inicial de Caja General</div>' +
      '<p class="per-txt">El saldo de apertura es <b>B/ '+fmt(c.apertura)+'</b> = '+

    completo + yaAcred +
    '<table class="per-tabla"><tbody>' +
      '<tr><td>Balance Inicial del navegador'+(c.fecha?' <span class="per-arch">'+c.fecha+'</span>':'')+'</td>' +
        '<td class="per-rango">B/ '+fmt(c.saldoInicial)+'</td></tr>' + filasAj +
      (filasAj ? '<tr><td><b>Saldo de apertura</b></td><td class="per-rango"><b>B/ '+fmt(c.apertura)+'</b></td></tr>' : '') +
      '<tr><td>Resumen del Paso 0 — '+partidas+' que '+(c.n===1?"pasa":"pasan")+' por Caja General</td>' +
        '<td class="per-rango">B/ '+fmt(c.total)+'</td></tr>' +
      bancos.replace(/<tr><td>/g, '<tr><td style="padding-left:26px;opacity:.8">') +
      '<tr class="per-mal"><td><b>Diferencia</b></td><td class="per-rango"><b>B/ '+fmt(c.dif)+'</b></td></tr>' +
    '</tbody></table>' + excluidas +
    // Con el saldo en negativo el error está del lado del navegador, no del resumen: no tiene sentido
    // mandar a buscar partidas que sobran cuando lo que hay es un saldo mal ubicado.
    (c.apertura < 0 || c.esResumenCompleto ? '' : '<p class="per-nota">' + (faltan
      ? '<b>Al resumen le faltan B/ '+fmt(Math.abs(c.dif))+'.</b> Revisá si quedó alguna partida sin anotar — lo más común es una fila de tarjeta (clave/visa) sin monto o un depósito de los últimos días del mes anterior.'
      : '<b>El resumen trae B/ '+fmt(Math.abs(c.dif))+' de más.</b> Revisá si hay una partida repetida, una que ya había compensado antes, o alguna que no debería estar (un pago, no un depósito).') +
    '</p>') +
    (c.apertura < 0
      ? '<p class="per-nota">⚠ <b>El saldo inicial viene en negativo, o sea en la columna CRÉDITO.</b> Eso acá no tiene sentido: todo lo que viene en tránsito es dinero ya registrado como depositado, así que el saldo de apertura tiene que quedar al <b>débito</b>. El descuadre no está en el resumen del Paso 0 — está en el navegador, y se corrige con el asiento de ajuste de abajo.</p>'
      : '') +
    '<p class="per-nota">' + (c.apertura < 0
      ? 'La conciliación corre igual: empareja partida por partida y no usa este saldo. Pero mientras no se registre el ajuste, el saldo de apertura de Caja General queda mal y el descuadre se arrastra al cierre.'
      : c.esResumenCompleto
      ? 'La conciliación corre igual: el resumen está bien y empareja partida por partida. Lo que hay que corregir es el <b>saldo de apertura</b>, con el asiento de abajo; si no, este mismo descuadre va a reaparecer todos los meses.'
      : 'La conciliación corre igual, pero mientras esto no cuadre <b>el resumen está incompleto</b>: lo que le falte va a aparecer como diferencia en los pasos siguientes, y lo que le sobre va a quedar como "pendiente de compensar" para siempre.') +
    '</p>' +
  '</div>';
}

// Paso 0: valida que las partidas en tránsito de meses anteriores compensaron en los bancos de este mes.
// Lo que compensó se reporta como tránsito ENTRANTE (no es diferencia: su asiento es del mes anterior);
// lo que no compensó sigue en tránsito y se arrastra al resumen del mes siguiente.
function paso0(transitoPrevio, estBanistmo, estStg, estBancoGeneral, ventanaDias, tolerancia){
  var estados = { "Banistmo": estBanistmo, "STG": estStg };
  if(estBancoGeneral) estados["Banco General"] = estBancoGeneral;
  var hallazgos = [];
  // Una partida cuyo banco no se reconoce no entra a ningun pool y desaparece en silencio del cotejo:
  // ni compensa ni queda pendiente. Antes de conciliar nada, se avisa.
  var BANCOS_OK = { "Banistmo":1, "STG":1, "Banco General":1 };
  var raros = (transitoPrevio||[]).filter(function(t){ return !BANCOS_OK[t.banco]; });
  if(raros.length){
    var totalRaro = Math.round(raros.reduce(function(a,t){ return a+t.monto; },0)*100)/100;
    var nombres = {};
    raros.forEach(function(t){ nombres[String(t.banco||"(vacío)")] = 1; });
    hallazgos.push({
      fecha:"", banco:"", monto:totalRaro, clase:"diff",
      concepto:"Banco no reconocido en el resumen en tránsito", comprobante:"", motivo:"banco no reconocido",
      texto: "El resumen en tránsito trae " + raros.length + " partida(s) por B/ " + fmt(totalRaro) +
             " con un banco que no reconozco: " + Object.keys(nombres).map(function(x){ return "\"" + x + "\""; }).join(", ") +
             ". Esas partidas NO se cotejan: no compensan ni quedan pendientes, simplemente se pierden. " +
             "Corregí la columna Banco del archivo (los valores válidos son Banistmo, STG y Banco General) y volvé a subirlo.",
      fuente: "Resumen en tránsito del mes anterior"
    });
  }
  // Sin estados de cuenta no hay contra qué cotejar: TODAS las partidas salen como pendientes y ese
  // resultado se arrastra al resumen del mes siguiente. Hay que decirlo, no dejarlo pasar por bueno.
  var hayEstados = Object.keys(estados).some(function(b){ return estados[b] && estados[b].length; });
  if(!hayEstados && transitoPrevio && transitoPrevio.length){
    hallazgos.push({
      fecha:"", banco:"", monto:0, clase:"aviso",
      concepto:"Paso 0 sin estados de cuenta", comprobante:"", motivo:"faltan los estados de cuenta",
      texto:"El Paso 0 se corrió sin estados de cuenta, así que no se pudo saber qué partidas compensaron: " +
            "las " + transitoPrevio.length + " quedaron como pendientes. Subí los estados de cuenta (Paso 2) y volvé a ejecutar, " +
            "o el resumen para el mes siguiente va a arrastrar partidas que ya cerraron.",
      fuente:"Paso 0 — partidas en tránsito"
    });
  }
  // Un resumen sin la columna del credito a Caja General no permite distinguir un cheque ya acreditado
  // de uno que sigue dentro de la cuenta. Se procesa igual que antes, pero hay que decirlo.
  if(transitoPrevio && transitoPrevio.sinColumnaCredito && transitoPrevio.length){
    hallazgos.push({
      fecha:"", banco:"", monto:0, clase:"aviso",
      concepto:"Resumen en tránsito sin la columna «Crédito a Caja General»", comprobante:"", motivo:"resumen de una versión anterior",
      texto:"El resumen del mes anterior se bajó con una versión anterior de la herramienta y no dice qué partidas ya tenían " +
            "su crédito en Caja General. Todas se tratan como si siguieran dentro de la cuenta: las que se acreditaron al depositar " +
            "(cheques, Brinks) pueden salir como descargo a registrar y descuadrar la apertura. Volvé a correr el mes anterior y " +
            "descargá de nuevo el resumen en tránsito.",
      fuente:"Paso 0 — resumen en tránsito del mes anterior"
    });
  }
  if(transitoPrevio && transitoPrevio.duplicados){
    transitoPrevio.duplicados.forEach(function(t){
      var partes = t._partesEnResumen || [];
      hallazgos.push({
        fecha:t.fecha, banco:t.banco, monto:t.monto, clase:"aviso",
        concepto:"Partida contada dos veces en el resumen", comprobante:t.comprobante||"", motivo:"consolidado y sus partes a la vez",
        texto:"El resumen del mes anterior trae B/ " + fmt(t.monto) + " de " + t.banco + " del " + t.fecha + " (\"" + String(t.concepto||"").trim() +
              "\") y TAMBIÉN las partidas que lo forman: " + partes.map(function(p){ return "B/ " + fmt(p.monto) + " (" + String(p.concepto||"").trim().slice(0,45) + ")"; }).join(" + ") +
              ". Es el mismo dinero contado dos veces, así que se toma una sola vez: las partes, que es como lo acredita el banco. " +
              "Si registraste el reingreso a Caja General siguiendo ese resumen, quedó B/ " + fmt(t.monto) + " de más" +
              (t.comprobante ? " (revisá el " + t.comprobante + ")" : "") + ": lo vas a ver en el cuadre de apertura de abajo.",
        fuente:"Paso 0 — resumen en tránsito del mes anterior"
      });
    });
  }
  var res = consumirTransitoPrevio(transitoPrevio, estados, tolerancia);
  guardarDecisionTransito(transitoPrevio || [], estados, res);   // los Pasos 2 y 3 heredan esta decision

  /* ---- Cuadre de apertura ----
     Caja General es una cuenta puente: su saldo al abrir el mes tiene que ser lo que quedo en transito y
     sigue dentro de la cuenta. Es la prueba de que el mes arranca bien, asi que va en el resultado del
     Paso 0 y no solo en el panel del saldo, donde aparecia despues de correr todo. */
  var cuadreAp = cuadreSaldoInicialPaso0(transitoPrevio, STATE.saldoCajaGeneral, STATE.diarioCaja);
  if(cuadreAp){
    if(cuadreAp.ok){
      hallazgos.push({
        fecha:cuadreAp.fecha||"", banco:"", monto:cuadreAp.total, clase:"informativo",
        concepto:"Apertura de Caja General cuadrada", comprobante:"", motivo:"el saldo inicial es el tránsito que sigue en la cuenta",
        texto:"Caja General abre el mes con B/ " + fmt(cuadreAp.apertura) + " y las " + cuadreAp.n + " partida(s) del resumen que siguen dentro de la cuenta suman lo mismo" +
              (cuadreAp.nFuera ? " (otras " + cuadreAp.nFuera + " por B/ " + fmt(cuadreAp.totalFuera) + " ya estaban acreditadas)" : "") +
              ". El mes arranca con el tránsito correcto." +
              (transitoPrevio.reingresadas
                ? " De esas, " + transitoPrevio.reingresadas.n + " por B/ " + fmt(transitoPrevio.reingresadas.total) +
                  " el resumen las marca como «crédito ya hecho», pero el saldo muestra que volvieron a la cuenta con el asiento de" +
                  " reingreso del cierre anterior: se tratan como dentro de Caja General y llevan su descargo al compensar."
                : ""),
        fuente:"Resumen en tránsito del mes anterior / Diario Caja General"
      });
    } else {
      hallazgos.push({
        fecha:cuadreAp.fecha||"", banco:"", monto:Math.round(Math.abs(cuadreAp.dif)*100)/100, clase:"aviso",
        concepto:"La apertura de Caja General no cuadra con el resumen", comprobante:"", motivo:"saldo inicial distinto del tránsito",
        texto:"Caja General abre el mes con B/ " + fmt(cuadreAp.apertura) + " y las partidas del resumen que siguen dentro de la cuenta suman B/ " +
              fmt(cuadreAp.total) + " (diferencia B/ " + fmt(cuadreAp.dif) + "). " +
              (cuadreAp.esResumenCompleto
                ? "La diferencia es exactamente las " + cuadreAp.nAcreditadas + " partida(s) por B/ " + fmt(cuadreAp.totalAcreditadas) +
                  " cuyo crédito a Caja General ya se hizo al depositar: esas viajan en el resumen porque el banco no las reflejó, " +
                  "pero ya salieron de la cuenta. El mes pasado el saldo de cierre se dejó en el total del resumen en vez de en el " +
                  "tránsito que sigue dentro; debió quedar en B/ " + fmt(cuadreAp.total) + "."
                : (transitoPrevio.duplicados && Math.abs(Math.abs(cuadreAp.dif) - transitoPrevio.duplicados.reduce(function(a,t){ return a+t.monto; },0)) < 0.01)
                ? "La diferencia es exactamente la partida que el resumen contaba dos veces (avisada arriba): el reingreso a Caja General se registró por el doble. " +
                  "Corregí ese comprobante para que el reingreso sea por el importe una sola vez, o registrá el asiento de ajuste: Débito al banco que figura en el reingreso, Crédito a Caja General."
                : cuadreAp.dif > 0
                ? "La cuenta abre con menos de lo que el resumen dice que quedó pendiente: o al resumen le sobran partidas que ya compensaron, o falta el ajuste de apertura."
                : "La cuenta trae de más: son partidas de meses anteriores que compensaron y nunca se descargaron.") +
              " El panel del saldo trae el asiento de ajuste.",
        fuente:"Resumen en tránsito del mes anterior / Diario Caja General"
      });
    }
  }
  // Fechas imposibles en el resumen del Paso 0 (error de tecleo): se concilian igual, pero hay que avisar.
  res.fechasRaras.forEach(function(f){
    hallazgos.push({ fecha:f.item.fecha, banco:f.banco, monto:f.item.monto, clase:"aviso",
      concepto:f.item.concepto, comprobante:f.item.comprobante, motivo:"fecha fuera del período",
      texto:"El resumen en tránsito trae la partida \""+(f.item.concepto||"").trim()+"\" de B/ "+fmt(f.item.monto)+
            " con fecha "+f.item.fecha+", que NO es anterior al período que se está conciliando (empieza el "+f.iniEstado+
            "). Una partida en tránsito del mes anterior siempre es de una fecha previa — revisá el año en el archivo del Paso 0."+
            (f.item.comprobante?" · Comprobante "+f.item.comprobante:"")+" Se concilió tomando "+f.iniEstado+" como fecha.",
      fuente:"Paso 0 — resumen en tránsito del mes anterior" });
  });
  // Compensadas: entraron del mes anterior y ya cerraron en el banco. Se listan para que quede la traza
  // (el motivo lleva "mes anterior" para que caigan en el grupo de tránsito ENTRANTE del reporte).
  res.compensadas.forEach(function(ch){
    var etiqueta = (ch.concepto||"").trim() || "Partida en tránsito";
    var fCierre = ch.compensoEn ? ch.compensoEn.fecha : null;
    hallazgos.push({ fecha:(fCierre||ch.fechaOrig), banco:ch.banco, monto:ch.monto, clase:"en_transito",
      concepto:ch.concepto, comprobante:ch.comprobante, creditoCG:ch.creditoCG, motivo:"compensó — venía del mes anterior",
      texto:etiqueta+" de B/ "+fmt(ch.monto)+" ("+ch.fechaOrig+", "+ch.banco+") venía en tránsito del mes anterior y COMPENSÓ en el banco"+
            (fCierre?" el "+fCierre:"")+" — su asiento es del mes pasado, no es una diferencia."+
            (ch.creditoCG==="hecho"?" No lleva asiento de descargo: su crédito a Caja General ya se hizo al depositar.":"")+
            (ch.comprobante?" · Comprobante "+ch.comprobante:""),
      fuente:"Paso 0 — partidas en tránsito / Estado de cuenta "+ch.banco });
  });
  // Partidas que no compensaron → siguen en tránsito (rotuladas con su concepto real).
  res.pendientes.forEach(function(ch){
    var etiqueta = (ch.concepto||"").trim() || "Partida en tránsito";
    hallazgos.push({ fecha:ch.fechaOrig, banco:ch.banco, monto:ch.monto, clase:"en_transito",
      concepto:ch.concepto, comprobante:ch.comprobante, creditoCG:ch.creditoCG, partes:ch.partes, motivo:"aún pendiente de compensar",
      texto:etiqueta+" de B/ "+fmt(ch.monto)+" ("+ch.fechaOrig+", "+ch.banco+") de un período anterior aún NO compensó este mes."+(ch.comprobante?" · Comprobante "+ch.comprobante:""),
      fuente:"Paso 0 — partidas en tránsito / Estado de cuenta "+ch.banco });
  });
  return hallazgos;
}

chequearVersion();
render();
</script>
