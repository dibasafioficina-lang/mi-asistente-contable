/* ---------------- Resumen de partidas en tránsito (para el Paso 0 del próximo mes) ---------------- */
// Junta todas las partidas "en tránsito" de los resultados (principalmente del Paso 2).
// Arma el resumen de lo que queda en tránsito para el próximo mes. Se toma de:
//  - Paso 0: cheques de meses anteriores que AÚN no compensaron (se siguen arrastrando).
//  - Paso 2: lo que Caja General depositó este mes y no clareó en el banco (cheques por cambiar,
//    depósitos de fin de mes). Es la vista "lo que depositamos que no clareó".
// NO se toma de Paso 3 (diario bancario vs estado): duplicaría los ítems de fin de mes de Paso 2 y
// además incluye compensaciones de ENTRADA del mes anterior (primer día), que no se arrastran.
function recolectarEnTransito(){
  var out = [];
  var p0 = STATE.results && STATE.results.paso0;
  if(Array.isArray(p0)) p0.forEach(function(it){ if(esEnTransito(it)) out.push(it); });
  var p2 = STATE.results && STATE.results.paso2;
  if(Array.isArray(p2)) p2.forEach(function(it){ if(esEnTransito(it)) out.push(it); });
  return out;
}
// Un ítem en tránsito es cheque si su concepto/texto lo dice (Paso 0 y detalle de cheques); el resto
// (tarjetas VISA/CLAVE, Yappy de fin de mes) son "otros depósitos".
function esChequeEnTransito(it){
  return esChequeDesc((it.concepto||"") + " " + (it.texto||""));
}
// Total en tránsito desglosado por banco y por tipo (cheque vs otros), para mostrarlo al cerrar el módulo.
function totalesEnTransitoPorBanco(){
  var items = recolectarEnTransito();
  var porBanco = {}; var totCheques = 0, totOtros = 0;
  items.forEach(function(it){
    var b = it.banco||"—";
    if(!porBanco[b]) porBanco[b] = {cheques:0, otros:0, total:0};
    if(esChequeEnTransito(it)){ porBanco[b].cheques += it.monto; totCheques += it.monto; }
    else { porBanco[b].otros += it.monto; totOtros += it.monto; }
    porBanco[b].total += it.monto;
  });
  return { porBanco: porBanco, cheques: totCheques, otros: totOtros, total: totCheques+totOtros, count: items.length };
}
// Método de pago de una partida en tránsito (según su concepto/texto), para el resumen del cierre.
function metodoTransito(it){
  var t = normTxt((it.concepto||"")+" "+(it.texto||""));
  if(t.indexOf("VISA")!==-1) return "Tarjeta VISA";
  if(t.indexOf("CLAVE")!==-1) return "Tarjeta CLAVE";
  if(t.indexOf("YAPPY")!==-1) return "Yappy";
  if(esBrinks(t) || t.indexOf("EFECTIVO")!==-1) return "Efectivo (Brinks)";
  if(esChequeEnTransito(it)) return "Cheque";
  if(t.indexOf("ACH")!==-1) return "ACH";
  return "Otro depósito";
}
function transitoPorMetodo(){
  var items = recolectarEnTransito();
  var porMetodo = {}; var total = 0;
  items.forEach(function(it){ var m = metodoTransito(it); porMetodo[m] = (porMetodo[m]||0) + it.monto; total += it.monto; });
  return { porMetodo: porMetodo, total: total, count: items.length };
}
// Panel de cierre de Caja General: en tránsito por método de pago + balance editable
// (saldo inicial + movimiento en tránsito = saldo final esperado, comparado con el saldo del sistema).
function cierreCajaHtml(){
  var tm = transitoPorMetodo();
  var saldo = STATE.saldoCajaGeneral || {};
  if(!STATE.caja) STATE.caja = {};
  var inicial = STATE.caja.inicial!=null ? STATE.caja.inicial : (saldo.inicial!=null ? saldo.inicial : 0);
  var sistema = STATE.caja.sistema!=null ? STATE.caja.sistema : (saldo.final!=null ? saldo.final : 0);
  // Movimiento en tránsito: editable (Diba lo define). Se precarga con el movimiento del mes del sistema
  // (para que el balance cuadre de entrada); el total en tránsito por método se muestra aparte como referencia.
  var movimiento = STATE.caja.movimiento!=null ? STATE.caja.movimiento : (saldo.movimiento!=null ? saldo.movimiento : tm.total);
  var finalEsp = Math.round((inicial + movimiento)*100)/100;
  var dif = Math.round((finalEsp - sistema)*100)/100;
  var ok = Math.abs(dif) < 0.01;
  var filasMetodo = Object.keys(tm.porMetodo).sort().map(function(m){
    return '<div class="cg-row"><span>'+m+'</span><b>B/ '+fmt(tm.porMetodo[m])+'</b></div>';
  }).join("");
  var h = '<div class="cierre-caja">' +
    '<div class="cierre-title">🎉 Caja General cuadrada — cierre del período</div>' +
    '<div class="cg-cols">' +
      '<div class="cg-box"><div class="cg-h">En tránsito para el próximo mes · por método de pago</div>' +
        filasMetodo +
        '<div class="cg-row cg-tot"><span>Movimiento en tránsito</span><b>B/ '+fmt(tm.total)+'</b></div>' +
        '<div class="cg-note">'+tm.count+' partida(s). Este es el dinero que la empresa registró y el banco reflejará el mes siguiente.</div>' +
      '</div>' +
      '<div class="cg-box"><div class="cg-h">Balance de Caja General</div>' +
        '<div class="cg-row"><span>Saldo inicial'+(saldo.fechaInicial?' <i class="cg-src">del sistema · '+saldo.fechaInicial+'</i>':'')+'</span><input id="cajaInicial" class="cg-inp" type="number" step="0.01" value="'+numInput(inicial)+'"></div>' +
        '<div class="cg-row"><span>+ Movimiento del mes <i class="cg-src">según el sistema</i></span><input id="cajaMov" class="cg-inp" type="number" step="0.01" value="'+numInput(movimiento)+'"></div>' +
        '<div class="cg-row cg-tot"><span>= Saldo final esperado</span><b id="cajaFinalEsp">B/ '+fmt(finalEsp)+'</b></div>' +
        '<div class="cg-row"><span>Saldo final del sistema'+(saldo.fechaFinal?' <i class="cg-src">'+saldo.fechaFinal+'</i>':'')+'</span><input id="cajaSistema" class="cg-inp" type="number" step="0.01" value="'+numInput(sistema)+'"></div>' +
        '<div class="cg-row cg-dif"><span>Diferencia</span><b id="cajaDif" style="color:'+(ok?"var(--ok)":"#B54B4B")+'">'+(ok?"✓ Coincide":"B/ "+fmt(dif))+'</b></div>' +
        (saldo.inicial==null && saldo.final==null ? '<div class="cg-note">Los saldos no se pudieron leer del navegador de Caja General — ingresalos a mano para que la comparación tenga sentido.</div>' : '') +
      '</div>' +
    '</div>' +
    '<button class="btn-run" id="btnTransito">Descargar resumen en tránsito</button>' +
  '</div>';
  return h;
}
// Recalcula en vivo el saldo final esperado y la diferencia al editar los campos (sin re-render completo).
function bindCajaInputs(){
  var ci = document.getElementById("cajaInicial");
  var cs = document.getElementById("cajaSistema");
  if(!ci || !cs) return;
  var cm = document.getElementById("cajaMov");
  function recalc(){
    var ini = parseFloat(ci.value); if(isNaN(ini)) ini = 0;
    var sis = parseFloat(cs.value); if(isNaN(sis)) sis = 0;
    var mov = cm ? parseFloat(cm.value) : transitoPorMetodo().total; if(isNaN(mov)) mov = 0;
    STATE.caja = { inicial: ini, sistema: sis, movimiento: mov };
    var fe = Math.round((ini + mov)*100)/100;
    var dif = Math.round((fe - sis)*100)/100;
    var ok = Math.abs(dif) < 0.01;
    document.getElementById("cajaFinalEsp").textContent = "B/ " + fmt(fe);
    var d = document.getElementById("cajaDif");
    d.textContent = ok ? "✓ Coincide" : "B/ " + fmt(dif);
    d.style.color = ok ? "var(--ok)" : "#B54B4B";
  }
  ci.addEventListener("input", recalc);
  cs.addEventListener("input", recalc);
  if(cm) cm.addEventListener("input", recalc);
}

/* -------- Paso 0 de Caja General: detalle del saldo inicial (manual o por Excel) -------- */
function sumaSaldoIniDetalle(){
  return Math.round((STATE.saldoIniDetalle||[]).reduce(function(a,r){ var v=parseFloat(r.monto); return a+(isNaN(v)?0:v); },0)*100)/100;
}
function saldoIniDetalleHtml(){
  var s = STATE.saldoCajaGeneral || {};
  if(s.inicial==null) return "";
  var det = STATE.saldoIniDetalle || [];
  var total = sumaSaldoIniDetalle();
  var dif = Math.round((total - s.inicial)*100)/100;
  var ok = Math.abs(dif) < 0.01;
  var filas = det.map(function(r,i){
    return '<tr>' +
      '<td><input class="cg-inp sidet" data-i="'+i+'" data-f="fecha" type="date" value="'+(r.fecha||"")+'"></td>' +
      '<td><input class="cg-inp sidet" data-i="'+i+'" data-f="concepto" type="text" value="'+String(r.concepto||"").replace(/"/g,"&quot;")+'" placeholder="Concepto"></td>' +
      '<td><input class="cg-inp sidet" data-i="'+i+'" data-f="monto" type="number" step="0.01" value="'+(r.monto!=null&&r.monto!==""?r.monto:"")+'"></td>' +
      '<td><button class="sidet-del" data-i="'+i+'" title="Eliminar fila">✕</button></td></tr>';
  }).join("");
  if(!det.length) filas = '<tr><td colspan="4" class="sidet-vacio">Sin detalle todavía. Agregá filas o subí un Excel (columnas: Fecha, Concepto, Monto).</td></tr>';
  return '<div class="cierre-caja sidet-panel">' +
    '<div class="cierre-title">Paso 0 — Detalle del saldo inicial de Caja General</div>' +
    '<p class="cg-note">Saldo inicial del sistema: <b>B/ '+fmt(s.inicial)+'</b>'+(s.fechaInicial?' ('+s.fechaInicial+')':'')+'. Es el dinero en tránsito arrastrado del mes anterior — ingresá de qué se compone, a mano o por Excel.</p>' +
    '<table class="ret-tabla sidet-tabla"><thead><tr><th style="width:140px">Fecha</th><th>Concepto</th><th style="width:120px">Monto</th><th style="width:34px"></th></tr></thead><tbody>'+filas+'</tbody></table>' +
    '<div class="sidet-bar">' +
      '<button id="sidetAdd" class="btn-export">＋ Agregar fila</button>' +
      '<label class="btn-export sidet-upload">Subir Excel<input id="sidetFile" type="file" accept=".xlsx,.xls,.csv"></label>' +
      (det.length? '<button id="sidetClear" class="btn-export">Limpiar</button>':'') +
    '</div>' +
    '<div class="cg-box" style="margin-top:12px;background:#fff">' +
      '<div class="cg-row cg-tot"><span>Total del detalle</span><b id="sidetTotal">B/ '+fmt(total)+'</b></div>' +
      '<div class="cg-row cg-dif"><span id="sidetDifLbl">'+(ok?'✓ Cuadra con el saldo inicial':'Diferencia vs saldo inicial')+'</span>' +
        '<b id="sidetDif" style="color:'+(ok?'var(--ok)':'#B54B4B')+'">'+(ok?'✓':'B/ '+fmt(dif))+'</b></div>' +
    '</div>' +
  '</div>';
}
function actualizarTotalSaldoIni(){
  var s = STATE.saldoCajaGeneral || {}; if(s.inicial==null) return;
  var total = sumaSaldoIniDetalle();
  var dif = Math.round((total - s.inicial)*100)/100;
  var ok = Math.abs(dif) < 0.01;
  var t=document.getElementById("sidetTotal"); if(t) t.textContent="B/ "+fmt(total);
  var d=document.getElementById("sidetDif"); if(d){ d.textContent=ok?"✓":"B/ "+fmt(dif); d.style.color=ok?"var(--ok)":"#B54B4B"; }
  var l=document.getElementById("sidetDifLbl"); if(l) l.textContent=ok?"✓ Cuadra con el saldo inicial":"Diferencia vs saldo inicial";
}
function bindSaldoIniDetalle(){
  if(!STATE.saldoIniDetalle) STATE.saldoIniDetalle=[];
  var add=document.getElementById("sidetAdd"); if(!add) return;
  add.onclick=function(){ STATE.saldoIniDetalle.push({fecha:"",concepto:"",monto:""}); renderResultados(); };
  var clr=document.getElementById("sidetClear"); if(clr) clr.onclick=function(){ STATE.saldoIniDetalle=[]; renderResultados(); };
  document.querySelectorAll(".sidet-del").forEach(function(b){ b.onclick=function(){ STATE.saldoIniDetalle.splice(parseInt(b.getAttribute("data-i"),10),1); renderResultados(); }; });
  document.querySelectorAll("input.sidet").forEach(function(inp){ inp.addEventListener("input",function(){
    var i=parseInt(inp.getAttribute("data-i"),10), f=inp.getAttribute("data-f");
    if(STATE.saldoIniDetalle[i]) STATE.saldoIniDetalle[i][f]=inp.value;
    actualizarTotalSaldoIni();
  }); });
  var file=document.getElementById("sidetFile"); if(file) file.addEventListener("change",function(e){
    if(!e.target.files[0]) return;
    readWorkbook(e.target.files[0], function(rows){
      try{ STATE.saldoIniDetalle=parseSaldoIniDetalle(rows); }catch(err){ alert("No se pudo leer el detalle: "+err.message); }
      renderResultados();
    });
  });
}
// Lee un Excel con el detalle del saldo inicial. Columnas flexibles: Fecha, Concepto/Descripción, Monto/Importe.
function parseSaldoIniDetalle(rows){
  var hIdx = findHeaderRow(rows, ["Fecha","Monto"]);
  if(hIdx===-1) hIdx = findHeaderRow(rows, ["Fecha","Concepto"]);
  var out=[];
  if(hIdx===-1){ // sin encabezado claro: col 0=fecha, 1=concepto, 2=monto
    rows.forEach(function(r){ if(!r) return; var f=toISODate(r[0],false); var c=String(r[1]||""); var mo=money(r[2]!=null?r[2]:r[1]);
      if(f || (mo && c)) out.push({fecha:f||"", concepto:c, monto:mo}); });
    return out;
  }
  var cF=colIdx(rows[hIdx],"Fecha");
  var cC=colIdx(rows[hIdx],"Concepto"); if(cC<0)cC=colIdx(rows[hIdx],"Descripcion");
  var cM=colIdx(rows[hIdx],"Monto"); if(cM<0)cM=colIdx(rows[hIdx],"Importe"); if(cM<0)cM=colIdx(rows[hIdx],"Saldo");
  for(var r=hIdx+1;r<rows.length;r++){ var row=rows[r]; if(!row) continue;
    var f=toISODate(cF>=0?row[cF]:null,false); var c=cC>=0?String(row[cC]||""):""; var mo=money(cM>=0?row[cM]:null);
    if(f || (mo && c) || (mo && f)) out.push({fecha:f||"", concepto:c, monto:mo});
  }
  return out;
}
function exportarEnTransito(){
  var items = recolectarEnTransito();
  var rows = [["Fecha","Banco","Monto","Concepto","Comprobante","Motivo"]];
  items.forEach(function(it){
    rows.push([it.fecha, it.banco, it.monto, it.concepto||"", it.comprobante||"", it.motivo||"en tránsito"]);
  });
  var ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [{wch:12},{wch:14},{wch:12},{wch:44},{wch:20},{wch:26}];
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "En transito");
  var mes = (STATE.saldoCajaGeneral && STATE.saldoCajaGeneral.fechaFinal) ? STATE.saldoCajaGeneral.fechaFinal.slice(0,7) : "mes";
  XLSX.writeFile(wb, "en_transito_" + mes + ".xlsx");
}
// Lee un resumen de partidas en tránsito exportado (para el Paso 0 del mes siguiente).
function parseTransitoPrevio(rows){
  var hIdx = findHeaderRow(rows, ["Fecha","Banco","Monto"]);
  if(hIdx===-1) throw new Error("No se encontró el encabezado (Fecha, Banco, Monto) en el resumen en tránsito.");
  var h = rows[hIdx];
  var cF=colIdx(h,"Fecha"), cB=colIdx(h,"Banco"), cM=colIdx(h,"Monto"), cC=colIdx(h,"Concepto"), cR=colIdx(h,"Comprobante");
  var out = [];
  for(var r=hIdx+1;r<rows.length;r++){
    var row = rows[r]; if(!row) continue;
    var iso = toISODate(cF>=0?row[cF]:null, false);
    var monto = money(cM>=0?row[cM]:0);
    if(!iso || !monto) continue;
    // Normaliza el nombre del banco a la forma canónica (acepta "stg"/"STG", "banistmo", "general", etc.).
    var bancoRaw = cB>=0?String(row[cB]||"").trim():"";
    var banco = clasificarBancoPorTexto(bancoRaw);
    if(!banco && normTxt(bancoRaw).indexOf("GENERAL")!==-1) banco = "Banco General"; // "general" → Banco General
    if(!banco) banco = bancoRaw;
    var concepto = cC>=0?String(row[cC]||"").trim():"";
    var comprobante = cR>=0?String(row[cR]||"").trim():"";
    // Sentido: un cheque EMITIDO (pago / débito en circulación) compensa como DÉBITO en el estado. Se
    // detecta por la nota "débito en circulación" en la fila, o por el comprobante/referencia que empieza
    // con "PAY" (los pagos llevan referencia PAY). Por defecto, crédito (cobros/depósitos).
    var rowTxt = normTxt(row.join(" "));
    var sentido = (rowTxt.indexOf("DEBITO")!==-1 || /^PAY/i.test(comprobante)) ? "debito" : "credito";
    out.push({ fecha:iso, banco: banco, monto:monto, concepto: concepto,
               comprobante: comprobante, sentido: sentido });
  }
  return out;
}

// Línea del estado que es una "Remisión Clave" (compensación de tarjeta CLAVE).
function esRemisionClave(desc){ var n = normTxt(desc); return n.indexOf("REMISION")!==-1 && n.indexOf("CLAVE")!==-1; }
// Paso 0: valida que las partidas en tránsito de meses anteriores compensaron en los bancos de este mes.
// Una partida puede tardar semanas o meses, así que NO se limita por días: se empareja hacia adelante
// (la compensación nunca es anterior a la partida) con combinaciones. Según su TIPO compensa distinto:
//  - Cheque por depositar / depósito en tránsito → CRÉDITO del estado (depósito).
//  - Cheque EMITIDO (pago, "débito en circulación") → DÉBITO del estado (cargo).
//  - Clave en tránsito → crédito "Remisión Clave" del estado.
// Lo que no compensó sigue en tránsito y se arrastra al resumen del mes siguiente.
function paso0(transitoPrevio, estBanistmo, estStg, estBancoGeneral, ventanaDias, tolerancia){
  var estados = { "Banistmo": estBanistmo, "STG": estStg };
  if(estBancoGeneral) estados["Banco General"] = estBancoGeneral;
  var VENTANA = 366; // sin límite práctico (puede clarear meses después)
  var hallazgos = [];
  Object.keys(estados).forEach(function(banco){
    var items = transitoPrevio.filter(function(t){ return t.banco===banco; });
    if(!items.length) return;
    var estado = estados[banco] || [];
    var noAborted = function(x){ return normTxt((x.descripcion||"")+" "+(x.referencia||"")).indexOf("ABORTED")===-1; };
    // Pools del estado según cómo compensa cada tipo (con .usado para no reusar la misma línea).
    var poolDeb   = estado.filter(function(x){ return x.debito>0 && noAborted(x); }).map(function(x){ return {fecha:x.fecha, monto:x.debito, usado:false}; });   // cheques emitidos (pagos) → débito
    var poolCred  = estado.filter(function(x){ return x.credito>0 && noAborted(x); }).map(function(x){ return {fecha:x.fecha, monto:x.credito, usado:false}; });   // depósito en tránsito → cualquier crédito
    var poolDep   = estado.filter(function(x){ return x.credito>0 && esDepositoEstado(x.descripcion) && noAborted(x); }).map(function(x){ return {fecha:x.fecha, monto:x.credito, usado:false}; }); // cheques por depositar → depósito
    var poolClave = estado.filter(function(x){ return x.credito>0 && esRemisionClave(x.descripcion) && noAborted(x); }).map(function(x){ return {fecha:x.fecha, monto:x.credito, usado:false}; }); // clave → remisión clave
    // Clasifica cada partida y le asigna su pool de compensación (según concepto y sentido).
    function poolDe(item){
      if(item.sentido==="debito") return poolDeb;                          // cheque emitido (pago) → débito del estado
      var c = normTxt(item.concepto);
      if(c.indexOf("CLAVE")!==-1) return poolClave;                        // clave en tránsito → remisión clave
      if(c.indexOf("DEPOSITO")!==-1) return poolCred;                      // depósito en tránsito → cualquier crédito
      return poolDep;                                                      // cheque por depositar → depósito
    }
    var chs = items.map(function(t){ return {fecha:t.fecha, monto:t.monto, concepto:t.concepto, comprobante:t.comprobante, sentido:t.sentido, usado:false, pool:poolDe(t)}; });
    // Paso A: cada partida contra su pool, hacia adelante (una compensación por partida).
    chs.forEach(function(ch){
      if(ch.usado) return;
      var combo = buscarSubsetSuma(ch.pool, ch.fecha, ch.monto, VENTANA, tolerancia, 1, "adelante");
      if(combo){ combo.forEach(function(i){ ch.pool[i].usado=true; }); ch.usado=true; }
    });
    // Paso B: cada línea del estado no usada contra una combinación de partidas del MISMO pool (el banco
    // a veces junta varias en una), hacia atrás.
    [poolDeb, poolCred, poolDep, poolClave].forEach(function(pool){
      pool.forEach(function(d){
        if(d.usado) return;
        var candidatos = chs.filter(function(c){ return !c.usado && c.pool===pool; });
        var combo = buscarSubsetSuma(candidatos, d.fecha, d.monto, VENTANA, tolerancia, 12, "atras");
        if(combo){ combo.forEach(function(i){ candidatos[i].usado=true; }); d.usado=true; }
      });
    });
    // Partidas que no compensaron → siguen en tránsito (rotuladas con su concepto real).
    chs.forEach(function(ch){
      if(ch.usado) return;
      var etiqueta = (ch.concepto||"").trim() || "Partida en tránsito";
      hallazgos.push({ fecha:ch.fecha, banco:banco, monto:ch.monto, clase:"en_transito",
        concepto:ch.concepto, comprobante:ch.comprobante, motivo:"aún pendiente de compensar",
        texto:etiqueta+" de B/ "+fmt(ch.monto)+" ("+ch.fecha+", "+banco+") de un período anterior aún NO compensó este mes."+(ch.comprobante?" · Comprobante "+ch.comprobante:""),
        fuente:"Paso 0 — partidas en tránsito / Estado de cuenta "+banco });
    });
  });
  return hallazgos;
}
