  var ventInp = document.getElementById("ventana");
  var tolInp = document.getElementById("tolerancia");
  ventInp.addEventListener("change", function(){ STATE.options.ventanaDias = parseFloat(ventInp.value)||0; });
  tolInp.addEventListener("change", function(){
    var v = parseFloat(tolInp.value);
    if(isNaN(v) || v <= 0) v = 0.01;
    if(v > TOLERANCIA_MAX){
      v = TOLERANCIA_MAX;
      alert("La tolerancia máxima es B/ " + fmt(TOLERANCIA_MAX) + "." + "\n\n" +
            "Por encima de eso el cotejo empieza a dar por buenas diferencias reales y a dejar partidas " +
            "fuera del resumen en tránsito, sin avisar.");
    }
    STATE.options.tolerancia = v;
    tolInp.value = v;
  });

  var runBtn = document.getElementById("runBtn");
  var algunoListo = ["paso0"].concat(PASO_ORDEN).some(function(k){ return pasoListo(k); });
  if(algunoListo){
    document.getElementById("runNote").textContent = "Ejecuta los pasos con archivos completos; los demás se omiten.";
  } else {
    runBtn.disabled = true;
  }
  runBtn.onclick = ejecutarConciliacion;

  if(STATE.results) renderResultados();
}

function saldoCtxHtml(s, pasoKey){
  function bal(v){ return (v<0?"-":"")+"B/ "+fmt(Math.abs(v)); }
  var partes = [];
  if(s.inicial!==null) partes.push('saldo inicial'+(s.fechaInicial?" ("+s.fechaInicial+")":"")+': <b>'+bal(s.inicial)+'</b>');
  if(s.movimiento!==null) partes.push('movimiento del mes: <b>'+bal(s.movimiento)+'</b>');
  if(s.final!==null) partes.push('saldo final'+(s.fechaFinal?" ("+s.fechaFinal+")":"")+': <b>'+bal(s.final)+'</b>');
  var sub = pasoKey==="paso2"
    ? 'El saldo inicial es lo que quedó en tránsito del mes anterior y debía compensar este mes: validá que las entradas de los primeros días del banco lo cubren. Y lo del último día del mes queda en tránsito para el mes siguiente (ver "En tránsito").'
    : 'Ese saldo es dinero en tránsito arrastrado del mes anterior. Algunas partidas sin emparejar de este mes pueden corresponder a operaciones anteriores que compensan ahora — revísalas contra el saldo antes de darlas por diferencia.';
  return '<div class="saldo-ctx"><span class="ico">🔄</span><div class="txt">' +
    '<div class="saldo-line">Caja General — ' + partes.join(' · ') + '</div>' +
    '<div class="saldo-sub">' + sub + '</div>' +
    '</div></div>';
}

function renderResultados(){
  var area = document.getElementById("resultsArea");
  var r = STATE.results;
  var pasosMeta = [];
  // Paso 0 es obligatorio: siempre se muestra.
  pasosMeta.push({key:"paso0", corto:"Paso 0", titulo:"Paso 0 — Partidas en tránsito del mes anterior → bancos de este mes (obligatorio)"});
  pasosMeta.push(
    {key:"paso1", corto:"Paso 1", titulo:"Paso 1 — Reporte de cajeras vs. Diario Caja General"},
    {key:"paso2", corto:"Paso 2", titulo:"Paso 2 — Reporte / Caja General vs. Estados de cuenta bancarios"},
    {key:"paso3", corto:"Paso 3", titulo:"Paso 3 — Diario bancario vs. Estado de cuenta + validación VISA"}
  );
  var keysRender = pasosMeta.map(function(p){return p.key;});
  var totalRojas = keysRender.reduce(function(sum,k){ return sum + contarRojas(r[k]); }, 0);
  var totalSinConf = keysRender.reduce(function(sum,k){ return sum + contarSinConfirmar(r[k]); }, 0);

  // Las claves se calculan una vez por paso (clavesPaso) y findingHtml las consulta por índice: así el
  // tilde depende del contenido del hallazgo, no de dónde quedó en la lista.
  var clavesPaso = {};
  function findingHtml(p, item, idx){
    var ckKey = (clavesPaso[p.key] && clavesPaso[p.key][idx]) || (p.key+"_"+idx);
    var checked = STATE.checks[ckKey] ? "checked" : "";
    var montoTxt = (item.monto<0?"-":"")+"B/ "+fmt(Math.abs(item.monto));
    return '<div class="finding'+(STATE.checks[ckKey]?" done":"")+'">' +
      '<input type="checkbox" data-ck="'+ckKey+'" '+checked+'>' +
      // esc(): el texto lleva descripciones tomadas del Excel. Sin escapar, una celda con HTML se ejecuta
      // al renderizar y puede ocultar una diferencia de la pantalla.
      '<div class="ftxt">'+esc(item.texto)+'<span class="src">'+esc(item.fuente)+'</span>' +
        asientoHallazgoHtml(asientoDelHallazgo(item, p.key), p.key) + '</div>' +
      '<div class="famt">'+montoTxt+'</div></div>';
  }
  // Fila de subtotal (alineada con la columna de montos, con espaciador de la casilla).
  function filaTotal(label, monto){
    return '<div class="finding transito-total" style="border-top:2px solid var(--line)"><span style="width:18px;flex-shrink:0"></span>' +
      '<div class="ftxt"><b>'+label+'</b></div><div class="famt"><b>B/ '+fmt(monto)+'</b></div></div>';
  }
  // Una partida "en tránsito" es ENTRANTE si es una compensación del mes anterior (aparece el primer día);
  // el resto SALE al próximo mes (fin de mes o cheque pendiente por cambiar).
  function esTransitoEntrante(item){ return /mes anterior/i.test(item.motivo||""); }

  var html = '<div class="results-head"><h2>Hallazgos</h2><span style="display:flex;gap:14px;align-items:center">' +
    '<button class="btn-plegar" id="btnPlegarTodos" type="button"></button>' +
    '<button class="btn-export" id="exportBtn">Descargar checklist (Excel)</button></span></div>';
  html += periodosHtml(STATE.periodos); // primero: si un archivo es de otro mes, nada de lo demás es confiable
  html += integridadHtml(STATE.integridad);   // y si a un archivo le faltan lineas, tampoco
  html += integridadBancoHtml(STATE.integridadBanco); // idem al reves: navegador de banco incompleto
  // El total del resumen del Paso 0 tiene que ser el saldo inicial de Caja General. Va ACÁ ARRIBA y no
  // dentro del bloque del Paso 0: cuando la caja cuadra, los pasos sin diferencias no se dibujan y la
  // alerta quedaría invisible justo en el caso en que hay que verla.
  var cuadreP0 = cuadreSaldoInicialPaso0(STATE.transitoPrevio, STATE.saldoCajaGeneral, STATE.diarioCaja);
  // Sin saldo de apertura no hay cuadre del Paso 0, y ése es el control que avisa si el resumen en
  // tránsito está mal. Antes eso pasaba en silencio: el panel simplemente no salía.
  if(!cuadreP0 && STATE.diarioCaja && STATE.transitoPrevio && STATE.transitoPrevio.length){
    var sinSaldo = !STATE.saldoCajaGeneral || STATE.saldoCajaGeneral.inicial==null;
    if(sinSaldo){
      html += '<div class="per-panel per-grave"><div class="per-title">⛔ No se pudo leer el saldo de apertura de Caja General</div>' +
        '<p class="per-txt">El navegador de Caja General no trae la fila <b>"Balance Inicial (fecha):"</b> — suele pasar cuando el archivo se editó a mano y se borraron las filas de encabezado o de totales.</p>' +
        '<p class="per-nota">Sin esa cifra <b>no se puede validar el resumen del Paso 0</b>, que es el control que avisa si trae partidas de más o de menos. Volvé a exportar el navegador completo, sin recortarlo.</p></div>';
    }
  }
  html += cuadreSaldoIniHtml(cuadreP0);
  html += ajusteHtml(cuadreP0, ajustesEnCajaGeneral(STATE.diarioCaja));
  var totalTransito = keysRender.reduce(function(sum,k){ return sum + contarEnTransito(r[k]); }, 0);
  var totalAvisos = keysRender.reduce(function(sum,k){ return sum + contarAvisos(r[k]); }, 0);

  var todoCuadrado = tieneCuadreLimpio(PASO_ORDEN, r) && PASO_ORDEN.every(pasoCuadrado);
  // Barra resumen (chips) — siempre visible.
  html += '<div class="summary-bar">' +
    '<span class="chip'+(totalRojas===0?" ok":" alert")+'">'+totalRojas+' diferencia(s) en total</span>' +
    (totalSinConf>0 ? '<span class="chip warn">'+totalSinConf+' sin confirmar banco</span>' : '') +
    (totalTransito>0 ? '<span class="chip warn">'+totalTransito+' en tránsito</span>' : '') +
    (totalAvisos>0 ? '<span class="chip warn">'+totalAvisos+' a revisar antes de cerrar</span>' : '') +
    (cuadreP0 && !cuadreP0.ok ? '<span class="chip alert">Paso 0 vs saldo inicial: B/ '+fmt(cuadreP0.dif)+'</span>' : '');
  pasosMeta.forEach(function(p){
    var items = r[p.key];
    var chipTxt = items===undefined ? "—" : items===null ? "omitido" : String(contarRojas(items));
    html += '<span class="chip">'+p.corto+': '+chipTxt+'</span>';
  });
  html += '</div>';

  // Cuando la CAJA (Paso 1 y 2) cuadra, se muestra el cierre CONSOLIDADO de Caja General arriba, y abajo
  // SOLO los pasos que todavía tengan diferencias (no se repiten los cuadrados). Si la caja aún no cuadra,
  // se muestra el detalle por paso + el panel de partidas en tránsito.
  // Paso 0 de Caja General: detalle del saldo inicial (visible siempre que haya un saldo de Caja General).
  if(STATE.saldoCajaGeneral && STATE.saldoCajaGeneral.inicial!=null){ html += saldoIniDetalleHtml(); }
  var cajaLista = pasoCuadrado("paso1") && pasoCuadrado("paso2");
  if(cajaLista){
    html += cierreCajaHtml();
  }
  var tt = totalesEnTransitoPorBanco();
  if(!cajaLista && tt.count > 0){
    var bancosTxt = Object.keys(tt.porBanco).sort().map(function(b){
      var x = tt.porBanco[b];
      var detalle = x.otros>0.005 ? " (cheques B/ "+fmt(x.cheques)+" + otros B/ "+fmt(x.otros)+")" : "";
      return b + ": B/ " + fmt(x.total) + detalle;
    }).join("<br>");
    html += '<div class="cierre-panel"><div class="cierre-txt">' +
      '<div class="cierre-title">📋 Partidas en tránsito</div>' +
      '<div class="cierre-sub"><strong>Total en tránsito para el próximo mes: B/ '+fmt(tt.total)+'</strong> ('+tt.count+' partida(s))' +
      '<br>Cheques: B/ '+fmt(tt.cheques)+' · Otros depósitos (tarjeta/fin de mes): B/ '+fmt(tt.otros) +
      (bancosTxt ? '<br>'+bancosTxt : '') +
      '<br>Aún quedan diferencias por resolver; el resumen ya está listo (sale del Paso 0 y del Paso 2).</div>' +
      '</div><button class="btn-run" id="btnTransito">Descargar resumen en tránsito</button></div>';
    // El reporte de Caja General va SIEMPRE que haya saldo, cuadre o no: es el resumen final que se
    // imprime como papel de trabajo, y antes solo existía si los Pasos 1 y 2 cerraban — justo cuando
    // menos falta hace. Adentro avisa cuántas diferencias quedaban abiertas al emitirlo.
    html += desgloseSaldoCajaHtml();
    html += tablaTransitoHtml();
  }

  pasosMeta.forEach(function(p){
    var items = r[p.key];
    // Si la caja ya está cuadrada (cierre consolidado arriba), no repetimos los pasos que cuadran; solo
    // se muestran abajo los que todavía piden algo. Los AVISOS cuentan como "pide algo": son cosas a
    // revisar antes de cerrar (un ajuste manual, un dato mal escrito) y esconderlos justo cuando son lo
    // único que queda es la peor forma de perderlos.
    if(cajaLista && Array.isArray(items) && contarRojas(items)===0 && contarAvisos(items)===0) return;
    var esArray = Array.isArray(items);
    var bloqueado = items==="bloqueado";
    var cuadrado = esArray && contarRojas(items)===0;
    var rojas = esArray ? items.filter(function(i){return !esNoRojo(i);}) : [];
    var sinConf = esArray ? items.filter(esSinConfirmar) : [];
    var enTransito = esArray ? items.filter(esEnTransito) : [];
    var efectivo = esArray ? items.filter(esEfectivo) : [];
    var avisos = esArray ? items.filter(esAviso) : [];
    var informativos = esArray ? items.filter(esInformativo) : [];
    var countTxt = items===undefined ? "sin ejecutar" : items===null ? "omitido" : bloqueado ? "bloqueado"
      : (rojas.length+' diferencia(s)' + (sinConf.length? ' · '+sinConf.length+' sin confirmar' : '') + (enTransito.length? ' · '+enTransito.length+' en tránsito' : '') + (efectivo.length? ' · '+efectivo.length+' efectivo' : '') + (avisos.length? ' · '+avisos.length+' aviso(s)' : ''));
    if(esArray) clavesPaso[p.key] = clavesDeHallazgos(p.key, items);
    var idxPaso = PASO_ORDEN.indexOf(p.key);
    // Cada paso se puede recoger para sacarlo de la vista una vez revisado. El estado vive en las
    // preferencias, así que sobrevive a los re-render (cada tilde vuelve a dibujar la lista entera) y a
    // recargar la página. Al imprimir salen todos desplegados: el @media print lo fuerza con !important.
    var plegado = !!PLEGADOS[p.key];
    html += '<div class="step-block'+(cuadrado?' cuadrado':'')+(plegado?' plegado':'')+'">' +
      '<div class="step-head" data-plegar="'+p.key+'" role="button" tabindex="0" aria-expanded="'+(plegado?"false":"true")+'">' +
      '<span class="lado"><span class="chev">&#9662;</span><h4>'+p.titulo+'</h4></span>' +
      '<span class="count">'+countTxt+'</span></div><div class="step-body">';
    // Contexto del saldo inicial de Caja General (Pasos 2 y 3): dinero en tránsito arrastrado del mes anterior.
    if((p.key==="paso2" || p.key==="paso3") && esArray && STATE.saldoCajaGeneral){
      html += saldoCtxHtml(STATE.saldoCajaGeneral, p.key);
    }
    if(items===undefined){
      html += '<div class="empty-skip">Aún no se ejecutó este paso — usa "Ejecutar solo este paso" o el botón global.</div>';
    } else if(bloqueado){
      html += '<div class="empty-skip">🔒 Bloqueado — primero debe cuadrar el '+nombreCortoPaso(pasoPrevio(p.key))+'.</div>';
    } else if(items===null){
      html += '<div class="empty-skip">'+(p.key==="paso1"
        ? "Paso omitido: no se subió el reporte de cajeras."
        : "Paso omitido: faltan archivos de este paso.")+'</div>';
    } else {
      if(rojas.length===0){
        html += '<div class="empty-ok">Sin diferencias detectadas en este paso.</div>';
      } else {
        items.forEach(function(item, idx){ if(!esNoRojo(item)) html += findingHtml(p, item, idx); });
      }
      if(enTransito.length){
        var salen = enTransito.filter(function(i){ return !esTransitoEntrante(i); });
        var entraron = enTransito.filter(esTransitoEntrante);
        var totSalen = salen.reduce(function(s,i){ return s + i.monto; }, 0);
        var totEntraron = entraron.reduce(function(s,i){ return s + i.monto; }, 0);
        var head = entraron.length
          ? 'sale al próximo mes B/ '+fmt(totSalen)+' · entró del mes anterior B/ '+fmt(totEntraron)
          : 'Total B/ '+fmt(totSalen);
        html += '<div class="sinconf-block transito"><div class="sinconf-head">En tránsito ('+enTransito.length+') · '+head +
          '<span class="sinconf-sub">Partidas que aún no compensan (salen al próximo mes) o que compensaron este mes viniendo del anterior. No son diferencias.</span></div>';
        // Grupo 1: sale al próximo mes (fin de mes + cheques pendientes).
        items.forEach(function(item, idx){ if(esEnTransito(item) && !esTransitoEntrante(item)) html += findingHtml(p, item, idx); });
        if(salen.length) html += filaTotal(entraron.length ? "Sale al próximo mes" : "Total en tránsito de este paso", totSalen);
        // Grupo 2: entró del mes anterior (compensó este mes).
        if(entraron.length){
          items.forEach(function(item, idx){ if(esEnTransito(item) && esTransitoEntrante(item)) html += findingHtml(p, item, idx); });
          html += filaTotal("Entró del mes anterior (compensó este mes)", totEntraron);
        }
        html += '</div>';
      }
      if(sinConf.length){
        html += '<div class="sinconf-block"><div class="sinconf-head">Sin confirmar el banco ('+sinConf.length+')' +
          '<span class="sinconf-sub">La plata está en el sistema, pero el depósito no trae etiqueta de banco. Verifica manualmente.</span></div>';
        items.forEach(function(item, idx){ if(esSinConfirmar(item)) html += findingHtml(p, item, idx); });
        html += '</div>';
      }
      if(informativos.length){
        html += '<div class="sinconf-block"><div class="sinconf-head">Fuera del alcance de este paso ('+informativos.length+')' +
          '<span class="sinconf-sub">Se apartaron del cotejo a propósito. No son diferencias ni hay nada que corregir — se listan para que quede claro qué no se comparó.</span></div>';
        items.forEach(function(item, idx){ if(esInformativo(item)) html += findingHtml(p, item, idx); });
        html += '</div>';
      }
      if(avisos.length){
        html += '<div class="sinconf-block"><div class="sinconf-head">Revisar antes de cerrar ('+avisos.length+')' +
          '<span class="sinconf-sub">No son diferencias: son asientos que mueven el saldo y nadie valida (ajustes manuales), o datos mal escritos en el archivo de origen que conviene arreglar para el próximo cierre.</span></div>';
        items.forEach(function(item, idx){ if(esAviso(item)) html += findingHtml(p, item, idx); });
        html += '</div>';
      }
      if(efectivo.length){
        html += '<div class="sinconf-block efectivo"><div class="sinconf-head">Depósitos en efectivo — Brinks ('+efectivo.length+')' +
          '<span class="sinconf-sub">Movimientos "Ach De Brinks Panama" del estado de cuenta: son el efectivo del reporte de cajeras, no una diferencia.</span></div>';
        items.forEach(function(item, idx){ if(esEfectivo(item)) html += findingHtml(p, item, idx); });
        html += '</div>';
      }
      // Etiqueta CUADRADO al pie del bloque cuando el paso no tiene diferencias rojas.
      if(cuadrado) html += '<div class="cuadrado-badge">CUADRADO</div>';
    }
    html += '</div></div>';
  });
  html += pieModulo1Html();   // trazabilidad: con qué archivos y con qué versión salió esto
  area.innerHTML = html;

  area.querySelectorAll('input[type=checkbox]').forEach(function(cb){
    cb.addEventListener("change", function(){
      var k = cb.getAttribute("data-ck");
      STATE.checks[k] = cb.checked;
      renderResultados();
    });
  });
  bindPlegado(area);              // recoger / desplegar cada paso
  document.getElementById("exportBtn").onclick = exportarChecklist;
  var btnT = document.getElementById("btnTransito");
  if(btnT) btnT.onclick = exportarEnTransito;
  bindAjusteCopy(cuadreP0);       // botón "copiar el asiento" del ajuste sugerido
  if(cajaLista) bindCajaInputs(); // campos editables del cierre de Caja General (saldo inicial / sistema)
  bindPrintCG();                  // boton "Imprimir" propio del reporte de Caja General
  bindSaldoIniDetalle(); // Paso 0: detalle editable del saldo inicial (manual o por Excel)
}

/* ---- Trazabilidad de los reportes del Módulo 1 ----
   Un papel de trabajo sin período, sin fecha de emisión y sin versión de la herramienta no se puede
   auditar: nadie puede reconstruir con qué se hizo. Además fue lo que impidió distinguir un resumen en
   tránsito viejo de uno nuevo cuando arrastraba partidas que ya habían compensado. El Módulo 2 ya lo
   resuelve en pantalla con pieReporteHtml; acá va en los dos Excel y también en pantalla. */
function ahoraTexto(){
  var a = new Date();
  function dd(n){ return String(n).padStart(2,"0"); }
  return a.getFullYear()+"-"+dd(a.getMonth()+1)+"-"+dd(a.getDate())+" "+dd(a.getHours())+":"+dd(a.getMinutes());
}
// Período de trabajo: el mes que la validación de períodos determinó por mayoría de archivos; si no está,
// el rango que declara el navegador de Caja General.
function periodoTrabajo(){
  if(STATE.periodos && STATE.periodos.mesTrabajo) return mesLargo(STATE.periodos.mesTrabajo);
  var s = STATE.saldoCajaGeneral;
  if(s && (s.fechaInicial || s.fechaFinal)) return (s.fechaInicial||"?")+" al "+(s.fechaFinal||"?");
  return "—";
}
// Los archivos que se usaron, con su nombre real: sin esto no se sabe si el reporte salió del navegador
// correcto (pasó con "BANISTMO ENERO 2026.xlsx", que traía movimientos de julio).
function archivosUsados(){
  return Object.keys(FILE_LABELS).filter(function(k){ return STATE.files[k]; }).map(function(k){
    var f = STATE.files[k];
    return { rol: FILE_LABELS[k], nombre: f.name || "—" };
  });
}
function filasTraza(titulo){
  var o = STATE.options || {};
  var filas = [
    [titulo],
    ["Período de trabajo", periodoTrabajo()],
    ["Generado", ahoraTexto()],
    ["Versión de la herramienta", APP_VERSION],
    ["Ventana de días / tolerancia", (o.ventanaDias!=null?o.ventanaDias:"—")+" días / B/ "+fmt(o.tolerancia!=null?o.tolerancia:0)],
    ["Archivos usados", ""]
  ];
  archivosUsados().forEach(function(a){ filas.push(["   "+a.rol, a.nombre]); });
  filas.push([]);
  return filas;
}
// El mismo pie, en pantalla, al cierre del reporte.
function pieModulo1Html(){
  var o = STATE.options || {};
  var arch = archivosUsados();
  return '<div class="pie-rep">' +
    '<div class="pie-fila"><span>Reporte</span><b>Conciliación de Caja General y bancos</b></div>' +
    '<div class="pie-fila"><span>Período de trabajo</span><b>'+esc(periodoTrabajo())+'</b></div>' +
    '<div class="pie-fila"><span>Archivos usados</span><b>'+arch.length+'</b></div>' +
    arch.map(function(a){ return '<div class="pie-fila"><span>   '+esc(a.rol)+'</span><b>'+esc(a.nombre)+'</b></div>'; }).join("") +
    '<div class="pie-fila"><span>Ventana de días / tolerancia</span><b>'+(o.ventanaDias!=null?o.ventanaDias:"—")+' días / B/ '+fmt(o.tolerancia!=null?o.tolerancia:0)+'</b></div>' +
    '<div class="pie-fila"><span>Generado</span><b>'+ahoraTexto()+'</b></div>' +
    '<div class="pie-fila"><span>Versión de la herramienta</span><b>'+APP_VERSION+'</b></div>' +
    '<div class="pie-firmas"><div><span>Preparado por</span><i></i></div><div><span>Revisado por</span><i></i></div></div>' +
  '</div>';
}
function exportarChecklist(){
  var r = STATE.results;
  var rows = filasTraza("Checklist de conciliación — Caja General y bancos");
  rows.push(["Paso","Fecha","Banco","Monto","Estado","Hallazgo","Fuente","Corregido"]);
  var cP0 = cuadreSaldoInicialPaso0(STATE.transitoPrevio, STATE.saldoCajaGeneral, STATE.diarioCaja);
  if(cP0 && !cP0.ok){
    rows.push(["Paso 0", cP0.fecha||"", "", cP0.dif, "Corregir archivo de origen",
      "El resumen del Paso 0 suma B/ "+fmt(cP0.total)+" y el saldo inicial de Caja General es B/ "+fmt(cP0.saldoInicial)+
      " — diferencia B/ "+fmt(cP0.dif)+". El resumen está incompleto o trae partidas de más.",
      "Resumen en tránsito del mes anterior / Navegador de Caja General", ""]);
    var aj = ajusteCajaGeneral(cP0);
    rows.push(["Paso 0", aj.fecha, "", aj.monto, "Asiento de ajuste sugerido",
      aj.columna+" a "+aj.cuenta+" por B/ "+fmt(aj.monto)+". "+aj.concepto,
      "Navegador de Caja General", ""]);
  }
  var pasosMeta = [["Paso 0","paso0"],["Paso 1","paso1"],["Paso 2","paso2"],["Paso 3","paso3"]];
  pasosMeta.forEach(function(p){
    var label = p[0], key = p[1], items = r[key];
    if(items===undefined){
      rows.push([label, "", "", "", "", "Paso no ejecutado en esta sesión.", "", ""]);
      return;
    }
    if(items===null){
      rows.push([label, "", "", "", "", key==="paso1"
        ? "Paso omitido: no se subió el reporte de cajeras."
        : "Paso omitido: faltan archivos de este paso.", "", ""]);
      return;
    }
    var clavesExp = clavesDeHallazgos(key, items);
    items.forEach(function(item, idx){
      var ckKey = clavesExp[idx];
      var estado = esSinConfirmar(item) ? "Sin confirmar banco" : esEnTransito(item) ? "En tránsito" : esEfectivo(item) ? "Efectivo (Brinks)" : esAviso(item) ? "Corregir archivo de origen" : esInformativo(item) ? "Fuera del alcance" : "Diferencia";
      rows.push([label, item.fecha, item.banco, item.monto, estado, item.texto, item.fuente, STATE.checks[ckKey] ? "Sí" : "No"]);
    });
  });
  var ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [{wch:8},{wch:12},{wch:10},{wch:12},{wch:18},{wch:70},{wch:40},{wch:10}];
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Hallazgos");
  XLSX.writeFile(wb, "checklist_conciliacion_caja_general.xlsx");
}

/* ---------------- Resumen de partidas en tránsito (para el Paso 0 del próximo mes) ---------------- */
// Junta todas las partidas "en tránsito" de los resultados (principalmente del Paso 2).
// Arma el resumen de lo que queda en tránsito para el próximo mes. Se toma de:
//  - Paso 0: cheques de meses anteriores que AÚN no compensaron (se siguen arrastrando).
//  - Paso 2: lo que Caja General depositó este mes y no clareó en el banco (cheques por cambiar,
//    depósitos de fin de mes). Es la vista "lo que depositamos que no clareó".
// NO se toma de Paso 3 (diario bancario vs estado): duplicaría los ítems de fin de mes de Paso 2 y
// además incluye compensaciones de ENTRADA del mes anterior (primer día), que no se arrastran.
// ¿La partida del Paso 3 ya está en lo recolectado? Se compara por banco y día contra una COMBINACIÓN,
// no partida por partida: el mismo depósito puede venir partido en el Paso 2 (detalle de cheques,
// 181.13 + 336.18) y entero en el Paso 3 (un solo asiento del diario, 517.31). Lo que se usa para cubrir
// queda marcado, para que dos partidas distintas del Paso 3 no se tapen con las mismas del Paso 2.
// La misma partida puede aparecer en dos pasos con fechas DISTINTAS: el Paso 2 usa la fecha del reporte
// de cajeras (el cheque se recibio el 11-feb) y el Paso 3 la del asiento (se digito el 12-feb). Exigir
// fecha exacta la contaba dos veces, asi que el emparejamiento acepta la ventana de dias del cotejo.
// La misma partida puede aparecer en dos pasos con fechas DISTINTAS: el Paso 2 usa la fecha del reporte
// de cajeras (el cheque se recibio el 11-feb) y el Paso 3 la del asiento (se digito el 12-feb). Exigir
// fecha exacta la contaba dos veces, asi que el emparejamiento acepta la ventana de dias del cotejo.
// `_cubrio` anota EN QUE PASO cubrio, no un simple si/no: el Yappy de junio lo veian el Paso 0, el 2 y el
// 3, y al marcarla consumida en el Paso 2 dejaba de estar disponible para el 3, que la volvia a sumar.
// Dentro de un mismo paso sigue sin poder cubrir dos veces: dos cheques iguales del mismo dia son dos
// partidas reales y taparian una a la otra.
// El concepto de una partida contra el metodo que declara una parte del consolidado. Sin esto, cualquier
// partida chica cabria en el saldo de cualquier parte: un deposito de ventanilla de 9.02 se comia el
// saldo de la parte VISA y desaparecia del resumen.
function mismoMetodoParte(concepto, metodo){
  var c = normTxt(concepto), m = normTxt(metodo);
  if(!c || !m) return false;
  if(m.indexOf("CHEQUE")!==-1 || m==="CK") return esChequeDesc(concepto);
  if(m.indexOf("VISA")!==-1) return c.indexOf("VISA")!==-1 || c.indexOf("V/MC")!==-1;
  if(m.indexOf("CLAVE")!==-1) return c.indexOf("CLAVE")!==-1;
  if(m.indexOf("YAPPY")!==-1) return c.indexOf("YAPPY")!==-1;
  if(m.indexOf("EFECTIVO")!==-1) return esDepositoEfectivo(concepto);
  if(m.indexOf("ACH")!==-1) return c.indexOf("ACH")!==-1;
  return false;
}
function yaCubiertoEnTransito(recolectado, it, paso){
  var VENT = (STATE.options && STATE.options.ventanaDias) || 3;
  var pool = [];
  recolectado.forEach(function(x){
    if(String(x.banco||"")!==String(it.banco||"")) return;
    if(x._cubrio && x._cubrio[paso]) return;
    pool.push({fecha:x.fecha, monto:x.monto, usado:false, ref:x});
  });
  if(!pool.length) return false;
  // Una partida puede ser PARTE de un consolidado que ya vio otro paso: el 30-jun-2026 el Paso 2 trajo el
  // asiento de 280.21 de Caja General (VISA 91.26 + CLAVE 188.95) y el Paso 3 la CLAVE de 188.95 por
  // separado. Y una PARTE puede a su vez venir partida: el consolidado del 27-feb-2026 (3,571.60) incluye
  // CHEQUE 1,463.08, que el detalle del informe trae como doce cheques sueltos.
  // Por eso no se marca la previa como consumida: se le descuenta a la parte que corresponda hasta
  // agotarla. La fecha tiene que ser la misma — con ventana, un cheque del dia siguiente se comeria el
  // saldo del dia anterior.
  for(var p=0;p<pool.length;p++){
    var prev = pool[p].ref;
    // La venta sin deposito nunca es parte de otra partida: su calculo ya descuenta lo que el Paso 1 dejo en
    // transito ese dia. Dejarla pasar por el desglose la hacia desaparecer: el 28-mar-2026 los 65.10 de venta
    // sin deposito se "cubrian" con los 189.31 de efectivo que reporto la cajera y salian del resumen.
    if(!prev || !prev.partes || !prev.partes.length || paso === "ventas") continue;
    if(String(prev.fecha||"") !== String(it.fecha||"")) continue;
    if(!prev._saldoPartes) prev._saldoPartes = prev.partes.map(function(x){ return x.monto; });
    for(var q=0;q<prev._saldoPartes.length;q++){
      if(!mismoMetodoParte(it.concepto, prev.partes[q].metodo)) continue;
      if(prev._saldoPartes[q] >= it.monto - 0.01){
        prev._saldoPartes[q] = Math.round((prev._saldoPartes[q] - it.monto)*100)/100;
        return true;
      }
    }
  }
  var combo = buscarSubsetSuma(pool, it.fecha, it.monto, VENT, 0.01, 8);
  if(!combo) return false;
  combo.forEach(function(i){
    var r = pool[i].ref;
    if(!r._cubrio) r._cubrio = {};
    r._cubrio[paso] = true;
  });
  return true;
}
function recolectarEnTransito(){
  var r = STATE.results || {};
  var entrante = function(it){ return /mes anterior/i.test(it.motivo||""); };
  // Se recorren TODOS los pasos: cada uno ve una parte distinta del tránsito y ninguno lo ve entero.
  // El Paso 2 rutea desde Caja General por banco, así que no ve el efectivo (Brinks y ventanilla no
  // llevan etiqueta de banco); ese solo aparece en el Paso 3, cotejando el diario del banco contra su
  // estado. En enero eran 1,354.25 en cinco partidas del 28 al 31 que quedaban fuera del resumen.
  var pasos = ["paso0","paso1","paso2","paso3"];
  pasos.forEach(function(k){ if(Array.isArray(r[k])) r[k].forEach(function(x){ delete x._cubrio; delete x._saldoPartes; }); });
  var out = [];
  pasos.forEach(function(k){
    if(!Array.isArray(r[k])) return;
    // La deduplicación se hace SOLO contra los pasos anteriores. Dentro de un mismo paso no: dos cheques
    // del mismo importe y del mismo día son dos partidas reales, y se taparían entre sí.
    var previos = out.slice();
    var nuevos = [];
    r[k].forEach(function(it){
      if(!esEnTransito(it) || entrante(it)) return;   // lo entrante ya compensó: no se arrastra
      if(yaCubiertoEnTransito(previos, it, k)) return;   // el mismo depósito que ya vio otro paso
      it._paso = k;
      nuevos.push(it);
    });
    out = out.concat(nuevos);
  });
  // Y al final, las ventas que entraron a la cuenta y no salieron por ningun deposito. No las ve
  // ningun paso —no hay linea de banco que cotejar, justamente porque falta— pero son plata que sigue
  // pendiente de depositar y tiene que viajar al mes siguiente igual que el resto.
  var vsd = [];
  try{ vsd = partidasVentaSinDeposito(); }catch(e){ vsd = []; }
  vsd.forEach(function(it){ if(!yaCubiertoEnTransito(out, it, "ventas")) out.push(it); });
  return out;
}

/* ---- De que lado esta cada partida en transito ----
   El resumen de transito y el saldo de Caja General se miran desde lados distintos, y la diferencia entre
   los dos solo se explica bien si de CADA partida se sabe si su credito a Caja General ya se hizo o no.

   Antes esto se calculaba por resta: "transito dentro de la cuenta" se armaba recorriendo el Paso 0 y los
   cheques del Paso 2 por su cuenta, y lo demas salia de restarlo del total del resumen. Dos errores:
   contaba cheques del Paso 2 que el resumen ya habia descartado por estar dentro de un consolidado
   (1,643.08 en febrero de 2026) y no contaba los depositos de fin de mes del Paso 1, que son justamente
   los que TODAVIA estan en la cuenta (6,234.12 el mismo mes). El panel terminaba diciendo que 9,856.78
   ya habian salido de Caja General mientras su propia tabla listaba 11,499.86, y el residuo de
   retenciones se inflaba a 7,257.47 cuando los cargos del mes eran 1,268.76.

   Ahora las dos caras salen de recorrer UNA sola lista —el resumen en transito— y clasificar partida por
   partida, asi que la tabla suma siempre su propio total. */
function transitoSigueEnCaja(it){
  // Politica validada por Diba (15-sep-2026): cheque y Brinks se acreditan en Caja General al DEPOSITAR;
  // el deposito de fin de mes y la VISA acumulada, al COMPENSAR. Cada partida se clasifica por la evidencia
  // (si el credito existe en el diario) y el resultado viaja al mes siguiente en el resumen.
  // El Paso 0 son partidas viejas: siguen dentro salvo que el cierre anterior diga que su credito ya se hizo.
  if(it._paso === "paso0") return it.creditoCG !== "hecho";
  // El Paso 1 marca lo que la cajera reporto y Caja General no tiene acreditado: sigue dentro por definicion.
  if(it._paso === "paso1") return true;
  // Una venta sin deposito no salio de la cuenta por definicion: entro y no salio.
  if(it._paso === "ventas") return true;
  // Un cheque del detalle sigue dentro mientras su deposito no se haya asentado.
  if(it._paso === "paso2" && it.concepto === "Cheque (detalle individual)") return !it._yaAcreditada;
  // El resto (VISA acumulada, Brinks, ventanilla) ya tiene su credito: su transito es del lado del banco.
  return false;
}
function clasificarTransito(){
  marcarChequesAcreditados();
  var dentro = [], fuera = [];
  recolectarEnTransito().forEach(function(x){ (transitoSigueEnCaja(x) ? dentro : fuera).push(x); });
  function suma(a){ return Math.round(a.reduce(function(s,x){ return s+(x.monto||0); },0)*100)/100; }
  return { dentro:dentro, fuera:fuera, totalDentro:suma(dentro), totalFuera:suma(fuera) };
}

// Un ítem en tránsito es cheque si su concepto/texto lo dice (Paso 0 y detalle de cheques); el resto
// (tarjetas VISA/CLAVE, Yappy de fin de mes) son "otros depósitos".
function esChequeEnTransito(it){
  return esChequeDesc((it.concepto||"") + " " + (it.texto||""));
}
// Total en tránsito desglosado por banco y por tipo (cheque vs otros), para mostrarlo al cerrar el módulo.
function totalesEnTransitoPorBanco(){
  var items = recolectarEnTransito();
  var porBanco = {}; var totCheques = 0, totOtros = 0;
  items.forEach(function(it){
    var b = it.banco||"—";
    if(!porBanco[b]) porBanco[b] = {cheques:0, otros:0, total:0};
    if(esChequeEnTransito(it)){ porBanco[b].cheques += it.monto; totCheques += it.monto; }
    else { porBanco[b].otros += it.monto; totOtros += it.monto; }
    porBanco[b].total += it.monto;
  });
  return { porBanco: porBanco, cheques: totCheques, otros: totOtros, total: totCheques+totOtros, count: items.length };
}
// Método de pago de una partida en tránsito (según su concepto/texto), para el resumen del cierre.
function metodoTransito(it){
  var t = normTxt((it.concepto||"")+" "+(it.texto||""));
  if(t.indexOf("VISA")!==-1) return "Tarjeta VISA";
  if(t.indexOf("CLAVE")!==-1) return "Tarjeta CLAVE";
  if(t.indexOf("YAPPY")!==-1) return "Yappy";
  if(esBrinks(t) || t.indexOf("EFECTIVO")!==-1) return "Efectivo (Brinks)";
  if(esChequeEnTransito(it)) return "Cheque";
  if(t.indexOf("ACH")!==-1) return "ACH";
  return "Otro depósito";
}
/* ---- Historial en transito, partida por partida ----
   El motor arrastra TODO lo que no compensa de un mes al siguiente, sin limite de tiempo (un cheque
   puede compensar hasta 4 meses despues). Pero cuando la caja cuadra, el cierre solo mostraba totales
   por metodo: las partidas viejas quedaban invisibles y no habia forma de notar un deposito que una
   cajera omitio. Esta tabla muestra cada partida con su fecha, marca las que vienen arrastrandose de
   meses anteriores y alerta cuando un cheque supera los 4 meses (ya ni el banco lo va a aceptar). */
function mesTrabajoActual(){
  if(STATE.periodos && STATE.periodos.mesTrabajo) return STATE.periodos.mesTrabajo;
  var s = STATE.saldoCajaGeneral;
  return (s && s.fechaFinal) ? s.fechaFinal.slice(0,7) : null;
}
function tablaTransitoHtml(){
  var items = recolectarEnTransito().slice().sort(function(a,b){ return String(a.fecha).localeCompare(String(b.fecha)); });
  if(!items.length) return "";
  var mesW = mesTrabajoActual();
  var finMes = STATE.saldoCajaGeneral && STATE.saldoCajaGeneral.fechaFinal;
  var h = '<div class="cg-box cg-hist"><div class="cg-h">Historial en tránsito · partida por partida</div>' +
    '<table class="dif-tabla"><thead><tr><th>Fecha</th><th>Banco</th><th>Concepto</th><th class="num">Monto</th></tr></thead><tbody>';
  var arrastre = 0, vencidos = 0;
  items.forEach(function(it){
    var viejo = mesW && it.fecha && it.fecha.slice(0,7) < mesW;
    if(viejo) arrastre++;
    var edad = (finMes && it.fecha) ? daysBetween(it.fecha, finMes) : 0;
    var vencido = esChequeEnTransito(it) && edad > 122;   // 4 meses: limite para presentar un cheque
    if(vencido) vencidos++;
    var nota = vencido ? ' <i class="tr-venc">más de 4 meses — verificá si el depósito se omitió</i>'
             : viejo ? ' <i class="tr-viejo">arrastre de ' + mesLargo(it.fecha.slice(0,7)) + '</i>' : "";
    h += '<tr'+(vencido?' class="tr-mal"':"")+'><td>'+esc(it.fecha||"")+'</td><td>'+esc(it.banco||"")+'</td><td>'+
         esc(String(it.concepto||"").slice(0,46))+nota+'</td><td class="num">'+fmt(it.monto)+'</td></tr>';
  });
  h += '</tbody></table><div class="cg-note">'+items.length+' partida(s).' +
    (arrastre ? ' <b>'+arrastre+' viene(n) arrastrándose de meses anteriores</b> — siguen acá hasta que compensen en el banco: así se detecta un depósito omitido.' : "") +
    ' Todas viajan en el Excel del resumen para el Paso 0 del mes siguiente.</div></div>';
  return h;
}
function transitoPorMetodo(){
  var items = recolectarEnTransito();
  var porMetodo = {}; var total = 0;
  items.forEach(function(it){ var m = metodoTransito(it); porMetodo[m] = (porMetodo[m]||0) + it.monto; total += it.monto; });
  return { porMetodo: porMetodo, total: total, count: items.length };
}
// Panel de cierre de Caja General: en tránsito por método de pago + balance editable
// (saldo inicial + movimiento en tránsito = saldo final esperado, comparado con el saldo del sistema).
/* ---- De qué está hecho el saldo de Caja General ----
   El saldo contable al cierre NO es el tránsito, y la diferencia desconcierta todos los meses (enero:
   18,191.26 contra 4,221.14). Se descompone en sus tres partes para que se vea de dónde sale cada una:
     · lo que queda en tránsito y sale al próximo mes,
     · la apertura que YA compensó en el banco y que nadie descargó de Caja General (el asiento de baja no
       existe: la cuenta se acredita al registrar el depósito, no cuando el banco lo refleja),
     · el resto del movimiento del mes, que son las retenciones y comisiones de tarjeta — la venta entra
       BRUTA y el depósito sale NETO, así que la diferencia se queda en la cuenta.
   Es un desglose, no un control: el tercer renglón se obtiene por diferencia y absorbe cualquier resto. */
// Descargos YA asentados este mes, segun los hallazgos informativos de los pasos. El mismo asiento lo
// ven varios pasos (el credito en Caja General y el debito en el diario del banco), asi que se
// deduplica por banco|fecha|centavos antes de sumar.
function totalDescargado(){
  var r = STATE.results || {};
  var visto = {}, total = 0;
  ["paso1","paso2","paso3"].forEach(function(k){
    (Array.isArray(r[k])?r[k]:[]).forEach(function(x){
      if(x.clase!=="informativo" || String(x.concepto||"").indexOf("Descargo")===-1) return;
      var c = (x.banco||"")+"|"+(x.fecha||"")+"|"+Math.round((x.monto||0)*100);
      if(visto[c]) return;
      visto[c] = true; total += x.monto||0;
    });
  });
  return Math.round(total*100)/100;
}
// Un cheque del detalle sigue DENTRO de Caja General hasta que su deposito se asienta (credito CK en el
// diario). Si ese credito existe, el cheque ya salio de la cuenta: su transito es del lado del banco.
// Marca _yaAcreditada en los items del Paso 2 cuyo deposito consolidado ya se asento. Los creditos que
// son descargos del mes anterior se excluyen: esos no depositan cheques de este mes.
function marcarChequesAcreditados(){
  var r = STATE.results || {};
  var p2 = Array.isArray(r.paso2) ? r.paso2 : [];
  p2.forEach(function(x){ delete x._yaAcreditada; });
  var diario = STATE.diarioCaja || [], det = STATE.chequesDetalle || [];
  if(!diario.length || !det.length) return;
  var descKeys = clavesDescargo(r);
  // El credito consolida TODOS los cheques del dia (tambien los ya compensados), asi que el pool es el
  // detalle completo del reporte, no solo los pendientes.
  var pool = det.map(function(x){ return {fecha:x.fecha, monto:x.monto, usado:false, depositado:false}; });
  diario.forEach(function(cr){
    if(!(cr.credito>0)) return;
    if(!esChequeDesc(cr.descripcion)){
      // El asiento puede no decirlo (al del 15-abr-2026 se le cayo el "CK"). Se acepta solo si el detalle del
      // informe de ESE dia y banco suma EXACTAMENTE el credito: es el deposito de esos cheques y ya salieron
      // de Caja General. Sin la igualdad exacta no se toca — un credito de tarjeta no es un cheque.
      var bkCr = clasificarBancoPorTexto(cr.descripcion);
      if(!bkCr) return;
      var totCk = Math.round(det.filter(function(x){ return x.banco===bkCr && x.fecha===cr.fecha; })
                                .reduce(function(a,x){ return a+x.monto; },0)*100)/100;
      if(!(totCk > 0.005) || Math.abs(totCk - cr.credito) > 0.01) return;
    }
    if(consumirClaveDescargo(descKeys, cr.fecha, cr.credito)) return;
    var combo = buscarSubsetSuma(pool, cr.fecha, cr.credito, 40, 0.01, 15, "atras");
    if(combo) combo.forEach(function(i){ pool[i].usado = true; pool[i].depositado = true; });
  });
  p2.forEach(function(x){
    if(!esEnTransito(x) || x.concepto!=="Cheque (detalle individual)") return;
    for(var i=0;i<pool.length;i++){
      var p = pool[i];
      if(p.depositado && p.fecha===x.fecha && Math.abs(p.monto-x.monto)<0.005){
        p.depositado = false; x._yaAcreditada = true; return;
      }
    }
  });
}
// Partidas del Paso 0 que YA compensaron en el banco este mes y todavia no tienen su asiento de descargo.
// Son las que componen el renglon "Apertura que ya compenso en el banco": plata que el banco ya acredito
// pero que sigue registrada en Caja General, asi que infla el saldo contra el transito real.
function partidasApertura(){
  var r = STATE.results || {};
  var descargadas = {};
  function k(banco, fecha, monto){ return String(banco||"")+"|"+String(fecha||"")+"|"+Math.round((monto||0)*100); }
  var vistos = {};
  ["paso1","paso2","paso3"].forEach(function(p){
    (Array.isArray(r[p])?r[p]:[]).forEach(function(x){
      if(x.clase!=="informativo" || String(x.concepto||"").indexOf("Descargo")<0 || !x.partidas) return;
      var idAsiento = k(x.banco, x.fecha, x.monto);
      if(vistos[idAsiento]) return;   // el mismo asiento lo ven varios pasos
      vistos[idAsiento] = true;
      x.partidas.forEach(function(p2){
        var c = k(p2.banco, p2.fecha, p2.monto);
        descargadas[c] = (descargadas[c]||0) + 1;
      });
    });
  });
  var pend = (Array.isArray(r.paso0)?r.paso0:[]).filter(function(x){
    if(!esEnTransito(x) || !/mes anterior/i.test(x.motivo||"")) return false;
    // Su credito a Caja General se hizo al depositar: compensar no deja nada que descargar.
    if(x.creditoCG==="hecho") return false;
    // El Paso 0 reporta la partida con la fecha en que COMPENSO; el descargo la referencia con su fecha
    // original, asi que el cruce va por banco + importe (y consume una sola vez cada una).
    var hit = null;
    Object.keys(descargadas).forEach(function(c){
      if(hit || !descargadas[c]) return;
      var p = c.split("|");
      if(p[0]===String(x.banco||"") && Math.abs(parseInt(p[2],10)/100 - x.monto) < 0.005) hit = c;
    });
    if(hit){ descargadas[hit]--; return false; }
    return true;
  });
  /* Un descargo registrado en Caja General que no nombra banco ("Descargo de partidas que venian en transito
     del mes anterior...") lo reconoce el Paso 3 buscando su otra mitad en el diario del banco. Si esa mitad
     no esta —el 02-feb-2026 los 246.20 de la CLAVE STG del 31-ene se acreditaron en Caja General y el
     navegador de St. Georges no tiene el debito—, el asiento igual existe y ya saco la partida de Caja
     General: pedirlo otra vez lo haria registrar dos veces. Se cruza por importe contra lo pendiente. */
  var reconocidas = [];
  ["paso1","paso2","paso3"].forEach(function(p){
    (Array.isArray(r[p])?r[p]:[]).forEach(function(x){
      if(x.clase==="informativo" && String(x.concepto||"").indexOf("Descargo")>=0) reconocidas.push({ fecha:x.fecha, monto:x.monto });
    });
  });
  (STATE.diarioCaja||[]).forEach(function(l){
    if(!(l.credito>0) || !esDescargoDesc(l.descripcion) || clasificarBancoPorTexto(l.descripcion)) return;
    for(var q=0;q<reconocidas.length;q++){
      if(reconocidas[q] && reconocidas[q].fecha===l.fecha && Math.abs(reconocidas[q].monto - l.credito) < 0.005){ reconocidas[q] = null; return; }
    }
    var pool = pend.map(function(x){ return { fecha:l.fecha, monto:x.monto, usado:!!x._descargoCG, x:x }; });
    var combo = buscarSubsetSuma(pool, l.fecha, l.credito, 0, 0.01, 12);
    if(combo) combo.forEach(function(k){ pool[k].x._descargoCG = true; });
  });
  var out = pend.filter(function(x){ return !x._descargoCG; });
  pend.forEach(function(x){ delete x._descargoCG; });
  return out;
}
function desgloseSaldoCaja(){
  var s = STATE.saldoCajaGeneral;
  if(!s || s.final==null) return null;
  var p0 = (STATE.results && STATE.results.paso0) || [];
  var p2 = (STATE.results && STATE.results.paso2) || [];
  var entrante = function(x){ return /mes anterior/i.test(x.motivo||""); };
  function suma(arr, f){
    return Math.round((Array.isArray(arr)?arr:[]).filter(f).reduce(function(a,b){ return a+b.monto; },0)*100)/100;
  }
  // Solo el tránsito que sigue DENTRO de Caja General: lo que quedó pendiente del Paso 0 y lo que el
  // Paso 2 no vio compensar. El efectivo que detecta el Paso 3 (Brinks, ventanilla) ya está acreditado en
  // Caja General —su tránsito es del lado del BANCO—, así que va al resumen del Paso 0 pero no compone
  // este saldo. Sin la distinción el renglón de retenciones salía negativo.
  // Dentro de Caja General sigue lo que no tiene asiento de salida; el resto ya se acredito y su
  // transito es del lado del banco. Las dos caras salen de clasificar el MISMO resumen, partida por
  // partida: calcularlas por separado dejaba tablas que no sumaban su total.
  var clas = clasificarTransito();
  var transitoCaja = clas.totalDentro;
  // De lo que compensó durante el mes, cuánto sigue DENTRO del saldo. No se puede asumir que está todo:
  // si el descargo ya se hizo, restarlo otra vez deja el renglón de retenciones en un número absurdo
  // (pasó al registrar el descargo de enero: daba −12,037.82). Se deduce del propio saldo de apertura —
  // lo que el navegador abre menos lo que el Paso 0 dice que sigue pendiente es lo que compensó y no se
  // descargó todavía.
  var pendientePaso0 = suma(p0, function(x){ return esEnTransito(x) && !entrante(x); });
  var cuadre = cuadreSaldoInicialPaso0(STATE.transitoPrevio, s, STATE.diarioCaja);
  var apertura = cuadre ? cuadre.apertura : (s.inicial || 0);
  // Lo que compenso y sigue sin descargar sale de las PARTIDAS, no de una resta. Calculado por diferencia
  // (apertura - pendiente - descargado) absorbia cualquier descuadre de la apertura y lo presentaba como
  // si fuera plata por descargar: en junio de 2026 pedia un asiento de 14,463.12 cuando las partidas que
  // realmente compensaron sumaban 1,307.78. El descuadre de apertura es otra cosa y lo reporta el Paso 0,
  // con su propio panel y su asiento de ajuste.
  var compenso = Math.round(partidasApertura().reduce(function(a,x){ return a+x.monto; },0)*100)/100;
  // ARRASTRE DE MESES ANTERIORES. Si la cuenta abre el mes con mas de lo que el resumen del Paso 0
  // justifica, ese exceso no se genero este mes y ningun asiento de este mes lo corrige. Metido dentro
  // del renglon residual quedaba disfrazado de "cargos de tarjeta" y mandaba a buscar donde no era: en
  // junio de 2026 el residuo daba 9,446.30 cuando los cargos reales del mes eran 990.54.
  // Va en las dos direcciones. Si la cuenta abre con MAS de lo justificado, sobra arrastre de meses
  // viejos; si abre con MENOS, falta plata en la apertura (o el ajuste que la corrige no se detecto).
  // En enero de 2026, sin contemplar el signo negativo, el residuo daba -10,466.72 en vez de 2,537.25.
  var arrastre = (cuadre && !cuadre.ok) ? Math.round(-cuadre.dif*100)/100 : 0;
  // Las ventas que entraron a la cuenta y no salieron por ningun deposito tienen su propio renglon:
  // metidas en el residuo se leian como retenciones de tarjeta y mandaban a buscar donde no era.
  // Ya no se restan aparte: entran al resumen en transito y por lo tanto a transitoCaja. Se guardan
  // igual para poder mostrar de que dias vienen.
  var vsd = ventasSinDeposito();
  var sinDepositar = Math.round(vsd.reduce(function(a,x){ return a+x.pendiente; },0)*100)/100;
  var resto = Math.round((s.final - transitoCaja - compenso - arrastre)*100)/100;
  var tm = transitoPorMetodo();
  return { final:s.final, fecha:s.fechaFinal, transito:transitoCaja, compenso:compenso, resto:resto, arrastre:arrastre,
           aperturaLibro:(cuadre?cuadre.apertura:null), aperturaTransito:(cuadre?cuadre.total:null),
           totalResumen:tm.total, n:tm.count,
           soloBanco: clas.totalFuera, sinDepositar:sinDepositar, ventasSinDeposito:vsd };
}
/* ---- Detalle de los dos componentes de la diferencia ----
   Los dos van en sentidos opuestos y conviene poder verlos partida por partida, no solo el total. */
// Lo que está en el tránsito pero YA salió de Caja General: el efectivo cuyo asiento se hizo el día del
// depósito. Son las partidas que aporta el Paso 3 y que el Paso 2 no ve (no llevan etiqueta de banco).
function partidasYaAcreditadas(){ return clasificarTransito().fuera; }
/* ---- Ventas del dia que no tienen deposito ----
   La venta del dia entra como DEBITO a Caja General y sale como CREDITO cuando se deposita. Si un dia
   entra la venta y no sale nada, esa plata se queda en la cuenta sin estar en el resumen en transito:
   nadie la ve. En febrero de 2026 eran 2,667.15 de los dias 27 y 28 —la parte que la cajera no reporto
   haber depositado— y el panel los presentaba como "retenciones de tarjeta", que es donde iba a parar
   todo lo que no se supiera explicar.

   Tres cosas no cuentan como venta sin depositar, y hay que descontarlas o el aviso sale todos los dias:
   1. La VISA de St. Georges, que se acredita en un solo asiento a fin de mes (el informe de retenciones
      dice cuanto vendio cada dia).
   2. Lo que el Paso 1 ya marco en transito: la cajera lo reporto, el credito va cuando el banco compense.
   3. Los descargos del transito del mes anterior, que son creditos del dia pero de ventas viejas. */
// Con 'opt' la calcula el Paso 1 con sus propios datos (su casa); sin 'opt', el cierre la calcula desde
// STATE igual que siempre, para el caso en que no haya reporte de cajeras y el Paso 1 no llegue a correr.
function ventasSinDeposito(opt){
  var tolPend = 0.15;   // el pendiente difiere del metodo en los centavos del faltante/sobrante del dia
  opt = opt || {};
  if(!opt.reporte) opt.reporte = STATE.reporteCajas || null;
  var cg = opt.cg || STATE.diarioCaja || [];
  if(!cg.length) return [];
  var r = STATE.results || {};
  // Ventas VISA STG por dia, del informe de retenciones: su credito no llega hasta fin de mes.
  var visaDia = (opt && opt.visaDia) || {};
  if(!(opt && opt.visaDia)) (STATE.retVisaDetalle || []).forEach(function(d){ visaDia[d.fecha] = Math.round(((visaDia[d.fecha]||0) + d.bruto)*100)/100; });
  /* Metodos que ESTE mes se difirieron a fin de mes en un solo asiento acumulado ("DEPOSITOS POR YAPPY
     DEL 1 AL 30"): la venta del dia no tiene credito ese dia y eso no es un deposito que falte. Lo anota el
     Paso 1, que es el unico que sabe que acumulado cubrio que dias; sin el no se descuenta nada. */
  var difDia = opt.difDia;
  if(!difDia){
    var decDif = STATE.decisiones && STATE.decisiones.diferidos;
    difDia = (decDif && (!cg.length || decDif.firmaCaja === firmaDiario(cg))) ? decDif.porDia : {};
  }
  // Lo que el Paso 1 dejo en transito ese dia (deposito reportado por la cajera, sin credito todavia).
  var transDia = (opt && opt.transDia) || {};
  if(!(opt && opt.transDia)) (Array.isArray(r.paso1) ? r.paso1 : []).forEach(function(x){
    if(esEnTransito(x)) transDia[x.fecha] = Math.round(((transDia[x.fecha]||0) + x.monto)*100)/100;
  });
  // Creditos que son descargo de transito viejo: no pagan la venta de hoy.
  var desc = (opt && opt.claves) || clavesDescargo(r);
  var comp = {};
  cg.forEach(function(x){
    var k = String(x.referencia==null?"":x.referencia).trim();
    if(!/^ME-/i.test(k)) return;
    if(!comp[k]) comp[k] = {ref:k, fecha:x.fecha, venta:0, acreditado:0};
    if(x.fecha && x.fecha < comp[k].fecha) comp[k].fecha = x.fecha;
    // Solo la VENTA del dia obliga a un deposito. Otros debitos —un ajuste de saldo, la reposicion de
    // un fondo— entran a la cuenta y no salen por el banco: en enero de 2026 un "AJUSTA SALDO ERRADO
    // DE LA CAJA GENERAL AL CIERRE" de 18,123.07 se denunciaba como venta sin depositar.
    // "VETA" no es un descuido nuestro: asi viene escrito el asiento del 14 de febrero de 2026.
    if(x.debito > 0 && /VENTA|VETA/.test(normTxt(x.descripcion)))
      comp[k].venta = Math.round((comp[k].venta + x.debito)*100)/100;
    if(x.credito > 0){
      // El acumulado de VISA de fin de mes ("DEL 1 AL 28") paga ventas de todo el mes, no las de hoy.
      if(/\bDEL\s+\d+\s+AL\s+\d+/i.test(String(x.descripcion||""))) return;
      if(consumirClaveDescargo(desc, x.fecha, x.credito)) return;
      comp[k].acreditado = Math.round((comp[k].acreditado + x.credito)*100)/100;
    }
  });
  var out = [];
  Object.keys(comp).forEach(function(k){
    var c = comp[k];
    if(!(c.venta > 0)) return;
    var visa = visaDia[c.fecha] || 0, trans = transDia[c.fecha] || 0, dif = difDia[c.fecha] || 0;
    var pend = Math.round((c.venta - c.acreditado - visa - trans - dif)*100)/100;
    if(pend <= 1) return;   // hasta un dolar es redondeo de faltantes/sobrantes, no una omision
    out.push({ ref:c.ref, fecha:c.fecha, venta:c.venta, acreditado:c.acreditado,
               visa:visa, reportado:trans, diferido:dif, pendiente:pend,
               // El banco sale del METODO que falta, no de donde compenso el efectivo: ver bancoDeMetodoRep.
               metodo: metodoDelPendiente(opt && opt.reporte, c.fecha, pend, tolPend) });
  });
  out.sort(function(a,b){ return a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : 0; });
  return out;
}

/* ---- De que metodo es lo que falta ----
   Para que la partida viaje al mes siguiente necesita BANCO: el Paso 0 agrupa por banco para cotejarla
   contra el estado de cuenta. Asumir el banco del efectivo manda la partida al banco equivocado cuando lo
   que falta no es efectivo — en marzo de 2026 seis partidas de Yappy viajaron como St. Georges y en Banco
   General no las esperaba nadie: ahi no compensan nunca y se arrastran mes tras mes.
   Se identifica por el importe: si el informe de cajeras de ese dia trae UN solo metodo cuyo monto es el
   pendiente (con los centavos del faltante/sobrante de margen), ese es. Si hay dos que encajan, o ninguno,
   se devuelve null y el banco se deduce como antes. */
function metodoDelPendiente(reporte, fecha, pendiente, tol){
  if(!reporte || !reporte.length) return null;
  var hit = null, n = 0;
  reporte.forEach(function(x){
    if(x.fecha !== fecha || !(x.monto > 0)) return;
    if(Math.abs(x.monto - pendiente) > tol) return;
    n++; hit = { metodo:x.metodo, banco:x.banco };
  });
  return n === 1 ? hit : null;
}
/* ---- Donde compensa el efectivo ----
   Una venta que entro y no salio por ningun deposito tiene que viajar al mes siguiente como cualquier
   otra partida en transito, y para eso necesita banco: el Paso 0 agrupa por banco para cotejar contra el
   estado de cuenta. El efectivo no lo dice ningun archivo, asi que se deduce de donde compensaron los
   depositos de efectivo DE ESTE MISMO MES. Si no hay evidencia o hay mas de un banco, se deja sin banco
   y la partida lo dice: es preferible a inventarle uno y que no compense nunca. */
function bancoDelEfectivo(){
  var r = STATE.results || {}, bancos = {};
  ["paso0","paso1","paso2","paso3"].forEach(function(k){
    (Array.isArray(r[k]) ? r[k] : []).forEach(function(x){
      if(!x.banco) return;
      var t = normTxt((x.concepto||"") + " " + (x.texto||""));
      if(esBrinks(t) || t.indexOf("EFECTIVO")!==-1) bancos[x.banco] = true;
    });
  });
  var ks = Object.keys(bancos);
  return ks.length === 1 ? ks[0] : null;
}
// Las ventas sin deposito, con forma de hallazgo, para que entren al resumen en transito y viajen al
// mes siguiente. Si el deposito nunca aparece, se van a seguir arrastrando: es la unica forma de notar
// que una venta no llego al banco.
function partidasVentaSinDeposito(){
  var banco = bancoDelEfectivo();
  return ventasSinDeposito({ reporte: STATE.reporteCajas }).map(function(v){ return itemVentaSinDeposito(v, banco); });
}
// La partida con forma de hallazgo. La arma el Paso 1, que es su casa, y tambien el cierre cuando no hubo
// reporte de cajeras y el Paso 1 no llego a correr.
function itemVentaSinDeposito(v, banco){
  var falta = "B/ " + fmt(v.pendiente) + " de la venta del " + v.fecha;
  // El banco del METODO identificado manda sobre el del efectivo: el Yappy compensa en Banco General, no
  // donde entro el camion, y una partida con el banco equivocado no compensa nunca.
  var porMetodo = v.metodo && v.metodo.banco ? v.metodo.banco : null;
  var bk = porMetodo || banco || "";
  return {
    fecha: v.fecha, banco: bk, monto: v.pendiente, clase: "en_transito",
    concepto: "Depósito pendiente de identificar", comprobante: v.ref,
    motivo: "la venta entró a Caja General y no salió por ningún depósito",
    texto: "El " + v.fecha + " entró una venta de B/ " + fmt(v.venta) + " a Caja General. " +
      (v.acreditado > 0.005 ? "Se acreditaron B/ " + fmt(v.acreditado) + " de depósitos" : "No se acreditó ningún depósito") +
      (v.visa > 0.005 ? " (más B/ " + fmt(v.visa) + " de VISA St. Georges, que se acredita a fin de mes)" : "") +
      (v.diferido > 0.005 ? " (más B/ " + fmt(v.diferido) + " que el asiento acumulado de fin de mes cubre)" : "") +
      (v.reportado > 0.005 ? " y la cajera reportó B/ " + fmt(v.reportado) + " depositados" : " y la cajera no reportó depósito") +
      ": quedan " + falta + " sin explicar. Se arrastra al mes siguiente hasta que el depósito aparezca en el banco. " +
      (porMetodo
        ? "El informe de cajeras de ese día trae " + v.metodo.metodo + " por ese mismo importe, así que va a " + porMetodo + "."
        : bk ? "Se asume " + bk + " porque es donde compensó el efectivo de este mes; si fue otro banco, corregilo en el resumen."
             : "No se pudo deducir a qué banco va: completá el banco en el resumen en tránsito antes de usarlo el mes que viene."),
    fuente: "Diario Caja General / Reporte consolidado de caja",
    _paso: "ventas"
  };
}

/* ---- Donde buscar el residuo ----
   Cuando todos los pasos cuadran y el saldo igual no coincide con el transito, queda el residuo, y hasta
   ahora el reporte solo decia su total: no habia por donde empezar a buscar. Este cuadro lo abre DIA por
   dia con la aritmetica del propio navegador de Caja General, y suma exactamente el residuo:

     residuo = (apertura en transito - lo que ya compenso y falta descargar)
               + suma por dia de (debitos - creditos - lo que quedo en transito ESE dia)

   Un dia normal deja en la cuenta solo la retencion de tarjeta: la venta entra BRUTA y el deposito sale
   NETO. Por eso al lado va la retencion que dice el informe de VISA: el dia donde "sin explicar" no se le
   parece es el que hay que ir a mirar. */
function pistasResiduo(){
  var cg = STATE.diarioCaja || [];
  var d = desgloseSaldoCaja();
  if(!cg.length || !d) return null;
  function r2(n){ return Math.round((n||0)*100)/100; }
  var visaRet = {};
  (STATE.retVisaDetalle || []).forEach(function(x){ visaRet[x.fecha] = r2((visaRet[x.fecha]||0) + Math.abs(x.retenciones)); });
  // Lo que quedo en transito con fecha de ESE dia y sigue dentro de Caja General (lo que ya salio de la
  // cuenta no toca el saldo, asi que no se descuenta aca). El transito con fecha de meses anteriores —los
  // cheques viejos que siguen en circulacion— no es de ningun dia de este mes: va en el renglon de apertura.
  var diaCG = {};
  cg.forEach(function(x){ if(x.fecha) diaCG[x.fecha] = true; });
  var transDia = {}, transViejo = 0;
  clasificarTransito().dentro.forEach(function(x){
    if(x.fecha && diaCG[x.fecha]) transDia[x.fecha] = r2((transDia[x.fecha]||0) + x.monto);
    else transViejo = r2(transViejo + x.monto);
  });
  var claves = clavesDescargo(STATE.results || {});
  var dias = {}, otros = [], descargos = 0;
  cg.forEach(function(x){
    if(!x.fecha) return;
    var dd = dias[x.fecha] || (dias[x.fecha] = { fecha:x.fecha, ref:"", deb:0, cred:0, descargo:0 });
    var ref = refME(x.referencia);
    if(!dd.ref && ref) dd.ref = ref;
    if(x.debito > 0){
      dd.deb = r2(dd.deb + x.debito);
      // Un debito que no es la venta del dia ni un deposito (un ajuste de saldo, una diferencia por credito,
      // la reposicion de un fondo) entra a la cuenta y no sale por el banco: ningun paso lo mira.
      var t = normTxt(x.descripcion);
      if(!/VENTA|VETA/.test(t) && t.indexOf("DEPOSITO") === -1)
        otros.push({ fecha:x.fecha, ref:ref, descripcion:String(x.descripcion||"").trim(), monto:x.debito });
    }
    if(x.credito > 0){
      dd.cred = r2(dd.cred + x.credito);
      // El credito que descarga transito del mes anterior no paga nada de este dia: se empareja con la
      // apertura, que es de donde salio esa partida.
      if(consumirClaveDescargo(claves, x.fecha, x.credito)){   // la clave va por la fecha del asiento
        dd.descargo = r2(dd.descargo + x.credito);
        descargos = r2(descargos + x.credito);
      }
    }
  });
  // Para la lista de "asientos que no son venta ni deposito": el navegador de algunos meses trae las dos
  // patas del asiento, asi que un debito que tiene su credito igual el mismo dia es el mismo deposito
  // visto dos veces y no hay nada que revisar. Solo afecta a la lista: la aritmetica usa todas las lineas.
  otros = otros.filter(function(o){
    return !cg.some(function(y){ return y.credito > 0 && y.fecha === o.fecha && Math.abs(y.credito - o.monto) < 0.005 &&
      normTxt(y.descripcion) === normTxt(o.descripcion); });
  });
  var lista = Object.keys(dias).map(function(f){
    var dd = dias[f];
    dd.transito = transDia[f] || 0;
    dd.retencion = visaRet[f] || 0;
    dd.sinExplicar = r2(dd.deb - dd.cred + dd.descargo - dd.transito);
    return dd;
  }).filter(function(x){ return Math.abs(x.sinExplicar) >= 0.005; });
  lista.sort(function(a, b){ return Math.abs(b.sinExplicar) - Math.abs(a.sinExplicar); });
  otros.sort(function(a, b){ return b.monto - a.monto; });
  var apertura = r2((d.aperturaTransito||0) - d.compenso - transViejo - descargos);
  var sumaDias = r2(lista.reduce(function(a, x){ return a + x.sinExplicar; }, 0));
  // Lo que falta para que el cuadro sume el residuo es lo que el navegador ya trae DENTRO de su saldo de
  // apertura y ademas asienta como linea del mes: el "ajusta saldo errado de la Caja General" del 1-ene-2026
  // por 5,119.10 estaba en los dos lados y el dia 1 salia con un sobrante de ese mismo importe.
  var ajuste = r2(d.resto - sumaDias - apertura);
  var total = r2(apertura + ajuste + sumaDias);
  return { dias: lista, otros: otros, apertura: apertura, aperturaTransito: d.aperturaTransito||0,
           compenso: d.compenso, transViejo: transViejo, descargos: descargos, ajuste: ajuste,
           total: total, resto: d.resto };
}
// Cargos de tarjeta del estado de cuenta, agrupados por concepto. Es lo que el banco se quedó y nunca va
// a acreditar, así que queda en Caja General porque la venta entró bruta.
function cargosTarjetaPorBanco(){
  var est = STATE.estados;
  if(!est) return null;
  var hasta = STATE.saldoCajaGeneral && STATE.saldoCajaGeneral.fechaFinal;
  var out = [];
  Object.keys(est).forEach(function(b){
    var xs = (est[b]||[]).filter(function(x){
      if(!(x.debito > 0)) return false;
      if(hasta && x.fecha > hasta) return false;   // el estado suele traer días del mes siguiente
      var n = normTxt(x.descripcion);
      if(!/RETENCI|COMISI|ITBMS|DEVOLUCION COMISION/.test(n)) return false;
      return /V\/MC|VISA|CLAVE|REMISION|ESTABLECIMIENTO AFILIADO/.test(n);
    });
    if(!xs.length) return;
    var porTipo = {};
    xs.forEach(function(x){
      var n = normTxt(x.descripcion);
      var t = /RETENCI/.test(n) ? "Retención ITBMS"
            : /DEVOLUCION COMISION/.test(n) ? "Devolución comisión"
            : /ITBMS/.test(n) ? "ITBMS" : "Comisión";   // "ITBMS sobre comisión" es ITBMS, no comisión
      porTipo[t] = Math.round(((porTipo[t]||0) + x.debito)*100)/100;
    });
    out.push({ banco:b, n:xs.length, total:Math.round(xs.reduce(function(a,x){ return a+x.debito; },0)*100)/100, porTipo:porTipo });
  });
  return out.length ? out : null;
}

/* ---- Control: el saldo de Caja General TIENE que ser el tránsito ----
   Regla de Diba: en Caja General solo deben quedar los métodos de pago en tránsito por compensar al
   banco. Para que se cumpla, el crédito a la cuenta se registra cuando el BANCO COMPENSA, no el día del
   depósito. Mientras la mecánica sea la vieja —acreditar al depositar— este control queda en rojo, y el
   desglose dice qué asiento falta en cada caso. */
// Diferencias rojas sin resolver en toda la conciliación. Si el reporte se imprime con alguna abierta,
// el papel tiene que decirlo: si no, se archiva un cuadre que en realidad no cerró.
/* ---- Que asiento hay que registrar para cerrar un hallazgo ----
   Quien usa esto no tiene formacion contable: decir "hay una diferencia de B/ 149.73" no alcanza para
   saber que hacer. Cada diferencia roja lleva ahora el asiento concreto —que cuenta va al debito, cual al
   credito y por cuanto— explicado en una linea de por que.
   La regla de fondo es siempre la misma: Caja General es la cuenta puente. Cuando el dinero SALE de caja
   hacia el banco, el banco se DEBITA (le entra) y Caja General se ACREDITA (le sale).
   Devuelve null cuando el hallazgo no se arregla con un asiento (ej. un dato mal escrito en el Excel). */
function cuentaDeBanco(banco){
  if(banco === "Banistmo") return "[1.1.1.07] Banistmo";
  if(banco === "STG") return "[1.1.1.10] St. Georges Bank";
  if(banco === "Banco General") return "Banco General";
  return banco || "el banco";
}
function asientoDelHallazgo(item, pasoKey){
  if(!item || (item.clase && item.clase !== "diff")) return null;
  var monto = Math.abs(item.monto || 0);
  if(!(monto > 0.005)) return null;
  var banco = item.banco || "";
  var txt = String(item.texto || "");
  var CG = "[1.1.8] Caja General";

  // Paso 1: el informe de cajeras y el diario de Caja General no dicen lo mismo ese dia.
  if(pasoKey === "paso1" && /Diferencia /.test(txt)){
    if((item.monto || 0) > 0){
      // La cajera reporto mas de lo que el diario registro como depositado: falta el asiento del deposito.
      return { porque: "La cajera reportó este dinero como depositado a " + banco + " y en Caja General no está registrado el depósito. Falta el asiento que lo saca de la caja y lo mete al banco.",
               debito: cuentaDeBanco(banco), credito: CG, monto: monto,
               concepto: "Depósito a " + banco + " del " + (item.fecha||"") + " reportado por la cajera",
               fecha: item.fecha || "" };
    }
    return { porque: "En Caja General hay más depósitos a " + banco + " de los que la cajera reportó ese día. Revisá primero el informe de caja: si al informe le falta la venta, se corrige ahí y no con un asiento. Si el que sobra es el asiento, hay que reversarlo.",
             debito: CG, credito: cuentaDeBanco(banco), monto: monto,
             concepto: "Reverso del depósito a " + banco + " del " + (item.fecha||"") + " que el informe de caja no respalda",
             fecha: item.fecha || "", revisarPrimero: true };
  }

  // Paso 2: Caja General dice que se deposito y el banco no lo muestra.
  if(pasoKey === "paso2"){
    return { porque: "Caja General registra este depósito a " + banco + " y el estado de cuenta no lo muestra. Si el banco ya lo acreditó con otra fecha o partido en varias líneas, no hace falta asiento: revisá el estado. Si el depósito nunca se hizo, hay que reversar el asiento.",
             debito: CG, credito: cuentaDeBanco(banco), monto: monto,
             concepto: "Reverso del depósito a " + banco + " del " + (item.fecha||"") + " que el banco no acredita",
             fecha: item.fecha || "", revisarPrimero: true };
  }

  // Paso 3: el banco muestra un movimiento que el diario no tiene.
  if(pasoKey === "paso3" && /no aparece registrado en el diario/.test(txt)){
    return { porque: "El banco acreditó este dinero y en el diario de " + banco + " no hay ningún asiento que lo registre. Es plata que entró y todavía no está en los libros.",
             debito: cuentaDeBanco(banco), credito: CG, monto: monto,
             concepto: "Depósito acreditado por " + banco + " el " + (item.fecha||"") + " sin registrar",
             fecha: item.fecha || "" };
  }
  return null;
}

/* ---- Asientos por registrar ----
   Al pie del reporte de Caja General iba la lista de archivos usados, que ya no aporta: el encabezado de
   la hoja lleva periodo, fecha de emision y version, y el checklist del modulo repite la traza completa.
   Lo que hace falta ahi es lo accionable: que asientos quedan por hacer para que el saldo de la cuenta
   sea exactamente el transito. Los cargos NO se deducen por diferencia — se leen del estado de cuenta y
   del informe de retenciones, que es dato duro, y se desglosan por banco y concepto para que el asiento
   se pueda digitar directo. */
/* ---- ¿El asiento sugerido ya se registro? ----
   Una vez que el asiento esta hecho y el navegador se vuelve a exportar, el reporte no deberia seguir
   pidiendolo como si faltara. Se busca en el diario de Caja General un CREDITO por su importe con un
   concepto compatible: primero una linea sola, y si no, varias del mismo dia que sumen (el asiento de
   cargos suele digitarse renglon por renglon, uno por comision, retencion e ITBMS).
   La tolerancia es de 3 centavos, la misma del cotejo. */
function asientoRegistrado(monto, patron){
  var diario = STATE.diarioCaja || [];
  if(!(monto > 0.005) || !diario.length) return null;
  var cand = diario.filter(function(x){
    return x.credito > 0 && patron.test(normTxt(x.descripcion));
  });
  for(var k=0;k<cand.length;k++){
    if(Math.abs(cand[k].credito - monto) <= 0.03) return { fecha:cand[k].fecha, ref:String(cand[k].referencia||"").trim(), n:1 };
  }
  var porDia = {};
  cand.forEach(function(x){ (porDia[x.fecha] = porDia[x.fecha] || []).push(x); });
  var hit = null;
  Object.keys(porDia).sort().forEach(function(f){
    if(hit || porDia[f].length < 2) return;
    var s = Math.round(porDia[f].reduce(function(a,x){ return a+x.credito; },0)*100)/100;
    if(Math.abs(s - monto) <= 0.03) hit = { fecha:f, ref:String(porDia[f][0].referencia||"").trim(), n:porDia[f].length };
  });
  return hit;
}

}
