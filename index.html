      if(((cajaPorBancoDia[B2+"|"+D]||0) - (repFullBD[B2+"|"+D]||0)) >= esperado - tolerancia) return true;
    }
    return false;
  }
  var cubiertoK = {};
  Object.keys(batchedBD).forEach(function(k){
    var p=k.split("|"); if(!swapDeBanco(p[0], p[1])) cubiertoK[k]=true;
  });
  /* ---- Acumulado por rango que no dice a que banco entro ----
     "DEPOSITO DE VISA 1AL 30 DE ABRIL 2026" por B/ 1,443.41: el metodo y el rango estan, el banco no.
     No se puede rutear por texto, pero si por monto: los unicos dias que ese asiento puede estar
     cubriendo son los del mismo metodo que NO tienen su propio credito en el diario (los que ya tienen
     asiento diario estan pagos y no entran). Si esos dias suman exacto el monto del asiento — y de UNA
     sola manera — el acumulado los cubre. Si hay dos combinaciones posibles no se adivina: queda como
     diferencia, igual que en el resto de la app. */
  var cajaPorBMD = {};
  cajaFiltrada.forEach(function(x){
    var bk2 = clasificarBancoPorTexto(x.descripcion), m2 = metodoDeposito(x.descripcion);
    if(!bk2 || !m2) return;
    var k2 = bk2+"|"+m2+"|"+x.fecha;
    cajaPorBMD[k2] = Math.round(((cajaPorBMD[k2]||0) + x.credito)*100)/100;
  });
  var cubiertasSinBanco = [];
  batches.forEach(function(b){
    if(!b.sinBanco) return;
    var cand = reporte.filter(function(x){
      if(x.metodo !== b.metodo || !(x.monto > tolerancia) || !x.fecha) return false;
      if(x.fecha.slice(0,7) !== b.ym) return false;
      var dia = parseInt(x.fecha.slice(8,10),10);
      if(dia < b.diaIni || dia > b.diaFin) return false;
      if(cubiertasSinBanco.indexOf(x) !== -1) return false;                 // ya la tomo otro acumulado
      return (cajaPorBMD[x.banco+"|"+b.metodo+"|"+x.fecha]||0) <= tolerancia; // el dia no tiene asiento propio
    });
    if(!cand.length) return;
    var elegidas = null;
    // El caso normal: el asiento difiere TODOS los dias sueltos del metodo. Se prueba primero, asi no se
    // enumeran subconjuntos de un mes entero.
    var todo = Math.round(cand.reduce(function(a,x){ return a+x.monto; },0)*100)/100;
    if(Math.abs(todo - b.monto) <= tolerancia) elegidas = cand;
    else {
      var sols = solucionesSuma(cand.map(function(x){ return x.monto; }), b.monto, tolerancia, Math.min(cand.length, 20), 1);
      if(sols && sols.length === 1) elegidas = sols[0].map(function(i){ return cand[i]; });
    }
    if(!elegidas || !elegidas.length) return;
    var bancosB = {};
    elegidas.forEach(function(x){ cubiertasSinBanco.push(x); b.cubierto += x.monto; b.filas.push(x); bancosB[x.banco] = true; });
    b.cubierto = Math.round(b.cubierto*100)/100;
    b.resuelto = true;
    var bks = Object.keys(bancosB);
    b.banco = bks.length === 1 ? bks[0] : "";   // si cubre un solo banco, queda etiquetado
    b.bancos = bks;
  });
  /* ---- Lo que un acumulado de fin de mes cubre no tiene credito el dia que se cobro ----
     La venta del dia entra a Caja General y sale cuando se deposita, pero un metodo diferido a fin de mes
     no sale ese dia: sale el 30, en un solo asiento. Sin anotarlo, `ventasSinDeposito` lo denunciaba como
     "venta que entro y no salio por ningun deposito" — el Yappy de abril de 2026 salia asi ocho veces
     (111.56 el 25-abr, y los otros siete dias), y en marzo esas partidas viajaron al resumen del mes
     siguiente con el banco del efectivo en vez de Banco General, donde no compensan nunca.
     Se anota SOLO lo que un acumulado real cubrio: si el asiento no existe, el pendiente sigue saliendo. */
  var difDiaP1 = {};
  function anotarDiferido(x){
    // La VISA de St. Georges ya la descuenta visaDia con el informe de retenciones, exista o no el asiento.
    if(x.banco === "STG" && normTxt(x.metodo).indexOf("VISA") !== -1) return;
    difDiaP1[x.fecha] = Math.round(((difDiaP1[x.fecha]||0) + x.monto)*100)/100;
  }
  cubiertasSinBanco.forEach(anotarDiferido);
  /* ---- Acumulado de fin de mes que NO declara el rango en su texto ----
     "DEPOSITOS POR YAPPY 404.49" del 31-mar-2026: difiere el metodo del mes entero pero sin decir "DEL 1 AL
     31", asi que el mecanismo de batches no lo ve. Sus dias tampoco tienen credito propio, y salian como
     "venta que entro y no salio por ningun deposito": seis partidas que viajaban al resumen del mes
     siguiente cuando su plata ya habia compensado — el estado de Banco General de marzo trae los seis
     depositos de Yappy y ese asiento los acredito.
     Se lo reconoce por monto: un credito del cierre, con metodo reconocible, que ALCANZA para cubrir los
     dias sueltos de ese metodo. No se exige igualdad porque el asiento puede traer algo mas: el de marzo
     son 404.49 e incluye un deposito de 157.94 que en el banco no figura como Yappy. Ese exceso es otra
     cosa y lo reporta el cotejo del dia; lo que esta anotacion dice es solo que los dias sueltos salieron. */
  (function(){
    var finPer = ultimoDiaMes(cajaFiltrada.map(function(x){ return x.fecha; }));
    if(!finPer) return;
    cajaFiltrada.forEach(function(x){
      if(x.fecha !== finPer || rangoDeposito(x.descripcion, x.fecha)) return;
      var met = metodoDeposito(x.descripcion);
      if(!met) return;
      var sueltos = reporte.filter(function(q){
        return q.metodo === met && q.monto > tolerancia && q.fecha && q.fecha < finPer &&
               (cajaPorBMD[q.banco+"|"+met+"|"+q.fecha]||0) <= tolerancia;
      });
      if(sueltos.length < 2) return;
      var suma = Math.round(sueltos.reduce(function(a,q){ return a+q.monto; },0)*100)/100;
      if(x.credito < suma - tolerancia) return;   // no alcanza para cubrirlos: no se da por cubierto nada
      sueltos.forEach(anotarDiferido);
    });
  })();
  var repParaDia = reporte.filter(function(x){
    if(cubiertasSinBanco.indexOf(x) !== -1) return false;
    var b=batchDe(x);
    if(b && cubiertoK[x.banco+"|"+x.fecha]){ b.cubierto += x.monto; b.filas.push(x); anotarDiferido(x); return false; }
    return true;
  });
  var repPorBancoDia = sumBy(repParaDia, function(x){return x.banco+"|"+x.fecha;}, function(x){return x.monto;});

  /* ---- Descargo del tránsito del mes anterior ----
     Con el crédito a Caja General registrado el día que el banco COMPENSA (y no el día del depósito), cada
     mes arranca descargando lo que quedó en tránsito del mes pasado. Esa venta la reportó la cajera el mes
     ANTERIOR, así que compararla contra el reporte de ESTE mes siempre da diferencia: en febrero de 2026
     salían B/ 1,354.25 de depósitos a STG contra un reporte de cajeras en cero. El crédito se saca del
     cotejo diario y se lista aparte, para que la exclusión quede a la vista y no parezca un olvido.
     Dos condiciones, las dos necesarias: que el importe salga de las partidas en tránsito de ESE banco (una
     sola o varias juntas, como acá que son cinco depósitos de Brinks), y que ese día el diario tenga un
     excedente sobre el reporte que alcance para cubrirlo. Sin la segunda, un depósito legítimo del mes que
     por casualidad coincida en monto con una partida en tránsito se borraría del cotejo sin decir nada. */
  var descargos = [], avisosDescargo = [];
  // Acumulados de fin de mes que traen adentro el descargo del transito anterior: el Paso 3 lo hereda para
  // no pedirle al banco un importe que incluye plata que el Paso 0 ya dio por compensada.
  var descargosEnAcumulado = [];
  if(transitoPrevio && transitoPrevio.length){
    var poolPrev = transitoPrevio.filter(pasaPorCajaGeneral).map(function(t){
      return { fecha:t.fecha, monto:t.monto, banco:t.banco, concepto:t.concepto, partes:t.partes, usado:false, compensada:false };
    });
    /* Cuales de esas partidas el Paso 0 vio COMPENSAR en el banco este mes. Es la evidencia que habilita
       reconocer un descargo embutido en un asiento acumulado: sin ella, cualquier importe que coincida por
       casualidad se daria por descargado. Se cruza por banco + fecha + importe, igual que poolParaDescargos. */
    (function(){
      var dec = STATE.decisiones && STATE.decisiones.transito;
      (dec && dec.compensadas ? dec.compensadas : []).forEach(function(ch){
        if(ch.sentido === "debito") return;
        for(var i=0;i<poolPrev.length;i++){
          var o = poolPrev[i];
          if(!o.compensada && o.banco === ch.banco && Math.abs(o.monto - ch.monto) < 0.005 &&
             o.fecha === (ch.fechaOrig || ch.fecha)){ o.compensada = true; return; }
        }
      });
    })();
    function recalcCajaP1(){
      cajaPorBancoDia = sumBy(cajaFiltrada, function(x){return clasificarBancoPorTexto(x.descripcion)+"|"+x.fecha;},
        function(x){ return x.credito; });
    }
    // Lo que el diario acredita a un banco ese dia por encima de lo que reporto la cajera: solo eso puede ser descargo.
    function excesoP1(bk, f){ return Math.round(((cajaPorBancoDia[bk+"|"+f]||0) - (repPorBancoDia[bk+"|"+f]||0))*100)/100; }
    function lineaP1(x){ return { fecha:x.fecha, monto:x.credito, descripcion:x.descripcion, referencia:x.referencia, src:x }; }
    function lineasBancoP1(bk, f){
      return cajaFiltrada.filter(function(x){ return clasificarBancoPorTexto(x.descripcion)===bk && (!f || x.fecha===f); }).map(lineaP1);
    }
    function quitarP1(ls){
      var fuera = ls.map(function(l){ return l.src; });
      cajaFiltrada = cajaFiltrada.filter(function(x){ return fuera.indexOf(x) === -1; });
      recalcCajaP1();
    }
    var bancosP1 = [], cercanosP1 = [];
    cajaFiltrada.forEach(function(x){ var b = clasificarBancoPorTexto(x.descripcion); if(bancosP1.indexOf(b) === -1) bancosP1.push(b); });

    // a) Lineas que citan su fecha de origen ("tarjeta visa 28/2"): el grupo se cruza con la partida de esa fecha.
    bancosP1.forEach(function(bk){
      var r = descargosPorFechaOrigen(lineasBancoP1(bk), poolPrev, bk, tolerancia, "usado");
      r.hechos.forEach(function(h){
        if(excesoP1(bk, h.fecha) < h.monto - tolerancia){ h.partidas.forEach(function(p){ p.usado = false; }); return; }
        descargos.push({ fecha:h.fecha, banco:bk, monto:h.monto, ref:h.lineas[0].referencia, partidas:h.partidas, lineas:h.lineas });
        quitarP1(h.lineas);
      });
      r.cercanos.forEach(function(c){ cercanosP1.push(c); });
    });

    // b) Desglose por medio de pago que trae la partida desde el cierre anterior: cada medio contra una linea
    // del mismo importe, todas del mismo dia. Va antes que (c) porque es la evidencia mas precisa: sin este
    // orden, la linea del cheque podia descargar sola otra partida del mismo importe.
    poolPrev.forEach(function(p){
      if(p.usado || !Array.isArray(p.partes) || p.partes.length < 2) return;
      var dias = [];
      cajaFiltrada.forEach(function(x){
        if(clasificarBancoPorTexto(x.descripcion)===p.banco && x.fecha >= p.fecha && dias.indexOf(x.fecha) === -1) dias.push(x.fecha);
      });
      dias.sort();
      for(var i=0;i<dias.length;i++){
        var f = dias[i];
        if(excesoP1(p.banco, f) < p.monto - tolerancia) continue;
        var libres = lineasBancoP1(p.banco, f).sort(function(a, b){ return prioridadDescargo(a) - prioridadDescargo(b); });
        var elegidas = [];
        var completo = p.partes.every(function(pt){
          for(var j=0;j<libres.length;j++){
            if(Math.abs(libres[j].monto - pt.monto) <= tolerancia){ elegidas.push(libres[j]); libres.splice(j, 1); return true; }
          }
          return false;
        });
        if(!completo) continue;
        p.usado = true;
        var tot = Math.round(elegidas.reduce(function(a, l){ return a + l.monto; }, 0)*100)/100;
        descargos.push({ fecha:f, banco:p.banco, monto:tot, ref:elegidas[0].referencia, partidas:[p], lineas:elegidas });
        quitarP1(elegidas);
        break;
      }
    });

    // c) Un credito que descarga una o varias partidas (el reconocimiento de siempre).
    var quedan = [];
    cajaFiltrada.forEach(function(x){
      var bk = clasificarBancoPorTexto(x.descripcion);
      var exceso = excesoP1(bk, x.fecha);
      if(exceso < x.credito - tolerancia){ quedan.push(x); return; }   // el reporte de cajeras sí lo respalda
      var pool = poolPrev.filter(function(p){ return p.banco===bk; });
      // Ventana amplia a propósito: el tránsito puede venir de hace dos o tres meses (un cheque de
      // diciembre que recién clarea). "atras" impide tomar partidas posteriores al crédito.
      var idx = buscarSubsetSuma(pool, x.fecha, x.credito, 400, tolerancia, 12, "atras");
      if(!idx){ quedan.push(x); return; }
      var usadas = idx.map(function(k){ return pool[k]; });
      usadas.forEach(function(p){ p.usado = true; });   // ningún crédito descarga dos veces la misma partida
      descargos.push({ fecha:x.fecha, banco:bk, monto:x.credito, ref:x.referencia, partidas:usadas, lineas:[lineaP1(x)] });
    });
    cajaFiltrada = quedan;
    recalcCajaP1();

    // d) El excedente del banco en el dia, sin fecha de origen ni desglose: se acepta SOLO si hay una unica
    // combinacion de partidas que lo forma y una unica combinacion de lineas del dia que lo suma. Con dos
    // posibles, elegir la primera seria adivinar, y queda como diferencia para que se revise.
    var clavesDia = [];
    cajaFiltrada.forEach(function(x){ var k = clasificarBancoPorTexto(x.descripcion) + "|" + x.fecha; if(clavesDia.indexOf(k) === -1) clavesDia.push(k); });
    clavesDia.sort().forEach(function(k){
      var bk = k.split("|")[0], f = k.split("|")[1];
      var ex = excesoP1(bk, f);
      if(ex <= tolerancia) return;
      var cand = poolPrev.filter(function(p){ return !p.usado && p.banco===bk && String(p.fecha||"").slice(0,7) < f.slice(0,7); });
      if(!cand.length) return;
      var solP = solucionesSuma(cand.map(function(p){ return p.monto; }), ex, tolerancia, 12, 1);
      if(!solP || solP.length !== 1) return;
      var ls = lineasBancoP1(bk, f);
      var solL = solucionesSuma(ls.map(function(l){ return l.monto; }), ex, tolerancia, 12, 1);
      if(!solL || solL.length !== 1) return;
      var partidas = solP[0].map(function(i){ return cand[i]; });
      partidas.forEach(function(p){ p.usado = true; });
      var elegidas = solL[0].map(function(i){ return ls[i]; });
      descargos.push({ fecha:f, banco:bk, monto:ex, ref:elegidas[0].referencia, partidas:partidas, lineas:elegidas });
      quitarP1(elegidas);
    });

    // "Descargo que no coincide" solo para lineas que ningun reconocimiento pudo explicar. Un asiento que cita
    // una fecha puede descargar partidas de varias fechas y reconocerse en (c): avisar de el seria una falsa alarma.
    cercanosP1.forEach(function(c){
      var sigue = c.lineas.every(function(l){ return cajaFiltrada.indexOf(l.src) !== -1; });
      if(!sigue) return;
      // Solo se aparta si el reporte de cajeras de ese dia NO la respalda. Si la respalda, la fecha del texto
      // esta mal tecleada y es la venta del dia: el 4-jun-2026 "TARJETA CLAVE BTS DEL 04/5/2026" por 130.45
      // era el deposito de ese dia, y la cajera lo reporto.
      if(excesoP1(c.banco, c.fecha) < c.monto - tolerancia){
        if(!c.otraFecha) avisosDescargo.push(avisoCercanoEnCotejo(c, "Resumen en tránsito del mes anterior / Diario Caja General"));
        return;
      }
      if(c.partida && c.partida.usado){ c.partida = null; c.dif = c.monto; }   // la tomo otro descargo: no se reporta contra ella
      if(c.partida) c.partida.usado = true;
      avisosDescargo.push(avisoDescargoNoCoincide(c, "Resumen en tránsito del mes anterior / Diario Caja General"));
      descargos.push({ fecha:c.fecha, banco:c.banco, monto:c.monto, ref:c.lineas[0].referencia, partidas: c.partida ? [c.partida] : [],
                       lineas:c.lineas, dif:c.dif, soloDecision:true });
      quitarP1(c.lineas);   // no vuelve al cotejo del dia
    });
  }

  // Depósitos ACH/cheque que el sistema NO etiquetó con banco, por día (para explicar diferencias
  // "positivas" donde el reporte asigna a un banco pero el sistema registró el depósito sin banco).
  var sinBancoPorDia = {};
  diarioCaja.forEach(function(x){
    if(x.credito>0 && esAchOChequeSinBanco(x.descripcion)){
      (sinBancoPorDia[x.fecha] = sinBancoPorDia[x.fecha] || []).push({monto:x.credito, desc:x.descripcion, ref:x.referencia, usado:false});
    }
  });

  // Referencia del comprobante (columna D del diario, siempre empieza por "ME-") por día,
  // para citarla en cada hallazgo. Un día suele tener un solo comprobante ME-.
  function esRefME(r){ return /^ME-/i.test(String(r==null?"":r).trim()); }
  var refsPorDia = {};
  diarioCaja.forEach(function(x){
    if(!esRefME(x.referencia)) return;
    var ref = String(x.referencia).trim();
    if(!refsPorDia[x.fecha]) refsPorDia[x.fecha] = [];
    if(refsPorDia[x.fecha].indexOf(ref)===-1) refsPorDia[x.fecha].push(ref);
  });
  function comprobanteTxt(fecha, refPreferida){
    var rs = (refPreferida && esRefME(refPreferida)) ? [String(refPreferida).trim()] : (refsPorDia[fecha] || []);
    return rs.length ? (" · Comprobante " + rs.join(" / ")) : "";
  }

  var BANCOS = ["STG","Banistmo"];
  var dias = {};
  Object.keys(repPorBancoDia).forEach(function(k){ dias[k.split("|")[1]] = true; });
  Object.keys(cajaPorBancoDia).forEach(function(k){ dias[k.split("|")[1]] = true; });
  /* ---- Depositos de fin de mes bajo la mecanica nueva ----
     El credito a Caja General se registra el dia que el BANCO COMPENSA, no el dia del deposito. Un
     deposito de los ultimos dias del mes compensa el mes siguiente, asi que su credito tambien va el mes
     siguiente: comparar el reporte del dia contra los creditos del dia lo marcaba como "asiento que falta
     registrar" todos los meses. En febrero de 2026 salian asi los 3,571.60 del 27-feb y los 2,662.52 del
     28-feb, que estaban bien: sus asientos van en marzo.
     No se silencia: se clasifica EN TRANSITO, viaja al resumen del mes siguiente y si nunca llega a
     compensar se sigue arrastrando — que es como se detecta un deposito que no se hizo. */
  // El mes dominante sale de TODAS las fechas del periodo, no solo de los dias que quedaron en el cotejo: si
  // un acumulado se llevo las filas del reporte, `dias` queda corto y el borde de mes se perdia — con eso la
  // cola del rango dejaba de reconocerse como fin de mes y volvia a salir como diferencia.
  var finMesP1 = ultimoDiaMes(Object.keys(dias).concat(
    (reporte||[]).map(function(x){ return x.fecha; }),
    (diarioCaja||[]).map(function(x){ return x.fecha; })
  ).filter(Boolean));
  function esFinDeMesP1(f){
    if(!finMesP1 || !f || f > finMesP1) return false;
    return distanciaBancaria(f, finMesP1) <= 3;
  }

  var hallazgos = [];
  descargos.forEach(function(dg){
    if(dg.soloDecision) return;   // su hallazgo es la diferencia contra la partida, ya emitida
    var repartido = dg.lineas && dg.lineas.length > 1;
    hallazgos.push({
      fecha:dg.fecha, banco:dg.banco, monto:dg.monto, clase:"informativo", concepto:"Descargo de tránsito",
      // Igual que el de los Pasos 2 y 3: el desglose del saldo las necesita para saber cuales de las
      // partidas compensadas siguen sin descargo. Sin esta lista, el detalle listaba como pendientes
      // partidas que el total SI habia restado, y el renglon se contradecia con su propia tabla.
      partidas: dg.partidas.map(function(p){ return { banco:p.banco, fecha:p.fecha, monto:p.monto, concepto:p.concepto }; }),
      lineas: (dg.lineas||[]).map(function(l){ return { fecha:l.fecha, monto:l.monto, descripcion:String(l.descripcion||"").trim() }; }),
      texto: "Descargo del tránsito del mes anterior: " + (repartido
               ? dg.lineas.length + " créditos a Caja General del " + dg.fecha + " (" + dg.banco + ") suman B/ " + fmt(dg.monto) + " (" +
                 dg.lineas.map(function(l){ return String(l.descripcion||"").trim().slice(0,40) + " B/ " + fmt(l.monto); }).join("; ") + ") y"
               : "el crédito a Caja General de B/ " + fmt(dg.monto) + " del " + dg.fecha + " (" + dg.banco + ")") +
             " descarga" + (repartido ? "n " : " ") + dg.partidas.length + " partida(s) que venían en tránsito y " +
             "compensaron en el banco este mes, así que NO se compara contra el reporte de cajeras — esa venta la " +
             "reportaron el mes pasado: " + dg.partidas.map(function(p){ return p.fecha + " B/ " + fmt(p.monto); }).join(", ") +
             "." + comprobanteTxt(dg.fecha, dg.ref),
      fuente: "Resumen en tránsito del mes anterior / Diario Caja General"
    });
  });
  avisosDescargo.forEach(function(a){ hallazgos.push(a); });
  Object.keys(dias).sort().forEach(function(fecha){
    // diferencia por banco ese día (reporte de cajeras vs crédito del sistema)
    var d = {};
    BANCOS.forEach(function(bk){
      var a = repPorBancoDia[bk+"|"+fecha]||0, b = cajaPorBancoDia[bk+"|"+fecha]||0;
      d[bk] = { a:a, b:b, diff: Math.round((a-b)*100)/100 };
    });
    var dS = d.STG.diff, dB = d.Banistmo.diff;

    // 1) Mismo monto en bancos distintos: el informe lo pone en un banco y el sistema en el otro
    //    (diferencias opuestas que se cancelan). Se emite UNA sola alerta clara en vez de dos.
    if(Math.abs(dS) > tolerancia && Math.abs(dB) > tolerancia &&
       Math.abs(dS + dB) <= tolerancia && (dS > 0) !== (dB > 0)){
      var monto = Math.abs(dS);
      var bancoInforme = dS > 0 ? "STG" : "Banistmo";  // el reporte lo asigna aquí (diferencia positiva)
      var bancoSistema = dS > 0 ? "Banistmo" : "STG";  // el sistema lo depositó aquí
      hallazgos.push({
        fecha:fecha, banco:bancoInforme, monto:monto, clase:"diff",
        texto: "El monto B/ " + fmt(monto) + " del " + fecha + " tiene bancos diferentes: el informe de cajeras lo reporta en " +
               bancoInforme + " y el diario de Caja General lo registró en " + bancoSistema +
               ". Verifica el informe de caja y el navegador de Caja General." + comprobanteTxt(fecha),
        fuente: "Reporte consolidado de caja / Diario Caja General"
      });
      return;
    }

    // 2) Por banco: sin confirmar (ACH/cheque sin banco) o diferencia genérica
    BANCOS.forEach(function(bk){
      var info = d[bk], diff = info.diff;
      if(Math.abs(diff) <= tolerancia) return;

      // ¿La diferencia positiva (reporte > sistema-etiquetado) se explica por un depósito ACH/cheque
      // que el sistema registró sin banco ese día? Entonces la plata está, solo falta la etiqueta.
      if(diff > tolerancia){
        var pool = sinBancoPorDia[fecha] || [];
        var match = null;
        for(var i=0;i<pool.length;i++){
          if(!pool[i].usado && Math.abs(pool[i].monto - diff) <= tolerancia){ match = pool[i]; break; }
        }
        if(match){
          match.usado = true;
          hallazgos.push({
            fecha:fecha, banco:bk, monto:diff, clase:"sin_confirmar",
            texto: bk + " " + fecha + ": la cajera reportó B/ " + fmt(diff) +
                   " para este banco y el sistema tiene el depósito (\"" + String(match.desc).trim() +
                   "\") pero sin etiqueta de banco, así que no se puede confirmar a qué banco entró." + comprobanteTxt(fecha, match.ref),
            fuente: "Reporte consolidado de caja / Diario Caja General"
          });
          return;
        }
      }

      // La cajera reporto el deposito y Caja General todavia no tiene su credito: si es de los ultimos
      // dias del mes, es lo que se espera — el credito va cuando el banco compense, el mes que viene.
      if(diff > tolerancia && esFinDeMesP1(fecha)){
        var partes = (reporte||[]).filter(function(r){ return r.fecha===fecha && r.banco===bk && r.monto>0; });
        var det = partes.length ? partes.map(function(p){ return p.metodo + " B/ " + fmt(p.monto); }).join(" + ") : "";
        hallazgos.push({
          fecha:fecha, banco:bk, monto:diff, clase:"en_transito",
          concepto:"Depósito de fin de mes reportado por la cajera", comprobante:"",
          // El desglose por metodo: el Paso 2 ve esos mismos cheques uno por uno en el detalle del
          // informe, y sin esto se sumarian ademas del consolidado.
          partes: partes.map(function(p){ return { metodo:p.metodo, monto:p.monto }; }),
          motivo:"depósito de fin de mes — el crédito se registra al compensar",
          texto: bk + " " + fecha + ": la cajera reportó B/ " + fmt(diff) + " depositado a " + bk +
                 (det ? " (" + det + ")" : "") + " y Caja General todavía no tiene el crédito. Es de los últimos días " +
                 "del mes: el banco lo compensa el mes siguiente y ahí va su asiento. Queda en tránsito y viaja al " +
                 "resumen del próximo mes." + comprobanteTxt(fecha),
          fuente: "Reporte consolidado de caja / Diario Caja General"
        });
        return;
      }
      hallazgos.push({
        fecha:fecha, banco:bk, monto:diff, clase:"diff",
        texto: "Diferencia " + bk + " " + fecha + ": reporte de cajeras B/ " + fmt(info.a) +
               " vs. diario Caja General (depósitos a " + bk + ") B/ " + fmt(info.b) + " (dif. B/ " + fmt(diff) + ")" + comprobanteTxt(fecha),
        fuente: "Reporte consolidado de caja / Diario Caja General"
      });
    });
  });

  // Reconciliación de los depósitos acumulados por rango: el monto que registró el sistema vs. la suma
  // de los depósitos diarios de ese método+banco del reporte dentro del rango (los días "cubiertos").
  /* ---- Efectivo de la cajera contra Caja General ----
     El efectivo no nombra banco en Caja General ("DEPOSITO BRINKS DEL 01/03/2026", "DEPOSITO DEL 01/03/2026"),
     asi que el cotejo por banco no lo veia: el efectivo reportado solo aparecia en el Paso 3, desde el
     navegador del banco, y un Brinks entregado que nunca se asento recien salia al cierre. En marzo de 2026
     quedaban fuera B/ 9,067.00. Aca se compara por dia: Efectivo Brink + Efectivo Ventanilla del informe
     contra los creditos de efectivo sin banco de Caja General. Las lineas que citan una fecha de otro mes
     no son el efectivo del dia (son descargo). El Paso 2 hereda estas lineas y las busca en el banco. */
  if(reporte && Array.isArray(reporte.efectivo)){
    var efDec = { firmaCaja: firmaDiario(diarioCaja), banco: null, filas: {} };
    var votosEf = {};
    diarioCaja.forEach(function(x){ var b = clasificarBancoPorTexto(x.descripcion); if(x.credito>0 && b && esBrinks(x.descripcion)) votosEf[b] = (votosEf[b]||0) + 1; });
    (transitoPrevio||[]).forEach(function(t){ var n = normTxt(t.concepto); if(t.banco && (esBrinks(n) || n.indexOf("EFECTIVO")!==-1)) votosEf[t.banco] = (votosEf[t.banco]||0) + 1; });
    var bancosEf = Object.keys(votosEf).sort(function(a, b){ return votosEf[b] - votosEf[a]; });
    efDec.banco = bancosEf.length ? bancosEf[0] : null;
    var lineasEf = diarioCaja.filter(function(x){
      return x.credito>0 && !clasificarBancoPorTexto(x.descripcion) && esDepositoEfectivo(x.descripcion) && !fechaOrigenEnTexto(x.descripcion, x.fecha);
    });
    var fechasEf = {};
    reporte.efectivo.forEach(function(e){ fechasEf[e.fecha] = true; });
    lineasEf.forEach(function(x){ fechasEf[x.fecha] = true; efDec.filas[x.fila] = true; });
    Object.keys(fechasEf).sort().forEach(function(f){
      var delDia = reporte.efectivo.filter(function(e){ return e.fecha === f; });
      var ls = lineasEf.filter(function(x){ return x.fecha === f; });
      var brink = Math.round(delDia.filter(function(e){ return e.tipo === "BRINK"; }).reduce(function(a, e){ return a + e.monto; }, 0)*100)/100;
      var vent = Math.round(delDia.filter(function(e){ return e.tipo === "VENTANILLA"; }).reduce(function(a, e){ return a + e.monto; }, 0)*100)/100;
      var a = Math.round((brink + vent)*100)/100;
      var b = Math.round(ls.reduce(function(s2, x){ return s2 + x.credito; }, 0)*100)/100;
      var diffEf = Math.round((a - b)*100)/100;
      if(Math.abs(diffEf) <= tolerancia) return;
      var det = [brink > 0 ? "Brink B/ " + fmt(brink) : "", vent > 0 ? "Ventanilla B/ " + fmt(vent) : ""].filter(Boolean).join(" + ");
      var enCaja = ls.length ? " (" + ls.map(function(x){ return "\"" + String(x.descripcion||"").trim() + "\" B/ " + fmt(x.credito); }).join("; ") + ")" : "";
      if(diffEf > tolerancia && esFinDeMesP1(f)){
        hallazgos.push({
          fecha:f, banco:efDec.banco || "", monto:diffEf, clase:"en_transito",
          concepto:"Efectivo de fin de mes reportado por la cajera", comprobante:"",
          partes: [{ metodo:"EFECTIVO BRINK", monto:brink }, { metodo:"EFECTIVO VENTANILLA", monto:vent }].filter(function(p){ return p.monto > 0; }),
          motivo:"efectivo de fin de mes sin crédito en Caja General",
          texto: "Efectivo " + f + ": la cajera reportó B/ " + fmt(a) + (det ? " (" + det + ")" : "") + " y Caja General " +
                 (b > 0 ? "acreditó B/ " + fmt(b) + enCaja : "no tiene su crédito") + ". Es de los últimos días del mes: queda en tránsito y viaja al resumen del próximo mes." +
                 (efDec.banco ? "" : " No se pudo deducir el banco del efectivo: completalo en el resumen en tránsito.") + comprobanteTxt(f),
          fuente: "Reporte consolidado de caja (efectivo) / Diario Caja General"
        });
        return;
      }
      /* ---- Efectivo asentado al cierre que el informe de la cajera no trae ----
         Al reves del caso de arriba: el credito a Caja General YA se hizo, asi que la plata salio de la
         cuenta y lo que queda en transito es del lado del banco — el Paso 2 hereda esta misma linea por
         `decisiones().efectivo.filas` y la busca en el estado de cuenta, que es donde corresponde
         reportarla. Emitirla acá como diferencia la contaba dos veces (roja en el Paso 1 y transito en el
         Paso 2), y como transito de Caja General habria inflado el saldo de apertura del mes siguiente.
         Lo que si falta de verdad es la linea en el informe de la cajera: eso es lo que dice el aviso.
         Caso real: 28-may-2026, "DEPOSITO DEL 28/5/2026" por B/ 73.00 en ventanilla, con el informe en
         B/ 0.00 ese dia. Solo al cierre: un efectivo sin reportar en medio del mes sigue siendo rojo,
         porque ahi no hay rezago del banco que lo explique. */
      if(diffEf < -tolerancia && ls.length && esFinDeMesP1(f)){
        hallazgos.push({
          fecha:f, banco:"", monto:Math.round(Math.abs(diffEf)*100)/100, clase:"aviso",
          concepto:"Efectivo asentado que el informe de la cajera no trae", comprobante:"",
          motivo:"falta la línea en el reporte consolidado de caja",
          texto: "Efectivo " + f + ": Caja General acreditó B/ " + fmt(b) + enCaja + " y el informe de la cajera " +
                 (a > 0 ? "solo trae B/ " + fmt(a) + (det ? " (" + det + ")" : "") : "no lo trae") +
                 " (falta B/ " + fmt(Math.abs(diffEf)) + "). Es de los últimos días del mes: el asiento ya sacó la plata de " +
                 "Caja General y el Paso 2 la busca en el banco, así que acá no hay descuadre — lo que falta es la línea " +
                 "en el informe de la cajera." + comprobanteTxt(f),
          fuente: "Reporte consolidado de caja (efectivo) / Diario Caja General"
        });
        return;
      }
      hallazgos.push({
        fecha:f, banco:"", monto:diffEf, clase:"diff", concepto:"Efectivo", comprobante:"",
        texto: "Efectivo " + f + ": la cajera reportó B/ " + fmt(a) + (det ? " (" + det + ")" : "") + " y Caja General acreditó B/ " + fmt(b) +
               enCaja + " (dif. B/ " + fmt(diffEf) + ")." + comprobanteTxt(f),
        fuente: "Reporte consolidado de caja (efectivo) / Diario Caja General"
      });
    });
    decisiones().efectivo = efDec;   // el Paso 2 hereda estas lineas y las busca en el estado de cuenta
  }

  batches.forEach(function(b){
    var enBk = b.banco ? " " + b.banco : "";
    // No dice banco y no hubo forma de saber que dias cubre: sin eso el monto no se puede cotejar con nada.
    if(b.sinBanco && !b.resuelto){
      hallazgos.push({
        fecha:b.fecha, banco:"", monto:b.monto, clase:"diff",
        texto: "Depósito acumulado " + b.metodo + " (\"" + String(b.desc).trim() + "\") por B/ " + fmt(b.monto) +
               ": el asiento no dice a qué banco entró y los días del " + b.diaIni + " al " + b.diaFin +
               " sin crédito propio no suman ese monto de una sola forma, así que no se puede saber qué está " +
               "cubriendo. Agregá el banco en la descripción del asiento.",
        fuente: "Reporte consolidado de caja / Diario Caja General"
      });
      return;
    }
    var diff = Math.round((b.cubierto - b.monto)*100)/100;
    /* ---- Lo de los ULTIMOS dias del rango puede no estar acreditado todavia ----
       El asiento acumulado solo puede incluir lo que el banco ya acredito, y lo de los ultimos dias compensa
       el mes siguiente. En abril de 2026 el informe trae 612.95 de Yappy y el asiento 403.33: la diferencia
       (209.62) es exactamente el Yappy del 30-abr, que el estado de Banco General acredita en mayo — el
       asiento cuadra al centavo con los nueve depositos que el banco SI acredito. Cuando la diferencia se
       explica por la cola del rango, esas partidas quedan en transito y viajan al resumen, que es lo que
       son; lo que sobre de ahi sigue siendo diferencia. */
    if(diff > tolerancia && (b.filas||[]).length){
      var cola = b.filas.slice().sort(function(p,q){ return String(p.fecha) < String(q.fecha) ? 1 : -1; });
      var acum = 0, colaFin = [];
      for(var ci=0; ci<cola.length && acum < diff - tolerancia; ci++){
        if(!esFinDeMesP1(cola[ci].fecha)) break;   // ya no es fin de mes: el resto es diferencia real
        acum = Math.round((acum + cola[ci].monto)*100)/100;
        colaFin.push(cola[ci]);
      }
      if(colaFin.length && Math.abs(acum - diff) <= tolerancia){
        var detCola = colaFin.map(function(q){ return q.fecha + " B/ " + fmt(q.monto); }).join(" + ");
        hallazgos.push({
          fecha: colaFin[0].fecha, banco: colaFin[0].banco || b.banco, monto: diff, clase:"en_transito",
          concepto:"Depósito de fin de mes reportado por la cajera", comprobante:"",
          partes: colaFin.map(function(q){ return { metodo:q.metodo, monto:q.monto }; }),
          motivo:"depósito de fin de mes — el crédito se registra al compensar",
          texto: (colaFin[0].banco || b.banco) + ": el asiento acumulado de " + b.metodo + " registró B/ " + fmt(b.monto) +
                 " y el informe de cajeras trae B/ " + fmt(b.cubierto) + " en el período. La diferencia (B/ " + fmt(diff) +
                 ") es lo de los últimos días — " + detCola + " —, que el banco compensa el mes siguiente: " +
                 "el asiento solo pudo incluir lo ya acreditado. Queda en tránsito y viaja al resumen del próximo mes.",
          fuente: "Reporte consolidado de caja / Diario Caja General"
        });
        return;
      }
    }
    /* ---- El acumulado trae adentro el DESCARGO del transito del mes anterior ----
       El credito a Caja General se registra cuando el banco COMPENSA, asi que una partida que quedo en
       circulacion el mes pasado se descarga este mes. Si ese descargo se digita DENTRO del asiento acumulado
       del metodo —en vez de en su propio asiento del dia que compenso— el acumulado registra MAS de lo que el
       informe de cajeras trae en el rango, y la diferencia salia como roja.
       Caso real: 31-may-2026, "DEPOSITOS POR YAPPY DEL 1 AL 30 DE MAYO" por B/ 973.96 = 764.34 del Yappy de
       mayo + 209.62 del Yappy del 30-abr, que quedo en circulacion y el banco acredito el 1-may. Las dos
       cosas son legitimas; lo que faltaba era que la app entendiera el asiento.
       Solo con la evidencia del Paso 0: misma cuenta bancaria, el Paso 0 tiene que haberla visto COMPENSAR
       este mes, y la combinacion tiene que ser UNICA. Sin eso queda como diferencia, igual que siempre. */
    if(diff < -tolerancia && poolPrev){
      var faltaD = Math.round(-diff*100)/100;
      var candD = poolPrev.filter(function(p){ return !p.usado && p.compensada && p.banco === b.banco; });
      var solsD = candD.length ? solucionesSuma(candD.map(function(p){ return p.monto; }), faltaD, tolerancia, 6, 1) : null;
      if(solsD && solsD.length === 1){
        var partD = solsD[0].map(function(i){ return candD[i]; });
        partD.forEach(function(p){ p.usado = true; });
        descargosEnAcumulado.push({ banco:b.banco, fecha:b.fecha, monto:b.monto, descargo:faltaD });
        hallazgos.push({
          fecha:b.fecha, banco:b.banco, monto:faltaD, clase:"informativo",
          concepto:"Descargo de tránsito incluido en el acumulado", comprobante: refME(b.ref),
          partidas: partD.map(function(p){ return { banco:p.banco, fecha:p.fecha, monto:p.monto, concepto:p.concepto }; }),
          motivo:"el asiento acumulado trae el descargo del mes anterior",
          texto: b.banco + ": el asiento acumulado de " + b.metodo + " registró B/ " + fmt(b.monto) +
                 " y el informe de cajeras trae B/ " + fmt(b.cubierto) + " en el período. La diferencia (B/ " +
                 fmt(faltaD) + ") es el descargo de " + partD.length + " partida(s) que venían en tránsito del mes " +
                 "anterior y el banco compensó este mes: " +
                 partD.map(function(p){ return p.fecha + " B/ " + fmt(p.monto); }).join(", ") +
                 ". El asiento junta las dos cosas y las dos son correctas, así que no hay nada que corregir — " +
                 "queda más claro si el descargo se fecha el día que el banco compensó, pero no es un error.",
          fuente: "Reporte consolidado de caja / Resumen en tránsito del mes anterior / Diario Caja General"
        });
        return;
      }
    }
    if(Math.abs(diff) > tolerancia){
      hallazgos.push({
        fecha:b.fecha, banco:b.banco, monto:diff, clase:"diff",
        texto: "Depósito acumulado " + b.metodo + enBk + " (\"" + String(b.desc).trim() + "\"): el sistema registró B/ " +
               fmt(b.monto) + " pero la suma de los depósitos diarios de " + b.metodo + enBk +
               " del reporte (días " + b.diaIni + " al " + b.diaFin + ") es B/ " + fmt(b.cubierto) +
               " (dif. B/ " + fmt(diff) + "). Revisa si algún día quedó registrado en otro banco o método.",
        fuente: "Reporte consolidado de caja / Diario Caja General"
      });
    }
  });

  // Consistencia del desglose de cheques (2ª pestaña): la suma de los cheques individuales por
  // banco/día debe igualar el total de cheques del reporte (columna Cheque de la 1ª pestaña).
  if(chequesDetalle && chequesDetalle.length){
    var detBD = sumBy(chequesDetalle, function(x){return x.banco+"|"+x.fecha;}, function(x){return x.monto;});
    var repChequeBD = sumBy(reporte.filter(function(x){return x.metodo==="CHEQUE";}), function(x){return x.banco+"|"+x.fecha;}, function(x){return x.monto;});
    var clavesCh = {};
    Object.keys(detBD).forEach(function(k){clavesCh[k]=true;});
    Object.keys(repChequeBD).forEach(function(k){clavesCh[k]=true;});
    Object.keys(clavesCh).sort().forEach(function(k){
      var p = k.split("|"), bk = p[0], fecha = p[1];
      var det = detBD[k]||0, tot = repChequeBD[k]||0, dch = Math.round((det-tot)*100)/100;
      if(Math.abs(dch) > tolerancia){
        hallazgos.push({
          fecha:fecha, banco:bk, monto:dch, clase:"diff",
          texto: "Cheques " + bk + " " + fecha + ": el desglose individual suma B/ " + fmt(det) +
                 " pero el total de cheques del reporte es B/ " + fmt(tot) + " (dif. B/ " + fmt(dch) + ").",
          fuente: "Reporte de cajeras (desglose de cheques vs. total)"
        });
      }
    });
  }

  /* ---- Faltantes y sobrantes ----
     No son un depósito, pero mueven el saldo de Caja General en su propio diario: si la cajera reporta un
     faltante y nadie lo asienta (o hay un asiento que el reporte no respalda), el saldo queda descuadrado
     sin que ningún otro control lo detecte. */
  cotejarFaltantesSobrantes(faltSobrReporte, faltSobrDiario(diarioCaja), tolerancia).forEach(function(x){
    var etq = function(t){ return (t||"").toLowerCase().replace("+"," y ") || "faltante/sobrante"; };
    if(x.clase === "etiqueta"){
      // El importe cuadra: es la descripción del asiento la que no coincide con lo que reportó la cajera.
      hallazgos.push({
        fecha:x.fecha, banco:"", monto:x.diario, clase:"aviso",
        concepto:"Faltante/sobrante", comprobante:"", motivo:"etiqueta que no coincide",
        texto: "Caja General " + x.fecha + ": el importe de B/ " + fmt(x.diario) + " cuadra, pero el informe lo reporta como " +
               etq(x.tipoReporte) + " y el asiento dice " + etq(x.tipoDiario) + ". Corregí la descripción del asiento.",
        fuente: "Reporte consolidado de caja (Faltante/Sobrante) / Diario Caja General"
      });
      return;
    }
    var texto;
    if(x.reporte === 0){
      texto = "Caja General " + x.fecha + ": hay un asiento de " + etq(x.tipoDiario) + " por B/ " + fmt(x.diario) +
              " que el informe de cajeras no reporta ese día.";
    } else if(x.diario === 0){
      texto = "Caja General " + x.fecha + ": la cajera" + (x.cajera ? " (" + x.cajera + ")" : "") +
              " reportó un " + etq(x.tipoReporte) + " de B/ " + fmt(x.reporte) + " que no está asentado en el diario.";
    } else {
      texto = "Caja General " + x.fecha + ": el " + etq(x.tipoReporte) + " del informe es B/ " + fmt(x.reporte) +
              " y el asiento del diario es B/ " + fmt(x.diario) + " (dif. B/ " + fmt(x.dif) + ").";
    }
    hallazgos.push({
      fecha:x.fecha, banco:"", monto:Math.abs(x.dif), clase:"diff",
      concepto:"Faltante/sobrante", comprobante:"",
      texto: texto + " Afecta el saldo de Caja General.",
      fuente: "Reporte consolidado de caja (Faltante/Sobrante) / Diario Caja General"
    });
  });

  /* ---- Ajustes ----
     Asientos manuales que mueven el saldo de Caja General y no vienen del reporte de cajeras. No son un
     error, pero nadie los valida: se listan para que se revisen antes de cerrar. Los de apertura quedan
     fuera — esos ya los cuenta el cuadre del Paso 0 contra el resumen en tránsito. */
  ajustesDelMes(diarioCaja, aperturaCaja).forEach(function(a){
    hallazgos.push({
      fecha:a.fecha, banco:"", monto:a.monto, clase:"aviso",
      concepto:"Ajuste en Caja General", comprobante:a.referencia, motivo:"asiento manual",
      texto: "Caja General " + a.fecha + ": asiento de ajuste por B/ " + fmt(a.monto) + " al " + a.columna +
             " (\"" + a.descripcion + "\")" + (a.referencia ? " · " + a.referencia : "") +
             ". Mueve el saldo y no viene del reporte de cajeras — verificá que corresponda.",
      fuente: "Diario Caja General (fila " + a.fila + ")"
    });
  });
  /* ---- Métodos del informe que no entran al cotejo por banco ----
     Caja General acá NO es solo efectivo: es la cuenta puente de TODA la venta. Si una columna del
     informe trae monto y ningún paso la mira, es un hueco — así se perdieron el Yappy y el ACH de Banco
     General hasta que se mapearon. Lo que queda fuera se informa con su total para que se vea completo. */
  if(reporte && reporte.sinMapear && reporte.sinMapear.length){
    var totFuera = Math.round(reporte.sinMapear.reduce(function(a,c){ return a + (c.total||0); },0)*100)/100;
    hallazgos.push({
      fecha:"", banco:"", monto:totFuera, clase:"informativo",
      concepto:"Métodos sin cotejar por banco", comprobante:"",
      texto: "El informe de caja trae B/ " + fmt(totFuera) + " en columnas que no se cotejan banco por banco: " +
             reporte.sinMapear.map(function(c){ return c.etiqueta + " B/ " + fmt(c.total); }).join(" · ") +
             ". El efectivo sí se rastrea, pero por el diario del banco en el Paso 3; lo demás (crédito, vales, certificados) no entra al banco.",
      fuente:"Reporte consolidado de caja"
    });
  }
  // Último: las diferencias que se cancelan entre sí no son plata faltante, son plata mal ubicada.
  /* ---- Ventas que entraron a la cuenta y no salieron por ningun deposito ----
     Es un cotejo de Caja General —el debito de la VENTA contra los creditos de su mismo comprobante— asi que
     vive aca y no en el panel del cierre: el Paso 1 podia dar "cuadrado" y la venta sin deposito aparecer
     recien al cerrar el mes. Se descuenta la VISA de St. Georges del dia (su credito llega a fin de mes),
     lo que este mismo paso dejo en transito —efectivo incluido— y los descargos del mes anterior. */
  (function(){
    var visaDiaP1 = {};
    (reporte||[]).forEach(function(x){
      if(x.banco === "STG" && normTxt(x.metodo).indexOf("VISA") !== -1)
        visaDiaP1[x.fecha] = Math.round(((visaDiaP1[x.fecha]||0) + x.monto)*100)/100;
    });
    var transDiaP1 = {};
    hallazgos.forEach(function(x){
      if(esEnTransito(x)) transDiaP1[x.fecha] = Math.round(((transDiaP1[x.fecha]||0) + x.monto)*100)/100;
    });
    var clavesP1 = {};
    descargos.forEach(function(dg){
      ((dg.lineas && dg.lineas.length) ? dg.lineas : [{ fecha:dg.fecha, monto:dg.monto }]).forEach(function(l){
        var c = (l.fecha||"") + "|" + Math.round((l.monto||0)*100);
        clavesP1[c] = (clavesP1[c]||0) + 1;
      });
    });
    var bancoEfP1 = (STATE.decisiones && STATE.decisiones.efectivo && STATE.decisiones.efectivo.banco) || null;
    ventasSinDeposito({ cg:diarioCaja, visaDia:visaDiaP1, difDia:difDiaP1, transDia:transDiaP1, claves:clavesP1, reporte:reporte }).forEach(function(v){
      hallazgos.push(itemVentaSinDeposito(v, bancoEfP1));
    });
  })();

  // Que dia y cuanto difirio un acumulado de fin de mes: el Paso 1 es el unico que lo sabe (ve que asiento
  // cubrio que dias). El cierre lo hereda para no recalcular las ventas sin deposito sin esa informacion —
  // sin esto las seis partidas de Yappy de marzo volvian a aparecer en el resumen por la puerta de atras.
  decisiones().diferidos = { firmaCaja: firmaDiario(diarioCaja), porDia: difDiaP1 };
  // El Paso 3 tiene que buscar en el banco el importe del acumulado MENOS el descargo que trae adentro: esa
  // parte la consumio el Paso 0 contra el credito del dia que compenso, asi que ya no esta libre en el estado.
  decisiones().acumDescargo = { firmaCaja: firmaDiario(diarioCaja), lista: descargosEnAcumulado };
  guardarDecisionDescargos(diarioCaja, transitoPrevio, descargos);   // los Pasos 2 y 3 heredan esta decision
  return colapsarCompensados(hallazgos, tolerancia);
}

// Mes dominante (YYYY-MM) entre un conjunto de fechas ISO.
function mesDominante(fechas){
  var ym = {};
  fechas.forEach(function(f){ if(f){ var k=f.slice(0,7); ym[k]=(ym[k]||0)+1; } });
  var best=null, max=-1;
  Object.keys(ym).forEach(function(k){ if(ym[k]>max){ max=ym[k]; best=k; } });
  return best;
}
// Último día calendario del mes dominante (para los bordes de mes).
function ultimoDiaMes(fechas){
  var best = mesDominante(fechas); if(!best) return null;
  var y=parseInt(best.slice(0,4),10), m=parseInt(best.slice(5,7),10);
  return best + "-" + String(new Date(y, m, 0).getDate()).padStart(2,"0"); // día 0 del mes sig. = último del actual
}
// Primer día del mes dominante.
function primerDiaMes(fechas){
  var best = mesDominante(fechas); return best ? (best + "-01") : null;
}
// ¿La descripción es un ACH/depósito de Brinks? (equivale al efectivo brinks del reporte, no es diferencia).
// Detecta Brinks en cualquiera de sus variantes: "Brinks Panama" (junto) o "Brink S Panama" (con espacio,
// como aparece en el estado de cuenta de STG). Por eso se busca "BRINK" y no "BRINKS".
function esBrinks(desc){ return normTxt(desc).indexOf("BRINK") !== -1; }
/* ---- El ACH de Brinks dice QUE DIA se retiro el efectivo ----
   "Ach De Brinks Panama, S.A. - D08563bsafe 130526 Davi" = el retiro del 13/05/26, que el banco acredita
   uno o dos dias despues. Sin leer esa fecha, para el cotejo todos los ACH son intercambiables mientras el
   importe cuadre, y uno se va al dia equivocado dejando huerfano al que le tocaba: en mayo de 2026 el
   asiento del 4-may (452.22) cuadro con 65.00 + 385.00 + 2.22 llevandose el ACH del retiro del 13-may, y el
   efectivo del 12-may (66.66 = 65.00 + 1.66) salio como "no aparece en el estado de cuenta".
   Confirmado por Diba (25-sep-2026): esa fecha es la del retiro en el local. */
function fechaRetiroBrinks(desc){
  if(!esBrinks(desc)) return null;
  var m = String(desc||"").match(/(?:^|\D)(\d{2})(\d{2})(\d{2})(?:\D|$)/);
  if(!m) return null;
  var d = parseInt(m[1],10), mo = parseInt(m[2],10), y = 2000 + parseInt(m[3],10);
  if(d < 1 || d > 31 || mo < 1 || mo > 12) return null;
  return y + "-" + String(mo).padStart(2,"0") + "-" + String(d).padStart(2,"0");
}
/* Brinks no puede retirar el dia F el efectivo que entro a caja DESPUES: un asiento muy anterior al retiro
   no es suyo. Solo se corta ese caso —el imposible—; si el retiro es anterior o del mismo dia que el
   asiento no se restringe nada, porque el asiento se digita a veces dias despues del retiro. */
var ACH_ANTICIPO_MAX = 3;   // dias habiles de anticipo tolerados entre el asiento y el retiro
function retiroCompatible(descEstado, fechaAsiento){
  var f = fechaRetiroBrinks(descEstado);
  if(!f || !fechaAsiento) return true;          // el texto no dice la fecha: como siempre
  if(f <= fechaAsiento) return true;            // el retiro es anterior o del mismo dia: normal
  return distanciaBancaria(fechaAsiento, f) <= ACH_ANTICIPO_MAX;
}
// Depósito de EFECTIVO del diario: el camión de valores (Brinks) o el que se lleva a ventanilla
// ("DEPOSITO DEL 09/6/2026"). Se distingue de los depósitos por tarjeta (VISA/CLAVE/Yappy), de los ACH y
// de los cheques, porque solo el efectivo se comporta como se describe en consolidarEfectivoDelDia.
/* ---- Efectivo: la combinacion mas cercana, no la primera ----
   El estado de cuenta viene ordenado de la fecha mas nueva a la mas vieja, asi que la primera combinacion
   que suma es la mas LEJANA. En junio de 2026 el efectivo del 13 (869.90) se llevo los 4.90 del 19 —que
   eran del 17— teniendo los suyos el 15, y el 17 quedo sin compensar. Se elige la combinacion (hasta 3
   lineas) cuya linea mas lejana esta mas cerca; a igualdad, la de menor distancia total. */
function combinacionMasCercana(pool, fecha, objetivo, ventanaDias, tolerancia){
  var idx = [];
  for(var i=0;i<pool.length;i++){
    var e = pool[i];
    if(e.usado || e.fecha < fecha) continue;
    var d = distanciaBancaria(fecha, e.fecha);
    if(d <= ventanaDias) idx.push({ i:i, d:d, m:montoConc(e) });
  }
  var mejor = null;
  function probar(sel){
    var suma = 0, max = 0, tot = 0;
    sel.forEach(function(x){ suma += x.m; if(x.d > max) max = x.d; tot += x.d; });
    if(Math.abs(suma - objetivo) > tolerancia) return;
    if(!mejor || max < mejor.max || (max === mejor.max && tot < mejor.tot)) mejor = { sel:sel.map(function(x){ return x.i; }), max:max, tot:tot };
  }
  for(var a=0;a<idx.length;a++){
    probar([idx[a]]);
    for(var b=a+1;b<idx.length;b++){
      probar([idx[a], idx[b]]);
      for(var c=b+1;c<idx.length;c++) probar([idx[a], idx[b], idx[c]]);
    }
  }
  return mejor ? mejor.sel : null;
}
/* El efectivo SE NOMBRA, aunque no diga un metodo de tarjeta: el camion dice Brinks y la ventanilla es
   "DEPOSITO DEL <fecha>" y nada mas. Queda fuera de la pasada 4 de conciliarBancoEstado — si no, un Brinks
   de 38.17 se comeria la remision de tarjeta de 38.17 del mismo dia, que es justo lo que
   compatibleConRemision existe para impedir. */
function esEfectivoConNombre(desc){
  if(esBrinks(desc)) return true;
  return /^DEPOSITOS?\s+DEL\s+\d/.test(normTxt(desc));
}
function esDepositoEfectivo(desc){
  var n = normTxt(desc);
  if(n.indexOf("DEPOSITO")===-1 && !esBrinks(desc)) return false;
  if(/TARJETA|VISA|CLAVE|YAPPY|MASTER|\bACH\b|CHEQUE|\bCK\b|TRANSFEREN/.test(n)) return false;
  return true;
}
// El efectivo de un mismo día se registra en el diario en partidas separadas (Brinks y ventanilla, tal como
// las reporta el informe de caja) pero el banco a veces las acredita CONSOLIDADAS en un solo crédito
// (ej. 09-jun: 395.00 Brinks + 3.35 ventanilla → un único crédito de 398.35 el 12-jun). Otras veces las
// acredita por separado. Se prueba la suma del día ANTES del emparejamiento genérico por monto: si no se
// hace primero, cada partida se empareja por su cuenta contra cualquier crédito que coincida en importe y
// deja huérfana a la otra. Devuelve la cantidad de grupos consolidados.
function consolidarEfectivoDelDia(poolDiario, poolEstado, ventanaDias, tolerancia){
  // El efectivo NUNCA compensa en una remisión de tarjeta: el banco lo acredita como depósito o ACH de
  // Brinks. Si no se excluyen, la suma del día se engancha con una remisión que coincida en importe por
  // casualidad — pasó en enero: el efectivo se comió la Remisión V/Mc de 350.91 del 23-ene y dejó
  // huérfano al asiento que acumula toda la VISA del mes. Comparten objetos, así que marcar `usado` en
  // este subconjunto marca también el pool original.
  var candidatos = poolEstado.filter(function(e){ return !esRemisionVisa(e.descripcion) && !esRemisionClave(e.descripcion); });
  // La linea del estado del MISMO importe mas cercana, del dia del deposito en adelante.
  function igualImporte(f, monto){
    var mejor = -1, mejorDist = Infinity, tope = Math.max(ventanaDias, 10);
    for(var k=0;k<candidatos.length;k++){
      var e = candidatos[k];
      if(e.usado || Math.abs(montoConc(e) - monto) > tolerancia) continue;
      if(e.fecha < f) continue;                 // el banco no acredita antes del deposito
      var dist = distanciaBancaria(f, e.fecha);
      if(dist <= tope && dist < mejorDist){ mejor = k; mejorDist = dist; }
    }
    return mejor;
  }
  var porFecha = {};
  poolDiario.forEach(function(d, i){
    if(d.usado || !esDepositoEfectivo(d.descripcion)) return;
    (porFecha[d.fecha] = porFecha[d.fecha] || []).push(i);
  });
  var n = 0;
  Object.keys(porFecha).sort().forEach(function(f){
    var grupo = porFecha[f].filter(function(i){ return !poolDiario[i].usado; });
    // PRIMERO cada partida contra una linea del mismo importe: el banco suele acreditar el Brinks por un
    // lado y la ventanilla por otro, y hasta en dias distintos (el 11-jun-2026 la ventanilla de 3.61
    // entro el 12 y el Brinks de 535.00 el 15). Buscar la suma del dia antes que eso hacia que una
    // combinacion cuadrara de casualidad y se llevara la linea que le tocaba a otro dia: los depositos
    // de 3.61 y 4.90 quedaban en transito teniendo su credito en el banco.
    grupo = grupo.filter(function(idx){
      var k = igualImporte(f, poolDiario[idx].monto);
      if(k < 0) return true;
      candidatos[k].usado = true; poolDiario[idx].usado = true; n++;
      return false;
    });
    if(grupo.length < 2) return; // lo que quede suelto lo cotejan las pasadas normales
    var suma = Math.round(grupo.reduce(function(a,i){ return a + poolDiario[i].monto; },0)*100)/100;
    // El efectivo clarea con rezago (el banco acredita días después), por eso la ventana se amplía.
    // El efectivo se entrega y el banco lo acredita ese dia o despues, nunca antes.
    var combo = buscarCombinacion(candidatos, f, suma, Math.max(ventanaDias, 10), tolerancia, "adelante");
    if(!combo) return;
    combo.forEach(function(i){ candidatos[i].usado = true; });
    grupo.forEach(function(i){ poolDiario[i].usado = true; });
    n++;
  });
  return n;
}

// Busca en 'pool' (créditos del banco, con flag .usado) una combinación de 1, 2 o 3 movimientos
// no usados, dentro de la ventana de días respecto a 'fecha', que sumen 'objetivo' (± tolerancia).
// El banco a veces refleja un depósito combinado de Caja General partido en varias líneas
// (ej. 429.74 aparece como 314.55 + 115.19). Devuelve los índices usados o null.
// Importe con el que se concilia una linea: el neto cuando se conoce (VISA), si no el propio monto.
function montoConc(x){ return x.montoConc!=null ? x.montoConc : x.monto; }
// Depósito de TARJETA en el diario (VISA, CLAVE, o genérico "por tarjeta").
function esDepositoTarjeta(desc){
  var n = normTxt(desc);
  return n.indexOf("TARJETA")!==-1 || n.indexOf("VISA")!==-1 || n.indexOf("V/MC")!==-1 || n.indexOf("CLAVE")!==-1;
}
// Una "Remisión V/Mc"/"Remisión Clave" del estado SOLO puede compensar un depósito de tarjeta: el
// efectivo, los cheques y los ACH entran al banco por otra vía. No se exige que el método coincida —el
// comprobante suele decir "VISA" y traer también CLAVE, y lo que vale es que la tarjeta cuadre— pero sí
// que sea tarjeta. Sin esta regla el efectivo del 23-ene (300.91+50.00) se comía la remisión de 350.91.
function compatibleConRemision(descEstado, descDiario){
  if(!esRemisionVisa(descEstado) && !esRemisionClave(descEstado)) return true;
  return esDepositoTarjeta(descDiario);
}
// Líneas del estado que compensan el MÉTODO de un depósito (VISA → Remisión V/Mc, CLAVE → Remisión
// Clave). Devuelve null si el depósito no dice el método. Comparte los objetos del pool, así que marcar
// `usado` en el subconjunto marca también el pool original.
// Lineas del estado donde puede caer un ACH: transferencias y depositos de terceros. Se descartan las
// remisiones de tarjeta, el efectivo del camion y los cargos del banco, que nunca son un ACH. Ademas de
// ser lo correcto, achica el pool de ~104 lineas a unas pocas: el subset-sum de hasta 6 partidas sobre el
// pool entero se cortaba por el tope de nodos y devolvia null aunque la combinacion estuviera ahi.
function poolParaAch(poolEstado){
  function d(e){ return e.descripcion || e.desc || ""; }
  var sub = poolEstado.filter(function(e){
    var n = normTxt(d(e));
    if(esRemisionVisa(d(e)) || esRemisionClave(d(e))) return false;
    if(n.indexOf("BRINK")!==-1) return false;
    if(/COMISION|ITBMS|RETENCION|TIMBRE/.test(n)) return false;
    return true;
  });
  return sub.length ? sub : null;
}
function poolDelMetodo(poolEstado, desc){
  var n = normTxt(desc);
  // El Paso 2 arma su pool con el campo "desc" y el Paso 3 con "descripcion": se aceptan los dos, si no
  // el filtro no encuentra nada y el acumulado del mes deja de cuadrar.
  function d(e){ return e.descripcion || e.desc || ""; }
  var sub = null;
  if(n.indexOf("VISA")!==-1 || n.indexOf("V/MC")!==-1) sub = poolEstado.filter(function(e){ return esRemisionVisa(d(e)); });
  else if(n.indexOf("CLAVE")!==-1) sub = poolEstado.filter(function(e){ return esRemisionClave(d(e)); });
  // Si el método no deja ninguna línea, no se restringe: mejor buscar en todo que no buscar.
  return (sub && sub.length) ? sub : null;
}
// Retención VISA acumulada de un rango de días del mes (para los asientos que cubren todo el período).
function retencionDelRango(retVisaPorDia, rg){
  var total = 0;
  Object.keys(retVisaPorDia||{}).forEach(function(f){
    if(f.slice(0,7)!==rg.ym) return;
    var dd = parseInt(f.slice(8,10),10);
    if(dd>=rg.diaIni && dd<=rg.diaFin) total += retVisaPorDia[f];
  });
  return Math.round(total*100)/100;
}
// DEPÓSITO ACUMULADO DEL PERÍODO: algunos meses el diario registra la tarjeta de TODO el mes en un solo
// asiento del último día ("DEPOSITOS POR TARJETA VISA STG DEL 1 AL 31 DE ENERO 2026") mientras el banco la
// fue acreditando en remisiones diarias. Se busca el conjunto de remisiones DEL MISMO MÉTODO que sumen el
// asiento. El diario puede traer el NETO (Caja General a veces trae el BRUTO), así que se prueban los dos.
// Va antes del emparejamiento genérico: si no, cada remisión suelta se engancharía por coincidencia de
// importe con cualquier otro depósito y el acumulado quedaría huérfano.
function conciliarAcumuladoPeriodo(poolDiario, poolEstado, retVisaPorDia, tolerancia){
  poolDiario.forEach(function(d){
    if(d.usado) return;
    var rg = rangoDeposito(d.descripcion, d.fecha);
    if(!rg) return;
    var cands = poolDelMetodo(poolEstado, d.descripcion);
    if(!cands || !cands.length) return;
    var objetivos = [d.monto];                                   // el diario ya trae el neto
    if(retVisaPorDia){
      var ret = retencionDelRango(retVisaPorDia, rg);
      if(ret>0) objetivos.push(Math.round((d.monto-ret)*100)/100); // el diario trae el bruto del período
    }
    for(var i=0;i<objetivos.length;i++){
      var combo = buscarSubsetSuma(cands, d.fecha, objetivos[i], 366, tolerancia, 60, "atras");
      if(combo){ combo.forEach(function(k){ cands[k].usado=true; }); d.usado=true; return; }
    }
  });
}
/* ---- Calendario bancario ----
   El banco no acredita sábados, domingos ni feriados, así que una ventana de 3 días de CALENDARIO se
   come un fin de semana largo y da por no cotejado algo que sí compensó: los depósitos CLAVE de STG del
   13 y el 14 de febrero de 2026 compensaron el 18 —el estado no tiene una sola línea el 15, 16 ni 17,
   que fueron domingo y los dos días de carnaval— y salían como diferencia. La ventana se mide en días
   CON movimiento bancario: del 13 al 18 hay 2, no 5.
   El calendario es la UNIÓN de los tres estados de cuenta: un día en que operó un banco es día hábil
   aunque otro no tenga movimientos. Tomarlo banco por banco descontaría días que sí fueron hábiles y
   aflojaría el cotejo. */
var CAL_BANCARIO = null;   // {dias:{iso:true}, min:iso, max:iso}
function fijarCalendarioBancario(raws){
  CAL_BANCARIO = null;
  if(!raws) return;
  var dias = {}, n = 0;
  [["estBanistmo","banistmo"],["estStg","stg"],["estBancoGeneral","bancogeneral"]].forEach(function(p){
    if(!raws[p[0]]) return;
    try{
      parseEstadoCuenta(raws[p[0]], p[1]).forEach(function(x){
        if(x.fecha && !dias[x.fecha]){ dias[x.fecha] = true; n++; }
      });
    }catch(e){}
  });
  // Con muy pocos días no se puede afirmar qué día el banco no operó (un estado de una sola línea
  // marcaría todo el resto del mes como inhábil y el cotejo se volvería un colador).
  if(n < 8) return;
  var ks = Object.keys(dias).sort();
  CAL_BANCARIO = { dias:dias, min:ks[0], max:ks[ks.length-1] };
}
function diaSiguiente(iso){
  var d = new Date(iso+"T00:00:00"); d.setDate(d.getDate()+1);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
// Días de calendario menos los que caen DENTRO del período que cubren los estados y no tienen ni un
// movimiento. Fuera de ese período no se descuenta nada: ahí no sabemos si el banco cerró o si el
// archivo simplemente no llega hasta esa fecha.
function distanciaBancaria(iso1, iso2){
  var d = daysBetween(iso1, iso2);
  if(!CAL_BANCARIO || !(d > 1) || d === Infinity) return d;
  var a = iso1 < iso2 ? iso1 : iso2;
  var muertos = 0, cur = a;
  for(var k=1;k<d;k++){
    cur = diaSiguiente(cur);
    if(cur < CAL_BANCARIO.min || cur > CAL_BANCARIO.max) continue;
    if(!CAL_BANCARIO.dias[cur]) muertos++;
  }
  return d - muertos;
}
/* ---- Sentido del tiempo en el cotejo ----
   El banco acredita un depósito el mismo día o después: un crédito ANTERIOR al asiento no puede ser su
   compensación. La excepción son los ACH, que se ordenan antes de que el asiento se registre — el ACH de
   B/ 1,313.10 del 27-jun-2026 entró al banco el 22 (100.00 + 579.10 + 25.00) y el 23 (609.00). Para todo
   lo demás —efectivo, cheque, tarjeta— la búsqueda va solo hacia adelante: sin esa restricción el
   depósito Brinks del 11-jun se "completaba" con 3.62 de una ventanilla del 05-jun, que es imposible.
   Los ACH se reconocen por el texto del asiento; para ellos la ventana sigue siendo bidireccional. */
function esAchDesc(desc){ return normTxt(desc).indexOf("ACH")!==-1; }
function sentidoDeposito(desc){ return esAchDesc(desc) ? null : "adelante"; }
function buscarCombinacion(pool, fecha, objetivo, ventanaDias, tolerancia, direccion){
  if(Math.abs(objetivo) <= tolerancia) return null;
  var idxs = [];
  for(var i=0;i<pool.length;i++){
    if(pool[i].usado || distanciaBancaria(fecha, pool[i].fecha) > ventanaDias) continue;
    if(direccion==="adelante" && pool[i].fecha < fecha) continue;   // el banco no acredita antes del depósito
    if(direccion==="atras" && pool[i].fecha > fecha) continue;
    idxs.push(i);
  }
  var a, b, c;
  for(a=0;a<idxs.length;a++){ if(Math.abs(montoConc(pool[idxs[a]]) - objetivo) <= tolerancia) return [idxs[a]]; }
  for(a=0;a<idxs.length;a++) for(b=a+1;b<idxs.length;b++){
    if(Math.abs(montoConc(pool[idxs[a]]) + montoConc(pool[idxs[b]]) - objetivo) <= tolerancia) return [idxs[a],idxs[b]];
  }
  for(a=0;a<idxs.length;a++) for(b=a+1;b<idxs.length;b++) for(c=b+1;c<idxs.length;c++){
    if(Math.abs(montoConc(pool[idxs[a]]) + montoConc(pool[idxs[b]]) + montoConc(pool[idxs[c]]) - objetivo) <= tolerancia) return [idxs[a],idxs[b],idxs[c]];
  }
